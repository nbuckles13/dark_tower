packages:
  - 'packages/*'

# pnpm settings live HERE and nowhere else. pnpm >= 11 reads only auth/registry settings
# from .npmrc and ignores the `pnpm` field of package.json, so a setting placed in either
# of those is silently dropped. pnpm 12 fails the install on a key it does not recognise
# here (ERR_PNPM_UNRECOGNIZED_WORKSPACE_SETTINGS), so a misspelled setting fails loudly.

# engineStrict: fail `pnpm install` LOUDLY when the running Node/pnpm does not
# satisfy the root package.json `engines` range, instead of silently skipping
# engines-mismatched optional native bindings (e.g. @rolldown/binding-linux-x64-gnu).
# Root `engines.node` is the SSoT this keys off — its floor is the true workspace
# floor so a below-floor Node fails here rather than at vite launch with
# "cannot find native binding". Incident: 2026-08-05 host dev-env failure; see
# docs/runbooks/client-dev-local.md F11. `engines.node` carries no upper bound:
# Dependabot's npm updater runs Node 24, and a cap fails every one of its runs.
engineStrict: true

# strictDepBuilds: no dependency install script runs unless approved. Every dependency
# that ships one must be classified in `allowBuilds` (true = run it, false = skip it) or
# `pnpm install` FAILS, instead of listing it in a warning nobody reads. The default is
# already true in pnpm >= 11; it is stated so the policy does not depend on a default.
strictDepBuilds: true

# Skipped, verified no-ops here (2026-09-30):
#   @bufbuild/buf — install.js re-checks the platform binary, which arrives as an optional
#                   dependency (it downloads one only if optional deps were dropped)
#   msw           — copies mockServiceWorker.js only when msw.workerDirectory is set; msw is
#                   used as a Node test server (setupServer) only
#   nx            — asserts platform support and updates the Nx Cloud client; no Nx Cloud
allowBuilds:
  '@bufbuild/buf': false
  msw: false
  nx: false

# strictPeerDependencies: `pnpm install` FAILS (ERR_PNPM_PEER_DEP_ISSUES) on an unmet peer, instead of the
# default's one-line warning. What it stops: a partial bump of a package family that cross-peers at EXACT
# versions — PR #78 moved `vitest` to 5 and left `@vitest/browser`, `-browser-playwright` and `-coverage-v8`
# on 4, which installed green with a warning and broke at test time. vitest and those three peer each other at
# their exact version, so any skew in that family is an unmet peer here. Stated explicitly so the policy does
# not depend on a default. LIMIT: it only fires when pnpm RESOLVES; `--frozen-lockfile` (CI) skips resolution,
# so a committed skewed lockfile still installs. `pnpm peers check` in scripts/lang/ts/compile.sh covers that.
strictPeerDependencies: true

# catalog: a dependency that holds a PROCESS-GLOBAL singleton, so it must resolve to ONE copy across every
# importer, where strictPeerDependencies cannot enforce that (its dependents peer it as a range). Membership is
# that criterion, not "shared versions live here": typescript, vite, @types/node etc. are declared in several
# manifests but hold no global, so they stay plain pins. Importers write `"<name>": "catalog:"`.
#   @opentelemetry/api — the OTel API registry (Symbol.for('opentelemetry.js.api.1')); @opentelemetry/core peers
#                        it as >=1.0.0 <1.10.0. sdk-svelte and web-app re-declare it ONLY because their test
#                        bundles compile sdk-core SOURCE and @vitest/browser 5 excludes it from optimizeDeps, so it
#                        must resolve from their own node_modules.
# The vitest family is NOT here: it cross-peers at exact versions, so strictPeerDependencies enforces lockstep.
catalog:
  '@opentelemetry/api': 1.9.1

# verifyDepsBeforeRun: `pnpm run` / `pnpm exec` REFUSE to run against a node_modules that
# no longer matches the lockfile (ERR_PNPM_VERIFY_DEPS_BEFORE_RUN), instead of pnpm >= 11's
# default of silently re-installing. Remedy: `pnpm install --frozen-lockfile`. The pipeline
# wrappers report it as REASON=pnpm-deps-stale (scripts/lang/_pnpm.sh).
verifyDepsBeforeRun: error

# Security floors for transitive dependencies (advisory remediation). Add or raise an entry
# here to force a patched version; see scripts/lang/ts/audit-remediation.md.
overrides:
  axios: '>=1.20.0 <2'
  brace-expansion: '>=5.0.11'
  devalue: '>=5.9.3 <6'
  fast-uri: '>=3.1.6 <4'
  follow-redirects: '>=1.16.1 <2'
  nanoid: '>=3.3.17 <4'
  postcss: '>=8.5.18'
  smol-toml: '>=1.7.1'
  source-map-js: '>=1.2.2 <2'
  undici: '>=7.29.1 <8'
  vite: '>=8.2.4 <9'
