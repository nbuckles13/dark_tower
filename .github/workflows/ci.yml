name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dark_tower_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Rust nightly (for guards)
        run: rustup toolchain install nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-cache"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1

      - name: Build guard binaries
        # Layer 3 guards are ALWAYS-RUN and consume target/release/dt-guard and
        # dt-story, but those binaries are produced by a SKIP-GATED compile verb
        # (scripts/lang/rust/changed.sh triggers only on crates/ changes). So a
        # packages/**-only PR skips the rust compile, the binaries are absent,
        # and _dt_guard_wrapper.sh / validate-story-manifest.sh exit 1 — a wiring
        # fault reported on the implementer lane. Mirrors ci-client.yml's
        # equivalent step.
        #
        # SCOPE: this closes the CI half ONLY. The same skip-gate lives in
        # scripts/lang/_dispatch.sh and runs identically in a local devloop, so a
        # fresh worktree with a packages/**-only change still reds Layer 3. And
        # this is a SECOND build site for the same two binaries alongside
        # scripts/lang/rust/compile.sh. Both are knowingly accepted here rather
        # than relocating the build outside the dispatcher, which is an ADR-0033
        # layering decision (layer1.sh calls dispatcher-as-single-enforcement-point
        # the load-bearing pipeline invariant). Tracked in docs/TODO.md.
        run: cargo build --release -p dt-guard -p dt-story

      - name: Install Playwright Chromium
        # INTERIM PATCH (see TODO: run CI in the devloop image). Layer 4
        # (scripts/lang/ts/test.sh → nx test:component) runs vitest browser-mode
        # tests that need Chromium — the devloop image bakes it in; CI must
        # provision it too or Layer 4 fails "Executable doesn't exist …
        # chromium_headless_shell". `playwright` is a package-level dep, so resolve
        # via the workspace package (not `npx` at root).
        run: pnpm --filter @darktower/web-app exec playwright install --with-deps chromium

      # Single end-to-end pipeline call — same router as local devloop's
      # scripts/verify-completion.sh --layer full (ADR-0033 §4). Local repro
      # of an audit failure: `./scripts/layer6.sh`.
      #
      # Gate-2 forgery backstop (task #51): this runs layer-all.sh FROM SCRATCH
      # and deliberately does NOT read the local /tmp/devloop/gate2-verdict
      # artifact. The verdict is an anti-drift convenience for the local
      # pre-commit hook (which an agent could forge or bypass with --no-verify);
      # CI's independent re-run is the only non-bypassable enforcement. Do NOT
      # "optimize" by trusting the committed/uploaded verdict — that would
      # reintroduce the authority skip-vector. See docs/runbooks/devloop-validation.md.
      - name: Run polyglot validation pipeline
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dark_tower_test
          AC_MASTER_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          AC_BIND_ADDRESS: 127.0.0.1:8082
        run: ./scripts/layer-all.sh

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dark_tower_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # fetch-depth omitted: coverage job runs cargo-llvm-cov over the full
        # working tree; no diff-aware tooling is invoked here. The pipeline
        # job above requires fetch-depth: 0 — keep that surface tight.

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage-cache"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dark_tower_test
          AC_MASTER_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          AC_BIND_ADDRESS: 127.0.0.1:8082
          RUSTFLAGS: --cfg coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
