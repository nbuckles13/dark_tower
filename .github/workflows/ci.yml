name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Manual run on any branch (e.g. a branch whose PR targets neither main nor develop).
  workflow_dispatch:

# Least-privilege default token for every job (matches ci-client.yml /
# audit-scheduled.yml). The coverage job's Codecov upload uses its own
# CODECOV_TOKEN secret, scoped to that step — see the coverage job.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The validation pipeline (scripts/layer-all.sh), split across parallel jobs by cargo
  # graph so one 4-vCPU runner no longer builds dev + test + clippy graphs in series.
  # Each matrix entry is a SHARD: `layer-all.sh --layers <its layers>`, from scratch. The
  # partition is written ONLY here (the matrix `layers` values); the `Test Suite` job below
  # aggregates the shards and fails unless every layer 1..LAYER_MAX ran exactly once, so a
  # layer dropped from (or duplicated in) this matrix reds the required check.
  # Local repro of one shard: `./scripts/layerN.sh` per layer, or `./scripts/layer-fast.sh`.
  # Job map + triage: docs/runbooks/devloop-validation.md §8.7.
  pipeline:
    name: Pipeline (${{ matrix.shard }}, layers ${{ matrix.layers }})
    runs-on: ubuntu-latest
    # Per shard, from measurement rather than a guess: the projected CI cold duration
    # (4-CPU local emulation x the ~1.4 local->CI factor, plus setup; docs/devloop-outputs/
    # 2026-10-05-ci-test-suite-speed/main.md §CI Timings) x 2, rounded up to 5 min.
    # A test that hangs is killed by nextest at 5 min (.config/nextest.toml), well inside.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      # Every shard reports even when another is red: the aggregate needs all summaries.
      fail-fast: false
      matrix:
        # Tools are keyed off explicit per-shard flags, never off `layers` contents. A
        # layer moved without its flag fails loudly (tool-not-found), never silently.
        include:
          # L3's guards consume the release dt-guard/dt-story that L1's
          # scripts/lang/rust/compile.sh builds, so 1 and 3 share a job.
          - shard: guards
            layers: "1,2,3,6,7"
            timeout_minutes: 20  # projected cold ~9 min
            needs_nightly: true
            needs_kubectl: true
            needs_audit: true
          - shard: test
            layers: "4"
            timeout_minutes: 25  # projected cold ~11 min
            needs_db: true
            needs_nextest: true
            needs_playwright: true
          - shard: lint
            layers: "5"
            timeout_minutes: 10  # projected cold ~3 min

    services:
      # Only the test shard uses it; GitHub cannot make `services:` conditional per matrix
      # entry, and it costs ~20 s of parallel container start.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dark_tower_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every shard runs layer-all.sh, whose merge-base precondition needs full history.
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        # One Rust version everywhere: rust-toolchain.toml. With no argument, rustup
        # installs the toolchain (and components) that file names, and every later cargo
        # call in the checkout resolves to it; the images derive theirs from the same
        # file (infra/lib/rust-toolchain.sh). rustup is preinstalled on the runner, so no
        # third-party toolchain action is needed.
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Install Rust nightly (for guards)
        if: matrix.needs_nightly
        run: rustup toolchain install nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # One key per shard: parallel jobs saving one key would race (last writer wins).
          shared-key: "ci-pipeline-${{ matrix.shard }}"
          # Save even when the run is red, so the next push to a failing PR starts warm
          # (default is success-only, so a red branch never warmed the cache). SAFE ONLY
          # WHILE no workflow uses `pull_request_target` or `workflow_run`: a
          # `pull_request` run's cache is scoped to that PR's ref, and main never reads it;
          # PRs read main's (base-branch) cache.
          cache-on-failure: true
          # ~/.cargo/bin is not cached here: the pinned tools below are installed (or
          # cache-restored by version) explicitly, so a stale binary cannot ride along.
          cache-bin: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Read tool pins
        # The ONE pin for CI and the devloop image: infra/cargo-tools.versions, through
        # its one reader. sqlx-cli is pinned to Cargo.lock's `sqlx` by its own reader.
        # Assign first, then write: a failing `$(…)` inside echo's arguments does NOT trip
        # `bash -e`, so `echo "x=$(reader)"` would write `x=` and pass an empty version on.
        id: pins
        run: |
          source infra/lib/cargo-tools.sh
          source infra/lib/cargo-lock-version.sh
          audit="$(cargo_tool_version infra/cargo-tools.versions cargo-audit)"
          nextest="$(cargo_tool_version infra/cargo-tools.versions cargo-nextest)"
          sqlx="$(cargo_lock_version Cargo.lock sqlx)"
          rustc_full="$(rustc --version)"
          rustc_v="${rustc_full#rustc }"; rustc_v="${rustc_v%% *}"
          [ -n "$rustc_v" ] || { echo "::error::could not read the rustc version from '${rustc_full}'"; exit 1; }
          {
            echo "cargo-audit=${audit}"
            echo "cargo-nextest=${nextest}"
            echo "sqlx=${sqlx}"
            echo "rustc=${rustc_v}"
          } >> "$GITHUB_OUTPUT"

      - name: Install cargo-audit
        if: matrix.needs_audit
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit@${{ steps.pins.outputs.cargo-audit }}

      - name: Install cargo-nextest
        # Layer 4's test runner (scripts/lang/rust/test.sh checks the version against the pin).
        if: matrix.needs_nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@${{ steps.pins.outputs.cargo-nextest }}

      - name: Cache sqlx-cli
        # Compiling sqlx-cli costs ~50 s per run. The key carries the exact version and
        # rustc, and scripts/lang/rust/test.sh still checks the CLI against Cargo.lock, so
        # a stale binary fails loudly rather than migrating with the wrong shape.
        # Same scoping premise as the rust-cache step: no pull_request_target/workflow_run.
        if: matrix.needs_db
        id: sqlx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ runner.os }}-rustc-${{ steps.pins.outputs.rustc }}-${{ steps.pins.outputs.sqlx }}

      - name: Install sqlx-cli
        # scripts/lang/rust/test.sh migrates the test DB with sqlx-cli and refuses
        # to run without it, or with a CLI that differs from Cargo.lock's `sqlx`.
        if: matrix.needs_db && steps.sqlx-cache.outputs.cache-hit != 'true'
        env:
          SQLX_VERSION: ${{ steps.pins.outputs.sqlx }}
        run: cargo install sqlx-cli --locked --no-default-features --features postgres --version "=${SQLX_VERSION}"

      # buf is provided by `pnpm exec buf` (@bufbuild/buf, lockfile-pinned) after `pnpm install`
      # (ADR-0037 §D7 COLLAPSE) — no separate buf-setup-action install.
      #
      # No separate dt-guard/dt-story build here: Layer 3's guards consume
      # target/release/{dt-guard,dt-story}, which scripts/lang/rust/compile.sh (Layer 1,
      # always-run) builds earlier in this same shard. A missing binary still fails Layer 3
      # loudly (scripts/guards/simple/_dt_guard_wrapper.sh), never skips.

      - name: Assert kubectl is present (kustomize R-21 renders the environment root)
        # `dt-guard kustomize` R-21 (ADR-0038 content-addressed ConfigMaps) FAILS
        # when no kustomize tool resolves, instead of degrading to a WARN. It is
        # the invariant's only enforcement. GitHub's ubuntu runner images ship
        # kubectl; this step makes that premise explicit and loud, so a runner
        # image change surfaces here and not as a confusing guard failure. The
        # devloop image pins kubectl in infra/devloop/Dockerfile (KUBECTL_VERSION).
        # See docs/TODO.md "validate-kustomize maps 'I did not check this'...".
        if: matrix.needs_kubectl
        run: kubectl version --client && kubectl kustomize --help >/dev/null

      - name: Install Playwright Chromium
        # INTERIM PATCH (see TODO: run CI in the devloop image). Layer 4
        # (scripts/lang/ts/test.sh → nx test:component) runs vitest browser-mode
        # tests that need Chromium — the devloop image bakes it in; CI must
        # provision it too or Layer 4 fails "Executable doesn't exist …
        # chromium_headless_shell". `playwright` is a package-level dep, so resolve
        # via the workspace package (not `npx` at root).
        if: matrix.needs_playwright
        run: pnpm --filter @darktower/web-app exec playwright install --with-deps chromium

      # Same router as local devloop's scripts/verify-completion.sh --layer full
      # (ADR-0033 §4), one shard of it. Local repro of an audit failure: `./scripts/layer6.sh`.
      #
      # Gate-2 forgery backstop (task #51): each shard runs its layers of layer-all.sh FROM
      # SCRATCH and deliberately does NOT read the local /tmp/devloop/gate2-verdict
      # artifact (a `--layers` run never writes one either). The verdict is an anti-drift
      # convenience for the local pre-commit hook (which an agent could forge or bypass
      # with --no-verify); CI's independent re-run — these shards, proven complete by the
      # `Test Suite` aggregate — is the only non-bypassable enforcement. Do NOT "optimize"
      # by trusting the committed/uploaded verdict — that would reintroduce the authority
      # skip-vector. See docs/runbooks/devloop-validation.md.
      - name: Run pipeline shard
        # Also emits `summary-path` (where it writes the shard summary) for the upload below.
        id: shard
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dark_tower_test
          AC_MASTER_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          AC_BIND_ADDRESS: 127.0.0.1:8082
          SHARD_LAYERS: ${{ matrix.layers }}
        run: ./scripts/layer-all.sh --layers "${SHARD_LAYERS}"

      - name: Upload shard summary
        # Always: a red shard's summary must still reach the aggregate, so `Test Suite`
        # reports the real FAIL instead of a generic missing-layer PRECONDITION.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layer-summary-${{ matrix.shard }}
          # The path layer-all.sh reported (its own directory + file name): never restated here.
          path: ${{ steps.shard.outputs.summary-path }}
          if-no-files-found: error
          retention-days: 5

  test:
    # The required check. Its name is the branch-protection context, so it keeps the
    # pre-split job's name: renaming it would silently drop the requirement.
    name: Test Suite
    needs: pipeline
    # Always runs, so a skipped/cancelled/failed shard still produces a red `Test Suite`
    # (a skipped required check would otherwise read as passing).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to have succeeded
        # FIRST, before reading anything: success is the only acceptable matrix result
        # (skipped / cancelled / failure all red this job). The steps below still run
        # (`if: always()`) so a red run also prints which layer failed, but they can only
        # add a failure, never clear this one.
        env:
          SHARDS_RESULT: ${{ needs.pipeline.result }}
        run: |
          if [ "${SHARDS_RESULT}" != "success" ]; then
            echo "::error::pipeline shards result is '${SHARDS_RESULT}', not success — open the red 'Pipeline (...)' job (the aggregate below names the failing layer when its summary was uploaded)"
            exit 1
          fi

      - name: Checkout code
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download shard summaries
        # This workflow run's artifacts only (no run-id / github-token): the aggregate
        # reads what these shards just produced, never a verdict or another run's output.
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: layer-summary-*
          path: shard-summaries

      - name: Aggregate the pipeline
        # Every layer 1..LAYER_MAX exactly once across the shards (strictly parsed), worst
        # status + observed-rc floor — the same result one full layer-all.sh would give.
        # See the Gate-2 backstop note on the "Run pipeline shard" step above.
        if: always()
        run: ./scripts/layer-all.sh --aggregate shard-summaries

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Raised from 30 deliberately: the external-binary flow adds an instrumented
    # dt-guard build plus the two bash guard suites (~111 cases) under
    # instrumentation. A timeout is loud, so this is ergonomics not correctness.
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dark_tower_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        # fetch-depth omitted: coverage job runs cargo-llvm-cov over the full
        # working tree; no diff-aware tooling is invoked here. The pipeline
        # job above requires fetch-depth: 0 — keep that surface tight.

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        # One Rust version everywhere: rust-toolchain.toml. With no argument, rustup
        # installs the toolchain (and components) that file names, and every later cargo
        # call in the checkout resolves to it; the images derive theirs from the same
        # file (infra/lib/rust-toolchain.sh). rustup is preinstalled on the runner, so no
        # third-party toolchain action is needed.
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
          rustup show active-toolchain

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "coverage-cache"
          # Save on red runs too. SAFE ONLY WHILE no workflow uses `pull_request_target` or
          # `workflow_run`: a `pull_request` run's cache is scoped to that PR's ref, and
          # main never reads it (see the pipeline job's cache step).
          cache-on-failure: true

      - name: Read tool pins
        # The ONE pin for CI and the devloop image (infra/cargo-tools.versions). The
        # comments below assert cargo-llvm-cov 0.8.x behaviour; the pin keeps that true.
        # Assign first, then write (a failing `$(…)` inside echo's arguments does not trip `bash -e`).
        id: pins
        run: |
          source infra/lib/cargo-tools.sh
          v="$(cargo_tool_version infra/cargo-tools.versions cargo-llvm-cov)"
          echo "cargo-llvm-cov=${v}" >> "$GITHUB_OUTPUT"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov@${{ steps.pins.outputs.cargo-llvm-cov }}

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dark_tower_test
          AC_MASTER_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          AC_BIND_ADDRESS: 127.0.0.1:8082
          # REDUNDANT under cargo-llvm-cov's wrapper flow, kept as belt-and-suspenders.
          # cargo-llvm-cov 0.8.x instruments via RUSTC_WRAPPER and injects `--cfg=coverage`
          # ITSELF, independent of this line (verified: `show-env` emits an identical
          # `__CARGO_LLVM_COV_RUSTC_WRAPPER_RUSTFLAGS=-Cinstrument-coverage--cfg=coverage`
          # with or without RUSTFLAGS set, and never exports CARGO_ENCODED_RUSTFLAGS).
          # The `coverage` cfg keeps ac-service's three `#[cfg_attr(coverage, ignore)]`
          # tests ignored; the load-bearing guarantee of that is the assert below, NOT
          # this env var.
          RUSTFLAGS: --cfg coverage
        # External-binary flow, so the bash guard self-tests' runs of the
        # INSTRUMENTED dt-guard contribute to the single merged lcov. See
        # docs/runbooks/devloop-validation.md §8.6 "Coverage Lane" for triage.
        run: |
          set -euo pipefail

          cargo llvm-cov clean --workspace

          # `source <(...)` swallows a show-env failure under set -e/pipefail (an
          # empty stream sources cleanly -> an UNINSTRUMENTED build). Capture to
          # a file, require it non-empty, then source.
          cargo llvm-cov show-env --export-prefix > llvm-cov-env.sh
          [ -s llvm-cov-env.sh ] || { echo "::error::cargo llvm-cov show-env produced no output"; exit 1; }
          . ./llvm-cov-env.sh

          # Instrumentation asserts against the ACTUAL cargo-llvm-cov 0.8.x mechanism: a
          # RUSTC_WRAPPER that injects the flags per crate. It does NOT export
          # CARGO_ENCODED_RUSTFLAGS, and it sets cfg(coverage) ITSELF (independent of the
          # job-env RUSTFLAGS). Each grep fails CLOSED — sound because the string is present
          # whenever the tool instruments, so it vanishes (and reds the job) only if a future
          # llvm-cov stops providing it. Three distinct silent-failure modes:
          #   1. RUSTC_WRAPPER unset            -> build is NOT instrumented (0% coverage).
          #   2. -Cinstrument-coverage absent   -> same, via a broken/changed show-env.
          #   3. cfg(coverage) absent           -> ac-service's three `#[cfg_attr(coverage,
          #      ignore)]` tests un-ignore and RUN under coverage.
          # (Review O-A: the original lone `cfg=coverage` grep was SOUND for mode 3, but its
          # comment wrongly cited CARGO_ENCODED_RUSTFLAGS/user-RUSTFLAGS survival, and it left
          # modes 1-2 unguarded — an uninstrumented build (RUSTC_WRAPPER unset or
          # -Cinstrument-coverage dropped) still matches `cfg=coverage`, so 0% would read green.
          # Comment corrected; modes 1-2 added. Patterns are deliberately TIGHT (the real
          # injected form is `--cfg=coverage`, the `=` form) — a format shift SHOULD red the
          # job, not be tolerated, so no space-form loosening.)
          grep -qE '^export RUSTC_WRAPPER=.*cargo-llvm-cov' llvm-cov-env.sh || { echo "::error::show-env did not set RUSTC_WRAPPER=cargo-llvm-cov — the build would be UNINSTRUMENTED (0% coverage)"; exit 1; }
          grep -q 'instrument-coverage' llvm-cov-env.sh || { echo "::error::-Cinstrument-coverage missing from the wrapper rustflags — the build would be UNINSTRUMENTED (0% coverage)"; exit 1; }
          grep -q 'cfg=coverage' llvm-cov-env.sh || { echo "::error::cfg=coverage missing from the wrapper rustflags — ac-service #[cfg_attr(coverage, ignore)] tests would un-ignore and RUN"; exit 1; }

          # The profraw filename must uniquify per process (%p/%m), or the
          # per-suite delta below cannot move.
          case "${LLVM_PROFILE_FILE:-}" in
            *%p*|*%m*) : ;;
            *) echo "::error::LLVM_PROFILE_FILE lacks %p/%m: '${LLVM_PROFILE_FILE:-<unset>}'"; exit 1 ;;
          esac

          # Build the instrumented binary (dev profile — identical across build,
          # test and report, so the report semantics are unchanged) and run the
          # cargo tests (the *_e2e.rs proof-of-trap fixtures included).
          #
          # PLAIN cargo here, NOT `cargo llvm-cov` — the instrumentation env is
          # already active (sourced from show-env above), so a nested `cargo
          # llvm-cov` subcommand re-wraps an already-wrapped build. cargo-llvm-cov
          # warns against exactly this ("subcommands other than report and clean
          # may not work correctly in context where environment variables are set
          # by show-env; consider using normal cargo commands"), and the doubled
          # RUSTC_WRAPPER nesting inflates the per-compile process fan-out until
          # the runner's fork/thread limit is hit — rustc children fail to spawn
          # with EAGAIN ("Resource temporarily unavailable", never executed) and
          # the step dies. `cargo test` under the sourced env emits the same
          # instrumented profraws the report step below consumes.
          cargo build -p dt-guard --locked
          cargo test --workspace --locked

          # Point DT_GUARD at the INSTRUMENTED binary, derived from the target dir
          # cargo-llvm-cov exported (not a hardcoded target/llvm-cov-target path).
          export DT_GUARD="${CARGO_LLVM_COV_TARGET_DIR:?}/debug/dt-guard"
          # Fail loudly rather than let the bash suites fall back to the
          # uninstrumented target/release/dt-guard (rust-cache may restore it).
          [ -n "${DT_GUARD}" ] && [ -x "${DT_GUARD}" ] || { echo "::error::instrumented DT_GUARD missing or not executable: ${DT_GUARD}"; exit 1; }
          [ "${DT_GUARD}" != "${PWD}/target/release/dt-guard" ] || { echo "::error::DT_GUARD points at the uninstrumented release binary"; exit 1; }

          # SSoT: derive the suite list (the script fails on drift/floor). set -e
          # catches its non-zero exit BEFORE we read the file.
          ./scripts/guards/list-coverage-suites.sh > coverage-suites.txt
          mapfile -t SUITES < coverage-suites.txt

          # Per-suite profraw DELTA: snapshot before each suite, require STRICT
          # growth after. A post-run ">=1 profraw exists" would be vacuous (the
          # cargo tests already deposited many); the delta proves the INSTRUMENTED
          # binary actually ran under each suite.
          PROFRAW_DIR="${CARGO_LLVM_COV_TARGET_DIR:?}"
          rc=0
          for s in "${SUITES[@]}"; do
            before=$(find "${PROFRAW_DIR}" -maxdepth 1 -name '*.profraw' | wc -l)
            if DT_GUARD="${DT_GUARD}" bash "${s}"; then :; else rc=1; fi
            after=$(find "${PROFRAW_DIR}" -maxdepth 1 -name '*.profraw' | wc -l)
            if [ "${after}" -le "${before}" ]; then
              echo "::error::${s} produced NO new profraw (${before} -> ${after}) — the binary under DT_GUARD was not instrumented (did DT_GUARD resolve to the plain target/release/dt-guard?)"
              rc=1
            fi
          done
          [ "${rc}" -eq 0 ] || { echo "::error::a coverage suite failed or produced no coverage"; exit 1; }

          # Single merged lcov from ALL profiles (cargo tests + bash suites).
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
