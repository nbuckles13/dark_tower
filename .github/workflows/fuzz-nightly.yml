name: Nightly Fuzz Testing

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

# It builds a fresh, unlocked third-party graph (C++ build.rs included): read-only token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  extended-fuzz:
    name: Extended Fuzz Testing (5.5 hours)
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 5 hours 50 min (GitHub Actions max is 6 hours)

    strategy:
      fail-fast: false
      matrix:
        # `seed_cmd` (optional, AFTER `target:` — fuzz_wiring.rs reads `- crate:` then
        # `target:`): the generator that writes this target's seed corpus into the
        # gitignored fuzz/corpus/<target>/, run from crates/<crate>. Seeds are generated,
        # never committed (docs/FUZZING.md §Seed Corpus). A target that declares one is
        # fuzzed seeded or the job fails. fuzz_wiring.rs checks every fuzz/examples/*.rs
        # is named by exactly one seed_cmd, and a crate-wide one (no --example) by every
        # entry of its crate. `--locked` only where a lock is tracked (root workspace);
        # the fuzz workspaces' locks are untracked (.gitignore), so gen_jwt_seed has none.
        fuzz_target:
          - crate: media-protocol
            target: codec_decode
            seed_cmd: cargo +nightly test --locked -p media-protocol --test corpus_seeds
          - crate: media-protocol
            target: codec_roundtrip
            seed_cmd: cargo +nightly test --locked -p media-protocol --test corpus_seeds
          - crate: media-protocol
            target: header_prefix
            seed_cmd: cargo +nightly test --locked -p media-protocol --test corpus_seeds
          - crate: media-protocol
            target: header_reader_split
            seed_cmd: cargo +nightly test --locked -p media-protocol --test corpus_seeds
          - crate: ac-service
            target: jwt_validation
            seed_cmd: cargo +nightly run --manifest-path fuzz/Cargo.toml --example gen_jwt_seed
          - crate: ac-service
            target: signaling_messages

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust nightly
        # rustup is preinstalled on the runner; `cargo +nightly fuzz` below selects it.
        run: rustup toolchain install nightly --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "fuzz-nightly-${{ matrix.fuzz_target.crate }}"

      - name: Install cargo-fuzz
        # Pinned and --locked from the ONE tool pin (infra/cargo-tools.versions): unpinned,
        # `cargo install` floats to the newest release and its newest dependencies.
        run: |
          source infra/lib/cargo-tools.sh
          v="$(cargo_tool_version infra/cargo-tools.versions cargo-fuzz)"
          cargo install cargo-fuzz --locked --version "=${v}"

      - name: Generate seed corpus
        if: matrix.fuzz_target.seed_cmd
        working-directory: crates/${{ matrix.fuzz_target.crate }}
        shell: bash
        env:
          SEED_CMD: ${{ matrix.fuzz_target.seed_cmd }}
        run: |
          set -euo pipefail
          echo "=== Generating seed corpus: ${SEED_CMD} ==="
          # Split the static matrix string into argv; no eval, no ${{ }} in the script.
          read -ra cmd <<<"${SEED_CMD}"
          "${cmd[@]}"

      - name: Verify seed corpus
        # Refuse to fuzz unseeded. Its own step, before `fuzz`: an empty seed corpus
        # fails the job here, the `fuzz` step is skipped (outcome 'skipped'), and the
        # crash upload/notify steps (gated on steps.fuzz.outcome == 'failure') stay off.
        if: matrix.fuzz_target.seed_cmd
        working-directory: crates/${{ matrix.fuzz_target.crate }}
        shell: bash
        env:
          TARGET: ${{ matrix.fuzz_target.target }}
        run: |
          set -euo pipefail
          corpus="fuzz/corpus/${TARGET}"
          n=0
          if [ -d "${corpus}" ]; then
            n=$(find "${corpus}" -type f | wc -l)
          fi
          if [ "${n}" -eq 0 ]; then
            echo "::error::${TARGET} declares seed_cmd but ${corpus} has 0 inputs after its seed_cmd ran; refusing to fuzz unseeded"
            exit 1
          fi
          echo "seed corpus: ${corpus} (${n} inputs)"

      - name: Run extended fuzz test
        id: fuzz
        working-directory: crates/${{ matrix.fuzz_target.crate }}
        shell: bash
        env:
          TARGET: ${{ matrix.fuzz_target.target }}
        run: |
          set -euo pipefail
          echo "=== Extended fuzzing ${TARGET} for 5.5 hours ==="
          # cargo-fuzz's default corpus dir; generated seeds (if any) are already in it.
          corpus="fuzz/corpus/${TARGET}"
          # A target with no seed_cmd may have no corpus dir yet (cargo-fuzz creates it).
          n=0
          if [ -d "${corpus}" ]; then
            n=$(find "${corpus}" -type f | wc -l)
          fi
          echo "corpus dir passed: ${corpus} (${n} pre-seeded inputs)"
          cargo +nightly fuzz run "${TARGET}" \
            -- \
            -max_total_time=19800 \
            -rss_limit_mb=4096 \
            -workers=2 \
            -print_final_stats=1

      - name: Upload crash artifacts
        # Only a failed fuzz run means crashes; an install or seed-generation failure
        # fails the job without being reported as one.
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.fuzz_target.crate }}-${{ matrix.fuzz_target.target }}
          path: crates/${{ matrix.fuzz_target.crate }}/fuzz/artifacts/

      - name: Upload corpus
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.fuzz_target.crate }}-${{ matrix.fuzz_target.target }}
          path: crates/${{ matrix.fuzz_target.crate }}/fuzz/corpus/

      - name: Notify on crash
        if: failure() && steps.fuzz.outcome == 'failure'
        run: |
          echo "::error::Fuzz test ${{ matrix.fuzz_target.crate }}/${{ matrix.fuzz_target.target }} found crashes!"
          echo "Check artifacts for crash inputs"
