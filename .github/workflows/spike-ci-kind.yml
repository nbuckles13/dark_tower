name: Spike S6 - Kind + Layer 7 on a GitHub-hosted runner

# Feasibility spike (cloud deploy plan, spike S6): does provision + deploy + Layer 7
# fit a standard ubuntu-latest runner, and how long does it take? Throwaway branch;
# not meant for main. Runs the helper on the runner host and points the canonical
# /tmp/devloop paths at its runtime dir, so layer7.sh takes its existing
# socket-present lane (no new mechanism).

# Trust tiers (image-caching spike, 2026-10-25). The spike EMULATES the real
# triggers with two branches; in production read `refs/heads/main` for
# `spike/ci-kind` and `pull_request` for `spike/ci-kind-pr`:
#   main tier: a `build` job (no test or third-party test code) gates the build
#     context, builds every image once with the layer cache, pushes to GHCR by
#     digest; `layer7` pulls those digests and never holds the cache token or a
#     package-write token.
#   pr tier: a `build-pr` job builds every image once (cache read from the base
#     branch, writes only its own scope), pushes nothing, and hands the images to
#     `layer7` as docker archives in this run's artifact. Fork PRs are read-only by
#     platform rule. In neither tier does `layer7` hold a cache or registry-write token.
on:
  push:
    branches: [ spike/ci-kind, spike/ci-kind-pr ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  KIND_VERSION: v0.33.0          # run 3: v0.20 `kind load` fails on the runner Docker image store (ctr digest not found); S2 also recommends v0.33
  HOST_GATEWAY_IP: 10.255.255.254  # devloop-helper DEFAULT_HOST_GATEWAY_IP
  SLUG: ci
  PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright  # run 6: layer7 defaults to the image path /opt/ms-playwright
  TIER: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/spike/ci-kind') && 'main' || 'pr' }}

jobs:
  build:
    # main tier only (the expression mirrors env.TIER; env is not readable here).
    if: github.event_name == 'push' && github.ref == 'refs/heads/spike/ci-kind'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write   # push CI images; this job runs no test code
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "spike-ci-kind-build"
          cache-on-failure: true
          cache-bin: false

      - name: Gate - build context holds no key material
        # Before any cache or registry credential exists in this job.
        run: |
          bash -c 'source scripts/lib/tool-bins.sh && dt_build_tool dt-guard --locked --quiet'
          scripts/guards/simple/validate-docker-context.sh
          scripts/guards/simple/validate-shared-image-builder.sh

      - name: Actions cache credentials for BuildKit
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Create docker-container builder
        run: docker buildx create --name dt-ci --driver docker-container --bootstrap --use

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

      - name: Build once, push by digest
        id: push
        env:
          DT_IMAGE_SOURCE_REV: ${{ github.sha }}
          DT_IMAGE_BUILD_CACHE: gha
        run: |
          start=$(date +%s)
          mkdir -p /tmp/images
          infra/ci/build-images.sh --push /tmp/images/image-refs.txt
          echo "image builds: $(( $(date +%s) - start ))s"
          cat /tmp/images/image-refs.txt

      - name: Publish the digest list to this run
        # An artifact, not a job output: layer7 starts without `needs: build` so its
        # setup overlaps the image builds, and collects the list when build finishes.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: /tmp/images/
          retention-days: 1
          if-no-files-found: error

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  build-pr:
    # pr tier only. Builds the same images as `build` with no registry token; the
    # archives travel to layer7 inside this run only (never another run or tier).
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/spike/ci-kind') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "spike-ci-kind-build"
          cache-on-failure: true
          cache-bin: false

      - name: Gate - build context holds no key material
        # The archives are downloadable by anyone who can read this run.
        run: |
          bash -c 'source scripts/lib/tool-bins.sh && dt_build_tool dt-guard --locked --quiet'
          scripts/guards/simple/validate-docker-context.sh
          scripts/guards/simple/validate-shared-image-builder.sh

      - name: Actions cache credentials for BuildKit
        # Self-scoped: a PR run's cache writes are readable only by that PR.
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Create docker-container builder
        run: docker buildx create --name dt-ci --driver docker-container --bootstrap --use

      - name: Build once, archive by image ID
        env:
          DT_IMAGE_BUILD_CACHE: gha
        run: |
          start=$(date +%s)
          infra/ci/build-images.sh --archive /tmp/images
          echo "image builds: $(( $(date +%s) - start ))s"
          cat /tmp/images/image-refs.txt
          ls -la /tmp/images

      - name: Publish the images to this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: /tmp/images/
          retention-days: 1
          if-no-files-found: error

  layer7:
    # One job per Layer 7 suite, each on its own Kind cluster: the two suites must
    # never run concurrently on one cluster (scripts/layer7.sh header), and
    # DEVLOOP_LAYER7_SUITE (CI-only) runs one of them.
    # No `needs:`: setup runs while the tier's build job builds images, and the
    # "wait for the build job" step joins the two before deploy.
    name: layer7 (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [ env-tests, browser-e2e ]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read    # pull the CI images; no write
      actions: read     # read this run's job status (wait for build)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Record runner shape (before)
        run: |
          nproc; free -m; df -h / /mnt 2>/dev/null; docker version --format '{{.Server.Version}}'
          which podman kind kubectl || true

      - name: Start resource sampler
        run: |
          mkdir -p /tmp/spike
          ( while true; do
              { date -u +%T; free -m | sed -n 2p; df -h / | tail -1;
                docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' 2>/dev/null; echo; } >> /tmp/spike/samples.log
              sleep 30
            done ) &
          echo "phase,start" > /tmp/spike/phases.csv

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler socat  # socat: dev-cluster client transport

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "spike-ci-kind"
          cache-on-failure: true
          cache-bin: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: matrix.suite == 'browser-e2e'
        run: pnpm --filter @darktower/web-app exec playwright install --with-deps chromium

      - name: Install kind
        run: |
          curl -fsSLo /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Classic Docker image store (kind load compatibility)
        # Runs 3-4: with Docker's containerd image store, `kind load` of multi-arch
        # images fails (`ctr images import --all-platforms`: content digest not found).
        run: |
          docker info --format 'driver={{.Driver}} images={{.DriverStatus}}' || true
          echo '{"features":{"containerd-snapshotter":false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format 'driver={{.Driver}}'

      - name: Use rootful docker, not the preinstalled podman
        # devloop-helper picks podman when it is on PATH; the spike measures the docker path.
        run: |
          p="$(command -v podman || true)"
          if [ -n "$p" ]; then sudo mv "$p" "$p.disabled"; fi
          ! command -v podman

      - name: Give the runner the dev container's view of the host
        # Kind binds NodePorts and the apiserver on HOST_GATEWAY_IP, and the helper
        # writes URLs/kubeconfig against host.containers.internal.
        run: |
          sudo ip addr add "${HOST_GATEWAY_IP}/32" dev lo
          echo "${HOST_GATEWAY_IP} host.containers.internal" | sudo tee -a /etc/hosts

      - name: Build devloop-helper
        run: |
          echo "build-helper,$(date -u +%s)" >> /tmp/spike/phases.csv
          cargo build --release -p devloop-helper

      - name: Wait for the build job
        # Fails loudly if the tier's build job fails, is cancelled, or does not
        # finish in time. Runs before any test code: nothing in this job can have
        # written the artifact the next step downloads.
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_JOB: ${{ env.TIER == 'main' && 'build' || 'build-pr' }}
        run: |
          jobs="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs"
          for _ in $(seq 1 240); do
            state="$(gh api "${jobs}" --jq "[.jobs[] | select(.name == \"${BUILD_JOB}\")] | if length == 1 then .[0] | \"\\(.status) \\(.conclusion)\" else \"ambiguous \\(length)\" end")"
            case "${state}" in
              "completed success") echo "${BUILD_JOB} job succeeded"; exit 0 ;;
              completed*|ambiguous*) echo "::error::${BUILD_JOB} job: ${state}"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::${BUILD_JOB} job still running after 60 min (${state})"; exit 1

      - name: Download the build job's images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: /tmp/images

      - name: (main tier) Use the build job's images, pinned by digest
        if: env.TIER == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          cat /tmp/images/image-refs.txt
          [ "$(grep -cE '^localhost/[a-z0-9-]+ [a-z0-9./_-]+@sha256:[0-9a-f]{64}$' /tmp/images/image-refs.txt)" -ge 5 ] \
            || { echo "::error::expected 5 digest-pinned refs"; exit 1; }
          ! ls /tmp/images/*.tar 2>/dev/null || { echo "::error::main tier pulls from the registry; unexpected archives"; exit 1; }
          echo "DT_PREBUILT_IMAGES=/tmp/images/image-refs.txt" >> "$GITHUB_ENV"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

      - name: (pr tier) Load the build job's images, pinned by image ID
        if: env.TIER == 'pr'
        run: |
          cat /tmp/images/image-refs.txt
          [ "$(grep -cE '^localhost/[a-z0-9-]+ sha256:[0-9a-f]{64}$' /tmp/images/image-refs.txt)" -ge 5 ] \
            || { echo "::error::expected 5 image-ID refs"; exit 1; }
          for tar in /tmp/images/*.tar; do docker load -i "${tar}"; done
          # deploy.sh refuses any listed ID the store does not hold; check here too, so a
          # mismatch names the image rather than surfacing mid-deploy.
          while read -r repo id; do
            docker image inspect "${id}" >/dev/null || { echo "::error::${repo}: ${id} not loaded"; exit 1; }
          done < /tmp/images/image-refs.txt
          rm -f /tmp/images/*.tar
          echo "DT_PREBUILT_IMAGES=/tmp/images/image-refs.txt" >> "$GITHUB_ENV"

      - name: Run Layer 7 (${{ matrix.suite }})
        env:
          KUBECONFIG: /tmp/devloop/kubeconfig
          DEVLOOP_LAYER7_SUITE: ${{ matrix.suite }}
        # The helper is launched in THIS step: the runner kills a step's background
        # processes when the step ends (run 1: helper ready, then gone before Layer 7).
        run: |
          ( while true; do
              { echo "L7 $(date -u +%T)"; free -m | sed -n 2p; df -h / | tail -1;
                docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' 2>/dev/null; echo; } >> /tmp/spike/samples.log
              sleep 30
            done ) &
          mkdir -p "/tmp/devloop-${SLUG}"
          chmod 700 "/tmp/devloop-${SLUG}"
          nohup target/release/devloop-helper "${SLUG}" --project-root "$GITHUB_WORKSPACE" \
            --host-gateway-ip "${HOST_GATEWAY_IP}" \
            >> "/tmp/devloop-${SLUG}/helper-stdout.log" 2>> "/tmp/devloop-${SLUG}/helper-stderr.log" &
          for _ in $(seq 1 60); do [ -S "/tmp/devloop-${SLUG}/helper.sock" ] && break; sleep 1; done
          [ -S "/tmp/devloop-${SLUG}/helper.sock" ] || { cat "/tmp/devloop-${SLUG}/helper-stderr.log"; exit 1; }
          ln -sfn "/tmp/devloop-${SLUG}" /tmp/devloop
          ls -la /tmp/devloop/

          infra/devloop/dev-cluster status || { echo "::error::dev-cluster status failed"; exit 1; }
          echo "layer7,$(date -u +%s)" >> /tmp/spike/phases.csv
          set +e
          /usr/bin/time -v ./scripts/layer-all.sh --layers 7 2> >(tee /tmp/spike/time-v.txt >&2)
          rc=$?
          set -e
          echo "done,$(date -u +%s)" >> /tmp/spike/phases.csv
          # SKIPPED-NO-CLUSTER here would mean the socket lane was not taken: fail loudly.
          if grep -rqs "SKIPPED-NO-CLUSTER" /tmp/devloop/layer-7*.log 2>/dev/null; then
            echo "::error::Layer 7 skipped despite a running helper"; exit 1
          fi
          exit $rc

      - name: Record runner shape (after)
        if: always()
        run: |
          free -m; df -h /; docker ps --format '{{.Names}} {{.Status}}' || true
          cat /tmp/spike/phases.csv

      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/spike/devloop
          cp -rL /tmp/devloop-${SLUG}/*.log /tmp/devloop-${SLUG}/ports.json /tmp/spike/devloop/ 2>/dev/null || true
          find /tmp -maxdepth 2 -name 'layer-*.log' -newer /tmp/spike/phases.csv -exec cp {} /tmp/spike/ \; 2>/dev/null || true

      - name: Upload spike evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-s6-evidence-${{ matrix.suite }}
          path: /tmp/spike/
          retention-days: 14
