# Loki Configuration for Dark Tower
#
# Loki is the log aggregation system that receives logs from Promtail.
# This is a single-instance configuration suitable for local development.
#
# For production, consider:
# - Distributed mode with separate read/write components
# - External object storage (S3, GCS, Azure Blob)
# - Proper retention policies
#
# The Loki server config itself lives in `loki.yaml` and is GENERATED into the
# `loki-config` ConfigMap by ./kustomization.yaml (content-addressed, ADR-0038
# §2): editing it changes the StatefulSet's pod template and rolls Loki.
#
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: dark-tower-observability
  labels:
    app: loki
    component: logging
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        component: logging
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.3
          securityContext:
            readOnlyRootFilesystem: false  # Loki writes index/chunks to /loki
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          args:
            - "-config.file=/etc/loki/loki.yaml"
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: dark-tower-observability
  labels:
    app: loki
    component: logging
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
      nodePort: 30080
  type: NodePort
