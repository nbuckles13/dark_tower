# Prometheus for Dark Tower — RBAC, Deployment and Service.
#
# The server config itself lives in `prometheus.yml` in this directory and the
# alert rules in `infra/docker/prometheus/rules/`; both are turned into
# ConfigMaps by `configMapGenerator` in `kustomization.yaml`.
#
# Scrape jobs (see `prometheus.yml`): prometheus, ac-service, gc-service,
# mc-service, mh-service, kube-state-metrics, node-exporter, kubelet.
#
# NOTE: the `prometheus-config` and `prometheus-rules` ConfigMaps are GENERATED
# by `configMapGenerator` in `kustomization.yaml` -- from
# `infra/kubernetes/observability/prometheus.yml` and from
# `infra/docker/prometheus/rules/` respectively. They are deliberately not
# inline here: a generated ConfigMap carries a content hash, so a change to
# either rolls the Deployment, which is what makes "the rules on disk are the
# rules Prometheus loaded" structural rather than a reload call someone must
# remember to make.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: dark-tower-observability
  labels:
    app: prometheus
    component: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    app: prometheus
    component: monitoring
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels:
    app: prometheus
    component: monitoring
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: dark-tower-observability
roleRef:
  kind: ClusterRole
  name: prometheus
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: dark-tower-observability
  labels:
    app: prometheus
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        component: monitoring
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.0
          securityContext:
            readOnlyRootFilesystem: false  # Prometheus writes TSDB to /prometheus
            runAsNonRoot: true
            runAsUser: 65534  # nobody — image uses string "nobody", K8s needs numeric UID
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            # NO `--web.enable-lifecycle`. It was removed on 2026-09-09 with the
            # alert-rule loading change, and the reason is that change: the flag
            # enables unauthenticated `POST /-/reload` AND `POST /-/quit`, this
            # Service is a NodePort on 30090, and `infra/kind/kind-config.yaml`
            # maps that to hostPort 9090 -- so `/-/quit` was reachable off-host.
            # While nothing evaluated rules, stopping Prometheus was a metrics
            # gap somebody would notice. NOW IT IS A DETECTION OUTAGE, and a
            # stopped evaluator looks exactly like a quiet one. The flag was
            # also dead: nothing in scripts/, infra/ or crates/env-tests/ calls
            # either endpoint. Rule changes do not need it -- the ConfigMaps are
            # generated with content hashes, so a rules edit changes the
            # Deployment spec and rolls the pod.
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            # Mounted at the path `rule_files: "rules/[a-z]*-alerts.yaml"`
            # resolves to. Prometheus resolves a relative `rule_files` glob
            # against the CONFIG FILE's directory, so `/etc/prometheus/rules`
            # here and `/etc/prometheus/rules` in docker-compose keep ONE glob
            # string valid in both deployments -- nothing to drift.
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: dark-tower-observability
  labels:
    app: prometheus
    component: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
  type: NodePort
