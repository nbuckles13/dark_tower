# Prometheus server configuration for the Dark Tower Kind cluster.
#
# THIS IS THE AUTHORITATIVE CONFIG -- it is what runs
# (docs/observability/dashboard-conventions.md §Two Prometheus configs).
# `infra/docker/prometheus/prometheus.yml` is the local-compose one and is not
# deployed. Keep the `rule_files` glob below BYTE-IDENTICAL to that file's, so
# there is one string and nothing to drift; `dt-guard alert-rules-policy`
# parses both and fails on a difference.
#
# EXTRACTED FROM AN INLINE ConfigMap on 2026-09-09. It used to live as a YAML
# string inside `prometheus-config.yaml`'s `data:` block, which had two costs
# this change removes: (1) an inline ConfigMap is not hashed by kustomize, so a
# config-only edit would NOT roll the pod and `setup.sh`'s readiness wait would
# pass instantly against the old pod running the old config -- a defect that
# only shows up on an ITERATED cluster, never a fresh one; (2) any guard
# reading it had to parse YAML embedded in YAML. It is now generated by
# `configMapGenerator`, so both this file and the rules directory are hashed
# and both roll the Deployment on change.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rule files.
#
# THE GLOB EXCLUDES A LEADING UNDERSCORE ON PURPOSE. `rules/*-alerts.yaml`
# would match `_template-service-alerts.yaml`, whose exprs are `<svc>`
# placeholders and are not parseable PromQL. Prometheus validates rule files at
# config load and EXITS NON-ZERO on a parse error -- in-cluster that is
# CrashLoopBackOff, which fails `infra/kind/scripts/setup.sh`'s Prometheus
# readiness wait and breaks whole-cluster bring-up. It is also a disclosure
# issue: that file is guard-EXEMPT by design (`dt-guard` skips `_template-*`,
# so its annotations get no hygiene scan), and loading it would serve unscanned
# annotation text on `/api/v1/rules`.
#
# THE PREDICATE HAS ONE HOME: `loadable_rules_files()` in
# `crates/dt-guard/src/alert_rules.rs`, beside ALERTS_SUBDIR. This glob is a
# consumer that cannot derive from it (Prometheus reads a config file, not Rust),
# so `dt-guard alert-rules-policy` asserts SET EQUALITY between what this glob
# matches and what that predicate yields, and names WHICH DIRECTION diverged --
# "linted but never loaded" costs detection, "loaded but never linted" costs
# disclosure. Do not widen this to `*-alerts.yaml`.
rule_files:
  - "rules/[a-z]*-alerts.yaml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape AC service pods running in-cluster
  - job_name: 'ac-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - dark-tower
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: ac-service
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8082"

  # Scrape Global Controller pods
  - job_name: 'gc-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - dark-tower
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: gc-service
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8080"

  # Scrape Meeting Controller pods (metrics on health port)
  - job_name: 'mc-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - dark-tower
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: mc-service
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8081"

  # Scrape Media Handler pods (metrics on health port)
  - job_name: 'mh-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - dark-tower
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: mh-service
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8083"

  # ==========================================================================
  # OTel collector — the browser `dt_client_*` series (R-27).
  # ==========================================================================
  #
  # DELIBERATELY NOT SHAPED LIKE THE FOUR SERVICE JOBS ABOVE, and deliberately
  # NOT keyed on the ac/gc/mh/mc enumeration in
  # `crates/dt-guard/src/common/services.rs`. This is not a Dark Tower service
  # exposing its own metrics; it is a relay exposing OTHER processes' metrics
  # (browsers), and every guard, dashboard convention and alert-inventory rule
  # that iterates "the four services" must keep skipping it.
  #
  # `scrape_interval: 10s` on the JOB, not globally. It matches the SDK's export
  # cadence — scraping faster only samples the same values twice, because the
  # collector re-exposes whatever it last accumulated. ANCHOR (DRY):
  # `DEFAULT_METRIC_EXPORT_INTERVAL_MS` in
  # `packages/sdk-core/src/telemetry/telemetryConfig.ts` is the value this
  # matches; YAML cannot import it, so if that constant moves, move this.
  #
  # `honor_labels` IS LEFT AT ITS DEFAULT (false), AND THAT IS A SECURITY
  # CONTROL, not just a naming choice. With it true, a client-supplied `job` or
  # `instance` would OVERRIDE the scrape's own — letting a patched browser
  # impersonate a service job and either forge an alert or suppress one. Left
  # false, the scrape identity wins and client-origin labels are prefixed.
  #
  # CONSEQUENCE FOR READING A CLIENT SERIES: it carries `job="otel-collector"` and
  # an `instance` naming the COLLECTOR POD, not a browser, with the SDK's own
  # identity under `exported_job="darktower-sdk-core"`. There is NO
  # `exported_instance`, because GC's filter passes only `service.name` and
  # `service.version` at the resource level and the SDK sets no
  # `service.instance.id` (barred as a participant dimension, ADR-0036 §11). So
  # grouping a `dt_client_*` series by `instance` groups by collector. The
  # authoritative stored-label shape lives in
  # `docs/observability/metrics/client.md` — one home, not restated here.
  - job_name: 'otel-collector'
    scrape_interval: 10s
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - dark-tower
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: otel-collector
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8889"

  # The collector's OWN telemetry — a SEPARATE job on purpose.
  #
  # Keeping this off the `otel-collector` job is what lets
  # `up{job="otel-collector"} == 1` keep meaning "the client-series endpoint is
  # being scraped", which is step 1 of the empty-panel discriminator on the
  # client dashboards and the positive control in
  # `crates/env-tests/tests/32_media_metric_hygiene.rs`. Two surfaces, two
  # scrape semantics, two `up` series.
  #
  # This is the only channel through which the metrics path's five silent drops
  # (name allowlist, temporality gate, keep_keys, max_streams, memory_limiter)
  # are observable at all — see the ConfigMap's `service.telemetry` comment. The
  # default 15s global interval is fine here; these are the collector's own
  # counters, not client data on a 10s cadence.
  - job_name: 'otel-collector-telemetry'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - dark-tower
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: otel-collector
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8888"

  # Scrape kube-state-metrics for cluster-level metrics
  - job_name: 'kube-state-metrics'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - dark-tower-observability
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: kube-state-metrics
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8080"

  # Scrape node-exporter for node-level metrics
  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - dark-tower-observability
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: node-exporter
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "9100"

  # Scrape kubelet for container metrics
  - job_name: 'kubelet'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
