# Prometheus server configuration for the Dark Tower Kind cluster.
#
# THIS IS THE AUTHORITATIVE CONFIG -- it is what runs
# (docs/observability/dashboard-conventions.md §Two Prometheus configs).
# `infra/docker/prometheus/prometheus.yml` is the local-compose one and is not
# deployed. Keep the `rule_files` glob below BYTE-IDENTICAL to that file's, so
# there is one string and nothing to drift; `dt-guard alert-rules-policy`
# parses both and fails on a difference.
#
# EXTRACTED FROM AN INLINE ConfigMap on 2026-09-09. It used to live as a YAML
# string inside `prometheus-config.yaml`'s `data:` block, which had two costs
# this change removes: (1) an inline ConfigMap is not hashed by kustomize, so a
# config-only edit would NOT roll the pod and `setup.sh`'s readiness wait would
# pass instantly against the old pod running the old config -- a defect that
# only shows up on an ITERATED cluster, never a fresh one; (2) any guard
# reading it had to parse YAML embedded in YAML. It is now generated by
# `configMapGenerator`, so both this file and the rules directory are hashed
# and both roll the Deployment on change.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rule files.
#
# THE GLOB EXCLUDES A LEADING UNDERSCORE ON PURPOSE. `rules/*-alerts.yaml`
# would match `_template-service-alerts.yaml`, whose exprs are `<svc>`
# placeholders and are not parseable PromQL. Prometheus validates rule files at
# config load and EXITS NON-ZERO on a parse error -- in-cluster that is
# CrashLoopBackOff, which fails `infra/kind/scripts/setup.sh`'s Prometheus
# readiness wait and breaks whole-cluster bring-up. It is also a disclosure
# issue: that file is guard-EXEMPT by design (`dt-guard` skips `_template-*`,
# so its annotations get no hygiene scan), and loading it would serve unscanned
# annotation text on `/api/v1/rules`.
#
# THE PREDICATE HAS ONE HOME: `loadable_rules_files()` in
# `crates/dt-guard/src/alert_rules.rs`, beside ALERTS_SUBDIR. This glob is a
# consumer that cannot derive from it (Prometheus reads a config file, not Rust),
# so `dt-guard alert-rules-policy` asserts SET EQUALITY between what this glob
# matches and what that predicate yields, and names WHICH DIRECTION diverged --
# "linted but never loaded" costs detection, "loaded but never linted" costs
# disclosure. Do not widen this to `*-alerts.yaml`.
rule_files:
  - "rules/[a-z]*-alerts.yaml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape AC service pods running in-cluster
  - job_name: 'ac-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - dark-tower
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: ac-service
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8082"

  # Scrape Global Controller pods
  - job_name: 'gc-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - dark-tower
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: gc-service
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8080"

  # Scrape Meeting Controller pods (metrics on health port)
  - job_name: 'mc-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - dark-tower
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: mc-service
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8081"

  # Scrape Media Handler pods (metrics on health port)
  - job_name: 'mh-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - dark-tower
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: mh-service
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8083"

  # Scrape kube-state-metrics for cluster-level metrics
  - job_name: 'kube-state-metrics'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - dark-tower-observability
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: kube-state-metrics
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8080"

  # Scrape node-exporter for node-level metrics
  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - dark-tower-observability
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: node-exporter
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "9100"

  # Scrape kubelet for container metrics
  - job_name: 'kubelet'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
