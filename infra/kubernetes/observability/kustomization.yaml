# Kustomization for Dark Tower Observability Stack
#
# This directory contains the observability infrastructure:
# - Promtail: Log shipping agent (DaemonSet)
# - Loki: Log aggregation (StatefulSet)
# - Prometheus: Metrics collection (Deployment)
# - kube-state-metrics: Cluster-level metrics (Deployment)
# - node-exporter: Node-level metrics (DaemonSet)
# - Grafana: Dashboards and visualization (Deployment)
#
# Usage:
#   kubectl apply -k infra/kubernetes/observability/
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - promtail-config.yaml
  - loki-config.yaml
  - prometheus-config.yaml
  - kube-state-metrics.yaml
  - node-exporter.yaml
  - ../../grafana/
  # Generates the `prometheus-rules` ConfigMap from the single on-disk copy of
  # the alert rules. It is a separate base because kustomize refuses file
  # sources outside its own directory -- see the header of that file.
  - ../../docker/prometheus/

# Prometheus server config and alert rules.
#
# GENERATED, NOT INLINE, AND THE HASH IS THE POINT. kustomize appends a content
# hash to each generated ConfigMap name and rewrites the Deployment's
# `volumes[].configMap.name` to match, so editing `prometheus.yml` or any rules
# file changes the Deployment spec and ROLLS THE POD. That is what makes "the
# rules on disk are the rules Prometheus loaded" structural. It is also why the
# Deployment no longer carries `--web.enable-lifecycle`: there is no reload call
# to make, so there is no reason to expose one.
#
# The `prometheus-rules` ConfigMap is generated by the base at
# `../../docker/prometheus/`, which has to live there because kustomize refuses
# file sources outside its own directory.
configMapGenerator:
  - name: prometheus-config
    # `namespace:` IS LOAD-BEARING, NOT DECORATION. This kustomization sets no
    # top-level namespace, so without it the generated ConfigMap lands
    # namespace-less while the Deployment is in `dark-tower-observability` --
    # and kustomize's name-reference transformer only rewrites a reference when
    # the namespaces match. The rewrite would silently not happen, the
    # Deployment would keep referencing the unhashed name `prometheus-config`,
    # no such ConfigMap would exist, and the pod would fail to mount. Verified
    # by `kubectl kustomize` before and after.
    namespace: dark-tower-observability
    options:
      labels:
        app: prometheus
        component: monitoring
    files:
      - prometheus.yml

labels:
  - pairs:
      managed-by: dark-tower
    includeSelectors: false
