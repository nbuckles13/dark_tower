# Promtail Configuration for Dark Tower
#
# Promtail ships logs from Kubernetes pods to Loki.
#
# The Promtail config itself lives in `promtail.yaml` and is GENERATED into the
# `promtail-config` ConfigMap by ./kustomization.yaml (content-addressed,
# ADR-0038 §2): editing it changes the DaemonSet's pod template and rolls it.
#
# IMPORTANT: The relabel_configs in `promtail.yaml` define which labels are
# available in Loki. `dt-guard grafana-datasources` reads that file directly to
# derive the valid label set (crates/dt-guard/src/grafana_datasources.rs).
#
# Current valid Loki labels:
#   - namespace: Kubernetes namespace
#   - pod: Pod name
#   - container: Container name
#   - app: Value of pod label 'app'
#   - component: Value of pod label 'component'
#   - level: Log level extracted from JSON logs (trace, debug, info, warn, error)
#   - target: Log target extracted from JSON logs (e.g., "ac_service", "global_controller")
#
# Services emit JSON structured logs via tracing_subscriber::fmt().json()
# Promtail parses JSON using the json pipeline stage (no brittle regex).
#
# Dashboard queries MUST use these labels.
# Using undefined labels like 'job' will cause "no data" errors.
#
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: dark-tower-observability
  labels:
    app: promtail
    component: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
  labels:
    app: promtail
    component: logging
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
  labels:
    app: promtail
    component: logging
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: dark-tower-observability
roleRef:
  kind: ClusterRole
  name: promtail
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: dark-tower-observability
  labels:
    app: promtail
    component: logging
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
        component: logging
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.3
          args:
            - "-config.file=/etc/promtail/promtail.yaml"
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
