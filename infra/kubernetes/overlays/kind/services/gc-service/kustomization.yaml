apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../../services/gc-service
  - nodeport.yaml

# R-55 (task #26): enable OTel in the Kind dev cluster (collector deployed by
# R-59 + the GC->collector :4317 egress rule present in the base
# NetworkPolicy). The prod base keeps OTEL_ENABLED="false"; this
# strategic-merge patch flips it to "true" for dev. Mirrors AC's task #25
# overlay pattern.
patches:
  - path: configmap-otel-patch.yaml
  # R-1/R-3 (task #5): enable the browser-SDK CORS allowlist in the Kind dev
  # cluster. Prod base keeps CORS_ALLOWED_ORIGINS=""; this strategic-merge patch
  # sets it to the Vite dev origin. Mirrors the OTEL overlay pattern above.
  - path: configmap-cors-patch.yaml

labels:
  - pairs:
      environment: kind
    includeSelectors: false
