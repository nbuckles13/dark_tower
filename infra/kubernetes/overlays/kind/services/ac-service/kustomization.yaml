apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../../services/ac-service
  - nodeport.yaml

# R-55: enable OTel in the Kind dev cluster (collector deployed by R-59 + the
# AC->collector egress rule present in the base NetworkPolicy). The prod base
# keeps OTEL_ENABLED="false"; this strategic-merge patch flips it to "true" for
# dev so the AC OTel exemplar is validated end-to-end.
patches:
  - path: configmap-otel-patch.yaml
  # Kind stands the NodePort in for production's ingress gateway: admit
  # non-pod sources to AC's HTTP port (see the patch file for why that is the
  # narrowest rule that works, and the podSubnet drift guard).
  - path: network-policy-nodeport-patch.yaml
    target:
      kind: NetworkPolicy
      name: ac-service

labels:
  - pairs:
      environment: kind
    includeSelectors: false
