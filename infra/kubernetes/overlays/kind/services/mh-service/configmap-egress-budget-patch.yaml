# Kind dev-cluster egress budget (story 2 R-19), strategic-merge patch.
#
# The prod base (infra/services/mh-service/config.env) ships
# MH_EGRESS_BUDGET_BPS as a deliberately-unsized placeholder. That placeholder
# admits fewer streams than the suite needs, so the Kind cluster must override
# it. This patch changes that ONE value and nothing else; every other base key
# is inherited unchanged. Mirrors the configmap-otel-patch.yaml precedent the
# AC, GC and MC Kind overlays already use.
#
# SIZED AGAINST A STATED REQUIREMENT — this is the only place the sizing lives.
#
#   Requirement: P participants each filling N audio plus M video receive
#   slots is P x (N + M) egress edges, one egress stream per edge. The
#   recommended minimum MH publishes (`mh_media_egress_stream_ceiling_
#   recommended_min`) is that formula at the story-3 demo size, and this
#   budget must clear it.
#
#   Formula: MH derives its stream ceiling as
#       ceiling = MH_EGRESS_BUDGET_BPS / max(derived audio cost,
#                                            derived video cost)
#   rounded down, where each derived cost is MEDIA_*_MAX_BITRATE_BPS plus a
#   per-frame overhead (derived in MH code from the frame layout) x
#   MEDIA_*_FRAME_RATE_HZ, both read from the media-codec-profile Kind runs
#   (`EgressAdmission` in crates/mh-service/src/config.rs). It divides by the
#   larger cost so MH stays type-blind. No cost or ceiling figure is restated
#   here: read the effective ceiling from `mh_media_egress_stream_ceiling`.
#
#   RE-SIZED when MH began deriving the costs (the derived video cost is far
#   below the retired configured one), so that the derived ceiling stays where
#   the S9 window below needs it; INF-C re-sizes it again when Kind moves to the
#   lower test codec profile. BUDGET AND IMAGE ROLL BACK TOGETHER: an image
#   that predates the derivation divides this budget by the retired
#   `MH_STREAM_COST_VIDEO_BPS` instead, which puts its ceiling below the demo
#   requirement — roll this patch back with such an image.
#   So this value must satisfy, against the DEPLOYED costs, a TWO-SIDED window:
#     lower:  ceiling >= P x (N + M) at the demo size     (the demo requirement)
#     upper:  2 x ceiling < MAX_S9_PARTICIPANTS x slot_cap (the S9 exhaustion
#             test, 28_mh_egress_admission.rs, must still be able to drive a
#             registration past the ceiling at an affordable meeting size;
#             limit and rule have one home in
#             crates/env-tests/src/fixtures/egress_admission.rs)
#
# WHY THIS VALUE (story 2 task 10), and why it is DEV HEADROOM, NOT A CAPACITY
# MODEL. It was 2.5x smaller, sized for the N = 5 demo alone. During story 2 task
# 20's Gate 2, mh-0 reached 39 of 40 installed streams and refused a
# registration outright. The cause was NOT real load: disconnected
# participants hold their edges through MC's reconnect grace window
# (MC_DISCONNECT_GRACE_PERIOD_SECONDS, 30 s default) while Layer-7 suites run
# back to back, so edges from suites that had finished were still installed.
# Raising the budget MASKS that edge retention — it lifts the ceiling above
# the retained floor — and a reader of the unreclaimed-edge-floor triage arm
# (MH incident runbook, egress-budget exhaustion scenario) must know the Kind
# ceiling was moved for that reason.
#   Considered and not taken: a shorter Kind grace period. It would remove the
#   retention at its source, but Kind would then diverge from the grace
#   behaviour the reconnect tests exercise, trading a capacity symptom for a
#   dev-vs-prod behavioural gap.
#   Why not ~10x: the upper side of the window. At 10x the ceiling is far
#   above what S9 can exceed within its participant limit (the test would fail
#   its own precondition), and a Kind pod (1Gi) carrying hundreds of egress
#   streams during S9 risks an OOMKill that takes every meeting on the pod
#   down — a worse, harder-to-diagnose failure than a clean admission refusal.
#   The value below sits mid-window: 2.5x the observed peak, S9 at 26 of its
#   40-participant limit.
#
# That relationship is ENFORCED, not asserted here: see
#   crates/env-tests/tests/01_mh_deployment_config.rs::test_kind_egress_stream_ceiling_meets_demo_requirement
# which reads the budget and the codec profile from the LIVE ConfigMaps,
# derives the costs independently of MH's code, and fails if the derived
# ceiling falls outside that window (either side). No ceiling literal is written
# here on purpose — a restated result goes stale the moment either cost moves;
# the test does not.
#
# WHY UNDER-SIZING IS DANGEROUS HERE, SPECIFICALLY. A budget that is too small
# makes MH reject admission partway through the largest scenario. That presents
# as "some receivers are missing some senders" — indistinguishable by symptom
# from the routing bug the suite exists to catch, and able to MASK a real one.
#
# GUARD COVERAGE, stated honestly. `dt-guard env-config` reads
# infra/services/** only, so the BASE key is guard-covered and this patched
# VALUE is not. That is acceptable because this patch changes a value, never a
# key — do NOT add keys here. A strategic merge is additive by key name: if the
# base key is ever renamed, this patch silently contributes a dead key and the
# base placeholder wins in Kind. The env-test above catches that at runtime (it
# has a distinct "overlay did not apply" failure); nothing catches it
# statically (docs/TODO.md §Infrastructure Validation in Devloops, the
# env-config overlay-coverage entry).
#
# CHANGING THIS VALUE rolls the MH pods by itself: the ConfigMap is
# content-addressed (ADR-0038 §2), so a changed value is a new ConfigMap name,
# hence a new pod template. Deploy it with `infra/kind/scripts/deploy.sh`
# (devloop container: `dev-cluster deploy`) — no restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mh-service-config
  namespace: dark-tower
data:
  MH_EGRESS_BUDGET_BPS: "82640000"
