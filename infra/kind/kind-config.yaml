# kind cluster configuration for Dark Tower local development
# This configuration creates a single-node cluster with Calico CNI for NetworkPolicy enforcement
#
# Usage: kind create cluster --config=infra/kind/kind-config.yaml --name=dark-tower
#
# See ADR-0013 for the single-tier development environment strategy.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dark-tower

nodes:
  # NOTE: exactly ONE `role: control-plane` node is ASSUMED by the KIND name-length caps
  # derived in infra/devloop/devloop.sh, infra/kind/scripts/{setup,teardown}.sh and
  # crates/devloop-helper/src/error.rs. Those caps subtract len("-control-plane")=14 from the
  # 63-char DNS label. Adding a second control-plane node makes KIND emit `<cluster>-control-plane2`
  # (suffix 15), so the real cluster-name cap becomes 48 and all four sites would be wrong by one
  # — and their pinned tests would stay green (they pin the caps, not this file). Adjust them
  # together with this block, or not at all.
  - role: control-plane
    # Expose ports for local access.
    #
    # SECURITY (R-37): browser-client-flow ports — AC/GC HTTP and MC/MH
    # WebTransport — bind listenAddress 127.0.0.1 (loopback only) so a laptop on
    # a hostile network never exposes dev services to the LAN. The host browser /
    # Playwright reach all of them at localhost, so loopback carries no functional
    # loss. The observability ports are deliberately left on the wildcard bind
    # (see their NOTE below). This is the static manual-dev config; the dynamic
    # kind-config.yaml.tmpl (ADR-0030 devloop helper) intentionally uses
    # ${HOST_GATEWAY_IP} for its container topology — do NOT align the two.
    extraPortMappings:
      # --- Browser-client flow (dev/E2E only; loopback) ---
      # AC (Auth Controller) sign-up HTTP: hostPort 8443 → nodePort 30082 → AC pod 8082
      - containerPort: 30082
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
      # GC (Global Controller) join HTTP: hostPort 8444 → nodePort 30180 → GC pod 8080
      # (GC gRPC nodePort 30051 is intentionally NOT mapped here — cluster-internal
      #  for this story; R-37 is scoped to AC sign-up + GC join HTTP.)
      - containerPort: 30180
        hostPort: 8444
        listenAddress: "127.0.0.1"
        protocol: TCP
      # --- Observability ---
      # NOTE: these three bind the wildcard address (0.0.0.0) ON PURPOSE — viewing
      # dev dashboards from a second device on the LAN is a legitimate dev pattern,
      # and they are not part of the browser-client flow (a different risk class,
      # per @security). Residual risk on a hostile network: LAN exposure of dev
      # Loki logs / a Grafana foothold — dev-only, out of R-37 scope to change.
      # Prometheus
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
      # Grafana
      - containerPort: 30030
        hostPort: 3000
        protocol: TCP
      # Loki
      - containerPort: 30080
        hostPort: 3100
        protocol: TCP
      # MC WebTransport (QUIC/UDP) — per-instance NodePorts.
      # Each MC instance has its own Deployment + NodePort Service.
      # listenAddress 127.0.0.1 (R-37): browser-client-flow ports; the host browser
      # reaches MC WebTransport at localhost, so loopback is a strict hardening.
      #
      # MC-0: hostPort 4433 → nodePort 30433
      - containerPort: 30433
        hostPort: 4433
        listenAddress: "127.0.0.1"
        protocol: UDP
      # MC-1: hostPort 4435 → nodePort 30435
      - containerPort: 30435
        hostPort: 4435
        listenAddress: "127.0.0.1"
        protocol: UDP
      # MH WebTransport hostPort SLOTS (ADR-0039 §7 "Kind"), K of them, loopback
      # (R-37). Host port == node containerPort == the MH pod's webtransport
      # hostPort (infra/kind/scripts/mh.sh sets it per slot). K's home is
      # crates/devloop-helper/src/ports.rs; this static list is pinned to it by
      # ports.rs's `test_static_kind_config_mh_block_matches_slot_table_shape`.
      # The `# dt:mh-slot=<k>` markers are machine-read by
      # infra/kind/scripts/deploy.sh:mh_slot_table(). Changing a slot means a
      # cluster recreate.
      # dt:mh-slot=0
      - containerPort: 4440
        hostPort: 4440
        listenAddress: "127.0.0.1"
        protocol: UDP
      # dt:mh-slot=1
      - containerPort: 4441
        hostPort: 4441
        listenAddress: "127.0.0.1"
        protocol: UDP
      # dt:mh-slot=2
      - containerPort: 4442
        hostPort: 4442
        listenAddress: "127.0.0.1"
        protocol: UDP
      # dt:mh-slot=3
      - containerPort: 4443
        hostPort: 4443
        listenAddress: "127.0.0.1"
        protocol: UDP
      # dt:mh-slot=4
      - containerPort: 4444
        hostPort: 4444
        listenAddress: "127.0.0.1"
        protocol: UDP
      # dt:mh-slot=5
      - containerPort: 4445
        hostPort: 4445
        listenAddress: "127.0.0.1"
        protocol: UDP

# Use containerd as the container runtime
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5001"]
      endpoint = ["http://kind-registry:5000"]

# Networking configuration for Calico
networking:
  # Pod subnet - must match Calico's default
  podSubnet: "192.168.0.0/16"
  # Service subnet
  serviceSubnet: "10.96.0.0/16"
  # IMPORTANT: Disable default CNI so Calico can be installed
  # This enables NetworkPolicy enforcement in both dev and CI
  disableDefaultCNI: true
