apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: dark-tower-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana
      # Grafana needs no Kubernetes API access now that dashboards are mounted
      # rather than listed by the removed k8s-sidecar, so a compromised Grafana
      # holds no API token at all.
      automountServiceAccountToken: false
      containers:
        - name: grafana
          image: grafana/grafana:10.2.2
          securityContext:
            readOnlyRootFilesystem: false  # Grafana needs writable home dir
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-config
          configMap:
            name: grafana-dashboards-config
        # Every dashboard group, content-addressed (ADR-0038 §2): a dashboard
        # edit changes these names and rolls Grafana. Sources are deliberately
        # NOT `optional:` -- a missing group must fail pod start, not silently
        # drop dashboards. A group added to infra/grafana/kustomization.yaml but
        # not listed here fails `dt-guard kustomize` R-21 (unreferenced).
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: grafana-dashboards-ac
              - configMap:
                  name: grafana-dashboards-gc
              - configMap:
                  name: grafana-dashboards-mc
              - configMap:
                  name: grafana-dashboards-mc-media
              - configMap:
                  name: grafana-dashboards-mh
              - configMap:
                  name: grafana-dashboards-client
              - configMap:
                  name: grafana-dashboards-errors
