apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dark-tower-observability

resources:
  - rbac.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: grafana-datasources
    files:
      - datasources.yaml=provisioning/datasources/datasources.yaml
  - name: grafana-dashboards-config
    files:
      - dashboards.yaml=provisioning/dashboards/dashboards.yaml
  - name: grafana-dashboards-ac
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - ac-logs.json=dashboards/ac-logs.json
      - ac-overview.json=dashboards/ac-overview.json
      - ac-slos.json=dashboards/ac-slos.json
  - name: grafana-dashboards-gc
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - gc-logs.json=dashboards/gc-logs.json
      - gc-overview.json=dashboards/gc-overview.json
      - gc-slos.json=dashboards/gc-slos.json
  - name: grafana-dashboards-mc
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - mc-logs.json=dashboards/mc-logs.json
      - mc-overview.json=dashboards/mc-overview.json
      - mc-slos.json=dashboards/mc-slos.json
  - name: grafana-dashboards-mh
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - mh-logs.json=dashboards/mh-logs.json
      - mh-media.json=dashboards/mh-media.json
      - mh-overview.json=dashboards/mh-overview.json
      - mh-slos.json=dashboards/mh-slos.json
  # `client` is not a Rust service, but it follows the same `<prefix>-*.json`
  # grouping convention so future `client-*.json` dashboards land here too.
  #
  # The `options.labels` block below is LOAD-BEARING AND UNGUARDED. The Grafana
  # k8s-sidecar mounts only ConfigMaps carrying `grafana_dashboard: "1"`, and
  # `dt-guard kustomize` R-20 checks dashboard BASENAMES in both directions
  # while never inspecting `options.labels`. A group that lists its files and
  # omits this block passes Layer 3 green, lands in the repo, and never appears
  # in Grafana. Every other group here carries it; so must any new one.
  - name: grafana-dashboards-client
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - client-media.json=dashboards/client-media.json
  - name: grafana-dashboards-errors
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - errors-overview.json=dashboards/errors-overview.json
