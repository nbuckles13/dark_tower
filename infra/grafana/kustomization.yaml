apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dark-tower-observability

resources:
  - rbac.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml

# EVERY ConfigMap here is content-addressed (ADR-0038 §2): generated WITH the
# hash suffix, and consumed by the Grafana pod template by name, so editing a
# datasource, the provider config or any dashboard changes the pod template and
# applying the environment root rolls Grafana. Grafana reads all of them only at
# startup, which is exactly why a stable name would leave it serving stale
# config until someone remembered a manual restart.
#
# Dashboards are mounted by `infra/grafana/deployment.yaml` through ONE
# `projected` volume listing every `grafana-dashboards-<prefix>` group below.
# ADDING A GROUP therefore means adding it in two places: here, and as a source
# of that projected volume. Forget the second and `dt-guard kustomize` R-21
# fails the build (a generated ConfigMap no pod template references). The
# sources are not `optional:`, so a group missing at runtime fails pod start
# loudly rather than silently dropping dashboards.
configMapGenerator:
  - name: grafana-datasources
    files:
      - datasources.yaml=provisioning/datasources/datasources.yaml
  - name: grafana-dashboards-config
    files:
      - dashboards.yaml=provisioning/dashboards/dashboards.yaml
  - name: grafana-dashboards-ac
    files:
      - ac-logs.json=dashboards/ac-logs.json
      - ac-overview.json=dashboards/ac-overview.json
      - ac-slos.json=dashboards/ac-slos.json
  - name: grafana-dashboards-gc
    files:
      - gc-logs.json=dashboards/gc-logs.json
      - gc-overview.json=dashboards/gc-overview.json
      - gc-slos.json=dashboards/gc-slos.json
  - name: grafana-dashboards-mc
    files:
      - mc-logs.json=dashboards/mc-logs.json
      - mc-overview.json=dashboards/mc-overview.json
      - mc-slos.json=dashboards/mc-slos.json
  # MC's ADR-0036 media path (§4 key custody, §5/§6 client signalling, §8
  # routing, §9 connectivity), split out of mc-overview.json at story 2 task 12
  # and given its OWN ConfigMap. Client-side apply stores each ConfigMap as
  # JSON-escaped text in the last-applied-configuration annotation, capped at
  # 262144 bytes; with mc-overview.json alone escaping to 99.7% of that, a
  # single MC ConfigMap failed cluster setup. `dt-guard kustomize` now fails
  # Layer 3 on any dashboard ConfigMap past its headroom threshold.
  - name: grafana-dashboards-mc-media
    files:
      - mc-media.json=dashboards/mc-media.json
  - name: grafana-dashboards-mh
    files:
      - mh-logs.json=dashboards/mh-logs.json
      - mh-media.json=dashboards/mh-media.json
      - mh-overview.json=dashboards/mh-overview.json
      - mh-slos.json=dashboards/mh-slos.json
  # GROUPING IS SIZE-BOUNDED, NOT PREFIX-BOUND. Dashboards are grouped by
  # service prefix (`<prefix>-*.json`) only while the group fits: client-side
  # apply stores each generated ConfigMap, JSON-escaped, in a
  # last-applied-configuration annotation capped at 262144 bytes, and a group
  # past that fails cluster setup outright (story 2 task 12: the MC group did,
  # hence `grafana-dashboards-mc-media` above). So before adding a
  # `<prefix>-*.json` to its service's group, check the group's headroom;
  # `dt-guard kustomize` (`configmap_annotation_size`, in
  # `crates/dt-guard/src/kustomize_configmaps.rs`) fails Layer 3 at 80% of the
  # cap, and its message says to split a file out, as MC's media path was.
  # A NEW group must also be added as a source of the `dashboards` projected
  # volume in deployment.yaml (R-21 fails the build otherwise).
  #
  # `client` is not a Rust service, but it follows the same grouping, so
  # future `client-*.json` dashboards land here too — subject to the same cap.
  - name: grafana-dashboards-client
    files:
      - client-media.json=dashboards/client-media.json
  - name: grafana-dashboards-errors
    files:
      - errors-overview.json=dashboards/errors-overview.json
