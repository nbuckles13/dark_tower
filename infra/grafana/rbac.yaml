# Grafana's ServiceAccount carries NO Role. Dashboards are mounted from
# content-addressed ConfigMaps (infra/grafana/deployment.yaml, projected volume)
# rather than listed from the API by a sidecar, so Grafana needs no Kubernetes
# API access, and the pod does not automount this account's token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: dark-tower-observability
