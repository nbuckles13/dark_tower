# Generates the `prometheus-rules-<svc>` ConfigMaps from THE one on-disk copy of
# the alert rules, so the cluster never gets a hand-mirrored second set.
#
# ONE GENERATOR PER RULES FILE, PROJECTED INTO ONE DIRECTORY (2026-10-25). Until
# then a single `prometheus-rules` generator held every file, and it reached 80%
# of the 262144-byte `last-applied-configuration` cap that `dt-guard kustomize`
# (`configmap_annotation_size`) enforces. So every new alert tipped it over a
# budget its own task had not filled. Each file is now its own ConfigMap: the
# largest (mc) is about a third of the cap, and a new rules file never inherits
# another file's size. The Prometheus Deployment
# (`infra/kubernetes/observability/prometheus-config.yaml`) mounts them as ONE
# `projected` volume at `/etc/prometheus/rules`, so the `rule_files` glob is
# unchanged. This is the same shape as Grafana's per-group dashboards.
#
# ADDING A RULES FILE therefore means three places: `rules/<svc>-alerts.yaml`,
# a generator here, and a source in that projected volume. Forget the generator
# and `dt-guard alert-rules-policy` fails (below). Forget the projected source
# and `dt-guard kustomize` R-21 fails (a generated ConfigMap no pod references).
# The sources are not `optional:`, so a missing ConfigMap fails pod start loudly
# rather than silently loading fewer rules.
#
# WHY THIS KUSTOMIZATION LIVES HERE AND NOT IN
# `infra/kubernetes/observability/`, WHERE THE REST OF THE STACK IS.
# kustomize refuses file sources outside its own directory:
#
#   security; file '/work/infra/docker/prometheus/rules/gc-alerts.yaml' is not
#   in or below '/work/infra/kubernetes/observability'
#
# so the generator has to sit at or above the rules directory. It is deliberately
# at `prometheus/` rather than inside `rules/`: `dt-guard alert-rules-policy`
# walks `rules/*.yaml`, and a `kustomization.yaml` dropped in there would be a
# file the linter reads and Prometheus never loads -- which is precisely the
# asymmetry the set-equality check below exists to make loud. Keeping this file
# one level up keeps the rules directory containing only rules.
#
# THE `files:` LIST IS A MEMBERSHIP SET AND KUSTOMIZE CANNOT GLOB. Verified
# empirically: `files: [rules/*-alerts.yaml]` fails with an evalsymlink error on
# the literal path. So a new `<svc>-alerts.yaml` can be inside Prometheus's
# `rule_files` glob, pass every existing guard, and still never be mounted and
# never load. `dt-guard alert-rules-policy` parses the files of EVERY generator
# below and asserts their union equals the loadable-rules-file set defined in
# `crates/dt-guard/src/alert_rules.rs`, failing on a difference in EITHER
# direction. Add the file here when you add it to `rules/`.
#
# `_template-service-alerts.yaml` is absent on purpose -- it is a starter
# template of `<svc>` placeholders, not parseable PromQL, and it is guard-exempt
# so its annotations get no hygiene scan.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dark-tower-observability

# Labels for every generator in this file, stated once.
generatorOptions:
  labels:
    app: prometheus
    component: monitoring

configMapGenerator:
  - name: prometheus-rules-ac
    files:
      - rules/ac-alerts.yaml
  - name: prometheus-rules-client
    files:
      - rules/client-alerts.yaml
  - name: prometheus-rules-gc
    files:
      - rules/gc-alerts.yaml
  - name: prometheus-rules-mc
    files:
      - rules/mc-alerts.yaml
  - name: prometheus-rules-mh
    files:
      - rules/mh-alerts.yaml
  - name: prometheus-rules-otel
    files:
      - rules/otel-alerts.yaml
