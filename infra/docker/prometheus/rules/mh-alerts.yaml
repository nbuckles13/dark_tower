# Prometheus alerting rules for Media Handler
#
# Severity levels (per docs/observability/alert-conventions.md):
# - page: User-visible impact now or SLO burn; pages oncall immediately (PagerDuty)
# - warning: Degraded but contained, or approaching limits; Slack notify, business hours
# - info: Awareness/trend/leading indicator; no notification, dashboards only
#
# All alerts link to sections in the consolidated incident response runbook:
# docs/runbooks/mh-incident-response.md
#
# Notes on deliberate omissions:
# - No burn-rate page/warning pair: MH has no ratified SLO TARGET. Cargo-culting
#   a 10x/5x burn-rate pair without an authoritative target would produce a
#   threshold with no principled justification.
#   CORRECTED 2026-09-02: this note previously said the blocker was the missing
#   FILE `docs/observability/slos.md`. That file now exists and is authoritative
#   per ADR-0011:40 -- but it does NOT unblock this alert. It defines the MH
#   forwarding SLI and its measurement point (ingress-read-complete ->
#   egress-enqueued) and records the target as OPEN. The real gate is the
#   ratified NUMBER, which lands in story 8. Anyone reading the old wording
#   would have concluded the wall had cleared when it had not.
#   To be added after the MH target is ratified; see `docs/observability/slos.md`
#   which states this same rule -- that file is authoritative and this comment is
#   the copy to fix if they ever disagree.
# - No RegisterMeeting RPC alert: mh_grpc_requests_total{method="register_meeting"}
#   is the MC->MH inbound path. Its `method` values are derived from
#   MediaHandlerService's method names: `register_meeting`, plus `end_meeting` for
#   the story-2 EndMeeting teardown RPC. Both are emitted and both are present at
#   zero from process start, so a flat-zero `end_meeting` means no MC is ending
#   meetings on the handler; an ABSENT series is a scrape fault.
#   CORRECTED 2026-09-22: this note previously said register_meeting was "the
#   ONLY value that label takes" and that MediaHandlerService "has a single RPC".
#   Story 2 (R-20) added EndMeeting, so ADR-0036 §8's invariant is now "forwarding
#   policy gains fields, not sibling RPCs", not "one RPC". Anyone reading the old
#   wording would have concluded a second method could never appear.
#   MC-side failure to place the call (timeout, unreachable handler)
#   still pages MC oncall first, so that half remains covered transitively.
#   What is NOT covered transitively, and what this note must stop asserting
#   flatly: once the policy-driven forward path lands, a RegisterMeeting that MC
#   places successfully but MH fails to APPLY is a media blackhole that reports
#   healthy on every MC-side signal -- exactly the failure ADR-0036 §8's
#   applied-generation echo exists to detect. A dedicated alert on that is
#   deferred until the MH SLO TARGET is ratified (story 8) -- the same gate, and
#   the same wording, as the burn-rate omission above. CORRECTED 2026-09-02: the
#   gate is the ratified target, not the existence of `docs/observability/slos.md`,
#   which now exists and records that target as open.
# - No teardown-never-arrives alert YET, and it is an OPEN OBLIGATION, not a
#   decision: if MC's EndMeeting never reaches MH (story 2 R-20), MH holds an
#   ended meeting's routing state indefinitely. Its signature is an ABSENT
#   event. An edge-holding leaked meeting IS caught, by
#   MHMediaEgressEdgeHeadroomLow's LEAK fork below. A ZERO-edge leaked
#   registration is not: its first symptom is rejected_meeting_cap at the
#   MH_MAX_REGISTERED_MEETINGS cap. The instrument landed at story-2 task 11
#   (`mh_media_registered_meetings`, `mh_media_registered_meetings_limit`,
#   `mh_media_meeting_teardowns_total{outcome}`), so only authorship remains.
#   CORRECTED 2026-09-30 (story 2 task 18): this note previously assigned the
#   rule to task 18, which never carried it. Tracked in docs/TODO.md
#   §Observability Debt, "No leading indicator for registered-meeting
#   exhaustion".
# - No registration-failure-rate alert: registration is a low-volume one-shot
#   signal (single register + periodic heartbeats). Heartbeats give a continuous,
#   larger-denominator signal - MHGCHeartbeatFailureRate below is the canonical
#   MH->GC health alert. MHHighRegistrationLatency still covers registration
#   slowness separately.
#
# Cross-service co-review triggers (per alert-conventions.md §Service-specialist
# cross-review):
# - MHGCHeartbeatFailureRate + MHGCHeartbeatLatencyHigh: need global-controller co-review.
# - MHMCNotificationFailures: needs meeting-controller co-review.

groups:
  - name: mh-service-page
    interval: 30s
    rules:
      # ====================================================================
      # PAGE ALERTS - User-visible impact or SLO burn; page oncall immediately
      # ====================================================================

      - alert: MHDown
        expr: |
          up{job="mh-service"} == 0
        for: 1m
        labels:
          severity: page
          service: mh-service
          component: infrastructure
        annotations:
          summary: "Media Handler service is down"
          description: "Media Handler has no running pods for 1 minute. All WebTransport media sessions on affected pods are disrupted."
          impact: "Users in active meetings lose media. New joins have no working media path."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-1-complete-service-outage"

  - name: mh-service-warning
    interval: 60s
    rules:
      # ====================================================================
      # WARNING ALERTS - Notify but don't page
      # ====================================================================

      - alert: MHHighJwtValidationFailures
        expr: |
          (
            sum(rate(mh_jwt_validations_total{result="failure"}[5m]))
            /
            sum(rate(mh_jwt_validations_total[5m]))
          ) > 0.10
          and
          sum(rate(mh_jwt_validations_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: mh-service
          component: webtransport
        annotations:
          summary: "MH JWT validation failure rate high ({{ $value | humanizePercentage }})"
          description: "JWT validation failure rate is {{ $value | humanizePercentage }} for 5 minutes. A failure-rate spike can mean legitimate rejections of invalid tokens (probing, client bugs) OR a system issue (AC JWKS down, key rotation misconfig, clock skew). Break down by failure_reason and token_type to triage."
          impact: "Subset of users unable to establish media sessions. Check AC service health, JWKS endpoint, and failure_reason label. signature_invalid concentrates suggest key-rotation or tampering; expired concentrates suggest clock-skew."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-2-jwt-validation-failures"

      - alert: MHGCHeartbeatFailureRate
        expr: |
          (
            sum(rate(mh_gc_heartbeats_total{status="error"}[5m]))
            /
            sum(rate(mh_gc_heartbeats_total[5m]))
          ) > 0.5
          and
          sum(rate(mh_gc_heartbeats_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
          service: mh-service
          component: gc-integration
        annotations:
          summary: "MH-GC heartbeat failure rate high ({{ $value | humanizePercentage }})"
          description: "Media Handler heartbeats (SendLoadReport) to Global Controller failing at {{ $value | humanizePercentage }} for 2 minutes. Heartbeats are continuous (larger denominator than one-shot registration), so sustained >50% failure indicates real connectivity or auth issues, not a flap."
          impact: "Partial degradation: existing WebTransport sessions unaffected; GC may mark MH unhealthy and stop assigning new meetings. Investigate MH-GC connectivity, NetworkPolicy, and MH service token validity."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-3-gc-heartbeat-failures"

      - alert: MHHighRegistrationLatency
        expr: |
          histogram_quantile(0.95,
            sum by(le) (rate(mh_gc_registration_duration_seconds_bucket[5m]))
          ) > 1.0
        for: 5m
        labels:
          severity: warning
          service: mh-service
          component: gc-integration
        annotations:
          summary: "MH GC registration p95 latency high ({{ $value }}s > 1s)"
          description: "Media Handler registration RPC p95 latency to GC is {{ $value }}s for 5 minutes. Threshold is provisional pending production baseline data - chosen as a user-perceptible slowness marker well below the 5s bucket ceiling. Revisit once steady-state observed baseline is available (expected sub-250ms typical)."
          impact: "Slower post-restart recovery. GC may temporarily treat MH as unavailable during slow re-registration."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-4-gc-registration-latency"

      - alert: MHHighWebTransportRejections
        expr: |
          (
            sum(rate(mh_webtransport_connections_total{status="rejected"}[5m]))
            /
            sum(rate(mh_webtransport_connections_total[5m]))
          ) > 0.10
          and
          sum(rate(mh_webtransport_connections_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: mh-service
          component: webtransport
        annotations:
          summary: "MH WebTransport rejection rate high ({{ $value | humanizePercentage }})"
          description: "WebTransport connection rejection rate is {{ $value | humanizePercentage }} for 5 minutes. May indicate capacity exhaustion, TLS issues, a QUIC listener stall, OR sustained MC gRPC unavailability holding accept-path slots. Since the sender_id binding contract landed, each connecting client holds an admission slot for up to ~48s awaiting MC's binding response, so an MC outage drives MH toward MH_MAX_CONNECTIONS and surfaces HERE rather than as an MC alert. Check mh_media_session_starts_total{outcome=\"declined_mc_unavailable\"} before concluding this is a capacity fault."
          impact: "Subset of users unable to establish media sessions. Check capacity, TLS cert, and pod health - AND MC availability, which is a cause this alert cannot distinguish on its own."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-5-webtransport-rejections"

      - alert: MHWebTransportHandshakeSlow
        expr: |
          histogram_quantile(0.95,
            sum by(le) (rate(mh_webtransport_handshake_duration_seconds_bucket[5m]))
          ) > 1.0
        for: 5m
        labels:
          severity: warning
          service: mh-service
          component: webtransport
        annotations:
          summary: "MH WebTransport handshake p95 latency high ({{ $value }}s > 1s)"
          description: "WebTransport handshake p95 latency (session accept through JWT validation) is {{ $value }}s for 5 minutes. Threshold is a user-perceptible slowness marker, well below the 5s histogram bucket ceiling; treat as hard-limit-derived pending SLO ratification. Likely causes: slow JWKS lookups, TLS renegotiation, or pod CPU saturation."
          impact: "Slow 'time to first frame' for new meeting joiners. Degraded experience."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-6-webtransport-handshake-slow"

      - alert: MHCallerTypeRejected
        expr: |
          sum(increase(mh_caller_type_rejected_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
          service: mh-service
          component: grpc-auth
        annotations:
          summary: "MH Layer-2 caller-type rejection detected"
          description: "One or more gRPC callers rejected by Layer-2 service-type routing over a 5-minute window, sustained for 2 minutes. MH expects meeting-controller as the only caller. Non-zero indicates a deployment misconfig OR credential misuse. Inspect actual_type label to identify the caller."
          impact: "Rejected calls are denied cleanly (no request-serving impact), but the signal means a service is misconfigured OR an unauthorized client is probing endpoints. Investigate deployment manifests and recent cert/token changes; escalate to Security Team if actual_type is unexpected."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-7-caller-type-rejected"

      - alert: MHMediaSessionDeclineRate
        expr: |
          (
            (
              sum(rate(mh_media_session_starts_total[5m]))
              - sum(rate(mh_media_session_starts_total{outcome="started"}[5m]))
            )
            /
            sum(rate(mh_media_session_starts_total[5m]))
          ) > 0.20
          and
          sum(rate(mh_media_session_starts_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
          service: mh-service
          component: media-binding
        annotations:
          summary: "MH media sessions declining to start ({{ $value | humanizePercentage }})"
          description: "More than 20% of media-session start attempts are declining for 10 minutes. This is the positive signal for 'MH healthy but forwarding nothing' — before this counter existed, the entire mh_media_* family read present-and-flat-at-zero, byte-identical to a healthy idle handler. Break down by outcome and follow mh-incident-response.md Scenario 15, which partitions on WHICH SERVICE to open: three of the seven outcome values mean DO NOT page MC."
          impact: "Users connect to MH and get no audio. MH readiness, handshake latency and connection-accept rate all read healthy throughout - do not clear MH on those panels."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-15-media-sessions-declining--no-sender-binding"

      # Occurrence-is-the-signal counter: steady state is zero forever, so there
      # is no noise floor to debounce and any non-zero is the incident. `for:`
      # suppresses flapping AROUND A THRESHOLD; this rule has no threshold to
      # flap around.
      #
      # `for:` MUST STAY BELOW THE `increase()` WINDOW OR THIS RULE CANNOT FIRE.
      # A single event — or a burst of any size confined to one window — makes
      # the expression truthy for at most 15m, so `for: 15m` or longer is
      # unsatisfiable BY CONSTRUCTION: it passes the alert guard and never
      # fires. An earlier draft of this rule shipped `increase[5m]` with
      # `for: 10m` and was blind to exactly the short-lived injection/probe shape
      # the description below calls its whole purpose. Same defect, same
      # reasoning as the window-derivation comment on
      # `GCMeetingCreationOrgStateInvalid` in gc-alerts.yaml.
      #
      # `for: 0m` matches the other any-occurrence rules in this tree,
      # MCActorPanic and MCKekEpochResetOnSenderIdExhaustion (mc-alerts.yaml), on
      # ONE shared ground: the 15m increase window supplies the >=30s smoothing
      # the guard requires. The further argument — a `for:` delay would only
      # postpone reporting an already-irreversible fact — is THIS rule's own and
      # is not shared: the MC exhaustion condition is no longer irreversible
      # (story 2 R-16), which is why that rule is info.
      - alert: MHMediaSenderBindingOutOfRange
        expr: |
          sum(increase(mh_media_session_starts_total{outcome="declined_sender_binding_out_of_range"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
          service: mh-service
          component: media-binding
        annotations:
          summary: "MH received an out-of-range sender_id from the control plane"
          description: "MC returned a sender_id above 65535. ANY OCCURRENCE FIRES THIS RULE - a single event is the incident, not a trend, which is why there is no `for:` debounce. THIS SHOULD READ ZERO FOREVER: it means MC violated its own contract (broken allocator) OR the control plane answering MH is not MC. The MC->MH gRPC channel has no cryptographic peer authentication, so this counter is the only signal separating those two causes. Separate from MHMediaSenderBindingConflict because they share no first move: this one starts at MC's allocator RANGE."
          impact: "Affected media sessions are refused fail-closed, so no wrong-sender forwarding occurs. Treat ANY non-zero as a SECURITY escalation, not merely a bug - escalate to the security owner alongside meeting-controller. WHY warning AND NOT page: the arm is fail-closed, so there is no user-impacting event to page on at 3am and the response is a forensic investigation, not a rollback. That severity is accepted ON THE ASSUMPTION that routing reaches a security owner rather than capacity on-call; if that assumption is found false, revisit the SEVERITY, not this annotation. See docs/TODO.md - no Alertmanager routing config exists in-tree today. CEILING: this catches only an OUT-OF-RANGE answer; a forged binding inside 1..=65535 is indistinguishable from a real one at MH, so a flat series is not evidence of no impersonation."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-15-media-sessions-declining--no-sender-binding"

      # Same any-occurrence shape and the same `for:`-below-the-window rule as
      # MHMediaSenderBindingOutOfRange above; see that comment for the full
      # derivation rather than a second copy of it.
      #
      # No reconnect-noise cost to `for: 0m`, verified rather than assumed:
      # SenderBindings::bind compares incumbent.participant_id, so a
      # same-participant re-bind takes over the entry instead of conflicting.
      # An ordinary reconnect cannot produce this outcome.
      - alert: MHMediaSenderBindingConflict
        expr: |
          sum(increase(mh_media_session_starts_total{outcome="declined_sender_binding_conflict"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
          service: mh-service
          component: media-binding
        annotations:
          summary: "MH sender_id binding conflict — ordinal held by a different participant"
          description: "A (meeting, sender_id) ordinal is already held by a DIFFERENT participant. ANY OCCURRENCE FIRES THIS RULE; an ordinary reconnect cannot produce it, because a same-participant re-bind takes over the entry rather than conflicting. Two candidate causes MH cannot separate: a STALE binding (MH failed to release the ordinal on teardown - MH's own fault) or a LIVE duplicate (MC allocated the same ordinal twice). Separate rule from MHMediaSenderBindingOutOfRange because the first move differs: check MH's UNBIND path first, then MC allocator UNIQUENESS. Do not restart MH as a remedy - it clears the symptom and destroys the evidence."
          impact: "Affected participants get no media. This is the cross-participant collision the ordinal exists to prevent, refused fail-closed rather than mis-forwarded."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-15-media-sessions-declining--no-sender-binding"

      # THE SHAPE HERE IS A RATIO OVER A LONG WINDOW, AND THE TWO RULES ABOVE
      # ARE THE CONTRAST. They are `increase(...) > 0` with `for: 0m` because a
      # single occurrence is an invariant violation. This one is neither, and
      # `> 0` was the first draft. Two independent reasons killed it, either of
      # which alone is sufficient:
      #
      #   1. THE VALUE IS CLIENT-INFLATABLE. Datagrams carrying an unmatched
      #      HTTP/3 session-id varint still increment quinn's `frame_rx.datagram`
      #      while wtransport discards them, so any client past the JWT gate can
      #      move this number at will. An occurrence rule at page severity would
      #      have been a CLIENT-FORCEABLE PAGE — an availability attack on
      #      on-call wearing a media-quality costume. This is also why the
      #      severity below is `warning` and must stay there.
      #      VERSION-DEPENDENT: verified against wtransport 0.7.1, `Cargo.lock`
      #      pins 0.7.2. If a future version discards such datagrams before
      #      quinn's counter, this reason lapses — but reason 2 below does not,
      #      and the rule shape does not change. Recorded so an upgrade that
      #      falsifies this bullet does not read as licence to switch to `> 0`.
      #   2. A SUSTAINED MC OUTAGE DOMINATES THE NUMERATOR RATHER THAN
      #      PERTURBING IT. Each connecting client holds an admission slot for
      #      up to ~48 s awaiting MC's binding answer (`config.rs` on
      #      MC_UNAVAILABLE_CLOSE_JITTER_MAX_MS), and a publishing client emits
      #      ~50 audio frames/s into that window. The DECLINED half of that
      #      traffic is deliberately counted on a different reason token
      #      (`no_media_session`, diagnostic-only, no rule) so it cannot reach
      #      this expression — but the split is what makes the ratio readable,
      #      not an accident, and merging the tokens would silently re-break it.
      #
      # FORENSIC, NOT DETECTIVE — THE MOST IMPORTANT PROPERTY OF THIS RULE AND
      # THE EASIEST TO FORGET. `transport_receive_dropped` is computed by
      # differencing quinn's received-frame count against what the ingress loop
      # actually read, and that delta is only final AT CONNECTION CLOSE. Nothing
      # increments while a session is live, and meetings run for an hour. So
      # this rule reports an incident that has already finished; it cannot
      # shorten one. Do not add `for:` time hoping to "confirm" the signal, and
      # do not read a flat series during an active no-audio incident as
      # evidence that ingress is healthy — the sessions are still open.
      #
      # MH HAS NO DETECTIVE SIGNAL FOR SILENT INGRESS LOSS. That gap is real,
      # is tracked in docs/TODO.md as the live-variant follow-on, and is NOT
      # closed by this rule. The nearest in-tree substitute is
      # `mh_media_frames_forwarded_total{direction="ingress"}` failing to track
      # the expected publisher frame rate on the steered instance, which needs a
      # responder who already knows that rate.
      #
      # THE NUMERATOR IS A SUBSET OF THE DENOMINATOR. THAT IS DELIBERATE.
      # Both new tokens carry `direction="ingress"`, so the unfiltered
      # `dropped{direction="ingress"}` term below INCLUDES
      # `transport_receive_dropped`. The denominator is therefore every datagram
      # frame the connection RECEIVED, and the ratio is "fraction of received
      # datagrams never read" — which is the quantity worth alerting on.
      # DO NOT "fix" the apparent inconsistency by subtracting the numerator out
      # of the denominator: that silently changes the rule from a fraction of
      # received to a ratio against the read set, which is a different and much
      # less useful question. Recovering the READ set, if you ever need it, means
      # subtracting BOTH new tokens back out.
      #
      # WINDOW: 2h, and the length is derived rather than picked. THE NUMERATOR
      # AND DENOMINATOR ACCRUE ON DIFFERENT CLOCKS — the numerator lands in one
      # instant at connection close for the whole session, while the denominator
      # accrues continuously. For any session LONGER than the window they are not
      # commensurable and the ratio inflates by roughly session_length/window:
      # over 30m, an hour-long session losing a true 5% reads 9.5%, and the 0.05
      # threshold actually trips at ~2.6% true loss; at two hours it trips at
      # ~1.3%. The effective threshold would move with MEETING DURATION, which is
      # a property of user behaviour, not of MH — an alert nobody could calibrate.
      # A window past typical session length removes the skew (at 2h, sessions up
      # to 2h read their true rate). The cost is detection latency, which on a
      # signal that is already forensic is close to free.
      #
      # RESIDUAL, both directions, neither normalisable: sessions LONGER than 2h
      # still over-read by the same ratio, and a connection that opened inside
      # the window but has not yet closed under-reads (numerator 0, denominator
      # already accruing). Do not try to correct per-session — any correction
      # needs session-length data MH is permanently barred from exposing, since
      # talk duration for a named participant is joinable via connection_id /
      # participant_id. The surviving bias for very long meetings is UPWARD, so
      # this rule fails toward firing early rather than toward silence, which is
      # the safe direction for a warning.
      #
      # THE DENOMINATOR INCLUDES `no_media_session` AND THE NUMERATOR DOES NOT.
      # That asymmetry is load-bearing and was not free. Declined-connection
      # datagrams land on `no_media_session`, which is inside the unfiltered
      # `dropped{direction="ingress"}` denominator term but is not the numerator.
      # So during a sustained MC outage the denominator GROWS while the numerator
      # does not, and this rule gets QUIETER — exactly when
      # MHMediaSessionDeclineRate is already firing and a second page would be
      # noise. The token split was made to stop this rule firing spuriously on an
      # MC outage; the direction it fails in was the bonus. Merging the two
      # tokens back together, or filtering `no_media_session` out of the
      # denominator, would silently delete this property and turn an MC outage
      # into a double page.
      #
      # `for: 10m` sits below the window per the rule stated on
      # MHMediaSenderBindingOutOfRange above.
      - alert: MHIngressDatagramsNeverRead
        expr: |
          (
            sum(rate(mh_media_frames_dropped_total{reason="transport_receive_dropped", direction="ingress"}[2h]))
            /
            (
              sum(rate(mh_media_frames_forwarded_total{direction="ingress"}[2h]))
              + sum(rate(mh_media_frames_dropped_total{direction="ingress"}[2h]))
            )
          ) > 0.05
          and
          (
            sum(rate(mh_media_frames_forwarded_total{direction="ingress"}[2h]))
            + sum(rate(mh_media_frames_dropped_total{direction="ingress"}[2h]))
          ) > 0
        for: 10m
        labels:
          severity: warning
          service: mh-service
          component: media-ingress
        annotations:
          summary: "MH is receiving ingress datagrams it never reads ({{ $value | humanizePercentage }})"
          description: "More than 5% of the ingress datagrams MH's QUIC layer received over 2 hours were never read by a media ingress loop - they arrived outside a live media session's lifetime, or were evicted from quinn's receive buffer before the loop got to them. THIS IS AN UPPER BOUND ON REAL LOSS, NOT A MEASUREMENT OF IT: the underlying value is client-inflatable (datagrams with an unmatched HTTP/3 session-id varint increment quinn's receive counter while wtransport discards them), so do not build a capacity, quality or SLI calculation on it. THRESHOLD IS PROVISIONAL - MH has no ratified SLO target (see docs/observability/slos.md, target OPEN, story 8), so 5% is chosen as a clearly-abnormal line well above the connection-setup race floor, not derived from one. Revisit once a steady-state baseline exists. THE 2h WINDOW IS LOAD-BEARING, NOT A SMOOTHING CHOICE - the numerator lands in one instant at connection close while the denominator accrues continuously, so a window shorter than typical meeting length inflates the ratio by roughly session_length/window and makes the effective threshold move with meeting duration. Meetings longer than 2h still over-read, which fails toward firing early rather than toward silence. THIS ALERT IS FORENSIC: the counter only moves at connection close, so it describes an incident that has already ended. A SUSTAINED SERVER MUTE DILUTES THIS RATIO (fail-quiet): a server-muted frame is a real ingress attempt, so reason=\"server_muted\" enters the denominator and lowers the ratio while the mute lasts; that token is deliberately not excluded (the denominator is the full ingress-attempt identity)."
          impact: "Audible media loss for affected publishers during the window that has already passed. Three causes with different owners and the runbook separates them: clients publishing outside their media sessions' lifetimes (client/steering timing, NOT MH), quinn's datagram receive buffer evicting under scheduling pressure because it is sized below MH's own ingress ring (an MH sizing defect - runbook Scenario 16 Step 3 has you read the current constants rather than trusting a restated number, and the ingress buffer-inversion entry in docs/TODO.md carries the arithmetic), or a client inflating the counter with unmatched session-id datagrams (neither of the above). DO NOT conclude MH is losing media before separating them - the predecessor of this signal misattributed exactly this shape to the client for three sessions."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-16-ingress-datagrams-received-but-never-read"

      # ====================================================================
      # MHMediaEgressQueueOverflowRate - the application egress queue bound
      # ====================================================================
      #
      # NAMED FOR ITS SELECTOR, NOT FOR THE SCENARIO. The runbook section is
      # "Media Datagram Drop", which is broader than this rule. An earlier
      # draft was called MHMediaEgressDatagramDropRate and that name
      # overclaims: a responder seeing `connection_closed` and `no_subscriber`
      # move without this firing would reasonably "fix" the mismatch by
      # widening the selector, which reintroduces the false fire below. The
      # name is the guard against that edit.
      #
      # THE NUMERATOR IS RESTRICTED TO `egress_queue_overflow` FOR A CONCRETE
      # REASON. `no_subscriber` is counted ONCE PER FRAME, not once per
      # (frame x subscriber) -- see docs/observability/metrics/mh-service.md
      # under mh_media_frames_forwarded_total. So in a meeting with nobody
      # subscribed, an unrestricted `direction="egress"` numerator reads 100%
      # off a single frame. `connection_closed` is likewise routine: every
      # participant leaves every meeting. Neither is back-pressure.
      #
      # THIS IS AN APPLICATION QUEUE BOUND, NOT A BANDWIDTH BUDGET. It is
      # ADR-0036 §1's transport-parameter bound: MH owns a bounded egress
      # datagram queue above quinn's send buffer, drop-oldest, sized to trip
      # BEFORE the transport ceiling so the drop is countable in our code
      # rather than discarded silently inside quinn. Do not describe this
      # counter in budget, capacity, stream-ceiling or admission terms -- and
      # the reason is the MECHANISM, not absence: since story 2 task 8 the
      # egress-budget chain EXISTS, but it is an ADMISSION-time control. It
      # refuses a forwarding policy at RegisterMeeting (counted on
      # mh_media_stream_admission_total, alerted on
      # mh_media_stream_admission_rejection_ratio against its threshold gauge)
      # and never sheds a datagram. This counter is a QUEUE-time shed on an
      # already-admitted stream. The two cannot move for the same reason, so
      # neither may be widened to cover the other.
      # (CORRECTED 2026-09-24: this block previously said the chain did not
      # exist "in this build". That premise expired with story 2 task 8; the
      # instruction it justified still stands on the mechanism above.)
      #
      # THE "DOES IT APPLY" HALF IS STRUCTURAL, NOT CONFIRMATORY. If quinn
      # absorbed the drop instead, this counter would never increment and the
      # alert would be DEAD BY CONSTRUCTION. That cannot happen silently:
      # the ordering is enforced at startup as
      # ConfigError::EgressQueueDoesNotBindFirst (defined and raised in
      # crates/mh-service/src/config.rs; cited by symbol, not line, because
      # story 2 task 8 moved both), so a config
      # violating it fails startup rather than producing a quiet dead alert.
      #
      # ZERO-DENOMINATOR GUARD IS ON THE FULL ATTEMPTS SUM, matching the
      # ratio's own denominator. Guarding `forwarded > 0` alone is wrong in
      # exactly the case that matters: when EVERYTHING is dropped, forwarded
      # is zero, the guard evaluates false, and the alert goes silent at the
      # moment the failure is total. Same rule as MHGCHeartbeatFailureRate
      # above and alert-conventions.md §attempts-denominator inversion.
      #
      # NOTHING RESTS ON mh_media_egress_queue_depth. Its catalog entry says
      # NO ALERT MAY REST ON THIS GAUGE ALONE: one process-wide,
      # last-writer-wins gauge fed by N per-subscriber queues, with a scrape
      # interval orders of magnitude longer than the queue's fill-and-drain
      # time. Trend input for the dashboard and the runbook only.
      #
      # key_custody is single-valued (`operator`) on every one of these
      # metrics, so it appears in no selector - it partitions nothing.
      - alert: MHMediaEgressQueueOverflowRate
        expr: |
          (
            sum(rate(mh_media_frames_dropped_total{direction="egress",reason="egress_queue_overflow"}[5m]))
            /
            (
              sum(rate(mh_media_frames_forwarded_total{direction="egress"}[5m]))
            + sum(rate(mh_media_frames_dropped_total{direction="egress"}[5m]))
            )
          ) > 0.01
          and
          (
            sum(rate(mh_media_frames_forwarded_total{direction="egress"}[5m]))
          + sum(rate(mh_media_frames_dropped_total{direction="egress"}[5m]))
          ) > 0
        for: 5m
        labels:
          severity: warning
          service: mh-service
          component: media-egress
        annotations:
          summary: "MH shedding media datagrams on its egress queue bound ({{ $value | humanizePercentage }} of egress attempts)"
          description: "More than 1% of egress datagram attempts are being dropped because MH's bounded application egress queue is full - a subscriber the queue cannot drain into fast enough. This is the ADR-0036 §1 transport-parameter bound tripping, NOT a bandwidth budget; the egress budget is a separate ADMISSION-time control with its own signal (mh_media_stream_admission_rejection_ratio against mh_media_stream_admission_rejection_ratio_threshold) and does not shed datagrams. Read the full reason breakdown before concluding back-pressure: connection_closed is routine (participants leave), and no_subscriber is counted once per FRAME rather than per subscriber, so while it happens it can read as 100% of egress. A short no_subscriber tail after a sender's last holder leaves is routine; SUSTAINED no_subscriber means MC's send directive and MH's policy disagree, or a client is ignoring its directive (a solo meeting sends nothing and does not produce it) - see the runbook. Neither is included here, deliberately."
          impact: "Audible loss for affected subscribers. Audio is carried one frame per QUIC datagram with no retransmission, so a dropped datagram is a dropped frame. MH readiness, handshake latency and connection-accept rate all read healthy throughout. The client-side send drop is NOT covered by this rule and cannot be - it happens in the sender and MH structurally cannot observe it; see the runbook's client-side ladder."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-17-media-datagram-drop"

      # ------------------------------------------------------------------
      # ADR-0031 block -- MHMediaEgressEdgeHeadroomLow (story 2 task 16, R-21)
      #
      # WHAT IT MEANS: installed egress edges on this handler are approaching
      # the bound that BINDS FIRST. That bound is the derived egress stream
      # ceiling (mh_media_egress_stream_ceiling, from the egress budget and
      # per-stream costs). It is checked before MH_MAX_TOTAL_EGRESS_EDGES, and MH
      # refuses to start unless the ceiling is at or below that edge limit
      # (infra/services/mh-service/config.env, the MH_MAX_TOTAL_EGRESS_EDGES
      # block), so the limit is a defence-in-depth backstop that this
      # denominator already covers. Dividing by mh_media_egress_edges_limit
      # instead would fire only after the ceiling was already rejecting (or
      # never). At the ceiling, new streams are refused at admission
      # (`rejected_stream_ceiling`; MHMediaEgressBudgetExhausted, below, is
      # the rejection-side alert). Every new participant in any meeting on the
      # pod then gets silence, while everyone already talking keeps talking.
      # This alert is the EARLY warning; that one is the failure.
      #
      # FORK LEAK VS LOAD FIRST (the description repeats this):
      #   LEAK -- edges climb with pod uptime while
      #           mh_media_meeting_teardowns_total{outcome="released"} stays
      #           flat: meetings are not being released (an MC that never
      #           called EndMeeting, e.g. after an MC crash). A TRUE POSITIVE
      #           for a reclamation regression on a long-lived pod. NEVER tune
      #           the fraction up to silence it. MC runbook Scenario 20.
      #   LOAD -- edges track concurrent meetings and participants
      #           (mh_media_registered_meetings moves with them): real demand.
      #           The remedy is capacity or placement, not teardown.
      #
      # THE ONE LITERAL, AND WHY IT IS NOT A SECOND ENCODING. 0.8 is a headroom
      # fraction OWNED BY THIS ALERT. It has no config home, so it duplicates
      # no configured value. That is unlike R-19's rejection threshold, which
      # has one and is therefore read from its gauge (docs/TODO.md, the
      # gauge-to-gauge entry for MHMediaEgressBudgetExhausted). No published
      # headroom gauge exists, and inventing one to avoid a literal would give
      # the alert's own policy a config key nobody tunes. The bound itself is
      # NEVER a literal here: mh_media_egress_stream_ceiling publishes the
      # EgressAdmission field admission reads.
      # PROVENANCE, STATED HONESTLY: unratified. 20% headroom was chosen to
      # leave room to act before new joins start failing silently; no join
      # arrival rate has been measured to turn it into minutes.
      #
      # `for: 10m`: an edge count is a level, not a rate, and a short burst of
      # joins legitimately approaching the bound then falling is not the
      # signal. Ten minutes matches the story's gauge-vs-gauge warning shape.
      #
      # LABEL-SET IDENTITY. `a / b` matches series with equal label sets. Both
      # gauges carry exactly key_custody plus the scrape labels, and a label
      # added to ONE of them silently empties the division, so the alert never
      # fires. Keep them in step (the same caveat as MCKekRotationOverdue).
      #
      # NON-ZERO DENOMINATOR: MH refuses to start with a stream ceiling below
      # MIN_EGRESS_STREAM_CEILING (crates/mh-service/src/config.rs), so the
      # ceiling gauge is never 0 on a running pod and no `> 0` guard is needed.
      #
      # DEMONSTRATION (ADR-0036 §11, both halves). FIRE -- lower the egress
      # budget in the MH ConfigMap so the derived ceiling falls below the edges
      # a demo meeting installs, and watch the ratio cross. KIND-ONLY: on a live
      # pod, lowering the budget is a new-meeting outage plus silent media in
      # existing meetings (docs/runbooks/mh-deployment.md §Operator levers;
      # corrected 2026-09-30 from "a join outage", which R-6 falsified).
      # PREMISE CORRECTION:
      # the task text said "lower the edge limit", but MH refuses to start with
      # the edge limit below the ceiling, so the budget is the lever. APPLY --
      # confirm the selector matches a real mh container's series (both gauges
      # present per instance with identical label sets).
      # ------------------------------------------------------------------
      - alert: MHMediaEgressEdgeHeadroomLow
        expr: |
          mh_media_egress_edges / mh_media_egress_stream_ceiling > 0.8
        for: 10m
        labels:
          severity: warning
          service: mh-service
          component: media-egress
        annotations:
          summary: "MH egress edges near the handler's stream ceiling on {{ $labels.instance }} ({{ $value | humanizePercentage }})"
          description: "mh_media_egress_edges is above the alert's headroom fraction of mh_media_egress_stream_ceiling, the admission bound that binds first (mh_media_egress_edges_limit, MH_MAX_TOTAL_EGRESS_EDGES, is a backstop at or above it). At the ceiling, new streams are refused at admission (rejected_stream_ceiling), so new participants on this handler get silence while existing ones keep talking. FORK FIRST: LEAK = edges climbing with pod uptime while mh_media_meeting_teardowns_total{outcome=\"released\"} stays flat (meetings not released; MC Scenario 20; a true positive on a long-lived pod, never tune it away). LOAD = edges tracking mh_media_registered_meetings and real demand (add capacity or rebalance placement; teardown is not the remedy)."
          impact: "New joins on this handler will soon hear nothing while every existing participant and every liveness signal reads healthy."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-20-meeting-teardown-failing--mh-budget-ratchet"

      # ------------------------------------------------------------------
      # ADR-0031 block -- MHMediaEgressBudgetExhausted (story 2 task 18,
      # R-19, R-29)
      #
      # WHAT IT MEANS: MH's egress admission has been refusing more than the
      # configured share of generation-advancing policy applies for 10
      # minutes. A refused apply installs nothing and the prior generation
      # stays live, so everyone already talking keeps talking and every NEW
      # participant on this handler hears nobody and is heard by nobody.
      #
      # GAUGE VERSUS GAUGE, NO ARITHMETIC, NO LITERAL (R-19; docs/TODO.md's
      # gauge-to-gauge entry, closed by this rule). The left side is the
      # code-computed windowed ratio. The right side publishes
      # MH_EGRESS_REJECTION_RATIO_THRESHOLD from the SAME configuration field
      # the session actor's threshold WARN reads. The number lives only in
      # infra/services/mh-service/config.env. A PromQL literal here would be
      # a second encoding nothing keeps in step.
      #
      # LABEL-SET IDENTITY. `a > b` matches series with equal label sets.
      # Both gauges carry exactly key_custody plus the scrape labels
      # (crates/mh-service/src/observability/metrics.rs,
      # resolve_session_handles and publish_egress_admission), so matching
      # is one-to-one per instance with no on()/ignoring(). A label added to
      # ONE of them silently empties the comparison, and the alert never
      # fires. Keep them in step (the same caveat as
      # MHMediaEgressEdgeHeadroomLow and MCKekRotationOverdue).
      #
      # NO NON-ZERO-DENOMINATOR GUARD, BY CONSTRUCTION. The ratio is computed
      # in code over a sliding window (ADMISSION_WINDOW_BUCKETS x
      # ADMISSION_WINDOW_BUCKET, crates/mh-service/src/session/admission.rs).
      # An empty window publishes 0.0, never NaN, so an idle handler is
      # silent. Zero admitted with any rejected publishes 1.0, so the alert is
      # loudest when exhaustion is total.
      #
      # EVIDENCE FLOOR, STATED RATHER THAN ENCODED. The gauge has no minimum
      # decision count on purpose: one rejection with nothing admitted reads
      # 1.0. No `sum(increase(...)) >= N` conjunct is added. That would be
      # arithmetic, and a second encoding of MIN_DECISIONS_FOR_THRESHOLD_LOG
      # (admission.rs). The window is 5 minutes and `for:` is 10 minutes, so a
      # lone rejection ages out of the window long before this fires. It
      # fires only while rejections keep arriving for more than 10 minutes
      # with too few admissions to dilute them. At low volume that is still
      # a true positive: a handler refusing every new participant in a
      # quiet hour is exhausted. The session actor's WARN applies that
      # minimum decision count and may therefore disagree with this rule at
      # low volume. THIS RULE IS AUTHORITATIVE for notification. The WARN is
      # a debugging breadcrumb.
      #
      # `for: 10m`, warning: a capacity/admission condition on one handler,
      # degraded but contained (held meetings keep their media). NOT a
      # burn-rate alert and no error-budget claim: the MH SLO target is
      # unratified (docs/observability/slos.md; story 8), so this sits
      # outside the SLO until then.
      #
      # LEADING INDICATOR: SCOPED, and stated ONCE, in runbook Scenario 18
      # ("Is there a leading indicator?").
      #
      # SUSTAINED REJECTION WHILE PLACEMENT KEEPS TARGETING THE POD IS A
      # TRIAGE STEP, NOT A SECOND ALERT. GC excludes a handler at its
      # max_streams from NEW-meeting placement only; an already-assigned
      # meeting keeps targeting it (R-6 sticky join). The runbook reads GC's
      # view there.
      #
      # DEMONSTRATION (ADR-0036 §11, both halves):
      #   | Half  | Inject / check | Expect |
      #   | FIRE  | On Kind ONLY, lower MH_EGRESS_BUDGET_BPS in the deployed budget | the ratio gauge crosses the |
      #   |       | (infra/kubernetes/overlays/kind/services/mh-service/            | threshold gauge and stays   |
      #   |       | configmap-egress-budget-patch.yaml) so the derived ceiling sits | above it for 10m; the alert |
      #   |       | below what a demo meeting installs, deploy, then keep joining   | goes pending, then firing   |
      #   |       | participants so admissions are refused                         |                             |
      #   | APPLY | Query both gauges bare in Prometheus                           | one series each per mh      |
      #   |       |                                                                | container, identical label  |
      #   |       |                                                                | sets, so the selector       |
      #   |       |                                                                | matches a real container    |
      # MH refuses to start with the ceiling below MIN_EGRESS_STREAM_CEILING
      # (crates/mh-service/src/config.rs), so the budget can only go so low.
      # BLAST RADIUS OF THE INJECT, even on Kind: the budget lives in a
      # content-addressed ConfigMap, so lowering it rolls BOTH MH pods, and
      # reverting it rolls them again. Every live media session is shed twice.
      # The FIRE half also needs registrations that keep being refused for
      # the whole 10m. An idle window publishes 0.0, so a non-fire without
      # that traffic proves nothing.
      # KIND-ONLY: on a live pod, lowering the budget is the new-meeting
      # outage plus silent media of docs/runbooks/mh-deployment.md §Operator
      # levers. It is never an operator lever.
      # ------------------------------------------------------------------
      - alert: MHMediaEgressBudgetExhausted
        expr: |
          mh_media_stream_admission_rejection_ratio > mh_media_stream_admission_rejection_ratio_threshold
        for: 10m
        labels:
          severity: warning
          service: mh-service
          component: media-egress
        annotations:
          summary: "MH egress admission refusing new streams on {{ $labels.instance }} ({{ $value | humanizePercentage }} of decisions)"
          description: "mh_media_stream_admission_rejection_ratio has been above mh_media_stream_admission_rejection_ratio_threshold (MH_EGRESS_REJECTION_RATIO_THRESHOLD) for 10 minutes: generation-advancing policy applies are refused at the derived egress stream ceiling (rejected_stream_ceiling). Participants already talking keep talking; every new participant on this handler gets silence. FORK FIRST, because two causes read identically on this ratio and need different remedies: genuine load (edges track demand: add capacity, by redeploy) and the unreclaimed-edge floor (edges rise with pod uptime while mh_media_meeting_teardowns_total{outcome=\"released\"} stays flat: fix the teardown path, never raise the threshold). A third cause gives users the same symptom but this ratio never counts it: empty-meeting growth, refused at the registration cap as mh_media_policy_applies_total{outcome=\"rejected_meeting_cap\"}. Check it alongside. Sustained rejection while placement keeps targeting this pod is a triage step in the runbook, not a second alert. Lowering MH_EGRESS_BUDGET_BPS is never a remedy."
          impact: "New joins on this handler hear nobody and are heard by nobody, while existing participants and every liveness signal read healthy."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-18-media-egress-budget-exhaustion"

      - alert: MHHighMemory
        expr: |
          (
            container_memory_usage_bytes{container="mh-service"}
            /
            container_spec_memory_limit_bytes{container="mh-service"}
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          service: mh-service
          component: infrastructure
        annotations:
          summary: "MH memory usage high ({{ $value | humanizePercentage }})"
          description: "Media Handler pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }} for 10 minutes."
          impact: "Risk of OOM kill. Investigate leak or scale before user impact."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-8-resource-pressure"

      - alert: MHHighCPU
        expr: |
          rate(container_cpu_usage_seconds_total{container="mh-service"}[5m]) > 0.80
        for: 5m
        labels:
          severity: warning
          service: mh-service
          component: infrastructure
        annotations:
          summary: "MH CPU usage high ({{ $value | humanizePercentage }})"
          description: "Media Handler pod {{ $labels.pod }} CPU usage is {{ $value | humanizePercentage }} for 5 minutes."
          impact: "High CPU may slow WebTransport handshakes and media forwarding. Consider scaling horizontally."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-8-resource-pressure"

      - alert: MHTokenRefreshFailures
        expr: |
          (
            sum(rate(mh_token_refresh_total{status="error"}[5m]))
            /
            sum(rate(mh_token_refresh_total[5m]))
          ) > 0.10
          and
          sum(rate(mh_token_refresh_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: mh-service
          component: auth
        annotations:
          summary: "MH token refresh failure rate high ({{ $value | humanizePercentage }})"
          description: "Media Handler OAuth token refresh failing at {{ $value | humanizePercentage }} for 5 minutes. MH uses this token for outbound RPCs to GC (registration, heartbeats) and MC (notifications). Break down by error_type for specific cause."
          impact: "Initially none (MH uses cached token); after token expiry MH loses outbound auth and GC/MC integration degrades. Check AC service health."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-9-token-refresh-failures"

      - alert: MHMCNotificationFailures
        expr: |
          (
            sum(rate(mh_mc_notifications_total{status="error"}[5m]))
            /
            sum(rate(mh_mc_notifications_total[5m]))
          ) > 0.10
          and
          sum(rate(mh_mc_notifications_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: mh-service
          component: mc-integration
        annotations:
          summary: "MH-MC notification delivery failure rate high ({{ $value | humanizePercentage }})"
          description: "MH to MC connect/disconnect notification delivery failing at {{ $value | humanizePercentage }} for 5 minutes. Fire-and-forget design means failed events are not retried - MC may develop stale participant state."
          impact: "Stale presence indicators, delayed disconnect detection, participants appearing still-present after leaving. Check MC service health."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-10-mhmc-notification-failures"

      - alert: MHPodRestartingFrequently
        expr: |
          rate(kube_pod_container_status_restarts_total{container="mh-service"}[1h]) > 0.016
        for: 5m
        labels:
          severity: warning
          service: mh-service
          component: infrastructure
        annotations:
          summary: "MH pod {{ $labels.pod }} restarting frequently"
          description: "Pod {{ $labels.pod }} has restarted {{ $value }} times per hour. May indicate crashes, OOM kills, or liveness probe failures."
          impact: "Repeated disconnection of WebTransport sessions on this pod. Users on this pod lose media each restart."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-11-pod-restarting-frequently"

  - name: mh-service-info
    interval: 60s
    rules:
      # ====================================================================
      # INFO ALERTS - Log only, no notification. Leading indicators.
      # ====================================================================

      - alert: MHGCHeartbeatLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by(le) (rate(mh_gc_heartbeat_latency_seconds_bucket[5m]))
          ) > 0.100
        for: 5m
        labels:
          severity: info
          service: mh-service
          component: gc-integration
        annotations:
          summary: "MH GC heartbeat p95 latency high ({{ $value }}s > 100ms)"
          description: "Media Handler heartbeat RPC p95 latency to GC is {{ $value }}s, exceeding the 100ms SLO target for 5 minutes. Info severity - this is a leading indicator for a future SLO-guarding page alert; no aggregate page alert currently defined (see ADR-0011 for SLO framework). Threshold is SLO-derived per the MH metrics catalog."
          impact: "No immediate user impact. Watch for escalation to heartbeat failures (MHGCHeartbeatFailureRate) or cascading latency."
          runbook_url: "docs/runbooks/mh-incident-response.md#scenario-12-gc-heartbeat-latency"
