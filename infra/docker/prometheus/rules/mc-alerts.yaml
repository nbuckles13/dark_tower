# Prometheus alerting rules for Meeting Controller
#
# Severity levels (per docs/observability/alert-conventions.md):
# - page: User-visible impact now or SLO burn; pages oncall immediately (PagerDuty)
# - warning: Degraded but contained, or approaching limits; Slack notify, business hours
# - info: Awareness/trend/leading indicator; no notification, dashboards only
#
# All alerts link to sections in the consolidated incident response runbook:
# docs/runbooks/mc-incident-response.md

groups:
  - name: mc-service-page
    interval: 30s
    rules:
      # ====================================================================
      # PAGE ALERTS - User-visible impact or SLO burn; page oncall immediately
      # ====================================================================

      - alert: MCDown
        expr: |
          up{job="mc-service"} == 0
        for: 1m
        labels:
          severity: page
          service: mc-service
          component: infrastructure
        annotations:
          summary: "Meeting Controller service is down"
          description: "Meeting Controller has no running pods for 1 minute. All active meetings are affected."
          impact: "Users in active meetings may be disconnected. New meeting joins will fail."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-4-complete-service-outage"

      - alert: MCActorPanic
        expr: |
          increase(mc_actor_panics_total[5m]) > 0
        for: 0m
        labels:
          severity: page
          service: mc-service
          component: actor-system
        annotations:
          summary: "MC actor panic detected ({{ $labels.actor_type }})"
          description: "Actor {{ $labels.actor_type }} has panicked. Per ADR-0023, MeetingControllerActor panic is fatal (shutdown) and MeetingActor panic triggers meeting migration - both user-visible."
          impact: "Affected meetings disrupted (migration for MeetingActor, full shutdown for root controller). Root cause investigation required."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-2-actor-panics"

      - alert: MCHighMailboxDepthCritical
        expr: |
          sum by(actor_type) (mc_actor_mailbox_depth) > 500
        for: 2m
        labels:
          severity: page
          service: mc-service
          component: actor-system
        annotations:
          summary: "MC mailbox depth critical ({{ $labels.actor_type }}: {{ $value }})"
          description: "Actor {{ $labels.actor_type }} has mailbox depth {{ $value }} (>500) for 2 minutes. Severe backpressure - messages will be dropped."
          impact: "Message processing severely delayed. Active meetings experiencing significant lag or failures."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-1-high-mailbox-depth"

      - alert: MCMediaConnectionAllFailed
        expr: |
          (
            sum(rate(mc_participant_mh_status_total{state="failed"}[5m]))
            /
            sum(rate(mc_participant_mh_status_total{state=~"connected|failed"}[5m]))
          ) > 0.80
          and
          sum(rate(mc_participant_mh_status_total{state=~"connected|failed"}[5m])) > 0.1
        for: 5m
        labels:
          severity: page
          service: mc-service
          component: media-coordination
        annotations:
          summary: "MC client-reported media connections predominantly failing ({{ $value | humanizePercentage }})"
          description: "Over 80% of client-reported per-MH media connections are in the FAILED state ({{ $value | humanizePercentage }}) for 5 minutes, at meaningful volume. Replaces the pre-R-60 all-fail-counter alert (deleted in Task #2); the new signal is the failed share of mc_participant_mh_status_total{state}. See 'Client-Reported MH Status by State' on MC Overview for the per-state breakdown."
          impact: "Participants are joining meetings but cannot establish media to their assigned Media Handlers — calls are silently broken (no audio/video) even though signaling and join succeed. User-visible."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-11-media-connection-failures"

      # ====================================================================
      # MCMediaGenerationDivergence - ADR-0036 §8's partial blackhole
      # ====================================================================
      #
      # WHY THIS FIRES ON THE COUNTER AND NOT ON THE GAUGE. There is a gauge,
      # `mc_media_generation_divergence`, and it is the obvious thing to page
      # on. Its own catalog entry (docs/observability/metrics/mc-service.md)
      # says NEVER PAGE ON IT, for two independent reasons: it is
      # last-write-wins at POD level, so a healthy push for an unrelated
      # meeting erases a diverged reading; and it is written once per
      # registration push, which is coarse relative to the scrape interval, so
      # a real divergence can be overwritten before it is ever scraped. The
      # gauge is the MAGNITUDE a responder reads next -- it belongs in the
      # runbook ladder, not in an expr. A reading of 0 there is not evidence
      # that nothing diverged.
      #
      # THE SELECTOR IS NEGATED (`outcome!~`), NOT POSITIVE, AND THAT IS THE
      # WHOLE DESIGN. It reads "everything that is not a confirmed match and
      # not the known-noisy diagnostic", never "these two named failures".
      #
      # WHY NEGATED -- THE DECISIVE REASON IS VOCABULARY GROWTH.
      # `PolicyPushOutcome::ALL` is compile-checked in Rust, so a sixth outcome
      # is a compile error there -- but THAT COMPILE ERROR DOES NOT REACH
      # PROMQL. Under the negated form a new outcome is covered automatically:
      # it pages, someone investigates, and the classification gets made
      # deliberately. Under a positive `outcome=~"a|b"` it would fall silently
      # outside the alert with nothing anywhere reporting it. For a PAGE alert
      # whose entire subject is A PARTIAL BLACKHOLE REPORTING HEALTHY, silence
      # is precisely the failure mode to defend against.
      #
      # An earlier draft of this rule shipped the positive form and was caught
      # at review. Do not "simplify" it back: the two forms differ only when a
      # sixth value exists, which is exactly when it matters.
      #
      # THE ONE EXCLUSION BEYOND `match` IS LOAD-BEARING, NOT TIDYING.
      # `handler_id_mismatch` is excluded because MH_HANDLER_ID is
      # per-incarnation today (MH derives it from HOSTNAME plus a fresh UUID at
      # process start, and MH_HANDLER_ID is unset in all three manifests), so an
      # ordinary MH pod restart produces that outcome BY CONSTRUCTION. A bare
      # `outcome != "match"` rule would page on every MH rollout, and a page
      # that cries wolf stops being read -- including for the real
      # `no_applied_generation` it exists to catch.
      #   REVERT TRIGGER: `2026-09-02-mh-stable-handler-id`. When the handler id
      #   becomes stable per deployment, REMOVE THE EXCLUSION IN ALL THREE
      #   PLACES TOGETHER. THIS EXPRESSION IS HELD AT THREE SITES -- here,
      #   `docs/observability/metrics/mc-service.md`'s catalog entry, and
      #   `docs/runbooks/mc-deployment.md`'s post-deploy checklist. One decision,
      #   one trigger; whoever stabilises the handler id must find all three, and
      #   the other two assert that this site holds the same string.
      #
      # `transport_mode_mismatch` IS COVERED, and this is a change from an
      # earlier draft. It is a different FAILURE from generation divergence --
      # ADR-0036 §8's separate "any two-ends-must-agree configuration is echoed
      # back with a loud mismatch" -- and the runbook says so. But being a
      # different failure justifies excluding it from THE SCENARIO's diagnosis,
      # not from THE ALERTING SURFACE: nothing else pages on it. Scenario 15
      # carries a triage row that routes it rather than disowning it, so a
      # responder who arrives on this page is not told their alert is not this
      # alert's problem.
      #
      # `no_applied_generation` is covered for the same reason it matters: MH
      # echoing nothing means MC cannot verify what MH is running, which is the
      # "absent policy" half of the scenario. It also fires on a rollout skew (an
      # MH build predating the echo) -- named in the description so oncall is not
      # surprised at 3am.
      #
      # NO ZERO-DENOMINATOR GUARD, DELIBERATELY. This is not a ratio. The
      # guard convention (alert-conventions.md §Non-Zero-Denominator Guard)
      # is load-bearing only when the denominator is an ATTEMPTS SUM; bolted
      # onto a bare counter it changes nothing about whether this fires and
      # teaches the next reader that the guard is decorative.
      #
      # `for: 0m` WITH A 15m increase() WINDOW: the occurrence IS the signal.
      # In this build divergence does NOT self-correct -- of ADR-0036 §8's
      # four re-fire triggers only structural change is implemented, so a
      # diverged meeting stays blackholed until a rejoin. Delaying the page
      # buys nothing and costs media-dark time. Same idiom and same reasoning
      # as MCActorPanic and MCSenderIdSpaceExhausted. `for:` MUST STAY BELOW
      # THE increase() WINDOW or the rule is unsatisfiable by construction.
      - alert: MCMediaGenerationDivergence
        expr: |
          sum(increase(mc_media_policy_pushes_total{outcome!~"match|handler_id_mismatch"}[15m])) > 0
        for: 0m
        labels:
          severity: page
          service: mc-service
          component: media-control-plane
        annotations:
          summary: "MC and MH disagree about the applied media policy generation ({{ $value }} in 15m)"
          description: "MC could not confirm its forwarding policy is live on MH. ADR-0036 §8 calls this shape a partial blackhole reporting healthy: MH forwards under stale or absent policy while up, readiness, the gRPC result and the channel all read green. SPLIT ON THE OUTCOME LABEL FIRST - the values have different first moves. generation_mismatch = MH applied an older generation (its apply path failed); no_applied_generation = MH echoed nothing (an MH build predating the echo, i.e. a rollout skew, or the apply never ran - confirm the image before treating it as an apply failure); transport_mode_mismatch = the separate two-ends-must-agree echo failing, a different remedy, routed from the same runbook. THIS DOES NOT SELF-CORRECT IN THIS BUILD: there is no periodic re-assert, so the resolution is to force a structural change (a rejoin), never to wait for convergence. The selector is negated, so an outcome added later fires here rather than falling silently outside the alert."
          impact: "Participants in the affected meeting get no audio while the client stays connected and the UI reads healthy. Blast radius is per (meeting, handler), not fleet-wide. DO NOT RESTART MH as a remedy: it sheds every media session on the pod, recovers none of the already-dark ones, and destroys the evidence."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-15-media-generation-divergence"

  - name: mc-service-warning
    interval: 60s
    rules:
      # ====================================================================
      # WARNING ALERTS - Notify but don't page
      # ====================================================================

      - alert: MCHighMailboxDepthWarning
        expr: |
          sum by(actor_type) (mc_actor_mailbox_depth) > 100
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: actor-system
        annotations:
          summary: "MC mailbox depth elevated ({{ $labels.actor_type }}: {{ $value }})"
          description: "Actor {{ $labels.actor_type }} has mailbox depth {{ $value }} (>100) for 5 minutes. Investigate backpressure cause."
          impact: "Message processing delayed. May escalate if not addressed."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-1-high-mailbox-depth"

      - alert: MCHighMemory
        expr: |
          (
            container_memory_usage_bytes{container="mc-service"}
            /
            container_spec_memory_limit_bytes{container="mc-service"}
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          service: mc-service
          component: infrastructure
        annotations:
          summary: "MC memory usage high ({{ $value | humanizePercentage }})"
          description: "Meeting Controller pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }} for 10 minutes."
          impact: "Risk of OOM kill. May need to investigate memory usage or increase limits."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-7-resource-pressure"

      - alert: MCHighCPU
        expr: |
          rate(container_cpu_usage_seconds_total{container="mc-service"}[5m]) > 0.80
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: infrastructure
        annotations:
          summary: "MC CPU usage high ({{ $value | humanizePercentage }})"
          description: "Meeting Controller pod {{ $labels.pod }} CPU usage is {{ $value | humanizePercentage }} for 5 minutes."
          impact: "High CPU may increase message processing latency. Consider scaling horizontally."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-7-resource-pressure"

      - alert: MCLowConnectionCount
        expr: |
          sum(mc_connections_active) < 1 and sum(mc_meetings_active) > 0
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: webtransport
        annotations:
          summary: "MC has active meetings but no connections"
          description: "Meeting Controller has {{ $value }} active meetings but no WebTransport connections for 5 minutes."
          impact: "Meetings may be orphaned. Investigate connection issues."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-3-meeting-lifecycle-issues"

      - alert: MCGCHeartbeatWarning
        expr: |
          (
            sum(rate(mc_gc_heartbeats_total{status="error"}[5m]))
            /
            sum(rate(mc_gc_heartbeats_total[5m]))
          ) > 0.10
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: gc-integration
        annotations:
          summary: "MC-GC heartbeat failure rate elevated ({{ $value | humanizePercentage }})"
          description: "Meeting Controller heartbeat failures to Global Controller at {{ $value | humanizePercentage }} for 5 minutes."
          impact: "GC integration may be degraded. Investigate connectivity."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-6-gc-integration-failures"

      - alert: MCPodRestartingFrequently
        expr: |
          rate(kube_pod_container_status_restarts_total{container="mc-service"}[1h]) > 0.016
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: infrastructure
        annotations:
          summary: "MC pod {{ $labels.pod }} restarting frequently"
          description: "Pod {{ $labels.pod }} has restarted {{ $value }} times per hour. This may indicate crashes, OOM kills, or liveness probe failures."
          impact: "Service instability. Investigate logs for crash causes."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-4-complete-service-outage"

      - alert: MCCapacityWarning
        expr: |
          sum(mc_meetings_active) > 80
        for: 10m
        labels:
          severity: warning
          service: mc-service
          component: capacity
        annotations:
          summary: "MC approaching capacity ({{ $value }} active meetings)"
          description: "Meeting Controller has {{ $value }} active meetings, approaching capacity threshold."
          impact: "May need to scale out or reject new meetings soon."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-7-resource-pressure"

      - alert: MCHighJoinFailureRate
        expr: |
          (
            sum(rate(mc_session_joins_total{status="failure"}[5m]))
            /
            sum(rate(mc_session_joins_total[5m]))
          ) > 0.05
          and
          sum(rate(mc_session_joins_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: meeting-join
        annotations:
          summary: "MC session join failure rate high ({{ $value | humanizePercentage }})"
          description: "Session join failure rate is {{ $value | humanizePercentage }} for 5 minutes. Check 'Join Failures by Error Type' dashboard panel to determine root cause."
          impact: "Some users unable to join meetings via WebTransport. Investigate join failure types in MC Overview dashboard."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-8-join-failures"

      # Absolute count, NOT a ratio, deliberately: a single meeting exhausting
      # its 65535-id namespace cannot move the fleet-wide MCHighJoinFailureRate
      # ratio above, so that rule is structurally blind to this condition. No
      # threshold judgement is involved — any occurrence is one permanently
      # broken meeting.
      - alert: MCSenderIdSpaceExhausted
        expr: |
          increase(mc_session_join_failures_total{error_type="sender_id_space_exhausted"}[15m]) > 0
        # 0m, matching MCActorPanic above (same absolute-count "any occurrence"
        # shape): the 15m increase window already smooths, the condition cannot
        # flap because it is permanent, and a `for:` delay would only postpone
        # paging on an already-irreversible state.
        for: 0m
        labels:
          severity: warning
          service: mc-service
          component: meeting-join
        annotations:
          summary: "MC refused a join: meeting sender_id space exhausted"
          description: "A meeting consumed all 65535 per-meeting sender_ids and MC refused the admission rather than reusing a live id (invariant R-35). NOT SELF-CLEARING: that meeting has permanently stopped admitting participants and the only remediation is to end it and have participants rejoin a new one, so the underlying state persists whether or not this alert re-fires. Namespace use is cumulative lifetime admissions, not concurrent participants, so MC_MAX_PARTICIPANTS does not bound it. Identify the meeting from the MC log record 'sender_id space exhausted' and treat a sudden onset as possibly driven — see the runbook."
          impact: "One meeting can admit no further participants, permanently. Existing participants are unaffected."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-8-join-failures"

      - alert: MCHighWebTransportRejections
        expr: |
          (
            sum(rate(mc_webtransport_connections_total{status="rejected"}[5m]))
            /
            sum(rate(mc_webtransport_connections_total[5m]))
          ) > 0.10
          and
          sum(rate(mc_webtransport_connections_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: meeting-join
        annotations:
          summary: "MC WebTransport rejection rate high ({{ $value | humanizePercentage }})"
          description: "WebTransport connection rejection rate is {{ $value | humanizePercentage }} for 5 minutes. May indicate capacity exhaustion or misconfigured clients."
          impact: "Users unable to establish WebTransport sessions. Check MC capacity and connection limits."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-9-webtransport-rejections"

      - alert: MCHighJwtValidationFailures
        expr: |
          (
            sum(rate(mc_jwt_validations_total{result="failure"}[5m]))
            /
            sum(rate(mc_jwt_validations_total[5m]))
          ) > 0.10
          and
          sum(rate(mc_jwt_validations_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: meeting-join
        annotations:
          summary: "MC JWT validation failure rate high ({{ $value | humanizePercentage }})"
          description: "JWT validation failure rate is {{ $value | humanizePercentage }} for 5 minutes. May indicate expired tokens, JWKS rotation issues, or token tampering."
          impact: "Users unable to authenticate for meeting join. Check AC service health and JWKS endpoint availability."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-10-jwt-validation-failures"

      # ====================================================================
      # MCMediaMissingKeyMaterial - client-side counter, MC-side remedy
      # ====================================================================
      #
      # !! THIS ALERT CANNOT FIRE TODAY. THAT IS STATED, NOT HEDGED. !!
      # `dt_client_*` metrics do not reach Prometheus in this deployment: the
      # OTLP collector's metrics pipeline exports to `debug` (its own
      # container log) and no Prometheus job scrapes the collector. So the
      # series does not exist and this rule cannot fire at any threshold for
      # any reason. It lands anyway, so that wiring the exporter is the single
      # remaining step rather than a rule nobody wrote -- and the premise
      # failure is recorded at five sites (this comment, the fire/apply table
      # in the devloop record, the docs/observability/alerts.md inventory
      # entry, mc-incident-response.md Scenario 16, and the docs/TODO.md
      # entry) so that nothing reads it as coverage.
      # Tracked: docs/TODO.md §Observability Debt (collector metrics export).
      #
      # NOTHING ELSE COVERS A TYPO IN THIS EXPRESSION. `dt-guard
      # application-metrics` extracts alert metric references with a regex
      # built from the four service prefixes in
      # crates/dt-guard/src/common/services.rs -- \b((?:ac|gc|mc|mh)_[a-z][a-z0-9_]*).
      # Underscore is a word character, so `dt_client_media_frames_dropped_total`
      # matches nothing and a misspelling here passes CI green while the alert
      # never fires. The "does it apply" step (the counter arriving in
      # Prometheus from a real browser client through the SDK OTLP sink and
      # the GC telemetry proxy) is this rule's SOLE coverage, not
      # belt-and-braces. When the export lands, that step must read the metric
      # name back OUT of Prometheus -- OTLP->Prometheus normalisation is not
      # guaranteed to preserve the `_total` suffix written in TypeScript.
      #
      # DENOMINATOR IS `received`, AND THAT IS THE ATTEMPTS SUM.
      # `received = accepted + sum(drops by reason)` is an accounting identity
      # held at the crypto/parse boundary, so `received` IS the total and the
      # guard on it matches the ratio's own denominator. Denominating or
      # guarding on `accepted` would be the attempts-denominator inversion in
      # its exact form: in a TOTAL key-delivery outage `accepted` goes to
      # zero, the guard evaluates false, and the alert goes silent at the
      # moment the failure is complete.
      #
      # `for: 15m` AGAINST A rate(...[5m]) WINDOW IS DELIBERATE AND IS A
      # DOCUMENTED ANTI-SHAPE. alert-conventions.md says to match `for:` to
      # the rate() window. DO NOT "FIX" THIS TO 5m. Both reasons are EXPECTED
      # transients at join and after a KEK rotation (ADR-0036 §11); the
      # sustained case is the signal, so the `for:` window must outlast the
      # transients and is doing the discriminating work that the threshold is
      # not.
      #
      # THRESHOLD PROVENANCE, STATED HONESTLY: 5% is not SLO-derived and there
      # is no observed baseline. At 20 ms/frame (50 frames/s) a 1-2 second
      # join transient is well under 1% of a 5-minute window, while a
      # sustained delivery failure sits near 100%. Do not cite it as ratified.
      #
      # AGGREGATED NUMERATOR, NOT `sum by(reason)`: both reasons share one
      # runbook scenario, and a per-reason instance would need
      # `/ on() group_left()` broadcasting for the denominator - machinery for
      # no triage gain. The reason fork lives in Scenario 16, which is where
      # the two remedies diverge.
      - alert: MCMediaMissingKeyMaterial
        expr: |
          (
            sum(rate(dt_client_media_frames_dropped_total{reason=~"no_kek_for_generation|no_roster_entry"}[5m]))
            /
            sum(rate(dt_client_media_frames_received_total[5m]))
          ) > 0.05
          and
          sum(rate(dt_client_media_frames_received_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          service: mc-service
          component: media-keys
        annotations:
          summary: "Clients sustained-dropping media frames for missing key material ({{ $value | humanizePercentage }})"
          description: "Receiving clients cannot open frames because they lack the meeting KEK for the carried generation (no_kek_for_generation) or a usable identity key for the sender (no_roster_entry). Both are EXPECTED transiently at join and after a KEK rotation; 15 minutes sustained is the signal, and ADR-0036 §11 makes it the only signal for a join or rotation path that has silently stopped delivering keys. Split on the reason label FIRST - the two arms have different remedies and are not equally instrumented. Fires on a client counter but lives here because the remedy is in MC's KEK-and-roster delivery path."
          impact: "Affected participants hear nothing while every server-side signal reads healthy - MH never opens a frame and structurally cannot observe either condition. The no_roster_entry arm additionally means sender signature verification cannot run, so attribution is failing and not merely decryption."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-16-missing-key-material"

  - name: mc-service-info
    interval: 60s
    rules:
      # ====================================================================
      # INFO ALERTS - Log only, no notification
      # ====================================================================

      - alert: MCHighJoinLatency
        expr: |
          histogram_quantile(0.95,
            sum by(le) (rate(mc_session_join_duration_seconds_bucket{status="success"}[5m]))
          ) > 2.0
        for: 5m
        labels:
          severity: info
          service: mc-service
          component: meeting-join
        annotations:
          summary: "MC session join p95 latency high ({{ $value }}s > 2s)"
          description: "Session join p95 latency is {{ $value }}s, exceeding 2s threshold for 5 minutes. MC SLO is p99 <500ms, so p95 >2s is a leading indicator of degradation. Note: info severity because this tracks join-specific latency, which is separate from the processing SLO. There is NO aggregate latency page alert - the processing SLO has no alert rule today, so do not read this note as saying something else already covers it."
          impact: "Slow meeting join experience. Investigate JWT validation, actor processing, and WebTransport session setup latency."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-5-high-latency"
