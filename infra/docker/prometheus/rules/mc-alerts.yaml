# Prometheus alerting rules for Meeting Controller
#
# Severity levels (per docs/observability/alert-conventions.md):
# - page: User-visible impact now or SLO burn; pages oncall immediately (PagerDuty)
# - warning: Degraded but contained, or approaching limits; Slack notify, business hours
# - info: Awareness/trend/leading indicator; no notification, dashboards only
#
# All alerts link to sections in the consolidated incident response runbook:
# docs/runbooks/mc-incident-response.md

groups:
  - name: mc-service-page
    interval: 30s
    rules:
      # ====================================================================
      # PAGE ALERTS - User-visible impact or SLO burn; page oncall immediately
      # ====================================================================

      - alert: MCDown
        expr: |
          up{job="mc-service"} == 0
        for: 1m
        labels:
          severity: page
          service: mc-service
          component: infrastructure
        annotations:
          summary: "Meeting Controller service is down"
          description: "Meeting Controller has no running pods for 1 minute. All active meetings are affected."
          impact: "Users in active meetings may be disconnected. New meeting joins will fail."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-4-complete-service-outage"

      - alert: MCActorPanic
        expr: |
          increase(mc_actor_panics_total[5m]) > 0
        for: 0m
        labels:
          severity: page
          service: mc-service
          component: actor-system
        annotations:
          summary: "MC actor panic detected ({{ $labels.actor_type }})"
          description: "Actor {{ $labels.actor_type }} has panicked. Per ADR-0023, MeetingControllerActor panic is fatal (shutdown) and MeetingActor panic triggers meeting migration - both user-visible."
          impact: "Affected meetings disrupted (migration for MeetingActor, full shutdown for root controller). Root cause investigation required."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-2-actor-panics"

      - alert: MCHighMailboxDepthCritical
        expr: |
          sum by(actor_type) (mc_actor_mailbox_depth) > 500
        for: 2m
        labels:
          severity: page
          service: mc-service
          component: actor-system
        annotations:
          summary: "MC mailbox depth critical ({{ $labels.actor_type }}: {{ $value }})"
          description: "Actor {{ $labels.actor_type }} has mailbox depth {{ $value }} (>500) for 2 minutes. Severe backpressure - messages will be dropped."
          impact: "Message processing severely delayed. Active meetings experiencing significant lag or failures."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-1-high-mailbox-depth"

      - alert: MCMediaConnectionAllFailed
        expr: |
          (
            sum(rate(mc_participant_mh_status_total{state="failed"}[5m]))
            /
            sum(rate(mc_participant_mh_status_total{state=~"connected|failed"}[5m]))
          ) > 0.80
          and
          sum(rate(mc_participant_mh_status_total{state=~"connected|failed"}[5m])) > 0.1
        for: 5m
        labels:
          severity: page
          service: mc-service
          component: media-coordination
        annotations:
          summary: "MC client-reported media connections predominantly failing ({{ $value | humanizePercentage }})"
          description: "Over 80% of client-reported per-MH media connections are in the FAILED state ({{ $value | humanizePercentage }}) for 5 minutes, at meaningful volume. Replaces the pre-R-60 all-fail-counter alert (deleted in Task #2); the new signal is the failed share of mc_participant_mh_status_total{state}. See 'Client-Reported MH Status by State' on MC Overview for the per-state breakdown."
          impact: "Participants are joining meetings but cannot establish media to their assigned Media Handlers — calls are silently broken (no audio/video) even though signaling and join succeed. User-visible."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-11-media-connection-failures"

      # ====================================================================
      # MCMediaGenerationDivergence - ADR-0036 §8's partial blackhole
      # ====================================================================
      #
      # WHY THIS FIRES ON THE COUNTER AND NOT ON THE GAUGE. There is a gauge,
      # `mc_media_generation_divergence`, and it is the obvious thing to page
      # on. Its own catalog entry (docs/observability/metrics/mc-service.md)
      # says NEVER PAGE ON IT, for two independent reasons: it is
      # last-write-wins at POD level, so a healthy push for an unrelated
      # meeting erases a diverged reading; and it is written once per
      # registration push, which is coarse relative to the scrape interval, so
      # a real divergence can be overwritten before it is ever scraped. The
      # gauge is the MAGNITUDE a responder reads next -- it belongs in the
      # runbook ladder, not in an expr. A reading of 0 there is not evidence
      # that nothing diverged.
      #
      # THE SELECTOR IS NEGATED (`outcome!~`), NOT POSITIVE, AND THAT IS THE
      # WHOLE DESIGN. It reads "everything that is not a confirmed match and
      # not the known-noisy diagnostic", never "these two named failures".
      #
      # WHY NEGATED -- THE DECISIVE REASON IS VOCABULARY GROWTH.
      # `PolicyPushOutcome::ALL` is compile-checked in Rust, so a sixth outcome
      # is a compile error there -- but THAT COMPILE ERROR DOES NOT REACH
      # PROMQL. Under the negated form a new outcome is covered automatically:
      # it pages, someone investigates, and the classification gets made
      # deliberately. Under a positive `outcome=~"a|b"` it would fall silently
      # outside the alert with nothing anywhere reporting it. For a PAGE alert
      # whose entire subject is A PARTIAL BLACKHOLE REPORTING HEALTHY, silence
      # is precisely the failure mode to defend against.
      #
      # An earlier draft of this rule shipped the positive form and was caught
      # at review. Do not "simplify" it back: the two forms differ only when a
      # sixth value exists, which is exactly when it matters.
      #
      # THE ONE EXCLUSION BEYOND `match` IS LOAD-BEARING, NOT TIDYING.
      # `handler_id_mismatch` is excluded because MH_HANDLER_ID is
      # per-incarnation today (MH derives it from HOSTNAME plus a fresh UUID at
      # process start, and MH_HANDLER_ID is unset in all three manifests), so an
      # ordinary MH pod restart produces that outcome BY CONSTRUCTION. A bare
      # `outcome != "match"` rule would page on every MH rollout, and a page
      # that cries wolf stops being read -- including for the real
      # `no_applied_generation` it exists to catch.
      #   REVERT TRIGGER: `2026-09-02-mh-stable-handler-id`. When the handler id
      #   becomes stable per deployment, REMOVE THE EXCLUSION IN ALL THREE
      #   PLACES TOGETHER. THIS EXPRESSION IS HELD AT THREE SITES -- here,
      #   `docs/observability/metrics/mc-service.md`'s catalog entry, and
      #   `docs/runbooks/mc-deployment.md`'s post-deploy checklist. One decision,
      #   one trigger; whoever stabilises the handler id must find all three, and
      #   the other two assert that this site holds the same string.
      #
      # `transport_mode_mismatch` IS COVERED, and this is a change from an
      # earlier draft. It is a different FAILURE from generation divergence --
      # ADR-0036 §8's separate "any two-ends-must-agree configuration is echoed
      # back with a loud mismatch" -- and the runbook says so. But being a
      # different failure justifies excluding it from THE SCENARIO's diagnosis,
      # not from THE ALERTING SURFACE: nothing else pages on it. Scenario 15
      # carries a triage row that routes it rather than disowning it, so a
      # responder who arrives on this page is not told their alert is not this
      # alert's problem.
      #
      # `no_applied_generation` is covered for the same reason it matters: MH
      # echoing nothing means MC cannot verify what MH is running, which is the
      # "absent policy" half of the scenario. It also fires on a rollout skew (an
      # MH build predating the echo) -- named in the description so oncall is not
      # surprised at 3am.
      #
      # NO ZERO-DENOMINATOR GUARD, DELIBERATELY. This is not a ratio. The
      # guard convention (alert-conventions.md §Non-Zero-Denominator Guard)
      # is load-bearing only when the denominator is an ATTEMPTS SUM; bolted
      # onto a bare counter it changes nothing about whether this fires and
      # teaches the next reader that the guard is decorative.
      #
      # `for: 0m` WITH A 15m increase() WINDOW: the occurrence IS the signal.
      # Since story 2 any structural change re-pushes, so a meeting WITH churn
      # may clear by itself -- but there is still no periodic re-assert
      # (story 4), so a QUIESCENT diverged meeting stays blackholed until
      # something changes, and a `for:` delay would only add media-dark time
      # for exactly the meetings nobody is touching. The one EXPECTED
      # non-match, an MC restart under a live meeting (the handler still holds
      # the pre-restart MC's generation), never reaches this counter: it is
      # recorded on mc_media_policy_generation_adoptions_total INSTEAD, at one
      # site in the pusher, so no rollout page and no scrape-interleaving
      # residue for a `for:` to absorb. Same idiom as MCActorPanic (and the
      # retired MCSenderIdSpaceExhausted, whose shape the info rule
      # MCKekEpochResetOnSenderIdExhaustion keeps). `for:` MUST STAY BELOW THE
      # increase() WINDOW or the rule is unsatisfiable by construction.
      - alert: MCMediaGenerationDivergence
        expr: |
          sum(increase(mc_media_policy_pushes_total{outcome!~"match|handler_id_mismatch"}[15m])) > 0
        for: 0m
        labels:
          severity: page
          service: mc-service
          component: media-control-plane
        annotations:
          summary: "MC and MH disagree about the applied media policy generation ({{ $value }} in 15m)"
          description: "MC could not confirm its forwarding policy is live on MH. ADR-0036 §8 calls this shape a partial blackhole reporting healthy: MH forwards under stale or absent policy while up, readiness, the gRPC result and the channel all read green. SPLIT ON THE OUTCOME LABEL FIRST - the values have different first moves. generation_mismatch = MH applied an older generation (its apply path failed); no_applied_generation = MH echoed nothing (an MH build predating the echo, i.e. a rollout skew, or the apply never ran - confirm the image before treating it as an apply failure); transport_mode_mismatch = the separate two-ends-must-agree echo failing, a different remedy, routed from the same runbook. SINCE STORY 2, ANY STRUCTURAL CHANGE RE-PUSHES: a join, leave, capability declaration or mute re-publishes to every handler and an unconfirmed push is re-sent, so a meeting with churn often clears on the next roster event - check whether the counter stopped moving before acting, and force a structural change only if the meeting is quiescent (there is still no periodic re-assert; story 4). An MC restart against a live handler is NOT counted here: MC adopts MH's generation as a floor and re-pushes above it, and records that on mc_media_policy_generation_adoptions_total instead - deliberately under no outcome label, so read that counter (and the adoption WARN at mc.register_meeting.trigger) alongside the split. A generation_mismatch with applied > sent that DOES reach this alert is a FAILED adoption or a higher echo after a confirm (e.g. the u64::MAX ratchet wedge) - not rollout noise. The selector is negated, so an outcome added later fires here rather than falling silently outside the alert."
          impact: "Participants in the affected meeting get no audio while the client stays connected and the UI reads healthy. Blast radius is per (meeting, handler), not fleet-wide. DO NOT RESTART MH as a remedy: it sheds every media session on the pod, recovers none of the already-dark ones, and destroys the evidence."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-15-media-generation-divergence"

      # ------------------------------------------------------------------
      # ADR-0031 block — MCKekRotationOverdue (story 2 task 9, R-12, R-26)
      #
      # WHAT IT MEANS: a departed participant still holds a working KEK and
      # the rotation that should have revoked it has not happened. A
      # CONFIDENTIALITY exposure, not media quality — which is why it pages.
      #
      # BARE GAUGE-VS-GAUGE, NO ARITHMETIC: both sides are published by MC
      # from the value its timer enforces, so W never appears in PromQL. The
      # rule DEPENDS ON LABEL-SET IDENTITY: `a > b` matches series with equal
      # label sets, so a label added to ONE of these two gauges silently
      # empties the comparison and the page never fires. Keep them in step.
      #
      # THRESHOLD PROVENANCE: the threshold is W x KEK_ROTATION_OVERDUE_MULTIPLIER
      # (= 2, compile-time asserted >= 2 in media_admission/rotation.rs).
      # Healthy pending age climbs to at most W plus rotation latency and
      # drops to 0 at each rotation, so a healthy steady state can never
      # reach 2W. At a multiplier of 1 it would reach the threshold just
      # before every rotation.
      #
      # DETECTION LATENCY, the accepted cost: 2W + for: 2m. At the W ceiling
      # of 300 s that is ~12 min after the oldest un-rotated departure,
      # against an R-12 promise of 5. So this page does NOT mean "W is about
      # to be missed"; it means W has already been exceeded by ~2x. Stated in
      # the `impact` annotation, which is what Alertmanager renders.
      #
      # PENDING AGE is a MAXIMUM across live meetings, sampled every 5 s from
      # times the meeting actors recorded — so a WEDGED actor still ages,
      # which is the case this exists for. It is cleared AT ROTATION, not on
      # push success: undelivered pushes are MCKekPushFailureRate's job.
      #
      # DEMONSTRATION (ADR-0036 §11, both halves): stall the rotation timer
      # and watch pending age cross the threshold gauge; the rule then fires.
      # ------------------------------------------------------------------
      - alert: MCKekRotationOverdue
        expr: |
          mc_meeting_kek_rotation_pending_age_seconds > mc_meeting_kek_rotation_overdue_threshold_seconds
        for: 2m
        labels:
          severity: page
          service: mc-service
          component: media-keys
        annotations:
          summary: "MC KEK rotation overdue: a departed participant still holds a working meeting KEK"
          description: "The oldest un-rotated departure in some meeting on {{ $labels.instance }} is older than twice the rotation window. Fork FIRST on mc_meeting_kek_rotation_failures_total{reason}: rng (overwhelmingly the likelier arm; CSPRNG failure, retried after W, confirm it clears) versus generation_exhausted (the meeting's u16 KEK generation is at its ceiling; permanent, this page will not clear until that meeting ends; effectively unreachable, ~22.7 days of uninterrupted rotation at the W floor). If NEITHER is moving, the rotation is not being attempted: suspect a wedged meeting actor and read mc_actor_mailbox_depth. Then confirm mc_meeting_kek_rotation_window_seconds matches the ConfigMap's MC_KEK_ROTATION_DEBOUNCE_SECONDS on this pod."
          impact: "CONFIDENTIALITY, not media quality: at least one departed participant still holds a KEK that opens every current participant's media in that meeting. When this fires the exposure bound W has ALREADY been exceeded by roughly 2x, for at least 2 minutes; it is not a leading indicator."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-19-kek-rotation-stalled"

  - name: mc-service-warning
    interval: 60s
    rules:
      # ====================================================================
      # WARNING ALERTS - Notify but don't page
      # ====================================================================

      - alert: MCHighMailboxDepthWarning
        expr: |
          sum by(actor_type) (mc_actor_mailbox_depth) > 100
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: actor-system
        annotations:
          summary: "MC mailbox depth elevated ({{ $labels.actor_type }}: {{ $value }})"
          description: "Actor {{ $labels.actor_type }} has mailbox depth {{ $value }} (>100) for 5 minutes. Investigate backpressure cause."
          impact: "Message processing delayed. May escalate if not addressed."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-1-high-mailbox-depth"

      - alert: MCHighMemory
        expr: |
          (
            container_memory_usage_bytes{container="mc-service"}
            /
            container_spec_memory_limit_bytes{container="mc-service"}
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          service: mc-service
          component: infrastructure
        annotations:
          summary: "MC memory usage high ({{ $value | humanizePercentage }})"
          description: "Meeting Controller pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }} for 10 minutes."
          impact: "Risk of OOM kill. May need to investigate memory usage or increase limits."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-7-resource-pressure"

      - alert: MCHighCPU
        expr: |
          rate(container_cpu_usage_seconds_total{container="mc-service"}[5m]) > 0.80
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: infrastructure
        annotations:
          summary: "MC CPU usage high ({{ $value | humanizePercentage }})"
          description: "Meeting Controller pod {{ $labels.pod }} CPU usage is {{ $value | humanizePercentage }} for 5 minutes."
          impact: "High CPU may increase message processing latency. Consider scaling horizontally."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-7-resource-pressure"

      - alert: MCLowConnectionCount
        expr: |
          sum(mc_connections_active) < 1 and sum(mc_meetings_active) > 0
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: webtransport
        annotations:
          summary: "MC has active meetings but no connections"
          description: "Meeting Controller has {{ $value }} active meetings but no WebTransport connections for 5 minutes."
          impact: "Meetings may be orphaned. Investigate connection issues."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-3-meeting-lifecycle-issues"

      - alert: MCGCHeartbeatWarning
        expr: |
          (
            sum(rate(mc_gc_heartbeats_total{status="error"}[5m]))
            /
            sum(rate(mc_gc_heartbeats_total[5m]))
          ) > 0.10
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: gc-integration
        annotations:
          summary: "MC-GC heartbeat failure rate elevated ({{ $value | humanizePercentage }})"
          description: "Meeting Controller heartbeat failures to Global Controller at {{ $value | humanizePercentage }} for 5 minutes."
          impact: "GC integration may be degraded. Investigate connectivity."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-6-gc-integration-failures"

      - alert: MCPodRestartingFrequently
        expr: |
          rate(kube_pod_container_status_restarts_total{container="mc-service"}[1h]) > 0.016
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: infrastructure
        annotations:
          summary: "MC pod {{ $labels.pod }} restarting frequently"
          description: "Pod {{ $labels.pod }} has restarted {{ $value }} times per hour. This may indicate crashes, OOM kills, or liveness probe failures."
          impact: "Service instability. Investigate logs for crash causes."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-4-complete-service-outage"

      - alert: MCCapacityWarning
        expr: |
          sum(mc_meetings_active) > 80
        for: 10m
        labels:
          severity: warning
          service: mc-service
          component: capacity
        annotations:
          summary: "MC approaching capacity ({{ $value }} active meetings)"
          description: "Meeting Controller has {{ $value }} active meetings, approaching capacity threshold."
          impact: "May need to scale out or reject new meetings soon."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-7-resource-pressure"

      - alert: MCHighJoinFailureRate
        expr: |
          (
            sum(rate(mc_session_joins_total{status="failure"}[5m]))
            /
            sum(rate(mc_session_joins_total[5m]))
          ) > 0.05
          and
          sum(rate(mc_session_joins_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: meeting-join
        annotations:
          summary: "MC session join failure rate high ({{ $value | humanizePercentage }})"
          description: "Session join failure rate is {{ $value | humanizePercentage }} for 5 minutes. Check 'Join Failures by Error Type' dashboard panel to determine root cause."
          impact: "Some users unable to join meetings via WebTransport. Investigate join failure types in MC Overview dashboard."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-8-join-failures"

      # ------------------------------------------------------------------
      # ADR-0031 block — MCKekPushFailureRate (story 2 task 9, R-26)
      #
      # WHAT IT MEANS: KEK pushes are not reaching members. SECURITY
      # RESIDUAL: a member whose push is not delivered never rotates its own
      # transmit keys, so a departed participant keeps opening THAT member's
      # media past W. This counter is the only control for it.
      #
      # NEGATED SELECTOR, deliberately: `outcome!~"delivered|participant_gone"`
      # excludes the success and the one benign outcome (a grace-period member
      # with no connection, which receives the current KEK on return), so any
      # outcome value added later fails CLOSED into this alert rather than
      # silently outside it. First paid off on `timed_out`.
      #
      # DENOMINATOR COMPLETENESS: every rostered recipient yields exactly one
      # outcome, including one that never answers (`timed_out`, emitted after
      # a 2 s deadline). Without that, a wedged recipient would leave BOTH the
      # numerator and the denominator and this ratio would get QUIETER as
      # participant actors wedged.
      #
      # NON-ZERO-DENOMINATOR GUARD on the same expression that forms the
      # denominator (alert-conventions.md). 1% / 10m is the story's figure,
      # not SLO-derived; there is no observed baseline.
      #
      # DEMONSTRATION: fill a participant's outbound channel and force a
      # rotation; `dropped_outbound` moves and the ratio crosses.
      # ------------------------------------------------------------------
      - alert: MCKekPushFailureRate
        expr: |
          (
            sum(rate(mc_meeting_kek_pushes_total{outcome!~"delivered|participant_gone"}[10m]))
            /
            sum(rate(mc_meeting_kek_pushes_total[10m]))
          ) > 0.01
          and
          sum(rate(mc_meeting_kek_pushes_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
          service: mc-service
          component: media-keys
        annotations:
          summary: "MC KEK pushes failing to reach meeting members ({{ $value | humanizePercentage }})"
          description: "More than 1% of MeetingKekUpdate pushes were neither delivered nor to a benign grace-period member, for 10 minutes. Split on the outcome label: dropped_outbound (the member's outbound channel was full or closed - a slow or wedged client connection), actor_unavailable (the participant actor exited or its mailbox closed - MCActorPanic territory), timed_out (no answer within 2s - read mc_actor_mailbox_depth, MCHighMailboxDepthCritical territory). Clients whose push failed drop frames as no_kek_for_generation, which is MCMediaMissingKeyMaterial's selector; that alert is a fleet-wide client ratio and cannot see a small population, so this is the small-denominator detector."
          impact: "Members that miss a KEK push cannot open frames under the new generation, and do not rotate their own transmit keys, so a departed participant can keep decrypting their media past the rotation window. There is NO re-push: an affected member recovers only at the next rotation or on a fresh join (page reload), so in a quiet meeting this does not clear on its own."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-16-missing-key-material"

      # ------------------------------------------------------------------
      # ADR-0031 block — MCKekRotationStorm (story 2 task 9, R-26)
      #
      # WHAT IT MEANS: leave-triggered rotations are happening faster than the
      # debounce allows — the debounce is not applying somewhere.
      #
      # POSITIVE SELECTOR `trigger="participant_left"`, NOT keyed on the
      # exhaustion arm. The 2/W threshold is derived ENTIRELY from the
      # debounce; `sender_space_exhausted` is exempt from the debounce and
      # bounded by one exhausted sender_id namespace per reset (size: the
      # allocator, crates/mc-service/src/media_admission/sender_id.rs), so it
      # can never approach 2/W and a
      # per-trigger series here would read as coverage while being unable to
      # fire. Its visibility is MCKekEpochResetOnSenderIdExhaustion below.
      # PARTITION — every trigger value must be classified into exactly one:
      #   participant_left       -> this rule
      #   sender_space_exhausted -> MCKekEpochResetOnSenderIdExhaustion (info)
      #   meeting_created        -> neither
      # A NEW value is silently unalerted until classified here — the one
      # place the KEK rules trade fail-closed for semantic honesty.
      #
      # THRESHOLD PROVENANCE: the debounce bounds each meeting to at most one
      # leave rotation per W, so the fleet AVERAGE per meeting is also <= 1/W.
      # Anything above that proves the debounce is broken fleet-wide. K = 2 is
      # margin. It is a fleet average, so it is DILUTED: it proves the
      # debounce is broken broadly, not that one meeting is.
      #
      # WINDOWS ALIGNED: the denominator is sum(avg_over_time(...[10m])), the
      # same ten minutes as the numerator's rate. Dividing by an instantaneous
      # meeting count fired ~25x over threshold on a synchronized fleet drain
      # (1000 meetings rotating then ending together) with nothing wrong.
      # avg_over_time over a RAW range vector, not a `[10m:]` subquery: no
      # subquery exists in any rule file, and a metric name inside new syntax
      # that dt-guard's extractor missed would pass silently (it fails open).
      # Precedent for this form: gc-alerts.yaml (absent_over_time). Per-pod
      # averaging over-estimates the denominator slightly when a pod joins or
      # leaves mid-window — the conservative direction for a warning.
      #
      # TWO CONJUNCTS WITH DIFFERENT JOBS — DO NOT MERGE:
      #   * `sum(avg_over_time(...)) > 0` is the non-zero-denominator guard,
      #     on the SAME expression that forms the denominator.
      #   * `and on() sum(mc_meetings_active) > 0` is a SANITY conjunct ("a
      #     live meeting exists now"), like MCLowConnectionCount's. A fully
      #     drained fleet still has rotations inside the window; without this
      #     it could fire with nothing to act on.
      #
      # `scalar(max(mc_meeting_kek_rotation_window_seconds))`: if that gauge is
      # ever absent the rule is silently non-evaluating (2/NaN is NaN, and
      # `vector > NaN` is false). Acceptable because MC sets it at boot and the
      # exporter has no idle_timeout — but a config gauge is load-bearing here.
      # ------------------------------------------------------------------
      - alert: MCKekRotationStorm
        expr: |
          (
            sum(rate(mc_meeting_kek_generated_total{trigger="participant_left"}[10m]))
            /
            sum(avg_over_time(mc_meetings_active[10m]))
          ) > 2 / scalar(max(mc_meeting_kek_rotation_window_seconds))
          and
          sum(avg_over_time(mc_meetings_active[10m])) > 0
          and on()
          sum(mc_meetings_active) > 0
        for: 10m
        labels:
          severity: warning
          service: mc-service
          component: media-keys
        annotations:
          summary: "MC leave-triggered KEK rotations exceed the debounce bound"
          description: "Leave-triggered KEK rotations per active meeting exceed twice 1/W, averaged over 10 minutes. The debounce limits each meeting to one leave rotation per W measured from its oldest un-rotated departure, so this is not reachable while it works: suspect the debounce, not the churn. Flapping clients cost join-path work, not extra leave rotations - read mc_meeting_sender_ids_issued_max for that."
          impact: "Every rotation pushes a new KEK to every member and makes every sender rotate its transmit keys; a storm multiplies control-plane and client key work across the fleet."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-17-kek-rotation-storm--flapping-participant"

      - alert: MCHighWebTransportRejections
        expr: |
          (
            sum(rate(mc_webtransport_connections_total{status="rejected"}[5m]))
            /
            sum(rate(mc_webtransport_connections_total[5m]))
          ) > 0.10
          and
          sum(rate(mc_webtransport_connections_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: meeting-join
        annotations:
          summary: "MC WebTransport rejection rate high ({{ $value | humanizePercentage }})"
          description: "WebTransport connection rejection rate is {{ $value | humanizePercentage }} for 5 minutes. May indicate capacity exhaustion or misconfigured clients."
          impact: "Users unable to establish WebTransport sessions. Check MC capacity and connection limits."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-9-webtransport-rejections"

      - alert: MCHighJwtValidationFailures
        expr: |
          (
            sum(rate(mc_jwt_validations_total{result="failure"}[5m]))
            /
            sum(rate(mc_jwt_validations_total[5m]))
          ) > 0.10
          and
          sum(rate(mc_jwt_validations_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: mc-service
          component: meeting-join
        annotations:
          summary: "MC JWT validation failure rate high ({{ $value | humanizePercentage }})"
          description: "JWT validation failure rate is {{ $value | humanizePercentage }} for 5 minutes. May indicate expired tokens, JWKS rotation issues, or token tampering."
          impact: "Users unable to authenticate for meeting join. Check AC service health and JWKS endpoint availability."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-10-jwt-validation-failures"

      # ====================================================================
      # MCMediaMissingKeyMaterial - client-side counter, MC-side remedy
      # ====================================================================
      #
      # THIS ALERT CAN FIRE. The client export path was proven end to end on
      # 2026-09-23: the full expression below, evaluated against live data
      # from sdk-core's built bundle through GC into Prometheus, returned
      # 0.286.
      #
      # THE FOUR PREMISES THIS ALERT RESTS ON, so the next reader can
      # re-falsify them instead of trusting that someone once checked:
      #   1. The collector SUMS same-identity delta datapoints from N browsers.
      #      VERSION-DEPENDENT: that is `delta_to_cumulative`, which the
      #      previously pinned collector did not ship. The image tag and the
      #      collector ConfigMap are one atomic rollback unit -- see
      #      docs/runbooks/gc-deployment.md §Rollback.
      #   2. GC's telemetry filter PASSES the `reason` key
      #      (crates/gc-service/src/services/telemetry_filter.rs).
      #   3. A Prometheus job scrapes the collector
      #      (`otel-collector` in infra/kubernetes/observability/prometheus.yml).
      #   4. `add_metric_suffixes: false` on the prometheus exporter, so the
      #      names below pass through VERBATIM as authored in TypeScript.
      # Premises 2 and 4 are now MECHANICALLY checked, not just narrated:
      # `dt-guard client-metrics-export` (rule 2, story 2 task 16) fails the
      # build if any dt_client_* name in a loaded rule is not exported by the
      # collector, or if any label this rule selects or groups on is not in the
      # collector's keep_keys. Rule 1 does the same for the labels the SDK
      # attaches. That replaces the old warning here that "nothing covers a
      # typo in this expression": a misspelled name now fails as
      # `dead_alert_reference`. Premises 1 and 3 are covered by the live
      # R-27 read-back (a real browser's series read back out of Prometheus
      # by the names in packages/web-app/e2e/clientMetricNames.ts).
      #
      # ABSENCE OF THIS ALERT IS NOT PROOF OF HEALTH. The series can vanish
      # without the alert firing: several controls on the collector's metrics
      # path drop client data BY DESIGN and all of them look identical to "no
      # browser is running", and there is no per-browser `up` signal and
      # structurally cannot be one (ADR-0036 §11 bars a per-session
      # service.instance.id). Triage ladder for a quiet series:
      # docs/runbooks/gc-deployment.md §When the client series go quiet.
      #
      # DENOMINATOR IS `received`, AND THAT IS THE ATTEMPTS SUM.
      # `received = accepted + sum(drops by reason)` is an accounting identity
      # held at the crypto/parse boundary, per client, and it survives N
      # senders unchanged with no sender split. So `received` IS the total and
      # the guard on it matches the ratio's own denominator. Denominating or
      # guarding on `accepted` would be the attempts-denominator inversion: in
      # a TOTAL key-delivery outage `accepted` goes to zero and the alert goes
      # silent at the moment the failure is complete.
      #
      # `for: 15m` AGAINST A rate(...[5m]) WINDOW IS DELIBERATE, and it is a
      # DOCUMENTED ANTI-SHAPE. alert-conventions.md says to match `for:` to
      # the rate() window. DO NOT "FIX" THIS TO 5m. Three of the four reasons
      # are EXPECTED transients at join and after every KEK rotation (ADR-0036
      # §11), so the `for:` window must outlast them; it does the
      # discriminating work that the threshold does not.
      #
      # THE SELECTOR (story 2 task 16) -- every client drop reason meaning "could
      # not open because of key delivery":
      #   no_kek_for_generation  newer generation than held: MC's push has not
      #                          arrived;
      #   kek_generation_stale   older than this client still retains;
      #   no_roster_entry        no usable identity key for the sender;
      #   unwrap_failed          JOINED IN TASK 16, BY DECISION. It is an
      #                          AUTHENTICATED frame (the signature covers the
      #                          wrap block and runs before unwrap, so transit
      #                          corruption is `signature_invalid`, never this)
      #                          whose KEK unwrap failed. Its causes are (a) sender
      #                          and receiver holding DIFFERENT KEK bytes under one
      #                          generation, which is a key-DISTRIBUTION split, (b) a
      #                          sender wrap/key-schedule bug, or (c) an
      #                          authenticated member emitting bad wraps. (a) is
      #                          this alert's subject. (b) and (c) produce the same
      #                          user symptom, and no other rule selects them, so
      #                          excluding the token would leave a receive-path
      #                          crypto failure that nothing watches.
      # Membership is a DECISION, never a pattern. `layer` names the processing
      # stage, not the remedy owner: unwrap_failed is layer=crypto and still
      # belongs here. The partition is MECHANICAL: dt-guard
      # client-metrics-export (G7) requires every `drops_frame: true` token in
      # proto/test-vectors/frame-v2.vectors.json to sit in EXACTLY ONE of this
      # alternation or its `NOT_KEY_DELIVERY` list
      # (crates/dt-guard/src/client_metrics_export.rs, which carries the
      # per-token reason, including sender_not_assigned = misrouting). A new
      # token therefore fails the build until someone classifies it. Do not
      # restate the exclusion reasons here; the const is their home.
      #
      # THRESHOLD, RE-DERIVED OVER THE FOUR-TOKEN SET AGAINST W (task 16):
      # 5% and `for: 15m` stand. The healthy steady state is a DUTY CYCLE:
      #   - no_kek_for_generation costs the KEK push SKEW between members on
      #     each rotation. Rotations are at most one per W per meeting, and W
      #     is at least MIN_KEK_ROTATION_DEBOUNCE_SECONDS
      #     (crates/mc-service/src/config.rs).
      #   - kek_generation_stale is ~0 while client retention (at least
      #     KEK_RETENTION_FLOOR_MS, packages/sdk-core/src/config/clientConfig.ts)
      #     far exceeds that skew.
      #   - no_roster_entry is join-only.
      #   - unwrap_failed has NO healthy transient: with a usable cached key
      #     the same mismatch is the non-dropping `wrap_key_id_mismatch`.
      # So the healthy ratio is about skew / W. Holding 5% for 15 minutes at
      # the W floor needs a skew of 5% of W on EVERY rotation, with a leave
      # every W for the whole window (that churn is MCKekRotationStorm's
      # subject). The story's "~25x margin" holds iff per-rotation push skew is
      # under 1/25 of that, i.e. 0.2% of W. THE SKEW IS UNMEASURED. Treat this
      # as a stated assumption, not a ratified number; if a deployment measures
      # a larger skew, re-derive here. Before the widening, the same argument
      # ran over two tokens. Widening a NUMERATOR over an unchanged denominator
      # only moves the ratio UP, and the added token contributes ~0 when
      # healthy, so the re-derivation leaves the number where it was.
      #
      # BLIND SPOT, AND ITS NAMED COMPENSATING CONTROL. This is a FLEET-WIDE
      # ratio: one client in a hundred whose KEK push always fails reads 1%
      # forever and never fires. The small-denominator detectors are MC's
      # per-recipient push counter (mc_meeting_kek_pushes_total{outcome},
      # alerted by MCKekPushFailureRate) and, for the unwrap split, the
      # client's conflicting_key refusal (MCClientKekConflictingKey below).
      #
      # AGGREGATED NUMERATOR, NOT `sum by(reason)`: the reasons share one
      # runbook scenario, and a per-reason instance would need
      # `/ on() group_left()` broadcasting for the denominator -- machinery
      # for no triage gain. The reason fork lives in Scenario 16.
      #
      # DEMONSTRATION (ADR-0036 §11, both halves): FIRE -- guard rule 2 proves
      # every name and label this expression reads survives the pipe. APPLY
      # -- a client series name read back out of Prometheus by a real browser
      # (the R-27 read-back, packages/web-app/e2e/multi-party-hear.spec.ts,
      # names from packages/web-app/e2e/clientMetricNames.ts).
      - alert: MCMediaMissingKeyMaterial
        expr: |
          (
            sum(rate(dt_client_media_frames_dropped_total{reason=~"no_kek_for_generation|kek_generation_stale|no_roster_entry|unwrap_failed"}[5m]))
            /
            sum(rate(dt_client_media_frames_received_total[5m]))
          ) > 0.05
          and
          sum(rate(dt_client_media_frames_received_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          service: mc-service
          component: media-keys
        annotations:
          summary: "Clients sustained-dropping media frames for missing key material ({{ $value | humanizePercentage }})"
          description: "Receiving clients cannot open frames because of key delivery, in four arms. no_kek_for_generation: the carried KEK generation is NEWER than any held, so MC's KEK push has not arrived. kek_generation_stale: the carried generation is OLDER than this client retains; retention derives from MC's rotation debounce, see Scenario 16 Arm 3 before touching MC_KEK_ROTATION_DEBOUNCE_SECONDS. no_roster_entry: there is no usable identity key for the sender. unwrap_failed: an authenticated frame whose KEK unwrap failed, i.e. a KEK-bytes split between sender and receiver, or a sender wrap bug. The first three are EXPECTED transiently at join and after a KEK rotation; unwrap_failed never is. 15 minutes sustained is the signal, and ADR-0036 §11 makes it the only signal for a join or rotation path that has silently stopped delivering keys. Split on the reason label FIRST: the arms have different remedies. This is a fleet-wide ratio and cannot see one client whose pushes fail; read mc_meeting_kek_pushes_total{outcome} for that. It fires on a client counter but lives here because the remedy is MC's KEK-and-roster delivery path."
          impact: "Affected participants hear nothing while every server-side signal reads healthy. MH never opens a frame and structurally cannot observe any of the four conditions. The no_roster_entry arm additionally means sender signature verification cannot run, so attribution is failing and not merely decryption."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-16-missing-key-material"

      # ====================================================================
      # Client key-lifecycle TRIPWIRES (story 2 task 16) -- MC-side remedy
      # ====================================================================
      #
      # Two client TRIPWIRE arms (near-zero, alerted on first occurrence; the
      # rebind arm is NOT zero-forever, see its causes) whose remedy is MC's KEK and roster
      # delivery path, so they live here, like MCMediaMissingKeyMaterial. The
      # third tripwire (retention violation) is an SDK regression and lives in
      # client-alerts.yaml. The `MCClient` prefix is the naming convention:
      # a client-origin series, an MC remedy (docs/observability/alert-conventions.md).
      #
      # SHAPE: PRESENCE, NOT increase(). The SDK exports a counter only in an
      # interval where it was recorded (DELTA temporality; OTel sdk-metrics'
      # DeltaMetricProcessor starts each collection from an empty map), so the
      # series is ABSENT until the first increment and first appears in
      # Prometheus already at >= 1. increase()/rate() need a prior sample and
      # never see that first event, and for a tripwire arm the first
      # event is the only one that matters. dt-guard client-metrics-export
      # (`tripwire_rate_wrapped`) fails the build if these names are ever
      # wrapped in increase()/rate(). That is a SHAPE guard. The claim that
      # "appears at 1, so sum > 0 fires" is UNVERIFIED BY EXECUTION, because no
      # PromQL-evaluating lane exists. The live demonstration is to trip the
      # counter once in a browser and watch the alert go pending.
      #
      # CLEARING: the alert clears on its own when the collector's prometheus
      # exporter drops the idle series after its `metric_expiration`
      # (infra/services/otel-collector/collector.yaml). Idle tabs do not hold
      # it up (they export nothing for an unrecorded arm). So "still firing"
      # is not "still happening", and a SECOND occurrence while firing is
      # invisible in the alert state; read the raw counter, which rises.
      # Silence proves nothing about the pipe (up{job="otel-collector"}).
      #
      # `for: 1m`, not 0m: validate_for_field accepts < 30s only with an
      # increase() window, which this shape deliberately lacks. It costs a
      # minute of latency and nothing else.
      #
      # EVERY KNOWN REASON THE COUNTER CAN BE NON-ZERO is listed per rule.
      # A newly observed legitimate cause is ADDED to that list. The rule is
      # never retired or silenced for it: the first legitimate-looking
      # increment is the exact event that tempts someone to retire a tripwire.
      #
      # DEMONSTRATION (ADR-0036 §11, both halves): FIRE -- the shape guard
      # plus the documented one-increment browser demo. APPLY -- guard rule 2
      # proves the name is exported and `outcome` is in keep_keys; the R-27
      # read-back proves the pipe carries client series.
      - alert: MCClientKekConflictingKey
        # Known non-zero causes (kekSource.ts, the `conflicting_key` arm):
        #   1. an MC defect delivering DIFFERENT bytes under a generation the
        #      client already holds, on a live connection;
        #   2. a compromised or misbehaving MC;
        #   3. a FUTURE SDK change adding reconnect that swaps keys on a live
        #      holder instead of starting a new session with a new holder.
        #      This is the most likely first legitimate-looking increment, and
        #      the fix is the SDK; never relax the refusal.
        # NOT causes: a stale tab or a reconnect race (the SDK has no
        # reconnect; one holder per session), or an equal-bytes redelivery
        # (`MeetingKekHolder.install` returns `already_held`, which is not a
        # refusal and is never counted). It is the SOLE observable witness of
        # its arm: the receive-side twin is unwrap_failed on peers, diluted
        # inside MCMediaMissingKeyMaterial's fleet ratio.
        expr: |
          sum(dt_client_media_kek_install_refusals_total{outcome="conflicting_key"}) > 0
        for: 1m
        labels:
          severity: warning
          service: mc-service
          component: media-keys
        annotations:
          summary: "A client refused conflicting KEK bytes under a generation it already held"
          description: "dt_client_media_kek_install_refusals_total{outcome=\"conflicting_key\"} is present: a client was handed different KEK bytes under a KEK generation it already holds, and kept the held key. Peers holding the other bytes drop that sender's frames as unwrap_failed. Causes: an MC KEK-issuance defect, a compromised MC, or an SDK change that reuses a key holder across sessions. The alert clears when the collector expires the idle series (metric_expiration), not when the condition stops. A second occurrence while firing shows only in the raw counter."
          impact: "Part of a meeting may be unable to open another member's media, with no server-side signal. Security-relevant: a same-generation key swap is exactly what the refusal exists to catch."
          runbook_url: "docs/runbooks/mc-incident-response.md#tripwire-conflicting-kek"

      - alert: MCClientRosterKeyRebind
        # Known non-zero causes (mediaMetrics.ts MEDIA_ROSTER_KEY_CHANGES, rosterKeys.ts):
        #   1. an MC defect in roster publication;
        #   2. a cache-poisoning attempt (route to security);
        #   3. a LOST ParticipantLeft (MC's roster try_send dropped under
        #      outbound backpressure) followed by an R-16 sender-id reissue,
        #      which reaches the client as a rebind.
        # Cause 3 has a NECESSARY condition: a sender-id-space-exhaustion KEK
        # epoch reset in that meeting, because an id is reissued ONLY under a
        # later generation (crates/mc-service/src/media_admission/epoch.rs,
        # "The invariant, stated once"). CHECK THAT FIRST:
        # the RAW counter sum(mc_meeting_kek_generated_total{trigger=
        # "sender_space_exhausted"}) > 0, with no range window (it covers MC's
        # process lifetime, which bounds every meeting). It is fleet-wide with no
        # meeting label: non-zero SUPPORTS cause 3, and only a fleet-wide zero
        # RULES IT OUT, leaving causes 1 and 2.
        # mc_participant_outbound_messages_dropped_total{payload_kind="participant_update_left"}
        # is SUPPORTING evidence only, read as the raw counter over MC's process
        # lifetime. The lost Left can precede the reissue by hours, so a
        # short-window zero rules NOTHING out. It is fleet-wide, so it never
        # confirms a single increment either.
        # Only the `rebind` arm is selected: `downgrade` is expected non-zero
        # and is panel-only (client-media.json).
        expr: |
          sum(dt_client_media_roster_key_rebinds_total{outcome="rebind"}) > 0
        for: 1m
        labels:
          severity: warning
          service: mc-service
          component: media-keys
        annotations:
          summary: "A client saw a sender id rebound to a different identity key"
          description: "dt_client_media_roster_key_rebinds_total{outcome=\"rebind\"} is present: a sender id the client had bound to one identity key arrived bound to a different one. Causes: an MC roster-publication defect, a cache-poisoning attempt, or a lost ParticipantLeft followed by a sender-id reissue. Check that third cause FIRST: it needs a sender-id-exhaustion epoch reset in that meeting (mc_meeting_kek_generated_total{trigger=\"sender_space_exhausted\"} or MCKekEpochResetOnSenderIdExhaustion). No reset rules it out. mc_participant_outbound_messages_dropped_total{payload_kind=\"participant_update_left\"} over MC's lifetime only supports it; a short-window zero proves nothing. The alert clears when the collector expires the idle series (metric_expiration), not when the condition stops. A second occurrence while firing shows only in the raw counter."
          impact: "Frames from the rebound sender may be attributed to the wrong identity or refused. Sender attribution is the property ADR-0036 §3 signatures exist to provide."
          runbook_url: "docs/runbooks/mc-incident-response.md#tripwire-roster-key-rebind"

      # ------------------------------------------------------------------
      # ADR-0031 block — meeting teardown on the media handlers
      # (story 2 task 12, R-20). A failed or skipped release leaves MH holding
      # the meeting's registration, routes and edge budget; since R-21 that
      # consumes the ENFORCED MH_MAX_REGISTERED_MEETINGS, so the cost is
      # progressive denial of NEW meetings on the handler, with no
      # client-visible cause until then. These rules see only teardowns MC
      # ATTEMPTED; a teardown that never happens (an MC crash) is an ABSENT
      # event. An edge-holding leaked meeting reaches mh-alerts.yaml's
      # MHMediaEgressEdgeHeadroomLow (LEAK fork); a ZERO-edge leaked
      # registration has no rule yet (docs/TODO.md §Observability Debt, "No
      # leading indicator for registered-meeting exhaustion").
      # ------------------------------------------------------------------
      # DELIBERATELY NO ALERT on mc_media_server_mute_requests_total,
      # mc_media_unmute_requests_total or mc_media_refusal_replies_suppressed_total
      # (story 2 task 12). A non-zero mute rate is healthy moderation, and the
      # refusal-side values (not_permitted, not_server_muted, suppressed replies)
      # are CLIENT-INFLATABLE by construction - one connection can drive them at
      # line rate. Recorded here so the absence reads as a decision, not an
      # omission; MH's server_muted drop reason records the same decision.
      - alert: MCEndMeetingOwnershipRejected
        # Fleet-contract-reads-zero-forever: MC only ever sends its own mc_id,
        # and releases only after GC can no longer re-assign the meeting id, so
        # a mismatch can only mean MC sent the wrong id. Present at zero from
        # process start, so a `> 0` rule is never silently inert.
        # The graceful-shutdown population (a successor already re-registered
        # the meeting) is its own value, superseded_by_successor, and is NOT
        # selected here: it is routine on rolling deploys. Do not widen this
        # selector to it.
        expr: |
          sum(increase(mc_media_end_meeting_total{outcome="rejected_ownership"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
          service: mc-service
          component: meeting-teardown
        annotations:
          summary: "MC released a meeting on a handler that says another MC owns it"
          description: "mc_media_end_meeting_total{outcome=\"rejected_ownership\"} rose: a handler answered EndMeeting with FAILED_PRECONDITION, i.e. the mc_id MC sent is not the one recorded for the meeting, on a teardown for a meeting that ENDED (the graceful-shutdown case is counted separately as superseded_by_successor). MC sends only its own id, so this is an MC defect, not an MH one. The mc.teardown ERROR line names the meeting and the handler."
          impact: "The handler keeps that meeting's registration, routes and edge budget until it restarts (the release was refused and is never retried)."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-20-meeting-teardown-failing--mh-budget-ratchet"

      - alert: MCEndMeetingFailureRate
        # Non-zero-denominator guard per docs/observability/alert-conventions.md.
        # THRESHOLD PROVENANCE: 5% is this task's figure, not SLO-derived; there
        # is no observed baseline (every release is new in story 2 task 12).
        #
        # BOTH SELECTORS ARE POSITIVE (`outcome=~`), NOT NEGATED, and that is
        # the catalog's standing rule for this family, not a style choice:
        # `docs/observability/metrics/mc-service.md` records that a negated
        # predicate is correct only where the SUCCESS set is closed and small,
        # and instructs that any harmonisation pass move predicates TO the
        # positive form. This metric's success set is demonstrably not closed —
        # it grew from {released} to {released, superseded_by_successor} inside
        # one devloop (story 2 task 12, O-24), and under a negated predicate
        # that new benign value would have silently joined the failure set and
        # paged on every rolling deploy. So an eighth outcome added later
        # defaults to NOT a failure and has to be classified deliberately.
        # THE CLASSIFICATION OBLIGATION LIVES AT THE ENUM: `EndMeetingOutcome`
        # in `crates/mc-service/src/media_routing/teardown.rs` names this rule
        # so a new variant is classified where it is added.
        #
        # `unimplemented` IS a failure here on purpose: it is an expected,
        # non-fatal rollout-order outcome, but it still leaks the meeting on
        # that handler, which is what this rule is about.
        #
        # `superseded_by_successor` is in NEITHER the numerator nor the
        # denominator. It leaks nothing (the successor MC owns the meeting), and
        # it arrives in BURSTS on every rolling deploy — left in the
        # denominator it would dilute the ratio exactly when deploys are
        # happening, which is the fail-quiet direction and would mask a real
        # failure during a rollout. So the rule reads: of the releases that were
        # ours to make, what fraction failed.
        expr: |
          (
            sum(rate(mc_media_end_meeting_total{outcome=~"rejected_ownership|unimplemented|unavailable_exhausted|invalid_argument|error"}[15m]))
            /
            sum(rate(mc_media_end_meeting_total{outcome=~"released|rejected_ownership|unimplemented|unavailable_exhausted|invalid_argument|error"}[15m]))
          ) > 0.05
          and
          sum(rate(mc_media_end_meeting_total{outcome=~"released|rejected_ownership|unimplemented|unavailable_exhausted|invalid_argument|error"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
          service: mc-service
          component: meeting-teardown
        annotations:
          summary: "MC meeting releases failing on media handlers ({{ $value | humanizePercentage }})"
          description: "More than 5% of the EndMeeting calls that were MC's to make (one per meeting per handler; superseded_by_successor is excluded from both numerator and denominator) did not release, for 15 minutes. Split on the outcome label: unimplemented (MH predates the RPC - rollout order was reversed; MH rolls forward first, MC rolls back first), unavailable_exhausted (MH unreachable - fix MH reachability), rejected_ownership (MC defect - see MCEndMeetingOwnershipRejected)."
          impact: "Each failed release leaves that meeting's registration and edge budget on the handler until it restarts; MH_MAX_REGISTERED_MEETINGS then ratchets toward refusing new meetings on that pod."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-20-meeting-teardown-failing--mh-budget-ratchet"

      - alert: MCPushQuiesceTimeouts
        # The leading indicator of the same ratchet: a teardown released
        # without confirming its pushes had drained. Clean denominator (both
        # outcomes are server-driven); `> 0` on the timeout cell, which is
        # zero-initialised so the rule is never silently inert.
        expr: |
          sum(increase(mc_media_push_quiesce_total{outcome="timed_out"}[30m])) > 0
        for: 0m
        labels:
          severity: warning
          service: mc-service
          component: meeting-teardown
        annotations:
          summary: "A meeting teardown released without its policy pushes draining"
          description: "mc_media_push_quiesce_total{outcome=\"timed_out\"} rose: a push worker was still mid-RegisterMeeting past push_quiesce_bound_seconds (MC's startup line), MC waited one more attempt window, then released anyway. A queued late apply is refused MH-side (mh_media_released_meeting_apply_refusals_total); a registration still in flight is only ORDERED by that wait, which fails open - confirm against the handler's mh_media_registered_meetings rather than assuming either outcome."
          impact: "Possibly one meeting's registration and edge budget re-created on a handler after its release, held until that handler restarts."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-20-meeting-teardown-failing--mh-budget-ratchet"

      - alert: MCTeardownFenceBackstop
        # Expected-empty; zero-initialised. Completion is reported from a Drop
        # guard on every exit of the teardown task, so this fires only for a
        # task that HUNG or vanished without unwinding. NOT mutually exclusive
        # with MCPushQuiesceTimeouts: a backstop WITHOUT a matching timeout is
        # a different fault (hung outside the drain).
        expr: |
          sum(increase(mc_media_teardown_fence_backstop_total[30m])) > 0
        for: 0m
        labels:
          severity: warning
          service: mc-service
          component: meeting-teardown
        annotations:
          summary: "A meeting teardown never reported completion; its fence was lifted by deadline"
          description: "mc_media_teardown_fence_backstop_total rose: a meeting's teardown task hung or died without unwinding, and the controller's fence for that meeting id expired so creates could proceed. A still-running release may land on the re-created meeting. For a meeting that ended (not a shutdown), GC is still told it ended on this path, so the id is re-assignable. Escalate on a repeat: every firing is also a meeting whose EndMeeting may never have gone out."
          impact: "Rejoins of that meeting were held until the deadline; one handler may hold a leaked registration."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-20-meeting-teardown-failing--mh-budget-ratchet"

      - alert: MCNotifyMeetingEndedFailing
        # A GC-coordination failure with a user-visible cost: GC keeps reusing
        # an ended meeting's assignment, and joins to it fail until MC restarts.
        expr: |
          sum(increase(mc_gc_notify_meeting_ended_total{status="error"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
          service: mc-service
          component: gc-coordination
        annotations:
          summary: "MC could not tell GC that a meeting ended"
          description: "mc_gc_notify_meeting_ended_total{status=\"error\"} rose. The notify is sent at most once for anything GC may have processed, so an error is final: GC keeps the ended meeting's assignment live, reuses it for the next join, and MC answers meeting_not_found. The mc.grpc.gc_client ERROR line names the meeting."
          impact: "Joins to the affected meeting id fail with meeting_not_found until MC restarts or is marked unhealthy."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-20-meeting-teardown-failing--mh-budget-ratchet"

      - alert: MCMeetingEndedNotificationsDropped
        expr: |
          sum(increase(mc_gc_meeting_ended_notifications_dropped_total[15m])) > 0
        for: 0m
        labels:
          severity: warning
          service: mc-service
          component: gc-coordination
        annotations:
          summary: "MC dropped meeting-ended notifications before sending them"
          description: "mc_gc_meeting_ended_notifications_dropped_total rose: MC's notify queue was full, so a meeting's end was never reported to GC. Expected-empty (the queue is sized far above any burst): this is MC losing events, not GC being down."
          impact: "GC keeps each affected meeting's assignment live; joins to those meeting ids fail until MC restarts."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-20-meeting-teardown-failing--mh-budget-ratchet"

  - name: mc-service-info
    interval: 60s
    rules:
      # ====================================================================
      # INFO ALERTS - Log only, no notification
      # ====================================================================

      # ------------------------------------------------------------------
      # ADR-0031 block — MCKekEpochResetOnSenderIdExhaustion (story 2 task 9, R-16)
      #
      # REPLACES the retired MCSenderIdSpaceExhausted. That rule's
      # `sender_id_space_exhausted` join-failure label is never emitted again,
      # and its "NOT SELF-CLEARING" annotation would now be the OPPOSITE of
      # true: exhaustion triggers an immediate KEK-epoch reset (new KEK, fresh
      # namespace excluding every bound id) and the join SUCCEEDS.
      #
      # SAME SHAPE as the retired rule — 15m increase, `for: 0m` — whose
      # reasoning still holds ("the 15m increase window already smooths, the
      # condition cannot flap"). But the CONCLUSION it drew is inverted: it
      # argued a `for:` delay "would only postpone paging on an
      # already-irreversible state". The state is no longer irreversible, which
      # is exactly why this is INFO and pages nobody. `for: 0m` satisfies the
      # guard floor via the expr window, not `for:`.
      #
      # WHY IT EXISTS AT ALL: exhausting a sender_id namespace (size: the
      # allocator, crates/mc-service/src/media_admission/sender_id.rs) in one
      # meeting is not reachable by human churn — it means a flapping client or a scripted join loop.
      # MC still has no join rate limit and no `jti` replay check
      # (docs/TODO.md §Media Path Obligations), so this is the trip-wire for
      # a driven cause. Read mc_meeting_sender_ids_issued_max.
      #
      # DEPLOY COUPLING: these rules self-roll (configMapGenerator); the MC
      # image does not. Retire with-or-after the image, restore with-or-before
      # any image rollback — a pre-R-16 image under these rules would refuse
      # admissions at exhaustion with NOTHING firing (mc-deployment.md).
      # ------------------------------------------------------------------
      - alert: MCKekEpochResetOnSenderIdExhaustion
        expr: |
          increase(mc_meeting_kek_generated_total{trigger="sender_space_exhausted"}[15m]) > 0
        for: 0m
        labels:
          severity: info
          service: mc-service
          component: media-keys
        annotations:
          summary: "A meeting exhausted its sender_id namespace and MC reset its KEK epoch"
          description: "A meeting consumed its sender_id namespace (size set by the allocator, crates/mc-service/src/media_admission/sender_id.rs; progress on mc_meeting_sender_ids_issued_max) and MC performed an immediate KEK-epoch reset: a new KEK plus a fresh namespace excluding every bound id. Admission SUCCEEDED; the meeting is recovering on its own. Do NOT end the meeting. Human churn does not reach this: treat it as a possibly DRIVEN cause (a flapping client or a scripted join loop). Identify the meeting from the MC log record 'sender_id namespace exhausted; KEK epoch reset and reissue'."
          impact: "None to availability. Security-relevant as a signal: one authenticated participant can drive this cheaply because MC has no join rate limit."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-17-kek-rotation-storm--flapping-participant"

      - alert: MCHighJoinLatency
        expr: |
          histogram_quantile(0.95,
            sum by(le) (rate(mc_session_join_duration_seconds_bucket{status="success"}[5m]))
          ) > 2.0
        for: 5m
        labels:
          severity: info
          service: mc-service
          component: meeting-join
        annotations:
          summary: "MC session join p95 latency high ({{ $value }}s > 2s)"
          description: "Session join p95 latency is {{ $value }}s, exceeding 2s threshold for 5 minutes. MC SLO is p99 <500ms, so p95 >2s is a leading indicator of degradation. Note: info severity because this tracks join-specific latency, which is separate from the processing SLO. There is NO aggregate latency page alert - the processing SLO has no alert rule today, so do not read this note as saying something else already covers it."
          impact: "Slow meeting join experience. Investigate JWT validation, actor processing, and WebTransport session setup latency."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-5-high-latency"
