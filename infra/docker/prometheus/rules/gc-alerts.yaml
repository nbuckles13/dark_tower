# Prometheus alerting rules for Global Controller
#
# Severity levels (per docs/observability/alert-conventions.md):
# - page: User-visible impact now or SLO burn; pages oncall immediately (PagerDuty)
# - warning: Degraded but contained, or approaching limits; Slack notify, business hours
# - info: Awareness/trend/leading indicator; no notification, dashboards only
#
# All alerts link to sections in the consolidated incident response runbook:
# docs/runbooks/gc-incident-response.md

groups:
  - name: gc-service-page
    interval: 30s
    rules:
      # ====================================================================
      # PAGE ALERTS - User-visible impact or SLO burn; page oncall immediately
      # ====================================================================

      - alert: GCDown
        expr: |
          up{job="gc-service"} == 0
        for: 1m
        labels:
          severity: page
          service: gc-service
          component: infrastructure
        annotations:
          summary: "Global Controller service is down"
          description: "Global Controller has no running pods for 1 minute. All meeting join requests are failing."
          impact: "Users cannot join meetings. Complete service outage."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-4-complete-service-outage"

      - alert: GCHighErrorRate
        expr: |
          (
            sum(rate(gc_http_requests_total{status_code=~"[45].."}[5m]))
            /
            sum(rate(gc_http_requests_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: page
          service: gc-service
          component: http
        annotations:
          summary: "GC error rate above SLO ({{ $value | humanizePercentage }})"
          description: "Global Controller error rate is {{ $value | humanizePercentage }}, exceeding 1% SLO threshold for 5 minutes. This violates the 99.9% availability SLO."
          impact: "Increased user errors. Error budget burning rapidly."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-5-high-error-rate"

      - alert: GCHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by(le) (rate(gc_http_request_duration_seconds_bucket[5m]))
          ) > 0.200
        for: 5m
        labels:
          severity: page
          service: gc-service
          component: http
        annotations:
          summary: "GC p95 latency above SLO ({{ $value }}s > 200ms)"
          description: "Global Controller p95 HTTP latency is {{ $value }}s, exceeding 200ms SLO for 5 minutes."
          impact: "Slow user experience during meeting join. SLO violation."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-2-high-latency--slow-responses"

      # POPULATION CAVEAT (R-6, 2026-09-24): this p95 is unfiltered and the underlying histogram
      # is bimodal. The assignment reuse path is much faster than the new-assignment path and
      # both emit status="success", with no label separating them. New assignments are ~1/N of
      # joins for an N-participant meeting, so above mean meeting size ~20 they fall below the
      # p95 cut and this rule cannot fire on new-assignment slowness. Do NOT tighten the 20ms
      # threshold against the diluted population — that yields a rule that looks tighter and
      # detects less. Analysis: docs/observability/metrics/gc-service.md "Population note (R-6)".
      # Fix tracked: docs/TODO.md §Observability Debt.
      - alert: GCMCAssignmentSlow
        expr: |
          histogram_quantile(0.95,
            sum by(le) (rate(gc_mc_assignment_duration_seconds_bucket[5m]))
          ) > 0.020
        for: 5m
        labels:
          severity: page
          service: gc-service
          component: mc-assignment
        annotations:
          summary: "MC assignment p95 latency above SLO ({{ $value }}s > 20ms)"
          description: "MC assignment latency is {{ $value }}s, exceeding 20ms SLO for 5 minutes. This is the critical path for meeting joins."
          impact: "Slow meeting join experience. May indicate MC capacity or database issues."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-3-mc-assignment-failures"

      - alert: GCDatabaseDown
        expr: |
          (
            sum(rate(gc_db_queries_total{status="error"}[1m]))
            /
            sum(rate(gc_db_queries_total[1m]))
          ) > 0.5
        for: 1m
        labels:
          severity: page
          service: gc-service
          component: database
        annotations:
          summary: "GC database connection failure ({{ $value | humanizePercentage }} error rate)"
          description: "Global Controller cannot connect to PostgreSQL. Database query error rate is {{ $value | humanizePercentage }} for 1 minute."
          impact: "All GC operations failing. Complete service outage."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-1-database-connection-failures"

      - alert: GCErrorBudgetBurnRateCritical
        expr: |
          (
            sum(rate(gc_http_requests_total{status_code=~"[45].."}[1h]))
            /
            sum(rate(gc_http_requests_total[1h]))
          ) / 0.001 > 10
        for: 1h
        labels:
          severity: page
          service: gc-service
          component: slo
        annotations:
          summary: "GC error budget burning at {{ $value }}x rate"
          description: "Error budget is burning at {{ $value }}x the sustainable rate. At this rate, the 30-day error budget will be exhausted in less than 3 days."
          impact: "SLO at risk. Urgent investigation required."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-5-high-error-rate"

      - alert: GCMeetingCreationStopped
        expr: |
          sum(rate(gc_meeting_creation_total[15m])) == 0
          and
          sum(rate(gc_meeting_creation_total[15m] offset 1h)) > 0
        for: 15m
        labels:
          severity: page
          service: gc-service
          component: meeting-creation
        annotations:
          summary: "Meeting creation traffic has stopped"
          description: "No meeting creation requests in the last 15 minutes, but there was traffic in the prior hour. This may indicate a service issue or routing problem. Note: expected detection delay is ~30 minutes (15m rate window + 15m for clause)."
          impact: "Users cannot create meetings. Investigate GC health, routing, and upstream dependencies."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-4-complete-service-outage"

      # OPS-14 dual-end coupling (counter-zero-init devloop). The
      # `absent_over_time(gc_telemetry_ingest_total[15m])` clause below detects a
      # restarted pod that received NO telemetry since restart by the series being
      # ABSENT. Because of this, `gc_telemetry_ingest_total` is deliberately
      # `Zero-init: exempt` in docs/observability/metrics/gc-service.md and must
      # NOT be added to any `zero_initialize_counters()` entrypoint: present-at-0
      # would make the series always present and silently defeat this clause (a
      # freshly-restarted pod also has no `[1h] offset 15m` baseline for the
      # fallback). Change one end and you must change the other.
      - alert: GCTelemetryProxySilent
        expr: |
          (
            sum(rate(gc_telemetry_ingest_total[15m])) == 0
            and
            sum(increase(gc_telemetry_ingest_total[1h] offset 15m)) > 0
          )
          or
          (
            absent_over_time(gc_telemetry_ingest_total[15m])
            and on()
            (sum(increase(gc_telemetry_ingest_total[1h] offset 15m)) > 0)
          )
        for: 5m
        labels:
          severity: page
          service: gc-service
          component: telemetry-proxy
        annotations:
          summary: "Telemetry ingest has gone silent despite recent baseline traffic"
          description: "No telemetry ingest events for 15+ minutes, but events flowed during the baseline hour before that. Covers both silence shapes: flat counters (pod alive, client traffic stopped — client reachability, CORS, or auth breakage) and absent series (pod restarted and no telemetry arrived since; a rolling restart in a low-traffic environment is a known benign trigger — check the deploy timeline first). Expected detection delay is ~20 minutes for the flat shape (15m rate window + 5m for clause). The alert can auto-resolve after ~1h15m of continuous silence as the baseline window drains — resolution is not recovery; verify ingest rate is non-zero before closing."
          impact: "Total loss of client-side observability. May be the leading indicator of client-facing breakage (CORS, ingress, auth) the server cannot otherwise see. Check user-facing traffic immediately."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-11-telemetry-ingest-silent"

      # ------------------------------------------------------------------
      # ADR-0031 block — GCMhRegistrationPingPong (story 4 OBS-ALERTS;
      # security's ping-pong signature, telemetry contract §Alerts PAGE;
      # ADR-0039 §7)
      #
      # WHAT IT MEANS: two LIVE MH processes share one client-facing address
      # and evict each other's registration. Provisioning broke the
      # one-process-per-address rule (the hostPort lock was defeated, almost
      # always by a force-delete). Handler identity is self-asserted (shared MH
      # OAuth client), so the second process may also be anything presenting
      # the MH service credential - do not read it as purely a misconfiguration.
      #
      # DERIVATION (re-derive if the load-report interval changes):
      #   - Ping-pong evicts at the MH->GC load-report cadence. GC owns it and
      #     pushes it at registration: ANCHOR (DRY): gc_mh_load_report_interval_seconds
      #     (GC_MH_LOAD_REPORT_INTERVAL_MS, default 10 s). Each live process
      #     re-registers once on a NOT_FOUND load report, so the pair causes
      #     about 2 supersedes and 2 unknown_handler reports per interval:
      #     about 120 per 10m at 10 s.
      #   - A dead process never load-reports, so routine in-place crash
      #     restarts (each a `superseded`, match=both) never move
      #     unknown_handler, AT ANY FLEET SIZE: the conjunction is fleet-size
      #     independent. Kubelet CrashLoopBackOff caps a looping pod at about
      #     1 supersede per 5m after a short burst.
      #   - The `superseded` floor of 20 only rejects a one-off duplicate, which
      #     GCMhUnknownHandlerLoadReports already warns on.
      #   - VALIDITY RANGE: holds while the interval is <= ~30 s (>= 40
      #     supersedes per 10m, twice the floor). Config allows up to 60 s
      #     (MAX_MH_LOAD_REPORT_INTERVAL_MS), where the rate sits ON the floor:
      #     re-derive before raising the interval past 30 s. env-test 33 asserts
      #     every live GC replica's interval is within this bound.
      # `sum()` across GC replicas is correct: each RegisterMH increments on
      # exactly one replica. No identity labels (`match` is summed away).
      # ------------------------------------------------------------------
      - alert: GCMhRegistrationPingPong
        expr: |
          sum(increase(gc_mh_registrations_total{outcome="superseded"}[10m])) >= 20 and sum(increase(gc_mh_load_reports_total{outcome="unknown_handler"}[10m])) >= 3
        for: 10m
        labels:
          severity: page
          service: gc-service
          component: mh-registry
        annotations:
          summary: "Two live media handlers are evicting each other's registration"
          description: "In 10 minutes GC superseded at least 20 MH registrations AND received at least 3 load reports from handlers it has no row for, sustained for 10 minutes. A dead process never load-reports, so routine crash restarts cannot produce this: two LIVE processes share one address and evict each other at the load-report cadence (gc_mh_load_report_interval_seconds). Provisioning broke the one-process-per-address rule (usually a force-deleted MH pod whose process kept running) - or a second process is presenting the MH service credential. Find the duplicate MH on that slot (mh.sh list --json, pods by node) and retire it; do not touch GC."
          impact: "The affected address's handler flaps in and out of GC's registry: replacements and new meetings may be granted a handler that is evicted moments later, and its meetings migrate repeatedly."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-14-two-live-media-handlers-on-one-address"

  - name: gc-service-warning
    interval: 60s
    rules:
      # ====================================================================
      # WARNING ALERTS - Notify but don't page
      # ====================================================================

      - alert: GCHighMemory
        expr: |
          (
            container_memory_usage_bytes{container="gc-service"}
            /
            container_spec_memory_limit_bytes{container="gc-service"}
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          service: gc-service
          component: infrastructure
        annotations:
          summary: "GC memory usage high ({{ $value | humanizePercentage }})"
          description: "Global Controller pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }} for 10 minutes."
          impact: "Risk of OOM kill. May need to increase memory limits or investigate leak."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-6-resource-pressure"

      - alert: GCHighCPU
        expr: |
          rate(container_cpu_usage_seconds_total{container="gc-service"}[5m]) > 0.80
        for: 5m
        labels:
          severity: warning
          service: gc-service
          component: infrastructure
        annotations:
          summary: "GC CPU usage high ({{ $value | humanizePercentage }})"
          description: "Global Controller pod {{ $labels.pod }} CPU usage is {{ $value | humanizePercentage }} for 5 minutes."
          impact: "High CPU may increase latency. Consider scaling horizontally."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-6-resource-pressure"

      # ANCHOR (DRY): the description below names rejection_reason values as triage
      # examples — source of truth is the terminal match in
      # crates/gc-service/src/services/mc_assignment.rs (illustrative, not a complete
      # enumeration; the complete mirrors are the catalog, runbook legend, and alerts.md).
      - alert: GCMCAssignmentFailures
        expr: |
          (
            sum(rate(gc_mc_assignments_total{status!="success"}[5m]))
            /
            sum(rate(gc_mc_assignments_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          service: gc-service
          component: mc-assignment
        annotations:
          summary: "MC assignment failure rate high ({{ $value | humanizePercentage }})"
          description: "MC assignment failures are {{ $value | humanizePercentage }} for 5 minutes. Break down by `rejection_reason` FIRST (`sum by(rejection_reason) (increase(gc_mc_assignments_total{status!=\"success\"}[5m]))`): at_capacity/unhealthy/no_mcs_available point at MC capacity or connectivity; `commit_budget_exceeded` points at GC->database latency (do not scale MCs); `invalid_request` is a GC-side contract violation (GC sent a malformed request), NOT a fleet problem — do not scale MCs, follow the runbook's invalid_request branch and escalate to the GC owner."
          impact: "Some users unable to join meetings. Triage by rejection_reason: MC health/capacity for most reasons, but invalid_request is a GC bug."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-3-mc-assignment-failures"

      - alert: GCDatabaseSlow
        expr: |
          histogram_quantile(0.99,
            sum by(le) (rate(gc_db_query_duration_seconds_bucket[5m]))
          ) > 0.050
        for: 5m
        labels:
          severity: warning
          service: gc-service
          component: database
        annotations:
          summary: "GC database queries slow (p99: {{ $value }}s > 50ms)"
          description: "Database query p99 latency is {{ $value }}s, exceeding 50ms threshold for 5 minutes."
          impact: "Slow database queries may cause HTTP latency SLO violations. Investigate slow queries."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-1-database-connection-failures"

      - alert: GCTokenRefreshFailures
        expr: |
          (
            sum(rate(gc_token_refresh_total{status="error"}[5m]))
            /
            sum(rate(gc_token_refresh_total[5m]))
          ) > 0.10
        for: 5m
        labels:
          severity: warning
          service: gc-service
          component: auth
        annotations:
          summary: "GC token refresh failure rate high ({{ $value | humanizePercentage }})"
          description: "Token refresh failures are {{ $value | humanizePercentage }} for 5 minutes. GC may lose ability to call MC/MH if token expires."
          impact: "Risk of authentication failures for GC->MC/MH calls. Check AC service health."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-7-token-refresh-failures"

      - alert: GCErrorBudgetBurnRateWarning
        expr: |
          (
            sum(rate(gc_http_requests_total{status_code=~"[45].."}[6h]))
            /
            sum(rate(gc_http_requests_total[6h]))
          ) / 0.001 > 5
        for: 6h
        labels:
          severity: warning
          service: gc-service
          component: slo
        annotations:
          summary: "GC error budget burning at {{ $value }}x rate"
          description: "Error budget is burning at {{ $value }}x the sustainable rate for 6 hours. At this rate, the 30-day error budget will be exhausted in less than 6 days."
          impact: "SLO at risk if trend continues. Investigate error causes."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-5-high-error-rate"

      - alert: GCPodRestartingFrequently
        expr: |
          rate(kube_pod_container_status_restarts_total{container="gc-service"}[1h]) > 0.016
        for: 5m
        labels:
          severity: warning
          service: gc-service
          component: infrastructure
        annotations:
          summary: "GC pod {{ $labels.pod }} restarting frequently"
          description: "Pod {{ $labels.pod }} has restarted {{ $value }} times per hour. This may indicate crashes, OOM kills, or liveness probe failures."
          impact: "Service instability. Investigate logs for crash causes."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-4-complete-service-outage"

      - alert: GCMeetingCreationFailureRate
        expr: |
          (
            sum(rate(gc_meeting_creation_total{status="error"}[5m]))
            /
            sum(rate(gc_meeting_creation_total[5m]))
          ) > 0.05
          and
          sum(rate(gc_meeting_creation_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: gc-service
          component: meeting-creation
        annotations:
          summary: "Meeting creation failure rate high ({{ $value | humanizePercentage }})"
          description: "Meeting creation failure rate is {{ $value | humanizePercentage }} for 5 minutes. Break down by `error_type` on the 'Meeting Creation Failures by Type' panel and follow the cause table in the runbook. These values are not interchangeable: capacity exhaustion, organization-state faults and role denial have different causes and different owners."
          impact: "Some users unable to create meetings. Investigate error types in dashboard."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-8-meeting-creation-limit-exhaustion"

      # Organization-state refusals (R-6). Steady state for this series is zero:
      # no code path deactivates or deletes an organization, and AC will not mint
      # a token for an inactive org, so a valid token naming a missing/inactive
      # org means GC and AC disagree about database state.
      #
      # Window derivation (SSoT coupling — NOT mechanically guarded):
      #   `for: 15m` must stay BELOW the maximum lifetime of the condition, which
      #   is bounded by AC's access-token TTL — `TOKEN_EXPIRY_SECONDS = 3600` at
      #   `crates/ac-service/src/services/token_service.rs:18` — plus the 1h
      #   `increase()` window. An earlier draft used `for: 2h`, which EXCEEDS that
      #   ceiling and was therefore unsatisfiable by construction: it would have
      #   passed the alert guard and never fired. If the token TTL is ever
      #   shortened, re-check this clause. Nothing enforces this coupling; see
      #   `docs/TODO.md` §Observability Debt (alert-rule unit tests).
      #
      # This rule has no automated exerciser — the repo has no `promtool test
      # rules` harness — so its silence is NOT evidence that it works.
      #
      # NOTE (counter-visibility fix, 2026-09-10): before `gc_meeting_creation_failures_total`
      # was present-at-zero from process start, this rule could not have fired AT
      # ALL — the series was born at 1 on its first event with no `0→1` edge for
      # `increase()` to measure. That is what this PR repaired; a first firing
      # after deploy is the fix working, not a spurious page.
      - alert: GCMeetingCreationOrgStateInvalid
        expr: |
          sum(increase(gc_meeting_creation_failures_total{error_type=~"org_inactive|org_not_provisioned"}[1h])) > 0
        for: 15m
        labels:
          severity: warning
          service: gc-service
          component: meeting-creation
        annotations:
          summary: "GC refused meeting creation for organization-state reasons ({{ $value }} in the last hour)"
          description: "Meeting creation was refused because the caller's organization is inactive (`org_inactive`) or absent (`org_not_provisioned`), rather than because its meeting cap is full. Steady state for this series is zero — no code path deactivates or deletes an organization — so any occurrence means a valid token references organization state GC cannot see. Check in this order: a database volume reset (the seeded org is re-created with a fresh org_id while pre-reset tokens carry the old one), GC and AC configured against different databases, a restore, then out-of-band SQL. This rule fires on a SINGLE occurrence; the 15m `for` clause debounces scrape flapping and does not require repeated events. Expected detection delay ~15m. The healthy reading is 0, not absent: this series is present-at-zero from process start, so a 0→1 edge exists for increase() to see. Absence now means the series stopped being exported — pod down, scrape broken, or the metric or label renamed — and is itself worth investigating."
          impact: "Affected callers cannot create meetings. `org_not_provisioned` returns 500 and so also counts toward the aggregate HTTP error-rate SLO alerts; `org_inactive` returns 403. A rate that does not decay within roughly an hour indicates an ongoing divergence rather than the tail of expiring tokens."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-8-meeting-creation-limit-exhaustion"

      - alert: GCMeetingCreationLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by(le) (rate(gc_meeting_creation_duration_seconds_bucket[5m]))
          ) > 0.500
        for: 5m
        labels:
          severity: warning
          service: gc-service
          component: meeting-creation
        annotations:
          summary: "Meeting creation p95 latency high ({{ $value }}s > 500ms)"
          description: "Meeting creation p95 latency is {{ $value }}s, exceeding 500ms threshold for 5 minutes. This may indicate slow database queries or code generation issues. Note: 500ms threshold is higher than the 200ms aggregate HTTP SLO because meeting creation involves DB writes, CSPRNG code generation, and atomic limit-check CTE. The aggregate GCHighLatency alert covers SLO violations."
          impact: "Slow meeting creation experience. Investigate database and handler performance."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-2-high-latency--slow-responses"

      - alert: GCHighJoinFailureRate
        expr: |
          (
            sum(rate(gc_meeting_join_total{status="error"}[5m]))
            /
            sum(rate(gc_meeting_join_total[5m]))
          ) > 0.05
          and
          sum(rate(gc_meeting_join_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: gc-service
          component: meeting-join
        annotations:
          summary: "Meeting join failure rate high ({{ $value | humanizePercentage }})"
          description: "Meeting join failure rate is {{ $value | humanizePercentage }} for 5 minutes. Check 'Meeting Join Failures by Type' dashboard panel to determine root cause. mc_assignment errors → Scenario 3 (MC assignment), ac_request errors → check AC service health (Scenario 7), not_found errors → check meeting lookup and database."
          impact: "Some users unable to join meetings. Investigate error types in dashboard."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-3-mc-assignment-failures"

      - alert: GCTelemetryProxyHighRejectionRate
        expr: |
          (
            sum(rate(gc_telemetry_ingest_total{status=~"rejected_.*|error"}[10m]))
            /
            sum(rate(gc_telemetry_ingest_total[10m]))
          ) > 0.10
          and
          sum(rate(gc_telemetry_ingest_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
          service: gc-service
          component: telemetry-proxy
        annotations:
          summary: "Telemetry proxy rejection rate high ({{ $value | humanizePercentage }})"
          description: "Telemetry ingest rejection rate is {{ $value | humanizePercentage }} for 10 minutes, above the 10% threshold. Triage on the telemetry counter's own status values first: rejected_size / rejected_rate point at a broken or abusive client; error aggregates client-fault decode/content-type failures (HTTP 400/415) and collector-fault forwarding failures (HTTP 502/503) — split via the paired HTTP status codes in the runbook. The telemetry routes have their own endpoint label values on gc_http_requests_total (/api/v1/telemetry/v1/metrics and /api/v1/telemetry/v1/traces)."
          impact: "Client telemetry is being dropped — degraded client-side observability. If the error status dominates with 502/503, the collector path is failing and accepted telemetry may not be forwarding either."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-10-telemetry-proxy-high-rejection-rate"

      # ====================================================================
      # STORY 4 — MH REGISTRY AND REPLACEMENT WARNINGS (OBS-ALERTS; telemetry
      # contract §Alerts WARNING; ADR-0039 §3, §7)
      # ====================================================================
      # Shared ADR-0031 block. Authored by observability, global-controller
      # reviews (ADR-0031 owner), operations owns the runbook targets. Every
      # selected series is zero-initialised over its outcome set at GC boot,
      # so `increase(...) > 0` is never silently inert. Fleet sums with no
      # identity grouping (replacement requests' trigger and gc_view are summed
      # away). No alert on gc_view or on the gc.mh.replacement_report evidence:
      # dashboard and log only (gc Scenario 15, gray failure).

      # GCMhUnknownHandlerLoadReports — any increase. A dead process never
      # reports, so ANY unknown_handler means a process GC has no row for is
      # ALIVE: a live duplicate on one address (the evicted side of a
      # ping-pong), a lost registry, or a live MH whose row was
      # retention-deleted. Handler identity is self-asserted (shared MH OAuth
      # client): a duplicate may be a second process presenting the MH
      # credential, not only a misconfiguration. Fail loud.
      - alert: GCMhUnknownHandlerLoadReports
        expr: |
          sum(increase(gc_mh_load_reports_total{outcome="unknown_handler"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
          service: gc-service
          component: mh-registry
        annotations:
          summary: "GC received load reports from a media handler it has no registration for"
          description: "gc_mh_load_reports_total{outcome=\"unknown_handler\"} rose: GC answered NOT_FOUND to a load report. A dead process never reports, so a process GC has no row for is ALIVE: a live duplicate on one address (the evicted side of a ping-pong; see GCMhRegistrationPingPong), a lost registry, or a live MH whose row was retention-deleted. Handler identity is self-asserted, so a duplicate may be a second process presenting the MH service credential, not only a misconfiguration. The MH re-registers on its own; find out why its row was missing."
          impact: "That handler is unselectable until it re-registers; if two processes share the address, they will keep evicting each other."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-14-two-live-media-handlers-on-one-address"

      # ------------------------------------------------------------------
      # GCMhAddressConflictPersisting — a conflicting registration that does
      # not clear past the staleness bound
      #
      # Past B, a stale conflicting row would be superseded (case 2b), so a
      # conflict that persists means two configured holders of one address.
      # Warning: capacity was not added, but no meeting is dark. Handler
      # identity is self-asserted (shared MH OAuth client), so the second
      # holder may be a second process presenting the MH credential.
      #
      # THE `for:` (one convention for config-derived `for:` literals, story 4
      # OBS-ALERTS): for = ceil_to_whole_minute(sum of these terms):
      #   - B: gc_mh_staleness_threshold_seconds (live gauge; k x load-report
      #     interval, 30 s shipped)
      #   - one MH registration retry: BACKOFF_MAX in
      #     crates/mh-service/src/grpc/gc_client.rs (30 s; a source const with
      #     no gauge). GC answers a conflict FAILED_PRECONDITION, so the retry
      #     is inside GcClient::register's exponential backoff (1 s doubling to
      #     BACKOFF_MAX), not gc_task's REGISTRATION_RETRY_DELAY. The other path
      #     (re-register after a NOT_FOUND load report) retries at the
      #     load-report interval, which is shorter, so BACKOFF_MAX bounds both.
      #     A FAILED_PRECONDITION returns fast, so GC_RPC_TIMEOUT adds nothing
      #     the rounding does not absorb.
      #   - the expr window w (1m): `increase([w]) > 0` stays true for w after
      #     the last conflict, so without it a conflict that clears at
      #     B + retry would still fire. DEVIATION from the contract's
      #     "for = B + one retry", for that reason (global-controller +
      #     observability + dry, Gate 1).
      #   - service-job scrape_interval (the max over the service jobs, infra/kubernetes/observability/prometheus.yml; read live)
      #   - this group's evaluation `interval:` (gc-service-warning)
      # = 30 + 30 + 60 + 5 + 60 = 185 s -> 4m.
      # CONSTRAINT: w >= BACKOFF_MAX, or `increase([w]) > 0` drops to false
      # between a conflicting MH's retries and resets `for:`.
      # env-test 33 asserts derived <= for < derived + 60 s and w >= BACKOFF_MAX,
      # reading B live, BACKOFF_MAX from source, w from this expr, and the
      # scrape and eval intervals from Prometheus's loaded config.
      # ------------------------------------------------------------------
      - alert: GCMhAddressConflictPersisting
        expr: |
          sum(increase(gc_mh_registrations_total{outcome="address_conflict"}[1m])) > 0
        # ANCHOR (DRY): gc_mh_staleness_threshold_seconds + mh-service grpc/gc_client.rs:BACKOFF_MAX + expr window + service-job scrape_interval + gc-service-warning interval, rounded up to the minute (derivation above; env-test 33 checks it against the live gauge and the source const)
        for: 4m
        labels:
          severity: warning
          service: gc-service
          component: mh-registry
        annotations:
          summary: "An MH registration keeps conflicting with a live handler's address"
          description: "gc_mh_registrations_total{outcome=\"address_conflict\"} has kept rising past the MH staleness bound (gc_mh_staleness_threshold_seconds) plus one MH registration retry: a registering MH names an address a fresh, serving row already holds. A transient conflict clears when the old row goes stale; one that persists means two configured holders of one address (provisioning broke the one-process-per-address rule) - or a second process presenting the MH service credential, since handler identity is self-asserted. Find both holders via mh.sh list --json; retire the duplicate."
          impact: "The registering handler never becomes capacity; no meeting is dark because of it."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-14-two-live-media-handlers-on-one-address"

      # GCMhRegistrationEndpointRejected — any increase. An MH config or
      # allowlist defect: its endpoints changed within one incarnation's life,
      # or are not on the allowlist. The handler never becomes capacity.
      - alert: GCMhRegistrationEndpointRejected
        expr: |
          sum by (outcome) (increase(gc_mh_registrations_total{outcome=~"endpoint_changed|invalid_endpoint"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
          service: gc-service
          component: mh-registry
        annotations:
          summary: "GC rejected MH registrations for their endpoints ({{ $labels.outcome }})"
          description: "gc_mh_registrations_total{outcome=\"{{ $labels.outcome }}\"} rose. endpoint_changed = an incarnation re-registered with different endpoints (endpoints are fixed for an incarnation's life); invalid_endpoint = the endpoint is not on GC's allowlist. Either is an MH config or allowlist defect, never load."
          impact: "The rejected handler never becomes replacement or placement capacity."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-14-two-live-media-handlers-on-one-address"

      # GCMhReplacementNoCapacity — sustained: no eligible handler after the
      # request's exclude list (mh_replacement.rs). Usually capacity headroom
      # gone; in a small region a repeatedly migrating meeting can exclude
      # every healthy handler, so healthy > 0 WITH free slots points there
      # instead (healthy handlers all at max_streams are missing capacity). Each request is one MC AcquireMediaHandler; a single burst after
      # an MH death that GC answers no_capacity once is not the signal, a
      # sustained run is. The runbook is MC's Scenario 25 (the capacity triage
      # lives there; task-directed).
      - alert: GCMhReplacementNoCapacity
        expr: |
          sum(increase(gc_mh_replacement_requests_total{outcome="no_capacity"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
          service: gc-service
          component: mh-registry
        annotations:
          summary: "GC keeps answering media-handler replacement requests with no capacity"
          description: "gc_mh_replacement_requests_total{outcome=\"no_capacity\"} has risen in every trailing 15-minute window for 15 minutes (at least two increments spread over about 30 minutes, not a continuous rate): GC found no eligible handler (healthy, fresh, below max_streams) AFTER each request's exclude list. Check gc_mh_available by state (region!=\"other\"), free slots (mh.sh list --json), and whether handlers are draining or stale. If gc_mh_available{state=\"healthy\"} > 0 AND those handlers have free slots (mh.sh list --json), the exclude lists have consumed the region's handlers: look for a repeatedly migrating meeting (mc_media_handler_migrations_total, MCMediaHandlerReplacementRateLimited) rather than missing capacity. Meetings with a surviving handler stay degraded; meetings with none page via MCMediaMeetingsAwaitingHandler."
          impact: "Meetings that lost a handler are not getting a replacement: degraded on survivors, or dark if they have none."
          runbook_url: "docs/runbooks/mc-incident-response.md#scenario-25-meetings-awaiting-a-media-handler"

  - name: gc-service-info
    interval: 60s
    rules:
      # ====================================================================
      # INFO ALERTS - Log only, no notification
      # ====================================================================

      # POPULATION CAVEAT (R-6, 2026-09-24): same dilution as GCMCAssignmentSlow —
      # gc_meeting_join_duration_seconds mixes reuse and new-assignment joins (~1/N new) with no
      # separating label, so this p95 is dominated by reuse joins. See the GCMCAssignmentSlow
      # caveat above; one TODO entry covers both rules.
      - alert: GCHighJoinLatency
        expr: |
          histogram_quantile(0.95,
            sum by(le) (rate(gc_meeting_join_duration_seconds_bucket[5m]))
          ) > 2.0
        for: 5m
        labels:
          severity: info
          service: gc-service
          component: meeting-join
        annotations:
          summary: "Meeting join p95 latency high ({{ $value }}s > 2s)"
          description: "Meeting join p95 latency is {{ $value }}s, exceeding 2s threshold for 5 minutes. This may indicate slow MC assignment or AC token request paths. Note: info severity because the aggregate GCHighLatency alert (200ms p95) covers SLO violations; this alert tracks join-specific degradation for observability."
          impact: "Slow meeting join experience. Investigate MC assignment and AC token request latency."
          runbook_url: "docs/runbooks/gc-incident-response.md#scenario-2-high-latency--slow-responses"
