global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'dark-tower-dev'
    environment: 'development'

# Alertmanager configuration (optional, for future use)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Alert rule files.
#
# THIS STANZA USED TO BE COMMENTED OUT, AND WHAT IT SAID WAS WRONG TWICE:
# `alerts/*.yml` names the wrong directory (`rules/`) AND the wrong extension
# (`.yaml`). Uncommenting it verbatim would have loaded nothing while looking
# fixed -- the same "alive, never applied" shape one layer down from the one
# this change closes.
#
# KEEP THIS GLOB BYTE-IDENTICAL to the one in
# `infra/kubernetes/observability/prometheus.yml`. Relative `rule_files` resolve
# against the config file's directory, and both deployments mount the rules at
# `/etc/prometheus/rules`, so ONE string is valid in both and there is nothing
# to drift. `dt-guard alert-rules-policy` parses both and fails on a difference.
#
# THE LEADING-UNDERSCORE EXCLUSION IS DELIBERATE. `rules/*-alerts.yaml` would
# match `_template-service-alerts.yaml`, whose exprs are `<svc>` placeholders
# and are not parseable PromQL; Prometheus validates rule files at config load
# and exits non-zero. That file is also guard-exempt by design, so loading it
# would evaluate -- and serve on `/api/v1/rules` -- annotation text that no
# hygiene scan has ever read. The predicate has one home:
# `loadable_rules_files()` in `crates/dt-guard/src/alert_rules.rs`. Do not widen
# this glob.
#
# NOTE: this file is the LOCAL-COMPOSE config and is not deployed.
# `infra/kubernetes/observability/prometheus.yml` is what runs
# (docs/observability/dashboard-conventions.md §Two Prometheus configs).
rule_files:
  - "rules/[a-z]*-alerts.yaml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Global Controller (when implemented)
  - job_name: 'gc-service'
    static_configs:
      - targets: ['gc-service:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Meeting Controller (when implemented)
  - job_name: 'mc-service'
    static_configs:
      - targets: ['mc-service:9100']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Media Handler
  - job_name: 'mh-service'
    static_configs:
      - targets: ['mh-service:8083']
    metrics_path: '/metrics'
    scrape_interval: 5s  # More frequent for real-time media metrics

  # PostgreSQL exporter (optional, for future use)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis exporter (optional, for future use)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
