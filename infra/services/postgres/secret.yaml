# The ONE owner of the dev Postgres credential. Everything else DERIVES from it: the
# migration Job and GC (secretKeyRef / composed DATABASE_URL), AC's DATABASE_URL
# (infra/kind/scripts/provision.sh) and the Kind scripts (lib/common.sh:pg_secret_value).
# It is a PROVISION input (it is in provision.sh's blueprint), so a change here REBUILDS
# the cluster — the database's password is fixed at initdb, so nothing less would apply
# it — and every consumer starts on the new value. Values must be URL-safe.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: dark-tower
type: Opaque
stringData:
  POSTGRES_DB: dark_tower
  POSTGRES_USER: darktower
  POSTGRES_PASSWORD: dev_password_change_in_production
