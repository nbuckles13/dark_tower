apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # THE ONE MH template (Deployment mh-template). Rendered here but NEVER
  # applied as-is: infra/kind/scripts/deploy.sh stores the rendered Deployment
  # as ConfigMap mh-template and infra/kind/scripts/mh.sh instantiates it per
  # hostPort slot (mh-s<k>). See the header of deployment.yaml.
  - deployment.yaml
  - service.yaml
  # mh-service-secrets ONLY
  - secret.yaml
  # mh-service-tls NOT listed — created imperatively by
  # infra/kind/scripts/provision.sh:create_tls_secret() from the certs
  # scripts/generate-dev-certs.sh generates, because listing it would commit
  # TLS key material to git. Consequence: `kubectl apply -k` alone does NOT
  # produce startable pods on a fresh namespace — every MH pod mounts it as
  # the `mh-tls` volume, which is NOT `optional:`, so kubelet cannot complete
  # the mount.
  #
  # THE SIGNAL IS `FailedMount`, NOT A CERT ERROR. The pod stays Pending in
  # ContainerCreating and the process NEVER STARTS, so there is nothing in
  # `kubectl logs` and no cert-loading error anywhere — mh-service's
  # `Identity::load_pemfiles` is a DIFFERENT failure that needs the Secret to
  # exist and be malformed. `kubectl describe pod` names the Secret; that is the
  # only artifact that says so. All THREE startup-config signals are documented
  # in docs/runbooks/mh-deployment.md §Config-failure triage, with MH spellings
  # (`CreateContainerConfigError` for a missing ConfigMap key or generation,
  # `CrashLoopBackOff` for a stale pod template, and this one).
  # `kubectl logs` is empty or misleading for all three, and pod phase alone
  # tells them apart before you read anything.
  #
  # infra/kind/scripts/provision.sh (the dev stand-in for a secret manager,
  # ADR-0038 §1) is the only supported bootstrap today; making this declarative is
  # tracked in docs/TODO.md §Infrastructure Validation in Devloops.
  - pdb.yaml
  - network-policy.yaml
  # service-monitor.yaml NOT listed — requires Prometheus Operator CRD

# Content-addressed configuration (ADR-0038 §2). Generated, NOT a plain
# ConfigMap resource: kustomize appends a hash of the rendered data to the name
# and rewrites every configMapKeyRef to it, so a config change changes the pod
# template and rolls exactly the workloads that consume it. `namespace:` is
# load-bearing -- see infra/kubernetes/observability/kustomization.yaml.
# Env-file format: KEY=VALUE taken literally, so an empty value is `KEY=` and
# values are never quoted (a quoted value keeps its quotes; `dt-guard` rejects it).
configMapGenerator:
  - name: mh-service-config
    namespace: dark-tower
    envs:
      - config.env
    options:
      labels:
        app: mh-service
        component: media
  # TEMPLATE INPUT, never applied (see slot-template.env). The per-slot
  # advertise-address ConfigMaps (mh-slot-<k>-config, labelled
  # dark-tower.io/mh-slot=<k>) are rendered by deploy.sh:render_env_overlay from
  # the slot table, not here: K has one home (crates/devloop-helper/src/ports.rs).
  - name: mh-slot-template-config
    namespace: dark-tower
    envs:
      - slot-template.env
    options:
      labels:
        app: mh-service
        component: media
        dark-tower.io/mh-template-input: "true"

labels:
  - pairs:
      managed-by: dark-tower
    includeSelectors: false

# Derive the template's MH_TERMINATION_GRACE_SECONDS from its own
# terminationGracePeriodSeconds, at build time (R-21: one literal, derived —
# never two hand-typed values free to drift). ONE entry: there is one MH
# template, and every MH (every mh-s<k> mh.sh creates) is an instance of it, so
# the source and the target are the same Deployment and no per-instance
# quantity can be collapsed into a shared one.
#
# `options: create:` is deliberately NOT set. Requiring the target env entry to
# pre-exist is what makes deletion of EITHER side a hard build failure:
#   - delete the source field  -> "fieldPath ... is missing for replacement source"
#   - delete the target entry  -> "unable to find field ... in replacement target"
# It is also what keeps the env var name visible to `dt-guard env-config`, which
# reads these base YAML files directly and never runs kustomize.
#
# Verified against kustomize v5.5.0 (embedded in kubectl v1.32.3), which is what
# both consumers of this base actually run: the guard
# (scripts/guards/simple/validate-kustomize.sh) and the deploy path
# (infra/kind/scripts/deploy.sh -> the Kind environment-root render).
replacements:
  - source:
      kind: Deployment
      name: mh-template
      fieldPath: spec.template.spec.terminationGracePeriodSeconds
    targets:
      - select:
          kind: Deployment
          name: mh-template
        fieldPaths:
          - spec.template.spec.containers.[name=mh-service].env.[name=MH_TERMINATION_GRACE_SECONDS].value
