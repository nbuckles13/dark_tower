apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - mh-0-configmap.yaml
  - mh-1-configmap.yaml
  - mh-0-deployment.yaml
  - mh-1-deployment.yaml
  - service.yaml
  # mh-service-secrets ONLY
  - secret.yaml
  # mh-service-tls NOT listed — created imperatively by
  # infra/kind/scripts/setup.sh:create_mh_tls_secret() from the certs
  # scripts/generate-dev-certs.sh generates, because listing it would commit
  # TLS key material to git. Consequence: `kubectl apply -k` alone does NOT
  # produce startable pods on a fresh namespace — both mh-{0,1} mount it as
  # the `mh-tls` volume, which is NOT `optional:`, so kubelet cannot complete
  # the mount.
  #
  # THE SIGNAL IS `FailedMount`, NOT A CERT ERROR. The pod stays Pending in
  # ContainerCreating and the process NEVER STARTS, so there is nothing in
  # `kubectl logs` and no cert-loading error anywhere — mh-service's
  # `Identity::load_pemfiles` is a DIFFERENT failure that needs the Secret to
  # exist and be malformed. `kubectl describe pod` names the Secret; that is the
  # only artifact that says so. All THREE startup-config signals are documented
  # in the SIBLING service's runbook — docs/runbooks/mc-deployment.md
  # §Config-failure triage (`CreateContainerConfigError` for a missing ConfigMap
  # key, `CrashLoopBackOff` for a stale pod template, and this one). The first
  # two apply verbatim to mh-service, whose five required MH_* transport keys
  # have the same shape; this one applies with `mh-service-tls`/`mh-tls`
  # substituted for their MC spellings. mh-deployment.md has no equivalent
  # section yet, so the MC one is cited deliberately rather than by mistake.
  # `kubectl logs` is empty or misleading for all three, and pod phase alone
  # tells them apart before you read anything.
  #
  # setup.sh is the only supported bootstrap today; making this declarative is
  # tracked in docs/TODO.md §Infrastructure Validation in Devloops.
  - pdb.yaml
  - network-policy.yaml
  # service-monitor.yaml NOT listed — requires Prometheus Operator CRD

labels:
  - pairs:
      managed-by: dark-tower
    includeSelectors: false

# Derive each instance's MH_TERMINATION_GRACE_SECONDS from THAT instance's own
# terminationGracePeriodSeconds, at build time (R-21: one literal, derived —
# never two hand-typed values free to drift).
#
# These two entries are deliberately NOT mergeable into one. `source.name` must
# be a literal, so a single entry would silently make BOTH deployments read
# mh-0's grace period — a per-instance quantity collapsed into a shared one,
# which is the defect this block exists to remove.
#
# `options: create:` is deliberately NOT set. Requiring the target env entry to
# pre-exist is what makes deletion of EITHER side a hard build failure:
#   - delete the source field  -> "fieldPath ... is missing for replacement source"
#   - delete the target entry  -> "unable to find field ... in replacement target"
# It is also what keeps the env var name visible to `dt-guard env-config`, which
# reads these base YAML files directly and never runs kustomize.
#
# Verified against kustomize v5.5.0 (embedded in kubectl v1.32.3), which is what
# both consumers of this base actually run: the guard
# (scripts/guards/simple/validate-kustomize.sh) and the deploy path
# (infra/kind/scripts/setup.sh -> kubectl apply -k the Kind overlay). NOTE: the
# story text claims verification against kustomize v5.7.1; that is not the
# version this tree runs. See docs/TODO.md.
replacements:
  - source:
      kind: Deployment
      name: mh-0
      fieldPath: spec.template.spec.terminationGracePeriodSeconds
    targets:
      - select:
          kind: Deployment
          name: mh-0
        fieldPaths:
          - spec.template.spec.containers.[name=mh-service].env.[name=MH_TERMINATION_GRACE_SECONDS].value
  - source:
      kind: Deployment
      name: mh-1
      fieldPath: spec.template.spec.terminationGracePeriodSeconds
    targets:
      - select:
          kind: Deployment
          name: mh-1
        fieldPaths:
          - spec.template.spec.containers.[name=mh-service].env.[name=MH_TERMINATION_GRACE_SECONDS].value
