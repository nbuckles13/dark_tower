# THE ONE MH TEMPLATE (ADR-0039 §7 "Template invariants"). NEVER APPLIED AS-IS.
#
# infra/kind/scripts/deploy.sh renders it in the ONE environment-root render
# (content-tagged image, hash-named ConfigMap refs), EXCLUDES it from the root
# apply, and stores the rendered Deployment in-cluster as ConfigMap
# `mh-template` (data: deployment.json, revision, baseline).
# infra/kind/scripts/mh.sh instantiates it once per hostPort slot as Deployment
# `mh-s<k>` (replicas 1), setting ONLY: the slot/revision/owner labels, the
# webtransport port's hostPort (= the slot's MH_HOST_PORT), and the
# MH_WEBTRANSPORT_ADVERTISE_ADDRESS configMapKeyRef name (= slot k's ConfigMap,
# found by label). Every other field below is identical for every MH.
#
# Every MH incarnation owns its client-facing address for its whole life: the
# scheduler admits one pod per hostPort per node, and a Terminating (draining)
# pod holds it until gone. Never `kubectl delete pod --force --grace-period=0`
# an MH pod: that is the one way to defeat the slot lock.
#
# The labels below (app=mh-service, component=media) are the ONLY source of
# the labels infra/services/mh-service/network-policy.yaml selects on: a pod
# without them is selected by no policy (default-allow on every port).
# scripts/setup.test.sh pins label ⊇ podSelector. Slot/revision/owner labels
# are pod labels only, never metric labels (telemetry contract §MH).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mh-template
  namespace: dark-tower
  labels:
    app: mh-service
    component: media
spec:
  replicas: 1
  # Recreate, NOT RollingUpdate: a surge pod would ask for the SAME hostPort as
  # the running one and sit Pending. Upgrades are mh.sh's start-new-then-drain-old
  # across two slots; an accidental `kubectl rollout restart`/`set image` on an
  # mh-s<k> is then sequential reuse of that slot (allowed: ADR-0039 §7), never a
  # stuck surge. Do not use either on an mh-s<k>; use mh.sh.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mh-service
      component: media
  template:
    metadata:
      labels:
        app: mh-service
        component: media
    spec:
      # SINGLE SOURCE OF TRUTH for every MH's shutdown drain window.
      # A kustomize replacement (kustomization.yaml) copies this value into the
      # MH_TERMINATION_GRACE_SECONDS env entry below. Once story task #12 lands,
      # MH derives its drain as min(SETTLE_TARGET, grace - MARGIN) from that env
      # var — so changing this number changes MH's drain behaviour, and setting it
      # at or below MARGIN makes MH refuse to start. Do not retype the value into
      # the env entry; the replacement is what keeps the two from drifting.
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        # Match distroless nonroot user (uid 65532)
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: mh-service
        image: localhost/mh-service:render-required
        # Tag set at render time to the image's content tag (sha-<id>) by
        # infra/kind/scripts/deploy.sh:render_env_overlay (ADR-0038 §2). Nothing loads
        # `:render-required`, so an apply that bypasses the render fails loudly
        # (ErrImageNeverPull) instead of running a stale image. Never: a Kind-loaded
        # image is never pulled; a prod overlay sets registry, tag and pull policy.
        imagePullPolicy: Never
        ports:
        - name: health
          containerPort: 8083
          protocol: TCP
        - name: grpc
          containerPort: 50053
          protocol: TCP
        # The MH binds 4434/UDP in-container for every slot (the NetworkPolicy's
        # UDP 4434 ingress rule covers every slot after hostPort DNAT). hostPort
        # is set per slot by mh.sh (= the slot's MH_HOST_PORT); it is the ONLY
        # hostPort in this pod (none on health/gRPC, no hostNetwork).
        - name: webtransport
          containerPort: 4434
          protocol: UDP
        env:
        # MH_HANDLER_ID omitted — auto-generated per pod from HOSTNAME + UUID
        - name: MH_REGION
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_REGION
        - name: GC_GRPC_URL
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: GC_GRPC_URL
        - name: MH_GRPC_BIND_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_GRPC_BIND_ADDRESS
        - name: MH_HEALTH_BIND_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_HEALTH_BIND_ADDRESS
        - name: MH_WEBTRANSPORT_BIND_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_WEBTRANSPORT_BIND_ADDRESS
        # RETIRED — PENDING REMOVAL, and this reference is deliberately KEPT.
        # Since story 2 task 8's image, nothing reads MH_MAX_STREAMS.
        # The ref stays as a cheap ordering discipline: the read goes one
        # deploy before the key. Undo itself is safe either way while the
        # previous hash-suffixed ConfigMap generation exists (ADR-0038 §2):
        # that generation holds every key its revision references. The
        # ordering protects a partial revert/apply, and a future move to a
        # stable ConfigMap name. It is NOT a defence against pruning; see
        # docs/runbooks/mh-deployment.md §Config-failure triage. The removal
        # is two deploys. STEP 1 IS DONE (story 3): this ref is now
        # `optional: true`. Step 2 deletes key and refs together, scheduled in
        # docs/TODO.md §Media Path Obligations, "Delete the story-3 retired
        # config keys".
        - name: MH_MAX_STREAMS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_MAX_STREAMS
              optional: true
        # QUIC transport parameters (ADR-0036 §1). Shared by every MH, so they
        # live in the shared ConfigMap; see the rationale comments there.
        - name: MH_MAX_CONCURRENT_UNI_STREAMS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_MAX_CONCURRENT_UNI_STREAMS
        - name: MH_DATAGRAM_BUFFER_AUDIO_FRAMES
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_DATAGRAM_BUFFER_AUDIO_FRAMES
        - name: MH_KEEPALIVE_INTERVAL_MS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_KEEPALIVE_INTERVAL_MS
        - name: MH_MAX_CONNECTIONS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_MAX_CONNECTIONS
        # Egress-budget chain (story 2 R-19, R-23). Rationale for every value
        # is in config.env, which is its single home. HARD references, NOT
        # `optional:`, for every key an image reads or will read — a key
        # missing here must be a loud CreateContainerConfigError, never a pod
        # that starts with a value nobody chose. The ONLY optional refs in this
        # file are MH_MEDIA_LATENCY_SAMPLE_RATIO and the RETIRED keys (see the
        # rule at MH_MEDIA_LATENCY_SAMPLE_RATIO below); do not copy that
        # pattern for a live key.
        #
        # ONE template, so every MH carries the identical set by construction.
        # `dt-guard env-config` rule 1 checks this workload; the env-test in
        # crates/env-tests/tests/01_mh_deployment_config.rs checks the live
        # pods against it.
        - name: MH_EGRESS_BUDGET_BPS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_EGRESS_BUDGET_BPS
        # RETIRED — PENDING REMOVAL: MH_STREAM_COST_AUDIO_BPS,
        # MH_STREAM_COST_VIDEO_BPS (superseded by the costs MH derives from
        # media-codec-profile) and MH_MAX_MUTED_SOURCES_PER_MEETING (superseded
        # by MH_MAX_SOURCE_STREAMS_PER_MEETING). Step 1 of the two-deploy
        # retirement: `optional: true`, keys kept in mh-service-config. The
        # current image no longer reads any of the three; the PREVIOUS image
        # reads all three as required, so step 2 (delete keys and refs
        # together) waits until the rollback floor is at or past the image
        # that removed the reads (docs/TODO.md §Media Path Obligations,
        # "Delete the story-3 retired config keys").
        - name: MH_STREAM_COST_AUDIO_BPS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_STREAM_COST_AUDIO_BPS
              optional: true
        - name: MH_STREAM_COST_VIDEO_BPS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_STREAM_COST_VIDEO_BPS
              optional: true
        - name: MH_EGRESS_REJECTION_RATIO_THRESHOLD
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_EGRESS_REJECTION_RATIO_THRESHOLD
        - name: MH_MAX_REGISTERED_MEETINGS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_MAX_REGISTERED_MEETINGS
        - name: MH_MAX_MUTED_SOURCES_PER_MEETING
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_MAX_MUTED_SOURCES_PER_MEETING
              optional: true
        # ADR-0036 §8 policy bounds (R-22): resource-exhaustion guards, never
        # capacity. REQUIRED reads since story 2 task 8 (no code default;
        # values equal the former defaults, so behaviour did not change at
        # cutover). Same per-workload rule as above.
        - name: MH_MAX_EGRESS_STREAMS_PER_MEETING
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_MAX_EGRESS_STREAMS_PER_MEETING
        - name: MH_MAX_CANDIDATE_SOURCES_PER_EGRESS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_MAX_CANDIDATE_SOURCES_PER_EGRESS
        - name: MH_MAX_TOTAL_EGRESS_EDGES
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_MAX_TOTAL_EGRESS_EDGES
        - name: MH_POLICY_APPLY_TIMEOUT_MS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_POLICY_APPLY_TIMEOUT_MS
        # Source-stream bound (story 3), replacing the retired muted bound.
        # HARD ref: a required read (no code default). Same per-workload rule
        # as above.
        - name: MH_MAX_SOURCE_STREAMS_PER_MEETING
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_MAX_SOURCE_STREAMS_PER_MEETING
        # Video stream path (story 3 R-12, R-21). HARD refs: all three
        # (stream opens, backlog, stall) are REQUIRED reads — absent or out of
        # bounds, MH refuses to start. Keyframe and recovery requests have no
        # keys (story 3 amendment 4). Rationale and bounds: config.env.
        - name: MH_STREAM_OPENS_PER_CONNECTION_PER_SEC
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_STREAM_OPENS_PER_CONNECTION_PER_SEC
        - name: MH_EGRESS_STREAM_BACKLOG_BYTES
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_EGRESS_STREAM_BACKLOG_BYTES
        - name: MH_STREAM_MID_FRAME_STALL_MS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_STREAM_MID_FRAME_STALL_MS
        # Shared media codec profile (story 3 R-23, R-24): the four values MH
        # reads from the SHARED `media-codec-profile` generator in the sibling
        # base infra/services/media-codec-profile/ — their single home, also
        # read by MC. MH derives both per-stream egress costs from them
        # (required reads). MH does not read the minimum keyframe interval
        # (MC-only, story 3 amendment 4). Kustomize rewrites this name to the
        # generator's hashed name in the environment-root render, so a profile
        # edit rolls mc-0 and mc-1 and changes the MH template revision (every MH
        # is replaced by `mh.sh upgrade`, start-new-then-drain-old). HARD refs.
        - name: MEDIA_VIDEO_MAX_BITRATE_BPS
          valueFrom:
            configMapKeyRef:
              name: media-codec-profile
              key: MEDIA_VIDEO_MAX_BITRATE_BPS
        - name: MEDIA_VIDEO_FRAME_RATE_HZ
          valueFrom:
            configMapKeyRef:
              name: media-codec-profile
              key: MEDIA_VIDEO_FRAME_RATE_HZ
        - name: MEDIA_AUDIO_MAX_BITRATE_BPS
          valueFrom:
            configMapKeyRef:
              name: media-codec-profile
              key: MEDIA_AUDIO_MAX_BITRATE_BPS
        - name: MEDIA_AUDIO_FRAME_RATE_HZ
          valueFrom:
            configMapKeyRef:
              name: media-codec-profile
              key: MEDIA_AUDIO_FRAME_RATE_HZ
        # Pod memory limit, in bytes, via the DOWNWARD API — deliberately NOT
        # a ConfigMap key, so the limit has exactly ONE home: this container's
        # `resources.limits.memory` below. MH's boot-time memory check (from
        # MH-A2: egress backlog cap x derived stream ceiling plus the
        # receive-side bound x MH_MAX_CONNECTIONS within a fixed fraction of
        # this) is therefore derived, never restated. The current image READS
        # it as a required value: absent, empty, unparseable or 0 refuses to
        # boot, and a failing check refuses with one ERROR line (target
        # `mh.config`); a passing boot logs the effective limit and figures on
        # target `mh.config.memory`.
        #
        # The limit MUST stay declared. If `resources.limits.memory` were
        # absent, Kubernetes would silently resolve this variable to the
        # NODE's allocatable memory and the check would pass vacuously —
        # fail-open with no signal. `dt-guard kustomize` fails any
        # resourceFieldRef whose container does not declare the referenced
        # resource. `divisor: "1"` yields integer bytes.
        - name: MH_POD_MEMORY_LIMIT_BYTES
          valueFrom:
            resourceFieldRef:
              containerName: mh-service
              resource: limits.memory
              divisor: "1"
        # OPTIONAL AT THE MANIFEST LAYER TOO, deliberately — the only LIVE key
        # in this file that is (the retired keys are the other case; see the
        # end of this comment).
        #
        # THE RULE, and it is NOT "required by config.rs": a hard
        # configMapKeyRef is correct when a missing key must be a LOUD STARTUP
        # FAILURE rather than a silent fallback. That covers both the keys
        # config.rs requires AND keys whose code default is wrong for a cluster
        # — GC_GRPC_URL defaults to http://localhost:50051 and MH_REGION to
        # us-east-1, so under `optional: true` a missing key would give you a
        # pod that starts, passes readiness and talks to nothing. Several keys
        # in this file are optional-with-default in code and hard-referenced
        # anyway, deliberately and correctly. DO NOT flip them.
        #
        # `optional: true` is correct only when the code default IS the intended
        # production behaviour AND decoupling the manifest rollback from the
        # image rollback matters. Among LIVE keys that is this key alone:
        # mh-service falls
        # back to DEFAULT_MEDIA_LATENCY_SAMPLE_RATIO, which is the value we
        # want, and a hard reference would make the kubelet refuse to start the
        # container when the key is absent (CreateContainerConfigError), forcing
        # the deployment and the ConfigMap to roll back together — the
        # deploy-time coupling optional-with-default was chosen to avoid,
        # reintroduced one layer down.
        #
        # THE RETIRED KEYS ARE ALSO `optional: true` (MH_MAX_STREAMS,
        # MH_STREAM_COST_*_BPS, MH_MAX_MUTED_SOURCES_PER_MEETING here, and
        # MC_MAX_RECEIVE_SLOTS + MC_AUDIO_* in the MC Deployments), and that
        # does NOT contradict "DO NOT flip them": the warning covers keys whose
        # absence must be LOUD, and a key nothing reads (after its code task
        # removes the read) cannot be loud. Every one of them is now unread
        # (MH's code tasks and story 3 MC-A removed the reads), and each key
        # stays present for one more deploy, so the flag loosens no bound: a
        # rollback to an image that still reads one as REQUIRED finds it.
        # It is step 1 of the two-deploy retirement in docs/TODO.md.
        - name: MH_MEDIA_LATENCY_SAMPLE_RATIO
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_MEDIA_LATENCY_SAMPLE_RATIO
              optional: true
        # Drain window, DERIVED — do not hand-edit this value.
        #
        # The single source of truth is this deployment's own
        # `spec.template.spec.terminationGracePeriodSeconds` (above). The
        # kustomize `replacements:` block in
        # infra/services/mh-service/kustomization.yaml overwrites the `"0"`
        # below with that field at BUILD time. Deliberately NOT a ConfigMap
        # key: it is read off this pod spec's own grace (mh.sh also reads the
        # pod's grace for its drain bound), and a shared key would be exactly the second, drift-prone
        # literal this derivation exists to remove (R-21).
        #
        # `"0"` is a sentinel, not a value. It is invalid — task #12 requires
        # grace > MARGIN — so a `0` that reaches a running pod is a loud refusal
        # to start, never a silently-wrong drain. Seeing `"0"` on a live pod
        # means the kustomize replacement did not run.
        #
        # That loudness is NOT automatic. It holds only if task #12 (a) parses
        # this var STRICTLY — no `unwrap_or`, or `"0"` parses to 0 and never
        # reaches the check; (b) validates BEFORE computing the drain; and
        # (c) uses `saturating_sub` for `grace - MARGIN`, since on an unsigned
        # type `0 - MARGIN` wraps to an effectively infinite drain rather than a
        # refusal. Tracked in docs/TODO.md § Cross-Service Duplication (DRY).
        #
        # ALWAYS deploy through kustomize (`kubectl apply -k`, or the Kind
        # overlay). `kubectl apply -f` on this file BYPASSES the replacement and
        # applies the sentinel verbatim — both MH pods would then refuse to
        # start: a new-meeting outage plus silent media in every existing
        # meeting (the scale-to-zero shape; R-6 made "a join outage" wrong).
        #
        # Operational consequence: once task #12 lands, MH's drain window is
        # min(SETTLE_TARGET, terminationGracePeriodSeconds - MARGIN). Editing
        # the grace period above therefore CHANGES MH's drain behaviour. That
        # coupling is the point, but it is not what a reader expects from a
        # pod-spec field.
        - name: MH_TERMINATION_GRACE_SECONDS
          value: "0"
        - name: AC_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: AC_ENDPOINT
        - name: AC_JWKS_URL
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: AC_JWKS_URL
        # TLS certificate paths for WebTransport (QUIC/HTTP3)
        - name: MH_TLS_CERT_PATH
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_TLS_CERT_PATH
        - name: MH_TLS_KEY_PATH
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_TLS_KEY_PATH
        # OAuth 2.0 client credentials for AC authentication (ADR-0010)
        - name: MH_CLIENT_ID
          value: "media-handler"
        - name: MH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mh-service-secrets
              key: MH_CLIENT_SECRET
        # Pod IP for gRPC advertise address (downward API)
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        # gRPC advertise address uses pod IP (cluster-internal, unchanged)
        - name: MH_GRPC_ADVERTISE_ADDRESS
          value: "grpc://$(POD_IP):50053"
        # Per-SLOT WebTransport advertise address. HARD ref (never optional).
        # The name here is the template-input placeholder generator
        # (slot-template.env), which deploy.sh NEVER applies: mh.sh rewrites this
        # name to slot k's ConfigMap (labelled dark-tower.io/mh-slot=<k>, built by
        # deploy.sh:render_env_overlay from the slot table). A pod created from an
        # unrewritten template therefore fails closed (CreateContainerConfigError)
        # instead of advertising another slot's address.
        - name: MH_WEBTRANSPORT_ADVERTISE_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mh-slot-template-config
              key: MH_WEBTRANSPORT_ADVERTISE_ADDRESS
        - name: RUST_LOG
          value: "info,mh_service=debug"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3  # Restart after 30s of failures
        readinessProbe:
          httpGet:
            path: /ready
            port: 8083
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3  # Remove from LB after 15s of failures
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: mh-tls
          mountPath: /etc/mh-tls
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: mh-tls
        secret:
          secretName: mh-service-tls
          defaultMode: 0400
