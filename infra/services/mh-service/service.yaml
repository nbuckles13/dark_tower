# ClusterIP Service — for internal gRPC and health access.
# WebTransport is NOT exposed here and has NO Service: each MH's UDP 4434 is
# reached through its own hostPort SLOT (ADR-0039 §7; mh.sh sets hostPort, the
# Kind extraPortMappings publish it). A draining MH stays reachable by
# construction (hostPort DNAT, not a Service endpoint).
apiVersion: v1
kind: Service
metadata:
  name: mh-service
  namespace: dark-tower
  labels:
    app: mh-service
    component: media
spec:
  type: ClusterIP
  selector:
    app: mh-service
    component: media
  ports:
  - name: health
    protocol: TCP
    port: 8083
    targetPort: 8083
  - name: grpc
    protocol: TCP
    port: 50053
    targetPort: 50053
  sessionAffinity: None
