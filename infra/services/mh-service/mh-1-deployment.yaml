apiVersion: apps/v1
kind: Deployment
metadata:
  name: mh-1
  namespace: dark-tower
  labels:
    app: mh-service
    component: media
    instance: mh-1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: mh-service
      component: media
      instance: mh-1
  template:
    metadata:
      labels:
        app: mh-service
        component: media
        instance: mh-1
    spec:
      # SINGLE SOURCE OF TRUTH for this instance's shutdown drain window.
      # A kustomize replacement (kustomization.yaml) copies this value into the
      # MH_TERMINATION_GRACE_SECONDS env entry below. Once story task #12 lands,
      # MH derives its drain as min(SETTLE_TARGET, grace - MARGIN) from that env
      # var — so changing this number changes MH's drain behaviour, and setting it
      # at or below MARGIN makes MH refuse to start. Do not retype the value into
      # the env entry; the replacement is what keeps the two from drifting.
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        # Match distroless nonroot user (uid 65532)
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: mh-service
        image: localhost/mh-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: health
          containerPort: 8083
          protocol: TCP
        - name: grpc
          containerPort: 50053
          protocol: TCP
        - name: webtransport
          containerPort: 4434
          protocol: UDP
        env:
        # MH_HANDLER_ID omitted — auto-generated per pod from HOSTNAME + UUID
        - name: MH_REGION
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_REGION
        - name: GC_GRPC_URL
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: GC_GRPC_URL
        - name: MH_GRPC_BIND_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_GRPC_BIND_ADDRESS
        - name: MH_HEALTH_BIND_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_HEALTH_BIND_ADDRESS
        - name: MH_WEBTRANSPORT_BIND_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_WEBTRANSPORT_BIND_ADDRESS
        - name: MH_MAX_STREAMS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_MAX_STREAMS
        # QUIC transport parameters (ADR-0036 §1). Shared across both MH
        # instances, so they live in the shared ConfigMap; see the rationale
        # comments there. Both instances MUST reference all four: dt-guard
        # env-config check 1 is per-workload, and a var present in mh-0 but
        # missing from mh-1 CrashLoops that pod alone once task #12 makes
        # these required.
        - name: MH_MAX_CONCURRENT_UNI_STREAMS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_MAX_CONCURRENT_UNI_STREAMS
        - name: MH_DATAGRAM_BUFFER_AUDIO_FRAMES
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_DATAGRAM_BUFFER_AUDIO_FRAMES
        - name: MH_KEEPALIVE_INTERVAL_MS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_KEEPALIVE_INTERVAL_MS
        - name: MH_MAX_CONNECTIONS
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_MAX_CONNECTIONS
        # OPTIONAL AT THE MANIFEST LAYER TOO, deliberately — the only key in
        # this file that is.
        #
        # THE RULE, and it is NOT "required by config.rs": a hard
        # configMapKeyRef is correct when a missing key must be a LOUD STARTUP
        # FAILURE rather than a silent fallback. That covers both the keys
        # config.rs requires AND keys whose code default is wrong for a cluster
        # — GC_GRPC_URL defaults to http://localhost:50051 and MH_REGION to
        # us-east-1, so under `optional: true` a missing key would give you a
        # pod that starts, passes readiness and talks to nothing. Several keys
        # in this file are optional-with-default in code and hard-referenced
        # anyway, deliberately and correctly. DO NOT flip them.
        #
        # `optional: true` is correct only when the code default IS the intended
        # production behaviour AND decoupling the manifest rollback from the
        # image rollback matters. Today that is this key alone: mh-service falls
        # back to DEFAULT_MEDIA_LATENCY_SAMPLE_RATIO, which is the value we
        # want, and a hard reference would make the kubelet refuse to start the
        # container when the key is absent (CreateContainerConfigError), forcing
        # the deployment and the ConfigMap to roll back together — the
        # deploy-time coupling optional-with-default was chosen to avoid,
        # reintroduced one layer down.
        - name: MH_MEDIA_LATENCY_SAMPLE_RATIO
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_MEDIA_LATENCY_SAMPLE_RATIO
              optional: true
        # Drain window, DERIVED — do not hand-edit this value.
        #
        # The single source of truth is this deployment's own
        # `spec.template.spec.terminationGracePeriodSeconds` (above). The
        # kustomize `replacements:` block in
        # infra/services/mh-service/kustomization.yaml overwrites the `"0"`
        # below with that field at BUILD time. Deliberately NOT a ConfigMap
        # key: it is a per-instance quantity read off this instance's own pod
        # spec, and a shared key would be exactly the second, drift-prone
        # literal this derivation exists to remove (R-21).
        #
        # `"0"` is a sentinel, not a value. It is invalid — task #12 requires
        # grace > MARGIN — so a `0` that reaches a running pod is a loud refusal
        # to start, never a silently-wrong drain. Seeing `"0"` on a live pod
        # means the kustomize replacement did not run.
        #
        # That loudness is NOT automatic. It holds only if task #12 (a) parses
        # this var STRICTLY — no `unwrap_or`, or `"0"` parses to 0 and never
        # reaches the check; (b) validates BEFORE computing the drain; and
        # (c) uses `saturating_sub` for `grace - MARGIN`, since on an unsigned
        # type `0 - MARGIN` wraps to an effectively infinite drain rather than a
        # refusal. Tracked in docs/TODO.md § Cross-Service Duplication (DRY).
        #
        # ALWAYS deploy through kustomize (`kubectl apply -k`, or the Kind
        # overlay). `kubectl apply -f` on this file BYPASSES the replacement and
        # applies the sentinel verbatim — both MH pods would then refuse to
        # start, which is a JOIN outage, not merely a media one.
        #
        # Operational consequence: once task #12 lands, MH's drain window is
        # min(SETTLE_TARGET, terminationGracePeriodSeconds - MARGIN). Editing
        # the grace period above therefore CHANGES MH's drain behaviour. That
        # coupling is the point, but it is not what a reader expects from a
        # pod-spec field.
        - name: MH_TERMINATION_GRACE_SECONDS
          value: "0"
        - name: AC_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: AC_ENDPOINT
        - name: AC_JWKS_URL
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: AC_JWKS_URL
        # TLS certificate paths for WebTransport (QUIC/HTTP3)
        - name: MH_TLS_CERT_PATH
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_TLS_CERT_PATH
        - name: MH_TLS_KEY_PATH
          valueFrom:
            configMapKeyRef:
              name: mh-service-config
              key: MH_TLS_KEY_PATH
        # OAuth 2.0 client credentials for AC authentication (ADR-0010)
        - name: MH_CLIENT_ID
          value: "media-handler"
        - name: MH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mh-service-secrets
              key: MH_CLIENT_SECRET
        # Pod IP for gRPC advertise address (downward API)
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        # gRPC advertise address uses pod IP (cluster-internal, unchanged)
        - name: MH_GRPC_ADVERTISE_ADDRESS
          value: "grpc://$(POD_IP):50053"
        # Per-instance explicit WebTransport advertise address from instance ConfigMap
        - name: MH_WEBTRANSPORT_ADVERTISE_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mh-1-config
              key: MH_WEBTRANSPORT_ADVERTISE_ADDRESS
        - name: RUST_LOG
          value: "info,mh_service=debug"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3  # Restart after 30s of failures
        readinessProbe:
          httpGet:
            path: /ready
            port: 8083
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3  # Remove from LB after 15s of failures
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: mh-tls
          mountPath: /etc/mh-tls
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: mh-tls
        secret:
          secretName: mh-service-tls
          defaultMode: 0400
