apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: dark-tower
  labels:
    app: otel-collector
    component: observability
spec:
  podSelector:
    matchLabels:
      app: otel-collector
      component: observability
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # OTLP-gRPC (:4317): only the four service pods may send traces (R-55 init_otel).
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: ac-service
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: gc-service
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: mc-service
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: mh-service
    ports:
    - protocol: TCP
      port: 4317
  # OTLP-HTTP (:4318): only GC may reach it — the /api/v1/telemetry proxy forward
  # path (R-2). No other service uses the HTTP receiver.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: gc-service
    ports:
    - protocol: TCP
      port: 4318
  # health (:13133): namespace-scoped. Kubelet probe traffic originates from the
  # node (not a pod), so a podSelector rule would never match it and would
  # crashloop the probes (per security). 13133 exposes only liveness/readiness
  # status, no telemetry payload — ns-scope is an acceptable exposure on Kind.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
    ports:
    - protocol: TCP
      port: 13133
  # Prometheus scrape of the browser `dt_client_*` series (:8889) and of the
  # collector's own telemetry (:8888). Prometheus runs in the OTHER namespace, so
  # both selectors are required.
  #
  # BOTH SELECTORS ARE KEYS OF ONE LIST ELEMENT, SO THEY AND TOGETHER. Written as
  # two `-` entries they would OR, opening the whole `dark-tower-observability`
  # namespace to these unauthenticated metrics endpoints. This mirrors
  # `infra/services/mh-service/network-policy.yaml` byte-for-byte in shape; keep
  # the family greppable.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower-observability
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8889
    - protocol: TCP
      port: 8888
  egress:
  # DNS only. The rule itself is unchanged and still correct — what changed is the
  # justification: the metrics path now has a real exporter, but the `prometheus`
  # exporter is PULL-SERVED (Prometheus connects IN on :8889, see the ingress rule
  # above), so it opens no outbound connection. `debug` writes to the container
  # log. There is still no network SINK, hence still no egress rule beyond DNS.
  # Adding `prometheusremotewrite` would change that — and was rejected for the
  # unauthenticated-write-surface reason recorded in the ConfigMap.
  # UDP + TCP 53 (TCP for large/truncated responses).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
