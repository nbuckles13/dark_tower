apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: dark-tower
  labels:
    app: otel-collector
    component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
      component: observability
  template:
    metadata:
      labels:
        app: otel-collector
        component: observability
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: otel-collector
        # Pinned to a specific contrib tag (not `latest`) so a collector upgrade
        # is a deliberate, reviewable change — see the collector-upgrade-discipline
        # runbook section (R-54 fail-hard-at-init makes botched upgrades fleet-wide
        # once R-55 lands).
        image: otel/opentelemetry-collector-contrib:0.103.1
        imagePullPolicy: IfNotPresent
        args:
        - --config=/etc/otelcol-contrib/config.yaml
        ports:
        - name: otlp-grpc
          containerPort: 4317
          protocol: TCP
        - name: otlp-http
          containerPort: 4318
          protocol: TCP
        - name: health
          containerPort: 13133
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/otelcol-contrib
          readOnly: true
        # readOnlyRootFilesystem is true; the collector needs a writable scratch
        # dir. With debug/logging exporters only (no file_storage / persistent
        # queue) an emptyDir at /tmp is sufficient — if a write error ever appears
        # the fix is an emptyDir mount, NOT loosening securityContext (per security).
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: otel-collector-config
          items:
          - key: config.yaml
            path: config.yaml
      - name: tmp
        emptyDir: {}
