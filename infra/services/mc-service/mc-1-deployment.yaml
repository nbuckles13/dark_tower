apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-1
  namespace: dark-tower
  labels:
    app: mc-service
    component: signaling
    instance: mc-1
spec:
  # MUST STAY 1 — this is a CORRECTNESS constraint, not a capacity choice.
  # The per-instance NodePort in service.yaml selects on `instance:`, so every
  # replica becomes an endpoint, while all replicas read one client-facing
  # MC_WEBTRANSPORT_ADVERTISE_ADDRESS from the single per-instance ConfigMap.
  # GC would then register N MCs advertising one URL and the NodePort would pick
  # an endpoint independently of GC's assignment — a 4-in-5 miss at
  # --replicas=5, WORSENING as you scale, presenting as intermittent join
  # failures (ADR-0023 session binding). Scale by adding an instance
  # (Deployment + ConfigMap + Service + Kind port mapping), never by raising
  # this. See service.yaml.
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: mc-service
      component: signaling
      instance: mc-1
  template:
    metadata:
      labels:
        app: mc-service
        component: signaling
        instance: mc-1
    spec:
      # COUPLED to mc-service: SHUTDOWN_TERMINATION_GRACE_SECONDS in
      # crates/mc-service/src/media_routing/teardown.rs must equal this (a unit
      # test reads this file and fails on drift). It sizes the graceful-shutdown
      # window for meeting releases: SHUTDOWN_RELEASE_BUDGET = 35 - 2 s pre-drain
      # - 5 s margin = 28 s. Raising this lengthens that window; lowering it
      # shortens it, and below 8 s the build fails.
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        # Match distroless nonroot user (uid 65532)
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: mc-service
        image: localhost/mc-service:render-required
        # Tag set at render time to the image's content tag (sha-<id>) by
        # infra/kind/scripts/deploy.sh:render_env_overlay (ADR-0038 §2). Nothing loads
        # `:render-required`, so an apply that bypasses the render fails loudly
        # (ErrImageNeverPull) instead of running a stale image. Never: a Kind-loaded
        # image is never pulled; a prod overlay sets registry, tag and pull policy.
        imagePullPolicy: Never
        ports:
        - name: grpc
          containerPort: 50052
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        - name: webtransport
          containerPort: 4433
          protocol: UDP
        env:
        - name: MC_GRPC_BIND_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_GRPC_BIND_ADDRESS
        - name: MC_HEALTH_BIND_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_HEALTH_BIND_ADDRESS
        - name: MC_WEBTRANSPORT_BIND_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_WEBTRANSPORT_BIND_ADDRESS
        - name: MC_REGION
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_REGION
        - name: GC_GRPC_URL
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: GC_GRPC_URL
        - name: AC_JWKS_URL
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: AC_JWKS_URL
        # REDIS_URL is COMPOSED from the password's one owner, redis-secrets
        # (infra/services/redis/kustomization.yaml's secretGenerator; content-addressed, so a
        # password change rolls MC) — never a second literal copy. Dependent env
        # vars: REDIS_PASSWORD MUST be declared before REDIS_URL. The owner's value must be
        # URL-safe (it is embedded unencoded).
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: REDIS_PASSWORD
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis.dark-tower:6379"
        - name: MC_BINDING_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: mc-service-secrets
              key: MC_BINDING_TOKEN_SECRET
        # OAuth 2.0 client credentials for AC authentication (ADR-0010)
        - name: AC_ENDPOINT
          value: "http://ac-service.dark-tower:8082"
        - name: MC_CLIENT_ID
          value: "meeting-controller"
        - name: MC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mc-service-secrets
              key: MC_CLIENT_SECRET
        # TLS certificate paths for WebTransport (QUIC/HTTP3)
        - name: MC_TLS_CERT_PATH
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_TLS_CERT_PATH
        - name: MC_TLS_KEY_PATH
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_TLS_KEY_PATH
        # MC's own OTel SDK wiring (R-55, task #6). Per-key configMapKeyRef
        # (this Deployment does not use envFrom), so each new key needs its own
        # entry — mirrors GC's task #26 deployment.yaml. Keep in lockstep with
        # mc-0-deployment.yaml.
        - name: OTEL_ENABLED
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: OTEL_ENABLED
        - name: OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: OTLP_ENDPOINT
        - name: OTEL_SAMPLE_RATE
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: OTEL_SAMPLE_RATE
        - name: DEPLOYMENT_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: DEPLOYMENT_ENVIRONMENT
        # ---- Client-facing media signalling (ADR-0036 §5, §6) ----
        # Every key here that an image reads is REQUIRED: mc-service reads it
        # via ConfigError::MissingEnvVar with no Rust default, so a missing key
        # CrashLoopBackOffs the pod rather than silently reverting to a value
        # nobody chose.
        #
        # THE COUPLED SET IS THREE ARTIFACTS: the ConfigMap, BOTH Deployments,
        # and the image. THIS file is where the configMapKeyRef lives, so THIS
        # file is what declares that the pod consumes a key — the ConfigMap only
        # supplies the value. Every MC ConfigMap is content-addressed
        # (ADR-0038 §2), so a value edit rolls this pod; a missing ref here is
        # NOT fixed by re-applying the ConfigMap (same pod, same crash, same key
        # in the message). Apply all three with-or-before each other; never
        # revert any independently. See docs/runbooks/mc-deployment.md
        # §Config-failure triage.
        #
        # PER WORKLOAD, NEVER UNION: mc-0-deployment.yaml and
        # mc-1-deployment.yaml carry the identical set (`dt-guard env-config`
        # rule 1 checks per workload; a key on mc-0 missing from mc-1
        # crash-loops that pod alone).
        #
        # Shared media codec profile (story 3 R-23): the encoding contract MC
        # directs, read from the SHARED `media-codec-profile` generator in the
        # sibling base infra/services/media-codec-profile/ — its single home,
        # also read by MH. Kustomize rewrites this name to the generator's
        # hashed name in the environment-root render, so a profile edit rolls
        # mc-0, mc-1, mh-0 and mh-1 together. HARD refs: required reads once
        # MC-A lands; the current image ignores them.
        - name: MEDIA_VIDEO_CODEC
          valueFrom:
            configMapKeyRef:
              name: media-codec-profile
              key: MEDIA_VIDEO_CODEC
        - name: MEDIA_VIDEO_WIDTH
          valueFrom:
            configMapKeyRef:
              name: media-codec-profile
              key: MEDIA_VIDEO_WIDTH
        - name: MEDIA_VIDEO_HEIGHT
          valueFrom:
            configMapKeyRef:
              name: media-codec-profile
              key: MEDIA_VIDEO_HEIGHT
        - name: MEDIA_VIDEO_FRAME_RATE_HZ
          valueFrom:
            configMapKeyRef:
              name: media-codec-profile
              key: MEDIA_VIDEO_FRAME_RATE_HZ
        - name: MEDIA_VIDEO_MAX_BITRATE_BPS
          valueFrom:
            configMapKeyRef:
              name: media-codec-profile
              key: MEDIA_VIDEO_MAX_BITRATE_BPS
        - name: MEDIA_VIDEO_MIN_KEYFRAME_INTERVAL_MS
          valueFrom:
            configMapKeyRef:
              name: media-codec-profile
              key: MEDIA_VIDEO_MIN_KEYFRAME_INTERVAL_MS
        - name: MEDIA_AUDIO_CODEC
          valueFrom:
            configMapKeyRef:
              name: media-codec-profile
              key: MEDIA_AUDIO_CODEC
        - name: MEDIA_AUDIO_MAX_BITRATE_BPS
          valueFrom:
            configMapKeyRef:
              name: media-codec-profile
              key: MEDIA_AUDIO_MAX_BITRATE_BPS
        - name: MEDIA_AUDIO_FRAME_RATE_HZ
          valueFrom:
            configMapKeyRef:
              name: media-codec-profile
              key: MEDIA_AUDIO_FRAME_RATE_HZ
        # Per-kind receive-slot caps (story 3 R-1, R-26). MC-only, so they live
        # in mc-service-config — NOT the profile — and the R-26 video-off lever
        # (MC_MAX_VIDEO_RECEIVE_SLOTS=0) rolls MC only. HARD refs: required
        # reads once MC-A lands; the current image ignores them.
        - name: MC_MAX_AUDIO_RECEIVE_SLOTS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_MAX_AUDIO_RECEIVE_SLOTS
        - name: MC_MAX_VIDEO_RECEIVE_SLOTS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_MAX_VIDEO_RECEIVE_SLOTS
        - name: MC_MAX_RECEIVE_CAPABILITY_DECLARATIONS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_MAX_RECEIVE_CAPABILITY_DECLARATIONS
        # RETIRED — PENDING REMOVAL: MC_MAX_RECEIVE_SLOTS (superseded by the
        # per-kind caps) and the three MC_AUDIO_* keys (superseded by
        # MEDIA_AUDIO_* in the profile). Step 1 of the two-deploy retirement:
        # these refs are `optional: true` and the keys stay present in
        # mc-service-config. The current image still READS all four as
        # required (MissingEnvVar), so the optional flag loosens nothing: a key
        # that vanished early would still fail this image's startup loudly.
        # Reads removed by MC-A; then nothing reads them, and a later deploy
        # deletes keys and refs together (docs/TODO.md §Media Path
        # Obligations, "Delete the story-3 retired config keys"). Why
        # `optional: true` here does not contradict the "DO NOT flip them" rule
        # is stated once, in infra/services/mh-service/mh-0-deployment.yaml at
        # MH_MEDIA_LATENCY_SAMPLE_RATIO.
        - name: MC_MAX_RECEIVE_SLOTS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_MAX_RECEIVE_SLOTS
              optional: true
        - name: MC_AUDIO_CODEC
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_AUDIO_CODEC
              optional: true
        - name: MC_AUDIO_MAX_BITRATE_BPS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_AUDIO_MAX_BITRATE_BPS
              optional: true
        - name: MC_AUDIO_FRAME_RATE_HZ
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_AUDIO_FRAME_RATE_HZ
              optional: true
        # ---- Meeting KEK lifecycle (ADR-0036 §4; story 2 R-12) ----
        # W, the KEK rotation debounce window. Required by MC (from task 9) with
        # no Rust default, and deliberately NOT `optional:` here: R-12's leaver
        # exposure bound IS W, so an MC running a different W from its sibling
        # makes that bound depend on which pod owns the meeting. Keep in lockstep
        # with the other mc-N-deployment.yaml; the three-artifact ordering note
        # above applies unchanged. See the key's comment in config.env.
        - name: MC_KEK_ROTATION_DEBOUNCE_SECONDS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_KEK_ROTATION_DEBOUNCE_SECONDS
        # ---- Connect settle window (ADR-0036 §9; story 2 task 20) ----
        # Required by MC with no Rust default, deliberately NOT `optional:`: a
        # pod without it must fail loudly (CreateContainerConfigError) rather
        # than start with a guessed window. Keep in lockstep with the other
        # mc-N-deployment.yaml; the three-artifact ordering note above applies.
        - name: MC_MEDIA_CONNECT_SETTLE_MS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_MEDIA_CONNECT_SETTLE_MS
        # Pod IP for gRPC advertise address (downward API)
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        # gRPC advertise address uses pod IP (cluster-internal, unchanged)
        - name: MC_GRPC_ADVERTISE_ADDRESS
          value: "http://$(POD_IP):50052"
        # Per-instance explicit WebTransport advertise address from instance ConfigMap
        - name: MC_WEBTRANSPORT_ADVERTISE_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mc-1-config
              key: MC_WEBTRANSPORT_ADVERTISE_ADDRESS
        - name: RUST_LOG
          value: "info,mc_service=debug"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3  # Restart after 30s of failures
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3  # Remove from LB after 15s of failures
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: mc-tls
          mountPath: /etc/mc-tls
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: mc-tls
        secret:
          secretName: mc-service-tls
          defaultMode: 0400
