apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-1
  namespace: dark-tower
  labels:
    app: mc-service
    component: signaling
    instance: mc-1
spec:
  # MUST STAY 1 — this is a CORRECTNESS constraint, not a capacity choice.
  # The per-instance NodePort in service.yaml selects on `instance:`, so every
  # replica becomes an endpoint, while all replicas read one client-facing
  # MC_WEBTRANSPORT_ADVERTISE_ADDRESS from the single per-instance ConfigMap.
  # GC would then register N MCs advertising one URL and the NodePort would pick
  # an endpoint independently of GC's assignment — a 4-in-5 miss at
  # --replicas=5, WORSENING as you scale, presenting as intermittent join
  # failures (ADR-0023 session binding). Scale by adding an instance
  # (Deployment + ConfigMap + Service + Kind port mapping), never by raising
  # this. See service.yaml.
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: mc-service
      component: signaling
      instance: mc-1
  template:
    metadata:
      labels:
        app: mc-service
        component: signaling
        instance: mc-1
    spec:
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        # Match distroless nonroot user (uid 65532)
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: mc-service
        image: localhost/mc-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: grpc
          containerPort: 50052
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        - name: webtransport
          containerPort: 4433
          protocol: UDP
        env:
        - name: MC_GRPC_BIND_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_GRPC_BIND_ADDRESS
        - name: MC_HEALTH_BIND_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_HEALTH_BIND_ADDRESS
        - name: MC_WEBTRANSPORT_BIND_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_WEBTRANSPORT_BIND_ADDRESS
        - name: MC_REGION
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_REGION
        - name: GC_GRPC_URL
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: GC_GRPC_URL
        - name: AC_JWKS_URL
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: AC_JWKS_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: mc-service-secrets
              key: REDIS_URL
        - name: MC_BINDING_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: mc-service-secrets
              key: MC_BINDING_TOKEN_SECRET
        # OAuth 2.0 client credentials for AC authentication (ADR-0010)
        - name: AC_ENDPOINT
          value: "http://ac-service.dark-tower:8082"
        - name: MC_CLIENT_ID
          value: "meeting-controller"
        - name: MC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mc-service-secrets
              key: MC_CLIENT_SECRET
        # TLS certificate paths for WebTransport (QUIC/HTTP3)
        - name: MC_TLS_CERT_PATH
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_TLS_CERT_PATH
        - name: MC_TLS_KEY_PATH
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_TLS_KEY_PATH
        # MC's own OTel SDK wiring (R-55, task #6). Per-key configMapKeyRef
        # (this Deployment does not use envFrom), so each new key needs its own
        # entry — mirrors GC's task #26 deployment.yaml. Keep in lockstep with
        # mc-0-deployment.yaml.
        - name: OTEL_ENABLED
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: OTEL_ENABLED
        - name: OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: OTLP_ENDPOINT
        - name: OTEL_SAMPLE_RATE
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: OTEL_SAMPLE_RATE
        - name: DEPLOYMENT_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: DEPLOYMENT_ENVIRONMENT
        # ---- Client-facing media signalling (ADR-0036 §5, §6) ----
        # All five REQUIRED: mc-service reads them via ConfigError::MissingEnvVar
        # with no Rust default, so a missing key CrashLoopBackOffs the pod rather
        # than silently reverting to a value nobody chose.
        #
        # THE COUPLED SET IS THREE ARTIFACTS: the ConfigMap, BOTH Deployments,
        # and the image. THIS file is where the configMapKeyRef lives, so THIS
        # file is what declares that the pod consumes a key — the ConfigMap only
        # supplies the value. Applying the ConfigMap alone does not roll the pods
        # (resources:, not configMapGenerator:, so no content hash) AND does not
        # fix a CrashLoop caused by a missing ref here: same pods, same crash,
        # same key in the message, which reads as "my apply did not take".
        # Apply all three with-or-before each other; never revert any
        # independently. See docs/runbooks/mc-deployment.md §Config-failure triage.
        - name: MC_MAX_RECEIVE_SLOTS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_MAX_RECEIVE_SLOTS
        - name: MC_MAX_RECEIVE_CAPABILITY_DECLARATIONS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_MAX_RECEIVE_CAPABILITY_DECLARATIONS
        - name: MC_AUDIO_CODEC
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_AUDIO_CODEC
        - name: MC_AUDIO_MAX_BITRATE_BPS
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_AUDIO_MAX_BITRATE_BPS
        - name: MC_AUDIO_FRAME_RATE_HZ
          valueFrom:
            configMapKeyRef:
              name: mc-service-config
              key: MC_AUDIO_FRAME_RATE_HZ
        # Pod IP for gRPC advertise address (downward API)
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        # gRPC advertise address uses pod IP (cluster-internal, unchanged)
        - name: MC_GRPC_ADVERTISE_ADDRESS
          value: "http://$(POD_IP):50052"
        # Per-instance explicit WebTransport advertise address from instance ConfigMap
        - name: MC_WEBTRANSPORT_ADVERTISE_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: mc-1-config
              key: MC_WEBTRANSPORT_ADVERTISE_ADDRESS
        - name: RUST_LOG
          value: "info,mc_service=debug"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3  # Restart after 30s of failures
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3  # Remove from LB after 15s of failures
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: mc-tls
          mountPath: /etc/mc-tls
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: mc-tls
        secret:
          secretName: mc-service-tls
          defaultMode: 0400
