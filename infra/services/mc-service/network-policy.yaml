apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mc-service
  namespace: dark-tower
  labels:
    app: mc-service
    component: signaling
spec:
  podSelector:
    matchLabels:
      app: mc-service
      component: signaling
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from Global Controller (meeting assignments, participant routing)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: gc-service
    ports:
    - protocol: TCP
      port: 50052
  # Allow ingress from Media Handler (participant connect/disconnect notifications)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: mh-service
    ports:
    - protocol: TCP
      port: 50052
  # Allow ingress from external clients (WebTransport)
  # In Kind, exposed via NodePort 30433 (mapped to host 4433 in kind-config.yaml)
  - from: []
    ports:
    - protocol: UDP
      port: 4433
  # Allow ingress from Prometheus for metrics scraping
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower-observability
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8081
  egress:
  # Allow egress to Global Controller (registration, heartbeat)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: gc-service
    ports:
    - protocol: TCP
      port: 50051
  # Allow egress to Redis
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow egress to Media Handler (gRPC media forwarding)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: mh-service
    ports:
    - protocol: TCP
      port: 50053
  # Allow egress to AC (OAuth token acquisition)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: ac-service
    ports:
    - protocol: TCP
      port: 8082
  # Allow egress to the OTel Collector (OTLP-gRPC) — MC's OWN span export via
  # init_otel (R-55, task #6). init_otel's collector probe is fail-hard at
  # startup, so a missing rule here CrashLoops MC the moment OTEL_ENABLED=true.
  # The collector's ingress netpol already admits mc-service on :4317
  # (pre-provisioned fleet-wide for R-55).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: otel-collector
    ports:
    - protocol: TCP
      port: 4317
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
