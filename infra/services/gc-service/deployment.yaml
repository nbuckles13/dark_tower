apiVersion: apps/v1
kind: Deployment
metadata:
  name: gc-service
  namespace: dark-tower
  labels:
    app: gc-service
    component: gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gc-service
      component: gateway
  template:
    metadata:
      labels:
        app: gc-service
        component: gateway
    spec:
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        # Match distroless nonroot user (uid 65532)
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: gc-service
        image: localhost/gc-service:render-required
        # Tag set at render time to the image's content tag (sha-<id>) by
        # infra/kind/scripts/deploy.sh:render_env_overlay (ADR-0038 §2). Nothing loads
        # `:render-required`, so an apply that bypasses the render fails loudly
        # (ErrImageNeverPull) instead of running a stale image. Never: a Kind-loaded
        # image is never pulled; a prod overlay sets registry, tag and pull policy.
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 50051
          protocol: TCP
        env:
        - name: BIND_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: gc-service-config
              key: BIND_ADDRESS
        - name: GC_GRPC_BIND_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: gc-service-config
              key: GC_GRPC_BIND_ADDRESS
        - name: GC_REGION
          valueFrom:
            configMapKeyRef:
              name: gc-service-config
              key: GC_REGION
        - name: AC_JWKS_URL
          valueFrom:
            configMapKeyRef:
              name: gc-service-config
              key: AC_JWKS_URL
        - name: AC_INTERNAL_URL
          valueFrom:
            configMapKeyRef:
              name: gc-service-config
              key: AC_INTERNAL_URL
        # In-cluster OTel collector base for the /api/v1/telemetry proxy (R-2/R-59).
        # The forwarder appends /v1/metrics or /v1/traces (telemetry_forwarder.rs).
        - name: OTEL_COLLECTOR_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: gc-service-config
              key: OTEL_COLLECTOR_ENDPOINT
        # GC's own OTel SDK wiring (R-55, task #26) — distinct from
        # OTEL_COLLECTOR_ENDPOINT above. Per-key configMapKeyRef (this
        # Deployment does not use envFrom), so each new key needs its own entry.
        - name: OTEL_ENABLED
          valueFrom:
            configMapKeyRef:
              name: gc-service-config
              key: OTEL_ENABLED
        - name: OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: gc-service-config
              key: OTLP_ENDPOINT
        - name: OTEL_SAMPLE_RATE
          valueFrom:
            configMapKeyRef:
              name: gc-service-config
              key: OTEL_SAMPLE_RATE
        - name: DEPLOYMENT_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: gc-service-config
              key: DEPLOYMENT_ENVIRONMENT
        # Browser-SDK CORS allowlist (R-1/R-3, task #5). Per-key configMapKeyRef
        # (this Deployment does not use envFrom). Base is "" (fail-closed); the
        # Kind overlay patches the ConfigMap value to the Vite dev origin.
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: gc-service-config
              key: CORS_ALLOWED_ORIGINS
        # DATABASE_URL is COMPOSED from the credential's one owner, postgres-secret
        # (infra/services/postgres/secret.yaml) — never a second literal copy. Kubernetes
        # dependent env vars: PG_* MUST be declared before DATABASE_URL, or `$(PG_*)`
        # stays literal. The owner's values must be URL-safe (they are embedded
        # unencoded; infra/kind/scripts/provision.sh enforces it for AC's copy).
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: PG_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: DATABASE_URL
          value: "postgresql://$(PG_USER):$(PG_PASSWORD)@postgres.dark-tower.svc.cluster.local:5432/$(PG_DB)"
        # OAuth 2.0 client credentials for AC authentication (ADR-0010)
        - name: GC_CLIENT_ID
          value: "global-controller"
        - name: GC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: gc-service-secrets
              key: GC_CLIENT_SECRET
        - name: RUST_LOG
          value: "info,gc_service=debug"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3  # Restart after 30s of failures
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3  # Remove from LB after 15s of failures
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
