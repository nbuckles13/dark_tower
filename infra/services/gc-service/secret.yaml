apiVersion: v1
kind: Secret
metadata:
  name: gc-service-secrets
  namespace: dark-tower
  labels:
    app: gc-service
    component: gateway
type: Opaque
stringData:
  # No DATABASE_URL here: deployment.yaml composes it from postgres-secret (the
  # credential's one owner) with dependent env vars, so there is no second copy to drift.

  # OAuth 2.0 client secret for GC authentication with AC (ADR-0010)
  # Matches the credential seeded by infra/kind/scripts/deploy.sh (seed_test_data): global-controller / global-controller-secret-dev-001
  # In production, override via external-secrets or sealed-secrets
  GC_CLIENT_SECRET: "global-controller-secret-dev-001"
