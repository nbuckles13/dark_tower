apiVersion: v1
kind: ConfigMap
metadata:
  name: gc-service-config
  namespace: dark-tower
  labels:
    app: gc-service
    component: gateway
data:
  # HTTP API bind address
  BIND_ADDRESS: "0.0.0.0:8080"
  # gRPC server for MC registration
  GC_GRPC_BIND_ADDRESS: "0.0.0.0:50051"
  # Deployment region (local for Kind)
  GC_REGION: "local"
  # AC service discovery via Kubernetes DNS
  AC_JWKS_URL: "http://ac-service.dark-tower:8082/.well-known/jwks.json"
  AC_INTERNAL_URL: "http://ac-service.dark-tower:8082"
  # In-cluster OTel collector endpoint for the /api/v1/telemetry proxy (R-2/R-59).
  # BARE BASE (scheme + host + port, NO /v1/... path): the telemetry forwarder
  # appends /v1/metrics or /v1/traces itself (telemetry_forwarder.rs:3-5,33-37).
  # A value WITH /v1/... would double-append (/v1/metrics/v1/metrics) → 404.
  # Overrides the compiled-in DEFAULT_OTEL_COLLECTOR_ENDPOINT (config.rs:34-35),
  # whose wrong `default` namespace is tracked for fix in docs/TODO.md (R-55/GC).
  OTEL_COLLECTOR_ENDPOINT: "http://otel-collector.dark-tower:4318"
  # Telemetry proxy size cap + per-user rate limit are intentionally NOT set here,
  # so GC uses the compiled-in defaults (config.rs): TELEMETRY_PROXY_MAX_BYTES =
  # 256 KiB, TELEMETRY_PROXY_RATE_LIMIT_PER_MINUTE = 60 (per-pod, in-memory GCRA).
  # COUPLING (reverse cross-ref): crates/env-tests/tests/31_gc_telemetry.rs depends
  # on those exact defaults (the 413 oversize case + the 429 rate-limit case). If
  # you set TELEMETRY_PROXY_MAX_BYTES or TELEMETRY_PROXY_RATE_LIMIT_PER_MINUTE here,
  # update that env-test's constants in lockstep (mirrors the bidirectional
  # OTEL_COLLECTOR_ENDPOINT ↔ config.rs cross-ref above).
