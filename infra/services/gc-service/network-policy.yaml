apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gc-service
  namespace: dark-tower
  labels:
    app: gc-service
    component: gateway
spec:
  podSelector:
    matchLabels:
      app: gc-service
      component: gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from Meeting Controller (gRPC registration/heartbeat)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: mc-service
    ports:
    - protocol: TCP
      port: 50051
  # Allow ingress from Media Handler (gRPC registration/heartbeat)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: mh-service
    ports:
    - protocol: TCP
      port: 50051
  # Allow ingress from external clients (browser SDK, env-tests) via the INGRESS
  # GATEWAY: in production external traffic reaches GC only through the gateway,
  # so the gateway's pods are the only external-facing source this base admits.
  # The selector is the placeholder identity of a gateway not yet chosen
  # (cloud-deploy debates pending): when one is deployed, its namespace and pod
  # label must match this rule (and the same rule in ac-service's policy), or
  # this rule is edited to match it. In Kind no such namespace exists, so this
  # rule admits nothing there; the Kind overlay adds the NodePort path instead
  # (infra/kubernetes/overlays/kind/services/gc-service/
  # network-policy-nodeport-patch.yaml). This replaced `from: []`, which
  # admitted every pod in every namespace (40_resilience asserts it cannot).
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower-ingress
      podSelector:
        matchLabels:
          app: ingress-gateway
    ports:
    - protocol: TCP
      port: 8080
  # Allow ingress from Prometheus for metrics scraping
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower-observability
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow egress to Auth Controller
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: ac-service
    ports:
    - protocol: TCP
      port: 8082
  # Allow egress to Meeting Controller (meeting creation, participant routing)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: mc-service
    ports:
    - protocol: TCP
      port: 50052
  # Allow egress to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow egress to the OTel Collector (OTLP-HTTP) — the /api/v1/telemetry proxy
  # forward path (R-2 / task #10). The collector's ingress netpol already admits
  # gc-service on :4318; this is the symmetric egress allow (zero-trust requires
  # BOTH). Without it GC's forward is blocked by its own egress policy and the
  # handler returns 502 (surfaced by 31_gc_telemetry env-tests).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: otel-collector
    ports:
    - protocol: TCP
      port: 4318
  # Allow egress to the OTel Collector (OTLP-gRPC) — GC's OWN span export via
  # init_otel (R-55, task #26). Distinct port/purpose from the :4318 HTTP rule
  # above (telemetry-proxy forward) — do NOT conflate/merge the two. The
  # collector's ingress netpol already admits gc-service on :4317 (pre-
  # provisioned fleet-wide for R-55); this is the symmetric egress allow.
  # init_otel's collector probe is fail-hard at startup, so a missing rule
  # here CrashLoops GC the moment OTEL_ENABLED=true.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: otel-collector
    ports:
    - protocol: TCP
      port: 4317
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
