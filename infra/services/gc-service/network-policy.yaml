apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gc-service
  namespace: dark-tower
  labels:
    app: gc-service
    component: gateway
spec:
  podSelector:
    matchLabels:
      app: gc-service
      component: gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from Meeting Controller (gRPC registration/heartbeat)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: mc-service
    ports:
    - protocol: TCP
      port: 50051
  # Allow ingress from Media Handler (gRPC registration/heartbeat)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: mh-service
    ports:
    - protocol: TCP
      port: 50051
  # Allow ingress from external clients (via ingress controller)
  # In Kind, we use port-forward so this allows any source on HTTP port
  - from: []
    ports:
    - protocol: TCP
      port: 8080
  # Allow ingress from Prometheus for metrics scraping
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower-observability
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow egress to Auth Controller
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: ac-service
    ports:
    - protocol: TCP
      port: 8082
  # Allow egress to Meeting Controller (meeting creation, participant routing)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: mc-service
    ports:
    - protocol: TCP
      port: 50052
  # Allow egress to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow egress to the OTel Collector (OTLP-HTTP) — the /api/v1/telemetry proxy
  # forward path (R-2 / task #10). The collector's ingress netpol already admits
  # gc-service on :4318; this is the symmetric egress allow (zero-trust requires
  # BOTH). Without it GC's forward is blocked by its own egress policy and the
  # handler returns 502 (surfaced by 31_gc_telemetry env-tests).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: otel-collector
    ports:
    - protocol: TCP
      port: 4318
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
