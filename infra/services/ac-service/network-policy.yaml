apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ac-service
  namespace: dark-tower
  labels:
    app: ac-service
    component: auth
spec:
  podSelector:
    matchLabels:
      app: ac-service
      component: auth
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from Global Controller (for JWT validation and token acquisition)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: gc-service
    ports:
    - protocol: TCP
      port: 8082
  # Allow ingress from Meeting Controller (for token acquisition)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: mc-service
    ports:
    - protocol: TCP
      port: 8082
  # Allow ingress from Media Handler (for token acquisition)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: mh-service
    ports:
    - protocol: TCP
      port: 8082
  # Allow ingress from external clients (browser sign-in, token acquisition) via
  # the INGRESS GATEWAY: in production external traffic reaches AC only through
  # the gateway, so the gateway's pods are the only external-facing source this
  # base admits. The selector is the placeholder identity of a gateway not yet
  # chosen (cloud-deploy debates pending): when one is deployed, its namespace
  # and pod label must match this rule (and the same rule in gc-service's
  # policy), or this rule is edited to match it. In Kind no such namespace
  # exists, so this rule admits nothing there; the Kind overlay adds the
  # NodePort path instead (infra/kubernetes/overlays/kind/services/ac-service/
  # network-policy-nodeport-patch.yaml). Never `from: []`: that admits every
  # pod in every namespace (40_resilience asserts it cannot).
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower-ingress
      podSelector:
        matchLabels:
          app: ingress-gateway
    ports:
    - protocol: TCP
      port: 8082
  # Allow ingress from Prometheus for metrics scraping
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower-observability
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8082
  egress:
  # Allow egress to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow egress to the OTel collector for OTLP-gRPC trace export (R-55 init_otel).
  # Default-deny egress otherwise drops this; with init_otel's fail-hard probe a
  # blocked path would CrashLoop AC when OTEL_ENABLED=true. Selector mirrors the
  # collector's ingress-from-AC rule (same namespace: dark-tower).
  - to:
    - podSelector:
        matchLabels:
          app: otel-collector
          component: observability
    ports:
    - protocol: TCP
      port: 4317
