apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ac-service
  namespace: dark-tower
  labels:
    app: ac-service
    component: auth
spec:
  podSelector:
    matchLabels:
      app: ac-service
      component: auth
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from Global Controller (for JWT validation and token acquisition)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: gc-service
    ports:
    - protocol: TCP
      port: 8082
  # Allow ingress from Meeting Controller (for token acquisition)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: mc-service
    ports:
    - protocol: TCP
      port: 8082
  # Allow ingress from Media Handler (for token acquisition)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower
      podSelector:
        matchLabels:
          app: mh-service
    ports:
    - protocol: TCP
      port: 8082
  # Allow ingress from external clients (browser sign-in / token acquisition via the
  # NodePort in Kind, the ingress gateway in production). Mirrors gc-service's rule.
  # Spike S6 finding: locally this passed only because rootless podman rewrites the
  # host's source address; a rootful Docker runner delivers the real source and
  # Calico enforces the policy.
  # Run 7: `from: []` also admitted other namespaces' pods (40_resilience caught it),
  # so admit only non-pod sources. 192.168.0.0/16 is Kind's podSubnet
  # (kind-config.yaml.tmpl) -- spike only; the real fix belongs in an overlay
  # (prod admits the ingress gateway instead).
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 192.168.0.0/16
    ports:
    - protocol: TCP
      port: 8082
  # Allow ingress from Prometheus for metrics scraping
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dark-tower-observability
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8082
  egress:
  # Allow egress to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow egress to the OTel collector for OTLP-gRPC trace export (R-55 init_otel).
  # Default-deny egress otherwise drops this; with init_otel's fail-hard probe a
  # blocked path would CrashLoop AC when OTEL_ENABLED=true. Selector mirrors the
  # collector's ingress-from-AC rule (same namespace: dark-tower).
  - to:
    - podSelector:
        matchLabels:
          app: otel-collector
          component: observability
    ports:
    - protocol: TCP
      port: 4317
