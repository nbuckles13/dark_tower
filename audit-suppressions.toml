# audit-suppressions.toml — SINGLE SOURCE OF TRUTH for audit advisory suppressions.
#
# This is the ONLY sanctioned place to suppress a security advisory (ADR-0033 §11).
# The derived files below are GENERATED from this manifest — DO NOT hand-edit them:
#   .cargo/audit.toml          (cargo-audit native ignore list)
#   .pnpm-audit-ignore.json    (post-hoc filter for `pnpm audit`)
# Regenerate after editing: `scripts/audit-suppressions-check.sh --fix`, then commit
# BOTH this manifest and the regenerated derived files.
#
# Suppression is NEVER done via ad-hoc CLI flags, hand-edited derived files, or
# Dependabot / code-scanning alert dismissals — only via an entry here, landed in a
# reviewed PR. See docs/contributor/audit-suppressions.md.
#
# Each entry: id, ecosystem (rust|js), reason (one line), expires (ISO YYYY-MM-DD),
# ticket. The always-run suppressions-check hard-fails past `expires` (re-suppress
# with a new date after re-verifying, or fix the advisory). Default duration: 90 days.
# Policy ownership: security. Machinery: infrastructure.

# RUSTSEC-2023-0071 — rsa 0.9.10 Marvin Attack (timing side-channel on RSA decryption).
#
# Exposure analysis (security, 2026-05-08; re-anchored to new manifest 2026-06-06):
#   - Pulled transitively by sqlx-macros-core compile-time query-validation
#     scaffolding, NOT by any runtime driver we select.
#   - Workspace sqlx features = ["runtime-tokio","postgres","uuid","chrono",
#     "migrate"]. No "mysql" feature; no runtime code path constructs rsa::*.
#   - INVARIANT (verify command of record): `cargo tree -p rsa --invert`
#     must show ONLY build-time consumers; no shipped binary links rsa runtime.
#   - Marvin requires attacker-observable RSA decrypt timing on a server we
#     operate. We don't ship rsa code, so there is no such surface.
#
# Upstream: no fix in rsa 0.9.x; constant-time RSA in Rust is an unsolved
# upstream problem (rust-lang/rsa#19). Waiting for a fix is waiting indefinitely.
# Expected to be the longest-lived entry here.
#
# FAIL-CLOSED: if `cargo tree -p rsa --invert` ever shows a runtime consumer,
# this suppression is void immediately — remove it, fix, or re-justify with a
# new exposure analysis. No grace period.
#
# Sunset: 90-day heavy re-justification at `expires` (2026-09-01) — re-run the
# invert command, confirm the runtime tree is still empty, re-affirm in-tree.
# ADR-0033 §12 14-day MTTR tripwire continues to apply independently.
[[suppression]]
id = "RUSTSEC-2023-0071"
ecosystem = "rust"
expires = "2026-09-01"
ticket = "docs/TODO.md (see the 'Suppressed Advisories' + 'Dependency Vulnerabilities' sections)"
reason = "rsa 0.9.10 Marvin timing side-channel; build-time-only via sqlx-macros (no mysql feature, no runtime rsa::*) — verify with `cargo tree -p rsa --invert`; fail-closed if a runtime consumer ever appears; no upstream fix. Full rationale in comment above + docs/TODO.md Cluster C."

# RUSTSEC-2025-0052 — async-std 1.13.2 unmaintained (discontinued 2025-08-24).
#
# WARNING-CLASS ADVISORY (unmaintained, not a vulnerability): cargo-audit does NOT
# deny `unmaintained` warnings, so this entry silences review noise only — the
# Layer 6 gate was never red on it and does not depend on this entry. Suppressed
# per the operations pre-authorization recorded 2026-05-25 in docs/TODO.md
# (Polyglot Pipeline Follow-ups -> async-std entry): "add an ignore-with-
# justification entry if the warning becomes review-noise before the bump lands."
# Approved by security at task #48 Gate 1 (2026-06-07): the alarm-fatigue argument
# wins — an un-actionable warning printed on every dep-change run trains readers
# to skim past cargo-audit output.
#
# ID-SCOPED: this ignores RUSTSEC-2025-0052 only. A future real CVE against
# async-std gets a different RUSTSEC id and WILL still surface — this is not a
# blanket ignore of the crate.
#
# Exposure analysis (security + infrastructure, 2026-06-07):
#   - Pulled ONLY via opentelemetry_sdk 0.24.1's `testing` feature
#     (testing -> rt-async-std -> async-std), enabled by crates/common's
#     DEV-dependency for InMemorySpanExporter (crates/common/Cargo.toml
#     [dev-dependencies]).
#   - INVARIANT (verify command of record): `cargo tree -i async-std -e normal`
#     must print nothing — async-std must never appear in the normal (non-dev)
#     dependency graph. Verified empty 2026-06-07 (independently re-run by
#     security).
#   - No shipped service binary compiles or links async-std; it exists only in
#     the test build graph + Cargo.lock.
#
# FAIL-CLOSED: if the verify command ever shows a normal-graph consumer, this
# suppression is void immediately — remove it and fix, or re-justify with a fresh
# exposure analysis. No grace period (a shipped unmaintained dep is a different
# risk class).
#
# Fix: OTel-stack migration 0.24 -> 0.29+ (registry-verified: opentelemetry_sdk's
# `testing` feature carries rt-async-std through 0.28.0; the async-std dependency
# is gone only at 0.29.0+; 0.29-era pairings are opentelemetry/opentelemetry_sdk/
# opentelemetry-otlp 0.29+ and tracing-opentelemetry 0.30+). Tracked in the ticket
# entry below (owner: observability + operations, P3). Until that lands there is
# no in-range fix.
#
# RENEWAL PLAYBOOK (expires 2026-09-05, likely BEFORE the P3 OTel migration lands.
# The entry is valid THROUGH that date; CI goes red with
# REASON=suppression-past-due starting the day after — 2026-09-06 —
# strictly-past-due semantics per __date_check, BY DESIGN):
#   1. Re-run `cargo tree -i async-std -e normal` — must still be empty.
#      If non-empty: do NOT renew; the fail-closed clause applies.
#   2. If the OTel 0.29+ migration has landed: DELETE this entry instead.
#   3. Otherwise: bump `expires` +90 days, re-affirm this analysis in the PR,
#      regenerate derived files (`scripts/audit-suppressions-check.sh --fix`).
[[suppression]]
id = "RUSTSEC-2025-0052"
ecosystem = "rust"
expires = "2026-09-05"
ticket = "docs/TODO.md -> section 'Polyglot Pipeline Follow-ups (ADR-0033 Wave 1 #1)' -> entry: async-std unmaintained warning from opentelemetry_sdk 0.24.1 transitive (RUSTSEC-2025-0052; fix = OTel 0.29+ migration, owner observability+operations)"
reason = "async-std unmaintained WARNING (non-gating; noise-only suppression). Test-build-graph-only via opentelemetry_sdk 0.24 `testing` feature (dev-dep of common) — verify with `cargo tree -i async-std -e normal` (must be empty); fail-closed if a normal-graph consumer appears. Fix = tracked OTel 0.29+ migration (rt-async-std persists through sdk 0.28.0)."

# GHSA-h67p-54hq-rp68 — js-yaml <=4.1.1 quadratic-complexity DoS via merge keys.
#
# Exposure analysis (infrastructure + security, 2026-06-20, task #54):
#   - Installed: js-yaml@3.14.2 (3.x series), via .>nx>@yarnpkg/parsers>js-yaml.
#   - @yarnpkg/parsers@3.0.2 declares "js-yaml": "^3.10.0" — constrains to 3.x only.
#   - No patched 3.x release exists: advisory specifies vulnerable_versions <=4.1.1,
#     patched_versions >=4.2.0. The fix exists ONLY in the 4.x series; there is no
#     js-yaml@3.x patch. pnpm audit flags 3.14.2 numerically (3.14.2 <= 4.1.1).
#   - Forcing a pnpm override "js-yaml>=4.2.0" would jump v3 -> v4 into a package
#     whose upstream requires ^3.10.0 — a breaking major-version injection into nx
#     tooling. Evaluated and rejected (task #54 Gate 1; js-yaml@3.x breakage risk
#     confirmed by Lead independently).
#   - Dev/build-tooling ONLY: nx project-graph parsing, not production runtime.
#     Not browser-bundled; not reachable via user-controlled input.
#
# INVARIANT (verify command of record): `pnpm why js-yaml` must show ONLY
# the .>nx>@yarnpkg/parsers (^3.10.0) and .>nx>@zkochan/js-yaml paths —
# NO production consumer, NO path outside nx tooling.
# FAIL-CLOSED: if `pnpm why js-yaml` ever shows a production consumer, this
# suppression is void immediately — remove it and fix, or re-justify.
#
# Fix: nx upstream must bump @yarnpkg/parsers to a release that declares
# "js-yaml": "^4.x". Resolves naturally when that lands; no action needed
# here except monitoring the nx@20.3.0 -> nx@21+ migration path.
#
# RENEWAL PLAYBOOK (expires 2026-09-18):
#   1. Run `pnpm why js-yaml` — must still show only the @yarnpkg/parsers
#      (3.x) / @zkochan/js-yaml path. If a production consumer appears: do
#      NOT renew; fail-closed clause applies.
#   2. Check nx changelog: if @yarnpkg/parsers was bumped to a js-yaml@^4.x
#      dep, override may now work safely — evaluate, fix, DELETE this entry.
#   3. Otherwise: bump `expires` +90 days, re-affirm this analysis in the PR,
#      regenerate derived files (`scripts/audit-suppressions-check.sh --fix`).
[[suppression]]
id = "GHSA-h67p-54hq-rp68"
ecosystem = "js"
expires = "2026-09-18"
ticket = "docs/TODO.md -> section 'Suppressed Advisories' -> row GHSA-h67p-54hq-rp68"
reason = "js-yaml <=4.1.1 merge-key quadratic DoS; installed js-yaml@3.14.2 pinned by @yarnpkg/parsers@3.0.2 (^3.10.0) — no patched 3.x release exists (fix only in 4.2.0); forcing >=4.2.0 override is a breaking v3->v4 jump into nx tooling. Dev/build-tooling only, below the high/critical gate. Resolves naturally when nx bumps @yarnpkg/parsers to a js-yaml@^4.x consumer."
