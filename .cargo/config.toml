# Cargo configuration.
#
# Build parallelism is CAPPED for every cargo invocation in this workspace — the
# validation pipeline, ad-hoc scripts, a bare `cargo build`, an IDE build, and the
# service image builds (each Dockerfile copies this directory in before compiling).
# This file is the ONE home of the number: nothing else sets it, so a new script or
# build path cannot forget to apply it.
#
# WHY (memory, not cores): the RAM peak of a Rust build is the LINK phase — several
# concurrent links at ~1.5-2GB each. cargo's only self-scaling is to CPU count
# (nproc=32 on the dev box), which is the wrong axis: more cores → more concurrent
# links → OOM. On the 16GB WSL dev box, with a Kind cluster + observability stack
# taking ~3GB, 6 concurrent jobs fit with margin and 8 do not; uncapped image builds
# (32 jobs each) with two devloops running exhausted the VM on 2026-09-27.
#
# The cap is PER cargo invocation: two devloops building at once still double the
# load (docs/TODO.md, cross-devloop build coordination).
#
# To change it for YOUR machine without changing it for everyone: export
# `CARGO_BUILD_JOBS=N` (raise on a bigger box, lower on a weaker one) or pass
# `--jobs N`. Precedence: `--jobs` > CARGO_BUILD_JOBS env > `build.jobs` here.
[build]
jobs = 6
