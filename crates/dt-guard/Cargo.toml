[package]
name = "dt-guard"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# ADR-0034: Guard pipeline as Rust binary (`dt-guard`).
# Single-crate workspace member exposing one subcommand per guard policy.
# Shell wrappers at scripts/guards/simple/*.sh invoke `dt-guard <subcommand>`.
# Workspace lints (no-panic) are enforced; static-regex `.expect()` sites carry
# line-scoped `#[allow(clippy::disallowed_methods, clippy::expect_used)]`
# per the canonical-home convention in ADR-0034 §6.

[lints]
workspace = true

[[bin]]
name = "dt-guard"
path = "src/main.rs"

[lib]
name = "dt_guard"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
once_cell = "1"
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = "0.9.42"
# Typed TOML deser for the release-profile premise guard. Deliberately the real
# parser rather than a line scanner: the artifact is determined by how *cargo*
# reads Cargo.toml, and `toml`/`winnow` is what cargo itself parses with. A
# hand-rolled scanner is a second, divergent implementation of that grammar and
# every divergence is a false-negative window (dotted keys, inline tables,
# quoted keys). @security ruling 2026-09-01; ADR-0033 audit dep-change gate
# applies.
toml = "0.8"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
