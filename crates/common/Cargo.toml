[package]
name = "common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Enable test utilities (e.g., TokenReceiver::from_test_channel,
# MetricAssertion at `observability::testing`). The test-utils feature
# is NOT default-enabled so production builds of consumer services do
# not pull in test-only dependencies (the metrics facade, the SDK's
# in-memory exporter for `observability::testing::otel`).
test-utils = ["dep:metrics", "opentelemetry_sdk/testing"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }

# Tonic for the OTel gRPC interceptor (`observability::otel_grpc`).
tonic = { workspace = true }

# HTTP types (HeaderMap/HeaderName/HeaderValue) for the OTel HTTP-transport
# adapter (`observability::otel_http`, R-56). Framework-agnostic — no axum dep.
http = { workspace = true }
# Shared request-span builders for tower-http `TraceLayer`s (R-56 inbound
# extraction hosts), so every service's request span has one definition.
tower-http = { workspace = true, features = ["trace"] }
tower = { workspace = true }

# OpenTelemetry SDK + OTLP-gRPC exporter + tracing bridge for `observability::otel`.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

# Additional dependencies
rand = { workspace = true }
secrecy = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }

# HTTP client for token management
reqwest = { workspace = true }

# Test-only deps, gated behind the `test-utils` feature.
# Used exclusively by `observability::testing::MetricAssertion`.
metrics = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }
wiremock = { workspace = true }
ring = { workspace = true }
jsonwebtoken = { workspace = true }
# For MetricAssertion's own in-file unit tests (module is cfg(test)-visible
# without needing the test-utils feature to be enabled for `cargo test -p common`).
metrics = { workspace = true }
# Pull the `testing` feature on `opentelemetry_sdk` for `InMemorySpanExporter`,
# used by `observability::otel::tests`.
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
# OTLP `TraceService` server types for the fake collector that proves
# `OtelGuard`'s shutdown flush in `observability::otel::tests`.
opentelemetry-proto = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
