[package]
name = "media-protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Deliberately minimal. This crate holds no keys, performs no cryptography, and
# emits no telemetry (ADR-0036 §4, §7, §11).
#
# `tracing` is intentionally ABSENT: without the dependency a log or metric
# macro in this crate is a compile error rather than a rule someone has to
# remember. Errors return; the caller counts them by `codec::RejectReason`.
#
# `tokio`, `serde`, `common` and the `criterion` dev-dependency were declared
# for the v1 codec and used by nothing; they are removed rather than carried.
thiserror = { workspace = true }
bytes = { workspace = true }
