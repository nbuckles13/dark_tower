[package]
name = "ac-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "ac_service"
path = "src/lib.rs"

[[bin]]
name = "auth-controller"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors", "timeout", "set-header"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
ring = { workspace = true }
bcrypt = { workspace = true }
jsonwebtoken = { workspace = true }

# Additional dependencies for auth controller
base64 = { workspace = true }

# Metrics (ADR-0011 Observability)
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# For field hashing (ADR-0011 privacy)
sha2 = "0.10"
hmac = "0.12"
hex = { workspace = true }

# Local dependencies
common = { path = "../common" }

[dev-dependencies]
# Testing utilities
ac-test-utils = { path = "../ac-test-utils" }
anyhow = { workspace = true }

# Enable common's test-utils feature for MetricAssertion in tests/.
# Per ADR-0032 Step 4: per-failure-class metric tests live in tests/ and
# require MetricAssertion's own thread-local recorder, shipped behind this feature.
common = { path = "../common", features = ["test-utils"] }

# Test framework
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true }
http-body-util = { workspace = true }

# Request-span / inbound trace-context tests (tests/otel_*.rs): exported-span
# capture and `tower::ServiceExt::oneshot` over the real router.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
tower = { workspace = true, features = ["util"] }

# Benchmarking
criterion = { workspace = true }
futures = { workspace = true }
