[package]
name = "ac-service-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]
# This is an independent workspace for fuzzing
# (not part of the main Dark Tower workspace)

[dependencies]
libfuzzer-sys = "0.4"
proto-gen = { path = "../../proto-gen" }
ring = "0.17"
base64 = { version = "0.23", default-features = false, features = ["std"] }  # mirrors root [workspace.dependencies]; dt-guard workspace-deps R3 checks version/defaults/features
serde = { version = "1.0", features = ["derive"] }

# For JWT fuzzing. Mirrors root [workspace.dependencies]; dt-guard workspace-deps
# R3 checks version/defaults/features. `aws_lc_rs` is the backend (ADR-0027):
# without it every decode panics inside signature verification.
[dependencies.jsonwebtoken]
version = "11.1"
default-features = false
features = ["aws_lc_rs"]

[[bin]]
name = "jwt_validation"
path = "fuzz_targets/jwt_validation.rs"
test = false
doc = false

[[bin]]
name = "signaling_messages"
path = "fuzz_targets/signaling_messages.rs"
test = false
doc = false
