[package]
name = "gc-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "timeout", "cors"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
bcrypt = { workspace = true }

# gRPC server/client for MC registration
tonic = { workspace = true }

# Async trait for mock implementations
async-trait = { workspace = true }

# Cancellation tokens for graceful shutdown
tokio-util = { workspace = true }

# HTTP client for JWKS fetching and AC communication
reqwest = { workspace = true }

# CSPRNG for meeting code and join token secret generation
ring = { workspace = true }

# Hex encoding for join_token_secret
hex = { workspace = true }

# Metrics (ADR-0011 Observability)
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Telemetry proxy (R-2): OTLP protobuf message types + per-user rate limiter.
# opentelemetry-proto supplies the OTLP message structs; prost decodes/re-encodes
# the filtered payload; governor is the per-`sub` keyed rate limiter.
opentelemetry-proto = { workspace = true }
governor = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }

# Local dependencies
# `db`: the shared Postgres connect path (`common::db`); only AC and GC enable it.
common = { path = "../common", features = ["db"] }
proto-gen = { path = "../proto-gen" }

[lib]
name = "gc_service"
path = "src/lib.rs"

[[bin]]
name = "gc-service"
path = "src/main.rs"

[dev-dependencies]
criterion = { workspace = true }
gc-test-utils = { path = "../gc-test-utils" }
anyhow = { workspace = true }
http-body-util = { workspace = true }
wiremock = { workspace = true }
futures = { workspace = true }
tower = { workspace = true, features = ["util"] }
# Re-export for integration tests (metrics-exporter-prometheus is also in deps)
metrics-exporter-prometheus = { workspace = true }
# JWT/base64 used in test code (auth_layer async_tests)
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
# Enable common's test-utils feature for MetricAssertion in tests/
# (mirrors AC's pattern — ADR-0032 Step 5).
common = { path = "../common", features = ["test-utils", "db"] }
# R-56 trace-continuity integration tests (tests/otel_*.rs) construct
# SpanContext fixtures and a local TracerProvider/OpenTelemetryLayer directly
# — transitive via `common` is not enough for `use`, hence direct dev-deps.
# Not needed in production code (gc-service's non-test deps stay thin; see
# devloop plan §Cargo.toml).
opentelemetry = { workspace = true }
# "testing" pulls in InMemorySpanExporter, used by
# otel_grpc_inbound_continuity.rs to assert the actual exported span's
# trace_id (not just that the RPC succeeded) — mirrors common's own dev-dep
# shape for the same feature.
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
tracing-opentelemetry = { workspace = true }
# Real mock Tonic server for otel_http_grpc_bridge.rs / otel_grpc_inbound_continuity.rs
# (mirrors mh-service/tests/common/mock_mc.rs's TcpListenerStream pattern —
# bind first to learn the OS-assigned port, then adapt to tonic's incoming stream).
tokio-stream = { workspace = true }
