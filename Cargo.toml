[workspace]
resolver = "2"

members = [
    "crates/gc-service",
    "crates/mc-service",
    "crates/mh-service",
    "crates/ac-service",
    "crates/ac-test-utils",
    "crates/gc-test-utils",
    "crates/mc-test-utils",
    "crates/mh-test-utils",
    "crates/common",
    "crates/proto-gen",
    "crates/media-protocol",
    # NON-PRODUCTION reference generator for the cross-language frame vectors.
    # A workspace MEMBER, deliberately not an `exclude` entry: excluded crates are
    # not compiled by the pipeline (the standing complaint in docs/TODO.md about
    # the two fuzz workspaces), and an excluded generator could rot silently and
    # take the drift gate with it.
    "crates/media-vector-gen",
    "crates/env-tests",
    "crates/devloop-helper",
    "crates/dt-guard",
    "crates/dt-story",
]

exclude = [
    "crates/ac-service/fuzz",
    "crates/media-protocol/fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Dark Tower Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nbuckles13/dark_tower"

[workspace.lints.rust]
# Allow cfg(coverage) for llvm-cov instrumentation
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[workspace.lints.clippy]
# ADR-0002: No-Panic Error Handling Policy
# These lints enforce zero-panic production code at compile time
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"

# Web frameworks
axum = "0.8"
tower = "0.5"
tower-http = "0.7"
# HTTP types (HeaderMap/HeaderName/HeaderValue) shared by axum/reqwest/tonic.
# Direct dep for `common::observability::otel_http` (R-56 HTTP propagation);
# previously only transitive.
http = "1"

# QUIC/WebTransport
quinn = "0.11"
wtransport = "0.7"

# Lock-free snapshot publication. Readers take an `Arc` with no guard lifetime
# (`ArcSwap::load_full`), which `tokio::sync::watch` cannot offer: its
# `borrow()` holds an internal RwLock read for the guard's life, so holding one
# across a per-frame forwarding decision would block the publisher.
arc-swap = "1.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14"
prost-types = "0.14"

# gRPC
tonic = "0.14"
tonic-prost-build = "0.14"
tonic-prost = "0.14"

# Database clients
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
redis = { version = "0.26", features = ["tokio-comp", "connection-manager"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
# `default-features = false`: 0.33's defaults add the OTLP/HTTP exporter
# (`http-proto` + `reqwest-blocking-client`), which would pull a second reqwest
# (0.13) into the lock. We export over gRPC only; `internal-logs` is kept so SDK
# export failures surface through our subscriber (observability ruling).
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace", "internal-logs"] }
tracing-opentelemetry = "0.34"
# OTLP protobuf message types for the GC telemetry proxy (R-2). Message types
# only (no gRPC transport) — GC re-encodes with prost and forwards over reqwest.
# Moves in lockstep with the opentelemetry crates above (0.33 requires
# prost ^0.14 + tonic ^0.14.1, the workspace's own prost/tonic).
opentelemetry-proto = { version = "0.33", features = ["gen-tonic-messages", "metrics", "trace"] }

# Rate limiting
# In-process GCRA keyed rate limiter for the GC telemetry proxy (R-2,
# per-JWT-`sub`). `dashmap` feature backs the keyed state store.
governor = { version = "0.10", features = ["std", "dashmap"] }

# Error handling
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"

# Utilities
# Hoisted to the workspace at story task 16 (@security S16). It was declared
# directly at `crates/common/Cargo.toml`, and a second direct declaration in
# `mh-service` would have created an independent pin on a crate whose 0.9
# release RENAMED both APIs the MH latency sampler uses (`from_entropy` ->
# `from_os_rng`, `gen_bool` -> `random_bool`): a later bump of one consumer
# would leave the other compiling against the old API with nothing flagging
# the split. `small_rng` is opted into per consumer, not here — only the
# sampler needs it.
rand = "0.8"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.9"

# Cryptography (for E2E encryption and passwords)
ring = "0.17"
rustls = "0.23"
bcrypt = "0.15"
secrecy = { version = "0.10", features = ["serde"] }
hex = "0.4"

# JWT
jsonwebtoken = "9.3"
# `default-features = false` drops the `simd-unsafe` default (0.23+), the crate's
# only `unsafe` code: we use only the scalar `general_purpose` engines. Every
# member inherits this entry (no member-level literal, which would re-enable
# defaults for the whole graph through feature unification); the excluded
# `crates/ac-service/fuzz` workspace repeats it, checked by dt-guard
# workspace-deps R3.
base64 = { version = "0.23", default-features = false, features = ["std"] }

# Metrics. `metrics` is the process-global recorder facade; it and the exporter
# move together (dt-guard workspace-deps R4 fails on a second `metrics` in the lock).
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# HTTP client. Every consumer uses rustls with defaults off.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
http-body-util = "0.1"
futures = "0.3.31"
tokio-stream = "0.1"

# CLI and parsing (dt-guard, dt-story, devloop-helper, env-tests)
clap = { version = "4", features = ["derive"] }
regex = "1.10"
serde_norway = "0.9.42"

# Testing
criterion = "0.5"
wiremock = "0.6"
tempfile = "3"
assert_cmd = "2"
rcgen = "0.13"
# Used by no member: the pin the two root-`exclude` fuzz workspaces share. They cannot
# inherit, so each repeats it, and dt-guard workspace-deps R3 binds both to this entry.
libfuzzer-sys = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
