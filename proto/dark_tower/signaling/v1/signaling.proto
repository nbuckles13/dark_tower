syntax = "proto3";

package dark_tower.signaling.v1;

import "google/protobuf/timestamp.proto";

// ============================================================================
// Media vocabulary (ADR-0036)
// ============================================================================

// What a media stream carries. Replaces the pre-ADR-0036 `StreamType` and
// `MediaType`, which were duplicate spellings of one concept.
//
// This is a client/MC concept only. A media handler is deliberately blind to
// it (ADR-0036 §7): MH cannot decrypt, so media-type awareness would be
// knowledge it has no legitimate source for, and a new media kind must cost
// zero MH changes. The subscriber learns the kind from its own slot
// declaration, never from a frame.
enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_AUDIO = 1;
  MEDIA_KIND_VIDEO_CAMERA = 2;
  MEDIA_KIND_VIDEO_SCREEN = 3;
}

// Codec vocabulary, defined once for both directions: what a participant
// declares it can handle (`ParticipantCapabilities.supported_codecs`) and what
// MC directs it to produce (`EncodingParameters.codec`).
//
// A closed enum rather than free-form strings so that "MC directed a codec the
// participant never declared" is checkable rather than merely wrong. Media
// kind is NOT encoded positionally by which list a value appears in — it is a
// property of the codec's own identity, so there is exactly one home for the
// classification.
//
// `CODEC_UNSPECIFIED` is never valid in a send directive. Zero is not a silent
// Opus, the same fail-closed rule `TransportMode` carries: an unset field must
// not select a codec by default, or the closed-set property is defeated on
// every directive that forgets to set it. Enforcement is MC-side (story task
// 14); the proto cannot check it.
enum Codec {
  CODEC_UNSPECIFIED = 0;
  CODEC_OPUS = 1;
  CODEC_VP9 = 2;
  CODEC_AV1 = 3;
  CODEC_H264 = 4;
  // The only video codec MC directs in story 3 (ADR-0036 §5). A client
  // declares it in `ParticipantCapabilities.supported_codecs` only after BOTH
  // `VideoEncoder.isConfigSupported` and `VideoDecoder.isConfigSupported`
  // pass for the directed profile; a client that cannot encode or decode it
  // fails loudly at media start (story 3 R-8).
  CODEC_VP8 = 5;
}

// How a media stream is carried on the wire (ADR-0036 §1, §5).
//
// Transport mode is not compiled in: it is a per-stream behaviour MC assigns,
// so moving video to datagrams-plus-FEC later is a configuration change.
//
// `TRANSPORT_MODE_UNSPECIFIED` is fail-closed: MC MUST assign a mode, and the
// zero value is not a convenient "datagram" default. A client receiving
// UNSPECIFIED on a send target MUST reject the directive rather than guess.
enum TransportMode {
  TRANSPORT_MODE_UNSPECIFIED = 0;
  // One frame per QUIC datagram. Audio today (ADR-0036 §1).
  TRANSPORT_MODE_DATAGRAM = 1;
  // One unidirectional QUIC stream per group of pictures: a stream opens at
  // each independently-decodable frame and is finished or reset when the next
  // group begins. Video today. The stream's head-of-line blocking scope equals
  // the decode-dependency scope, which is what fixes the granularity.
  TRANSPORT_MODE_STREAM_PER_GROUP = 2;
}

// The state of one of a subscriber's receive slots (ADR-0036 §6).
//
// Slot state is explicit on the wire because **absence of frames is not a
// signal**. "Withheld by congestion", "fewer sources than slots" and "source
// unreachable" are indistinguishable to a client — all present as no media —
// and render completely differently. A client that cannot tell them apart
// shows the same spinner for a bandwidth problem, an under-filled grid, and a
// participant it can never see.
//
// OBSERVABILITY (ADR-0036 §11): a slot is a stream identity. Slot state may be
// aggregated into a bounded counter; it MUST NOT be joined to a slot id,
// sender id or meeting id in a metric label or span attribute. Telemetry
// labels follow these wire names, lower-snake without the prefix (`active`,
// never "live"); the bounded label set is MC's `slot_state_label`, not a
// count restated here.
//
// A FLAT ENUM (story 3 wire freeze, ADR-0036 §6): one value per thing a
// receiver renders, so "live plus a reason" is unrepresentable and each value
// maps one-to-one onto telemetry. A slot is live (`ACTIVE`), an avatar for a
// named participant with a reason (`AVATAR_*`), or one of the sourceless
// states (`FEWER_SOURCES_THAN_SLOTS`, `UNAVAILABLE`).
//
// RETAINED, NEVER EMITTED: `WITHHELD_BY_CONGESTION`, `SOURCE_UNREACHABLE` and
// `SWITCH_PENDING`. A consumer that receives one, or any number it does not
// name (an open enum decodes unknown values as integers), MUST fail closed
// (render nothing from the slot) AND count it, never guess.
enum SlotState {
  SLOT_STATE_UNSPECIFIED = 0;
  // Steady: live. A source is assigned and real media should be arriving.
  //
  // VIDEO: MC does NOT name the source (`StreamAssignment.sender_id` absent);
  // the client attributes live video from the frame's signature-verified
  // key-id sender, which avoids racing the new source's keyframe. AUDIO: MC
  // names the source. A live slot with no decoded frame yet keeps showing what
  // it showed before (no spinner for a steady state).
  SLOT_STATE_ACTIVE = 1;
  // Was `SLOT_STATE_SOURCE_MUTED` ("the source is present but muted", both
  // mute causes in one value). Deleted by MC-B; replaced by
  // `SLOT_STATE_AVATAR_CLIENT_MUTED` and `SLOT_STATE_AVATAR_SERVER_MUTED`,
  // because story 3 R-4 renders the two causes distinctly.
  reserved 2;
  reserved "SLOT_STATE_SOURCE_MUTED";
  // RETAINED, NEVER EMITTED: congestion withholding is not built. Consumers
  // fail closed and count (enum header).
  SLOT_STATE_WITHHELD_BY_CONGESTION = 3;
  // Steady: the meeting has fewer eligible sources than the subscriber's
  // slots of this kind. No sender, no url.
  SLOT_STATE_FEWER_SOURCES_THAN_SLOTS = 4;

  // Was `SLOT_STATE_ZERO_REQUESTED` ("the subscriber requested zero of this
  // kind"). RESERVED 2026-10-13 because it is UNEMITTABLE: the state would
  // ride a `StreamAssignment` whose `slot_id` ECHOES a `ReceiveSlot.slot_id`
  // the subscriber chose, and a subscriber declaring zero slots of a kind owns
  // no slot id of that kind to echo. Inventing one (e.g. 0) would break the
  // echo property. The earlier "kept rather than reserved, per-kind
  // declarations make it emittable" reasoning was wrong: owning ids of the
  // OTHER kind does not give this kind an id. A zero-slot declaration of a
  // kind yields no assignment of that kind.
  reserved 5;
  reserved "SLOT_STATE_ZERO_REQUESTED";

  // RETAINED, NEVER EMITTED. Was the pinned-unreachable state (ADR-0036 §9);
  // no client pins under static fill. Unreachability stays per subscriber on
  // `StreamAssignments.unreachable_sender_ids` (story 2 R-33), and an
  // unreachable participant consumes no slot. Consumers fail closed and count.
  SLOT_STATE_SOURCE_UNREACHABLE = 6;
  // RETAINED, NEVER EMITTED. "Pending" (source assigned, no group start yet) is
  // MH-INTERNAL: it persists with no give-up timeout while the source stays
  // assigned and is visible only as an MH metric. The MH-to-MC
  // switch-completion report it would need is deferred to story 5 (dynamic
  // selection). When emitted, it carries the requesting command id in
  // `StreamAssignment.switch_command_id`: completion is reported by command
  // id, never by state description, because "A to B complete" is ambiguous
  // when a slot has switched to B, reverted to A, and switched to B again.
  // Consumers fail closed and count until then.
  SLOT_STATE_SWITCH_PENDING = 7;
  // Steady avatar: the named participant publishes no video. VIDEO SLOTS ONLY
  // -- audio slots take audio publishers only, so a participant without audio
  // has no audio representation. Video slots take any participant sharing a
  // connected handler with the subscriber, receive-only participants included.
  SLOT_STATE_AVATAR_NO_VIDEO = 8;
  // Steady and permanent for the declaration: this declared slot is over MC's
  // per-kind cap (`JoinResponse.max_audio_receive_slots` /
  // `max_video_receive_slots`) and was TRUNCATED. No sender, no url; echoes the
  // declared `slot_id`. Changes only on a redeclaration. A video cap of 0 makes
  // every video slot UNAVAILABLE (the video-off lever, story 3 R-26).
  // Truncation never fails a join (supersedes story 2 R-1's reject rule).
  SLOT_STATE_UNAVAILABLE = 9;
  // Steady avatar: the named participant client-muted this kind. Both kinds.
  SLOT_STATE_AVATAR_CLIENT_MUTED = 10;
  // Steady avatar: the named participant is server-muted for this kind. Both
  // kinds. WINS over `SLOT_STATE_AVATAR_CLIENT_MUTED` when both hold.
  SLOT_STATE_AVATAR_SERVER_MUTED = 11;
}

// ============================================================================
// Capabilities and join
// ============================================================================

// Participant capabilities during join.
message ParticipantCapabilities {
  // Pre-ADR-0036 shape, removed in full.
  //
  // `video_codecs`/`audio_codecs` were free-form strings whose media-kind
  // classification was encoded positionally; both collapse into
  // `supported_codecs`, where the classification lives in the codec's own
  // identity.
  //
  // `supports_simulcast`: simulcast and scalable coding are explicitly out of
  // scope in ADR-0036.
  //
  // `max_video_streams`: superseded by `ReceiveCapability` (ADR-0036 §6). A
  // scalar maximum and an explicit per-slot list are two representations of
  // one constraint, and the slot list is strictly more expressive — it carries
  // media kind and an optional pin per slot, and its length IS the count.
  // Keeping both would let them disagree.
  reserved 1 to 4;

  reserved "video_codecs", "audio_codecs", "supports_simulcast", "max_video_streams";

  // Codecs this participant can encode and decode. An upper bound on what the
  // client can do — never a lower bound on what the meeting accepts.
  //
  // Unbounded on this client-to-server wire; the proto does not enforce a cap.
  // Server-side configuration caps it and MC REJECTS an over-cap declaration,
  // same as the other two unbounded repeated fields in this message
  // (`supported_header_versions`, and `ReceiveCapability.slots`). Enforcement
  // owner: story task 10 (join-path validation).
  repeated Codec supported_codecs = 5;

  // Frame header versions (ADR-0036 §2) this client can produce and consume.
  //
  // The header version is meeting-wide and MC-directed: it sits in the signed
  // publisher region, so a relay cannot translate between versions, and MC
  // carries the one version in the send directive.
  //
  // SECURITY — a negotiation surface. Header v3 is the ONLY version (story 3
  // R-22; v2 is an intentional wire break with no dual decode). A join whose
  // list lacks 3 is REFUSED AT JOIN, before admission (no slot, sender id or
  // roster entry is allocated), with the existing generic join-refusal shape,
  // no version echoed, and counted at MC: the operator-queryable signal for an
  // old SDK meeting a new MC. Owner: MC-A. There is NO allowlist and NO floor
  // machinery (no production clients exist): a single accepted version needs
  // neither. An empty list lacks 3 and is refused — fail closed, never
  // "accept anything".
  //
  // The list is unbounded on this wire; the proto does not enforce a cap.
  // Server-side configuration caps it.
  //
  // (2026-10-13: the former "ENFORCEMENT NOT YET ALLOCATED" paragraph and the
  // allowlist-plus-minimum-floor rule are deleted; the v3-only refusal above
  // replaces both, and the `docs/TODO.md` entry that tracked them is closed.)
  //
  // ANCHOR (DRY): the cross-language single source of truth for the header
  // version is `proto/test-vectors/frame-v3.vectors.json`;
  // `crates/media-protocol/src/frame.rs::PROTOCOL_VERSION` is the Rust-side
  // derivation. Precedence: vectors beat prose, but a vector contradicting a
  // recorded ruling is a defect to escalate rather than conform to — see
  // `docs/TODO.md` §Media Path Obligations.
  repeated uint32 supported_header_versions = 6;
}

// Request to join a meeting (ADR-0023 Session Binding Token Pattern)
//
// First connection: correlation_id and binding_token are empty.
// Reconnection: Client provides previous correlation_id and binding_token
// for session recovery.
message JoinRequest {
  string meeting_id = 1;
  string join_token = 2; // JWT from GC (always required, must be fresh)
  string participant_name = 3;
  ParticipantCapabilities capabilities = 4;
  // Session recovery fields (ADR-0023)
  string correlation_id = 5; // UUIDv7, empty for first join
  string binding_token = 6; // HMAC-SHA256 binding token, empty for first join

  // The client's raw Ed25519 identity signing public key (ADR-0036 §4 step 2).
  // Exactly 32 bytes: the raw key, NOT PEM, JWK, base64 or SPKI.
  //
  // This story performs NO attestation check. MC does not verify this key
  // against the meeting token's `cnf` thumbprint, and publishes it on the
  // roster as received — trust on first use. A frame signature verified
  // against it therefore proves only that every frame came from the same
  // keyholder; it never proves WHO that keyholder is, and for a guest it never
  // proves more than a pseudonym. The client-validated AC attestation that
  // closes this is the attestation story (ADR-0036 addendum).
  //
  // The proto does not validate length. MC MUST length-check 32 before
  // publishing a client-controlled blob to every participant on the roster;
  // the enforcement lands in story task 10 (MC join path), NOT task 3.
  // Empty means NO KEY PUBLISHED: consumers MUST fail closed and MUST NOT fall
  // back to accepting unsigned frames.
  //
  // Identity keys are scoped to ONE MEETING, not to a participant across
  // meetings (ADR-0036 §4): a key reused across meetings makes a participant
  // linkable by public key regardless of display name, which matters most for
  // the guests who have the least identity assurance to begin with.
  //
  // OBSERVABILITY: public material, so not a do-not-log rule — but a stable
  // per-participant identifier for the meeting's lifetime. Never a metric
  // label, never a span attribute, never a per-frame log dimension.
  bytes identity_public_key = 7;

  // What this participant publishes (story 3 R-2): any subset of
  // {`MEDIA_KIND_AUDIO`, `MEDIA_KIND_VIDEO_CAMERA`}. EMPTY means it publishes
  // nothing (receive-only). FIXED FOR THE MEMBERSHIP: camera off is mute, not a
  // capability change, and a reconnect presenting a different publish SET
  // (order-insensitive) is refused and counted -- otherwise a participant could
  // slip out from under a mute by rejoining with a different set.
  //
  // MC VALIDATES FIRST, and rejects (generic, counted) -- never ignores -- a set
  // containing `MEDIA_KIND_UNSPECIFIED`, `MEDIA_KIND_VIDEO_SCREEN` (a kind this
  // story does not serve), an unknown value (the enum is open, so an unknown
  // number decodes as an integer), or a duplicate.
  //
  // THEN THE NEITHER-PUBLISH-NOR-RECEIVE REFUSAL: a join with no publish kinds
  // and no slots in `receive_capability` AS SENT -- judged before per-kind
  // truncation -- is refused at join with a generic, counted reason, never
  // admitted to a silent empty meeting. Truncation itself never fails a join
  // (`SLOT_STATE_UNAVAILABLE`).
  repeated MediaKind publish_kinds = 8;

  // The INITIAL receive declaration, carried on the join so the
  // neither-publish-nor-receive check above runs at join. ABSENT means zero
  // slots of each kind -- not an error by itself; the participant is admitted
  // if it publishes something. Same validation as the post-join path.
  //
  // The post-join `ClientMessage.receive_capability` stays the REDECLARATION
  // path; a redeclaration that would leave the participant neither publishing
  // nor receiving is refused (generic, counted).
  ReceiveCapability receive_capability = 9;
}

// Information about the media server.
//
// Kept as a message rather than collapsed to a bare URL string: this is the
// join-time handler DESCRIPTOR, and ADR-0036 §9 (handler unreachability) and
// §10 (transport seam) are expected to add per-handler fields to it. The
// vestigial `reserved 2` is what makes it look unearned today.
message MediaServerInfo {
  // Server-to-client. Same spelling as `SendTarget.media_handler_url` and
  // `StreamAssignment.media_handler_url` — one name for one concept.
  string media_handler_url = 1;

  // `connection_token` is not reused, so both halves are reserved (CONVENTIONS
  // §Rule 5): the number keeps a future field off tag 2, the name keeps a
  // future field from silently re-adopting the old identifier.
  reserved 2;
  reserved "connection_token";
}

// Encoding parameters for one media stream (ADR-0036 §5).
//
// The single encoding vocabulary in this file. Replaces the pre-ADR-0036
// `StreamMetadata`/`VideoMetadata`/`SimulcastLayer` cluster; simulcast and
// scalable coding are explicitly out of scope in ADR-0036.
//
// One shape for audio and video. Audio ignores `width`, `height` and
// `frame_rate`; the fields are present anyway so a later video story needs no
// wire change.
message EncodingParameters {
  // Server-to-client when carried on a send directive.
  Codec codec = 1;
  uint32 max_bitrate_bps = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 frame_rate = 5;

  // The minimum interval between keyframes the publisher may produce on this
  // stream, in milliseconds (story 3 R-11, R-12, R-23). There is no keyframe
  // interval: keyframes are produced on demand -- for a `KeyframeRequest`, or
  // because a target has no group in progress (amendment 4) -- and this bounds
  // both.
  //
  // VIDEO ONLY, AND REQUIRED ON VIDEO: a client REFUSES a video stream
  // directed without it. The client enforces max(directed value, its compiled
  // 100 ms floor), so neither an absent nor a tiny directed value can raise its
  // keyframe rate. Audio ignores it (every audio frame is independently
  // decodable); MC leaves it absent on audio.
  //
  // THE SINGLE NORMATIVE HOME for its source: MC's own ConfigMap key
  // `MC_VIDEO_MIN_KEYFRAME_INTERVAL_MS` (`mc-service-config`; range
  // 100..=10000, default 500), read by MC only. It is NOT in the shared
  // `media-codec-profile`, and MH does not read it (story 3 amendment 4). MC
  // directs it here and publishes the same parsed value as the gauge
  // `mc_media_video_keyframe_min_interval_seconds`. It is server-configured,
  // never client-reported: a client-reported value would let a patched client
  // suppress the keyframe-storm alert. Other sites name the key and point
  // here.
  //
  // NOT IDENTITY OR KEY MATERIAL: a configuration value, safe to log.
  optional uint32 min_keyframe_interval_ms = 6;
}

// Media stream information.
message MediaStream {
  string stream_id = 1;

  // Pre-ADR-0036: `StreamType stream_type = 2` and `StreamMetadata metadata =
  // 3`. Both take fresh tags rather than being re-pointed: the media-kind
  // enum's zero value changes meaning (old `AUDIO = 0`, new
  // `MEDIA_KIND_UNSPECIFIED = 0`), so an old peer's audio stream would decode
  // as "unspecified" on a re-pointed tag rather than failing.
  reserved 2, 3;

  reserved "stream_type", "metadata";

  MediaKind media_kind = 4;
  EncodingParameters encoding = 5;
}

// Participant information — the meeting roster.
//
// ADR-0036 §4: NO KEY MATERIAL RIDES ON THE ROSTER. The only key-bearing field
// is `identity_public_key`, which is a public key. No meeting KEK, no wrapped
// transmit key, no key id, no thumbprint.
message Participant {
  string participant_id = 1;
  string name = 2;
  repeated MediaStream streams = 3;
  uint64 joined_at = 4;

  // This participant's numeric sender id. See `JoinResponse.sender_id` for the
  // full range, allocation and fail-closed rules — stated once there and
  // referenced here so the key-id layout has one place to change.
  //
  // Present on the roster because a receiver resolves an arriving frame's key
  // id to `sender_id`, `sender_id` to this roster entry, and this entry to
  // `identity_public_key` for Ed25519 verification (ADR-0036 §2, §3). That
  // chain is unexpressible with the key alone.
  optional uint32 sender_id = 5;

  // This participant's raw Ed25519 identity signing public key, as received in
  // their `JoinRequest`. Exactly 32 bytes.
  //
  // NOT attested, NOT verified, NOT trusted — this story performs no
  // attestation check of any kind. MC publishes what the client sent. A
  // compromised or malicious MC can therefore publish a key it controls for a
  // participant that does not exist, and nothing here detects it; the
  // client-validated AC attestation that closes this is the attestation story
  // (ADR-0036 addendum), and when it lands the attestation wins over the roster
  // on disagreement.
  //
  // Empty means no key published: consumers MUST fail closed and MUST NOT fall
  // back to accepting unsigned frames from this participant. MC enforces the
  // 32-byte length before publishing to this roster in story task 10 (join
  // path), NOT task 3 — same owner as the sender_id and meeting_kek checks.
  bytes identity_public_key = 6;

  // This participant's client mute, per kind, as of the MC actor turn that
  // built this entry; any later `ParticipantMuteUpdate` for this participant
  // supersedes it. Set iff MC knows: ABSENT until the participant has reported
  // that kind, and absent MUST NOT be rendered as unmuted (presence rules and
  // the carrier map: the Mute-state section header). Client mute only — server
  // mute is not on the roster.
  optional bool audio_client_muted = 7;
  // As `audio_client_muted`, for video.
  optional bool video_client_muted = 8;
}

// Response to join request (ADR-0023 Session Binding Token Pattern)
//
// For first join: MC generates new correlation_id and binding_token.
// For reconnection: MC issues new binding_token (nonce rotates on success).
// Client must store correlation_id and binding_token for reconnection.
message JoinResponse {
  string participant_id = 1;

  // Pre-ADR-0036: `uint64 user_id = 2` (hardcoded 0) and `EncryptionKeys
  // encryption_keys = 5` (single-key model, superseded by ADR-0036 §4's KEK
  // model).
  //
  // `sender_id` deliberately does NOT re-point tag 2. `uint64` and `uint32`
  // are both varint, so a repurposed tag 2 is the one change in this reshape
  // that an old peer would decode successfully with the wrong semantics —
  // reading a per-meeting sender id as a durable user id. A fresh tag makes it
  // absent instead of plausible-but-wrong.
  reserved 2, 5;

  reserved "user_id", "encryption_keys";

  repeated Participant existing_participants = 3;
  // Connection bootstrap only: the media handlers this meeting is registered on,
  // for the client to open transports to. EVERY handler in this list is OFFERED,
  // and the client connects to ALL IT CAN — the transport is active/active. What
  // the client actually reaches becomes its connected set, which is what MC's
  // §9 reachability is computed from.
  //
  // NON-AUTHORITATIVE for send placement — this list does not decide where a
  // client sends. THE SOLE SOURCE OF A TRANSMIT ADDRESS IS
  // `SendTarget.media_handler_url`, on the send directive, and a sender sends to
  // EVERY target it is given.
  //
  // DO NOT DERIVE A TRANSMIT ADDRESS FROM A RECEIVE-SIDE FIELD. In particular it
  // is NOT the active slot's `StreamAssignment.media_handler_url`: that names the
  // handler carrying a stream this client RECEIVES, and a sender's targets are
  // the handlers carrying its OUTGOING edges — which are the handlers named on
  // its SUBSCRIBERS' slots, not on its own. The two coincide in a
  // single-handler meeting and diverge as soon as edges span handlers, so code
  // written against the coincidence passes every one-handler test and
  // mis-addresses in production.
  //
  // This list is deliberately left unordered and is not the selection mechanism:
  // relying on its order — selecting off its first element — silently diverges
  // from the directive. Its first element is not a selection and carries no
  // relationship to placement.
  repeated MediaServerInfo media_servers = 4;
  // Session recovery fields (ADR-0023)
  string correlation_id = 6; // UUIDv7, client stores for reconnection
  string binding_token = 7; // Client stores for reconnection (30s TTL)

  // The joiner's numeric sender id for this meeting. THE canonical statement of
  // this field's rules; the roster and `StreamAssignment` reference it.
  //
  // Valid range 1..=65535. **Zero is never valid**, and there is no zero
  // sentinel: absence is expressed by field presence, not by a magic value.
  // Absent means MC has not assigned one — the state this story ships, since
  // the allocator is story task 10.
  //
  // A `uint32` on the wire carrying 16-bit semantics: the 64-bit SFrame key id
  // allots 16 bits to the sender. ANCHOR (DRY): the key-id layout —
  // `sender_id` (16 bits) | `stream` (8 bits) | `generation` (40 bits) — is
  // documented at `crates/media-protocol/src/frame.rs::KEY_ID_BYTES`.
  //
  // MC is both the allocator and the enforcement point. The proto cannot check
  // the range and does not. MC MUST enforce it with `NonZeroU16` — NOT a bare
  // `u16::try_from`, which accepts 0, the one value this contract reserves as
  // invalid — and MUST fail closed on violation: refuse the join, refuse the
  // assignment, never truncate or wrap. An out-of-range value does not fail
  // loudly on its own: it truncates into the key id's 16-bit sender field and
  // corrupts attribution, surfacing as an Ed25519 verification failure against
  // the WRONG participant's key.
  //
  // Receiver-side, and this holds even under `optional` — explicit presence
  // says the field was set, not that it was set sensibly, and a peer can send
  // zero. A consumer MUST NOT use `sender_id = 0` for key-id construction or
  // roster lookup, MUST NOT substitute 0 for an absent value (no
  // `unwrap_or(0)`, no `?? 0`), MUST NOT attribute frames to an absent id, and
  // MUST reject rather than treat either as an anonymous participant. A shared
  // zero is not a recycled id, it is N concurrently-live colliding ones: since
  // the key id encodes (sender, stream, generation), the wrap nonce is derived
  // from the key id and the key id is the associated data, two senders at zero
  // with the same stream and generation wrap distinct transmit keys under the
  // same KEK at the same nonce — AES-GCM authentication-key recovery, not
  // merely a confidentiality loss (ADR-0036 §4).
  //
  // Nonce-uniqueness invariants this id participates in, ALL scoped to one KEK
  // GENERATION (ADR-0036 §4, amendment 2026-09-26 under "Key identifiers and
  // stop/start"):
  //   1. Within one KEK generation a `sender_id` is bound to at most one
  //      identity, EVER — never reissued in that generation, even after its
  //      holder leaves. The only path to reissue is MC's sender-id epoch reset
  //      on namespace exhaustion, which atomically bumps the KEK generation
  //      and reclaims every id MC cannot show is free — held by a rostered
  //      member (reconnect-grace members included) OR still bound at a media
  //      handler (MH releases a binding only on connection close, which can
  //      outlive roster removal). A later joiner may therefore legitimately receive
  //      a departed participant's id under a NEWER generation.
  //   2. Transmit-key generation is monotonic per (KEK generation,
  //      `sender_id`); a key id is never reused under one KEK.
  //
  // NOT "never recycled while a KEK is live": receivers retain the previous
  // generation for a bounded window, so a reissued id does coexist with a
  // still-usable old KEK. The scope is the generation, not KEK liveness — and
  // receiver state must be keyed the same way. That receiver obligation has no
  // wire representation; it lives in the ADR, not here.
  //
  // This is a PER-MEETING id MC allocates. It is NOT derived from, and NOT, a
  // stable user identity — carrying a durable user id into the media path
  // would reintroduce exactly the cross-meeting linkability that ADR-0036 §4's
  // meeting-scoped keys exist to prevent.
  //
  // OBSERVABILITY (ADR-0036 §11): never a metric label, never a span
  // attribute, never a per-frame log dimension. Note the rename away from
  // `user_id` removes this field's incidental coverage by the dt-guard PII
  // vocabulary, so this comment carries that weight now.
  optional uint32 sender_id = 8;

  // The meeting key-encryption key (ADR-0036 §4 step 3). AES-256: exactly 32
  // bytes. Empty means NOT YET PROVISIONED — the state this story ships, since
  // MC's KEK generation is story task 10.
  //
  // Every participant MC admits receives this KEK; there is no other
  // condition, no group protocol, and no key material on the roster. Senders
  // wrap their per-stream transmit keys under it and carry the wrapped key
  // in their own frames, so a joiner needs no round trip and no existing
  // member is touched.
  //
  // What this does and does not claim, stated in ADR-0036 §4's own words:
  // media is encrypted between clients; MH, transport and storage cannot read
  // it; MC can. This is accepted operator custody, recorded as the user's risk
  // decision. It MUST NOT be described as end-to-end against the operator, or
  // as zero-trust. Telemetry carries `key_custody=operator` in place of any
  // end-to-end boolean.
  //
  // SECURITY: live key material. Never logged, never a span attribute, never a
  // metric label, never placed in an error or panic payload, and NEVER crosses
  // the MC-to-MH contract — MH holds no keys, and that is a guard rather than
  // a convention. Consumers MUST fail closed: never wrap or unwrap under a KEK
  // of any length other than 32; an empty or all-zero KEK is never a usable
  // key. Derived `Debug` is suppressed for this message in
  // `crates/proto-gen/build.rs`; see the redacting impl in
  // `crates/proto-gen/src/lib.rs`.
  bytes meeting_kek = 9;

  // The generation of `meeting_kek`. A `uint32` carrying u16 semantics, to
  // match the frame's wrapped-key field. ANCHOR (DRY):
  // `crates/media-protocol/src/frame.rs::KEK_GENERATION_FIELD_BYTES` = 2.
  // Range-checked to 65535 by MC via `u16::try_from`.
  //
  // Deliberately has NO sentinel: 0 is a plausible legal first generation, so
  // the not-provisioned signal is `meeting_kek` not being exactly 32 bytes.
  // Do not gate on `kek_generation != 0` — that would give one field two
  // meanings.
  //
  // Note 65535 here and 65535 on `sender_id` are the same magnitude and
  // DIFFERENT CONCEPTS. Do not share a constant or a validation helper between
  // them: the two bounds are independent — a sender-id epoch reset DOES
  // trigger a KEK rotation (so the events are coupled), but the id namespace
  // and the generation counter exhaust at unrelated rates and mean unrelated
  // things — and collapsing them silently loses `sender_id`'s
  // never-reissued-within-one-KEK-generation invariant (`sender_id` above).
  // Same recorded boundary as `AEAD_TAG_BYTES` versus AC's at-rest
  // storage-envelope tag length.
  //
  // OBSERVABILITY: never a metric label, never a span attribute, and never a
  // per-frame log dimension — this IS a frame-header field
  // (`crates/media-protocol/src/frame.rs::KEK_GENERATION_FIELD_BYTES`), so
  // per-frame logging is the most reachable hazard of the three for it. And it
  // looks safe when it is not — it is monotonic over the meeting's life, so its
  // label cardinality is unbounded over TIME rather than bounded by its type,
  // and it advances on the §4 leave debounce, which makes a per-meeting
  // generation series a membership-change trace, de-anonymising by inspection
  // in the two-person case. Logging it inside an already-redacted `Debug` is
  // fine and useful.
  uint32 kek_generation = 10;

  // W: the meeting's KEK rotation debounce window, in seconds -- the same value
  // MC is configured with via `MC_KEK_ROTATION_DEBOUNCE_SECONDS` (ADR-0036 §4
  // Rotation, "Participant leaves"). THE canonical statement of this field's
  // rules; `MeetingKekUpdate.kek_rotation_debounce_seconds` references it.
  //
  // Carried here as well as on the push because the reconnect response is
  // JoinResponse-shaped and a reconnecting participant may hold an older
  // generation it still needs to open in-flight frames against. A first joiner
  // holds no previous generation and ignores it.
  //
  // WHAT THE CLIENT DERIVES, AND WHY THIS FIELD IS THE GUARANTEE'S HOME. The
  // client holds at most ONE previous KEK generation, for a retention of
  // `min(W / 2, ceiling)` computed at the consumer. Deriving it there, from W,
  // is what makes "retention is shorter than W" STRUCTURAL rather than a
  // cross-service check: both bounds only ever pull retention DOWN, so
  // retention < W holds at every value of W. The CEILING exists because
  // retention serves one purpose -- opening frames already in flight when a
  // rotation lands, a LATENCY-SCALE need of seconds -- and must not scale with
  // policy-scale W without bound: at a misconfigured W of a day, W/2 would
  // hold a superseded KEK in client memory for twelve hours to serve a
  // thirty-second need (key minimisation against client memory compromise). Do
  // not delete the `min()` as redundant. The ceiling's value is the client's,
  // derived from a stated frames-in-flight assumption, and lives at the
  // client's single config point; no number is restated here.
  //
  // The client MUST also check that the derived retention exceeds its own
  // transmit-key re-wrap latency; a retention shorter than that drops frames
  // from senders that have not yet re-wrapped.
  //
  // ZERO OR ABSENT (a non-optional scalar, so ONE observable): the client
  // substitutes its documented FLOOR constant, counts it, logs at WARN, and
  // NEVER hard-fails. An MC one version older does not send this field, and
  // that is exactly the supported rollback (story 2 R-24); `error` on a
  // supported path trains responders to ignore it. The count MUST distinguish
  // FLOOR-SUBSTITUTED (older MC: expected during a rollback) from
  // CEILING-CLAMPED (MC configured at a scale the client will not follow:
  // unexpected) -- two conditions with different owners and opposite
  // expectedness must not share one number. Either two counters or one bounded
  // dimension; any dimension must ride an attribute key GC's telemetry
  // allowlist admits (`crates/gc-service/src/services/telemetry_filter.rs`),
  // with its values homed in the client's vocabulary. That count is the ONLY
  // signal a fleet is running on the floor or ceiling instead of the negotiated
  // W, because nothing fails. The WARN line carries the received value and the
  // substituted one -- never the KEK, never the generation.
  //
  // NOT KEY MATERIAL. A duration: safe to log, shown in the clear by the
  // redacting `Debug`. OBSERVABILITY: bounded by configuration, but a value
  // rather than a category -- the log line, not a label.
  uint32 kek_rotation_debounce_seconds = 11;

  // Was `max_receive_slots`: MC's single cap on the TOTAL slots one
  // declaration may carry, a declaration over it rejected whole. Deleted by
  // MC-B; replaced by the per-kind caps below, which TRUNCATE (story 3 R-1).
  reserved 12;
  reserved "max_receive_slots";

  // MC's per-kind receive-slot caps (story 3 R-1, R-23):
  // `MC_MAX_AUDIO_RECEIVE_SLOTS` and `MC_MAX_VIDEO_RECEIVE_SLOTS`, in MC's own
  // ConfigMap so the video-off lever (a video cap of 0) rolls MC only. THE
  // canonical statement of these two fields' rules.
  //
  // INFORMATIONAL, for runtime readability of the effective caps. MC
  // TRUNCATES: a declaration with more slots of a kind than its cap keeps the
  // first `cap` slots of that kind IN DECLARATION ORDER, and every excess slot
  // is reported `SLOT_STATE_UNAVAILABLE` -- visible, never a silent
  // participant, never a join failure. A client therefore needs no
  // pre-check and MUST NOT shrink its declaration from these values.
  //
  // 0 is LEGAL for either kind (a video cap of 0 disables video, R-26).
  // Absent means an MC that does not send them; the caps are then unknown,
  // which costs a client nothing because truncation is reported per slot.
  //
  // PER SESSION. The values describe the MC instance that served THIS join.
  // Instances can differ during a configuration rollout, and an ADR-0023
  // recovery reconnect receives a fresh `JoinResponse`, so a client uses the
  // latest values it received and never caches them across joins.
  //
  // NOT IDENTITY OR KEY MATERIAL: bounded configuration values, safe to log.
  // OBSERVABILITY: log values, never metric labels.
  optional uint32 max_audio_receive_slots = 13;
  optional uint32 max_video_receive_slots = 14;
}

// Reason for participant leaving.
//
// Value 0 is `LEAVE_REASON_UNSPECIFIED` per buf STANDARD, which displaces the
// pre-ADR-0036 `VOLUNTARY = 0`. The five real reasons are renumbered to 5..9
// and 1..4 are RESERVED rather than re-pointed: re-pointing would have an old
// peer's `2` (`CONNECTION_LOST`) decode as `KICKED`, a plausible-but-wrong
// read on a forensics-adjacent field. The one unavoidable exception is value
// 0 itself, which proto3 forces to exist and so cannot be reserved: an old
// peer's `VOLUNTARY` now reads as `UNSPECIFIED`. That degrades in the safe
// direction — a real value collapsing to the fail-closed reading, never to a
// different real value.
enum LeaveReason {
  LEAVE_REASON_UNSPECIFIED = 0;

  reserved 1 to 4;

  LEAVE_REASON_VOLUNTARY = 5;
  LEAVE_REASON_KICKED = 6;
  LEAVE_REASON_CONNECTION_LOST = 7;
  LEAVE_REASON_MEETING_ENDED = 8;
  LEAVE_REASON_TIMEOUT = 9; // ADR-0023: 30s disconnect grace period expired
}

// ============================================================================
// Mute state (ADR-0023, terminology per ADR-0036 §5)
// ============================================================================
//
// Two distinct things are called muting, and the terminology matters because
// the enforcement point follows from who decided:
//
//   Client mute — decided by the participant about themselves, enforced at
//   capture on the client, protects the user from the server. No media leaves
//   the device; this must not depend on the server honouring it.
//
//   Server mute — decided by meeting policy about someone else, enforced at MH
//   ingress, protects the meeting from a patched client.
//
// "Host mute" is deliberately avoided as a term: it presumes a role model this
// system has not defined.
//
// FOUR INDEPENDENT CONTROLS (story 3 R-15, ADR-0036 §5 amendments 2026-10-13
// and 2026-10-23):
// client audio, client video, server audio, server video. They compose: a
// request about one kind never changes the other kind's state, and client and
// server mute of one kind are independent. Server mute of a kind WITHDRAWS
// that kind's send directive (capture stops; for video the camera light goes
// off) AND MH keeps dropping that stream at ingress as the backstop against a
// patched client. The send directive NEVER depends on client mute, which keeps
// "MC has not asked you to send" distinct from "you muted yourself"; under
// client mute nothing of that kind leaves the device (no silence, no DTX, no
// video), and MH learns it as a PAUSED source, never an ingress drop. Any
// video mute stops the camera track; an audio mute of either cause keeps the
// mic open and only stops sending. A server unmute restores the directive
// whatever the client mute, so it resumes capture unless the participant is
// client-muted (see `ParticipantMuteUpdate` for the notice it requires).
//
// PER-KIND FIELDS ARE `optional bool` on both request messages. ABSENT means
// "that kind is unchanged"; a request with BOTH absent is refused with a
// generic message and counted, and changes nothing. TAG-COMPATIBLE BUT NOT
// SEMANTICS-COMPATIBLE with a pre-optional encoder: a proto3 implicit-presence
// `bool` omits `false` from the wire, so an old sender's `false` (an unmute)
// is indistinguishable from absent and reads as "unchanged". Senders MUST set
// every kind they mean to change, including an explicit `false`.
//
// WHO SEES WHAT, AND WHERE A CLIENT LEARNS IT (the carrier map; story 3 R-15
// fix, ADR-0036 §5 amendment 2026-10-24). Every participant sees every other
// participant's client mute AND server mute, per kind, whether or not any of
// its slots carries that participant. Story-2 security judgment S-2 (self-mute
// does not fan out; slot state is the only client-mute signal) is REVERSED by
// that amendment.
//
//   Client mute: snapshot on the roster entry (`Participant.audio_client_muted`
//   / `video_client_muted`, on `JoinResponse.existing_participants` and on
//   `ParticipantJoined`), then deltas on `ParticipantMuteUpdate` (same field
//   names and tags).
//
//   Server mute: snapshot by the post-JoinResponse replay (one
//   `ParticipantMuteUpdate` per participant server-muted in either kind, so
//   `server_muted_by` / R-11 have one carrier), then deltas on
//   `ParticipantMuteUpdate`.
//
// CLIENT-MUTE FIELDS ARE SET IFF MC KNOWS (`optional bool`, everywhere they
// appear). MC holds no client-mute fact for a kind until that participant has
// reported it (`MuteRequest`); until then the field is ABSENT, never `false`.
// ABSENT means "no fact": consumers MUST NOT render it as unmuted and render
// "unknown" instead. On entering joined, a client MUST report its current
// client mute for every kind in its `JoinRequest.publish_kinds`, explicit
// `false` included (one kind per `MuteRequest` is fine). A kind it does not
// publish is never reported and stays ABSENT (no fact) for the whole
// membership; MC ignores a report for it (`MuteRequest`). A peer cannot
// distinguish an unpublished kind from an unreported one: both are absent and
// render "unknown". A fresh join or a rejoin is therefore "unknown" to peers
// until that report lands. That window is display-only -- capture is enforced
// locally -- so it is never a reason to trust the roster for capture. The
// latest PRESENT value wins; an absent field on a later message changes
// nothing.

// Request to update client-mute status.
//
// The participant's own client mute, per kind. Enforced at capture. MC
// reflects it to MH as `SOURCE_DISPOSITION_PAUSED` (forward nothing, never an
// ingress drop) and to holders as `SLOT_STATE_AVATAR_CLIENT_MUTED`; it never
// changes the send directive. Absent = unchanged; both absent is refused with
// a generic message and counted (section header). A kind not in the
// participant's `JoinRequest.publish_kinds` is ignored: no fact recorded,
// nothing fanned out, counted (`not_published`); a published kind in the same
// request still applies.
message MuteRequest {
  optional bool audio_muted = 1;
  optional bool video_muted = 2;
}

// Notification of participant mute state change.
//
// EMISSION (carrier map and presence rules: Mute-state section header). Every
// message is a FULL SNAPSHOT of what MC knows, never a delta: the server
// fields and `server_muted_by` always, each client field iff MC knows it
// (absent = no fact). A request that changes nothing emits nothing.
//   - A server-mute change goes to EVERY participant, the subject included
//     (R-10, R-11, R-18 below).
//   - A client-mute change (a reported fact changed, including the first
//     report of a kind) goes to every participant EXCEPT the subject. It is
//     coalesced latest-state-wins under a per-meeting bound (ADR-0036 §5
//     amendment 2026-10-24): under churn a fact may be delayed by the bound,
//     never dropped by it, and intermediate transitions may be skipped.
//     Clients MUST NOT infer or count transitions from these messages.
//   - The subject's own copy (server-mute changes only) carries its client-mute
//     fields too; the subject MUST NOT treat them as a capture command. Client
//     mute is enforced locally.
//
// SELF COPY AND RESUMED CAPTURE (story 3 R-18). A participant learns its OWN
// server-mute state ONLY from its own copy of this message. So when a server
// unmute will restore capture, MC MUST send the participant's self update
// BEFORE the send-directive change that restores capture, on the same
// MC-to-client signalling stream, in order. FAIL-SAFE: a client MUST NOT
// resume capture on a server-unmute path without showing the non-suppressible
// "a host resumed your camera/microphone" notice, even if that order is
// violated (a directive restoring a kind the client last saw server-muted
// shows the notice whatever arrived first). A host action CAN resume a
// participant's camera or mic unless the participant is client-muted.
message ParticipantMuteUpdate {
  string participant_id = 1;

  // Pre-2026-10-24: `bool audio_self_muted = 2; bool video_self_muted = 3;`,
  // informational snapshots taken at a server-mute change and never a
  // client-mute source. Retired rather than re-pointed: an old MC still writes
  // them, and a reader trusting them as facts would show a stale value that
  // never updates. The fresh optional tags 7/8 below replace them.
  reserved 2, 3;

  reserved "audio_self_muted", "video_self_muted";

  bool audio_server_muted = 4; // Directive withdrawn + ingress drop (ADR-0036 §5)
  bool video_server_muted = 5; // Directive withdrawn + ingress drop (ADR-0036 §5)

  // Participant id of the actor who applied the server mute, if any.
  //
  // SECURITY: server-to-client, but relayed identity. Truncate before logging
  // (256-byte bound, as `MhConnectionStatus.mh_url`); never log unbounded.
  string server_muted_by = 6;

  // Client mute: enforced at capture, PAUSED at MH. Set iff MC knows (section
  // header); absent = no fact.
  optional bool audio_client_muted = 7;
  // As `audio_client_muted`, for video.
  optional bool video_client_muted = 8;
}

// Server-mute request: mute a participant by meeting policy (ADR-0036 §5).
// Enforced by MC (the kind's send directive is withdrawn) and MH (ingress
// drop, the backstop), unlike `MuteRequest`, which the client enforces at
// capture. Renamed from the pre-ADR-0036 `HostMuteRequest`; same message, same
// tag, no behaviour change.
//
// Host-only, requester taken from the connection, refused generically and
// counted, rate-bounded (story 2 R-8; story 3 R-15 extends it per kind).
//
// Per-kind fields are `optional bool` (story 3 R-15; presence rules at the
// section header). Each kind is independent: absent = unchanged, and both
// absent is refused with the generic message and counted. Before MC-B, MC
// folded both fields into one mute/unmute action, so a request about one kind
// could change the other.
message ServerMuteRequest {
  string participant_id = 1;
  optional bool audio_muted = 2;
  optional bool video_muted = 3;

  // Optional free-text reason. Accepted by MC but NOT relayed:
  // `ParticipantMuteUpdate` has no reason field, so the muted participant
  // never sees it.
  //
  // SECURITY: client-controlled. Consumers MUST truncate before logging
  // (256-byte bound) and MUST NOT render it as trusted markup.
  string reason = 4;
}

// Participant request to unmute after being server-muted.
//
// Dual-use: sent client->MC as `ClientMessage.unmute_request`, and relayed
// MC->host as `ServerMessage.unmute_request`. Receiving it does NOT lift a
// server mute (R-10); see `participant_id`.
message UnmuteRequest {
  bool request_audio = 1;
  bool request_video = 2;

  // Server-stamped on the MC->host relay: MC sets this to the requester's
  // participant id from the authenticated connection and OVERWRITES any value
  // a client sent. Ignored on the client->MC receive path. UnmuteRequest
  // crosses the trust boundary in BOTH directions (client->MC request, MC->host
  // relay), so participant_id is authoritative in neither direction on the
  // wire; only the MC-stamped relay value is trustworthy. Identity relayed to
  // the host: truncate before logging (256-byte bound, as
  // `MhConnectionStatus.mh_url`), never log unbounded (same register as
  // `ParticipantMuteUpdate.server_muted_by`). Receiving this does NOT lift a
  // server mute; only the host's ServerMuteRequest with that kind set false does
  // (R-10).
  //
  // Tag 3, not 1 as `participant_id` is on most messages in this file, because
  // 1 and 2 were taken when it was added. Deliberate; do not renumber.
  string participant_id = 3;
}

// Response to an unmute request from a participant with mute authority.
message UnmuteResponse {
  string participant_id = 1;
  bool audio_approved = 2;
  bool video_approved = 3;
}

// ============================================================================
// ADR-0023: MC Migration / Redirect
// ============================================================================

// Server notification to client to reconnect to a different MC
// Sent during graceful shutdown, load shedding, or rebalancing
message RedirectToMc {
  string new_mc_endpoint = 1; // WebTransport endpoint of target MC
  string meeting_id = 2;
  string reason = 3; // "migration", "rebalance", "capacity"
}

// Notification of participant joining
message ParticipantJoined {
  Participant participant = 1;
}

// Notification of participant leaving
message ParticipantLeft {
  string participant_id = 1;
  LeaveReason reason = 2;
}

// Request to publish a new stream.
message PublishStream {
  string stream_id = 1;

  // Pre-ADR-0036 `StreamType stream_type = 2` / `StreamMetadata metadata = 3`;
  // fresh tags for the same reason as on `MediaStream`.
  reserved 2, 3;

  reserved "stream_type", "metadata";

  MediaKind media_kind = 4;
  EncodingParameters encoding = 5;
}

// Notification of stream being published
message StreamPublished {
  string participant_id = 1;
  MediaStream stream = 2;
}

// ============================================================================
// Receive capability and slot assignment (ADR-0036 §6)
// ============================================================================

// One receive slot a subscriber declares it can decode and render.
//
// A slot is a statement about what the client can DECODE, not about
// presentation: which participant lands in which slot is MC's decision, from
// meeting state the client does not have. The pre-ADR-0036 contract had the
// client specifying grid geometry, which inverts that.
message ReceiveSlot {
  // Subscriber-chosen identifier for this slot, echoed back in
  // `StreamAssignment.slot_id`.
  //
  // SCOPED TO ONE SUBSCRIBER'S CONNECTION — NOT globally unique. A media
  // handler's routing table MUST be keyed on (subscriber, slot_id), never on
  // `slot_id` alone, or two subscribers both choosing slot 0 collide.
  //
  // Must be unique within one `ReceiveCapability`: MC REJECTS a declaration
  // containing duplicates, never last-write-wins — a duplicate means "two
  // sources into one slot".
  //
  // A `uint32` on the wire carrying 16-bit semantics: this is the value MH
  // writes into the frame's relay-region `stream_id` ON THE DOWNLINK, which is
  // what lets a receiver validate an arriving `stream_id` against its own
  // declared slots. RELAY IDS ARE HOP-LOCAL (ADR-0036 §2, amendment
  // 2026-10-13): on the uplink the same 16-bit relay field carries the
  // publisher's `SendStream.stream_number` (MC's send id); on the downlink MH
  // rewrites it to this subscriber's `slot_id`. It is not merely
  // "subscriber-scoped" on every hop.
  // ANCHOR (DRY): `crates/media-protocol/src/frame.rs::STREAM_ID_FIELD_BYTES`
  // = 2. This is also NOT the 8-bit key-id `stream` field, which lives in the
  // signed key id, not the relay region (the reciprocal of the disclaimer on
  // `SendStream.stream_number`). This is NOT `sender_id`'s bound either:
  // that one is an allocation bound (key-id derived, never reissued within
  // one KEK generation), this one is a validation bound (relay-region
  // derived, per-subscriber, freely reusable across declarations). Do NOT
  // introduce a shared `MAX_16BIT_ID` constant or a shared
  // `validate_16bit_id()` helper — collapsing them silently loses
  // `sender_id`'s per-generation non-reissue invariant.
  //
  // SECURITY: client-controlled input that MC forwards into the relay-region
  // address space. MC MUST validate the 16-bit range and the server-side slot
  // cap with `u16::try_from` and REJECT THE WHOLE DECLARATION on violation.
  // Not a `debug_assert!` — release profiles do not enable debug assertions,
  // so it would be compiled out in exactly the builds facing untrusted
  // clients. Not clamp-or-truncate — reject, never silently truncate into the
  // u16 relay field. Blast radius is bounded to this subscriber's own slots,
  // which is WHY rejecting suffices and no cross-participant validation is
  // needed — but that bound depends entirely on the (subscriber, slot_id)
  // keying above holding in MH. The two conditions are load-bearing for each
  // other. Enforcement owner: story task 14.
  //
  // OBSERVABILITY (ADR-0036 §11): a slot is a stream identity. Never a metric
  // label, never a span attribute, never a per-frame log dimension. "Slot 3 is
  // stalling" is a legitimate operational question answered by the bucketed
  // slot-state gauge plus MC's assignment state at investigation time, not by
  // a per-slot series.
  uint32 slot_id = 1;

  // What this slot can decode.
  MediaKind media_kind = 2;

  // Optional pin: the source this subscriber wants in this slot.
  //
  // A per-slot OPTIONAL PARAMETER, never a parallel list — which is what makes
  // "seven pins into six slots" unrepresentable rather than merely invalid.
  // Every constraint here is an upper bound, so any subset is a valid
  // fulfilment and an unsatisfiable request cannot be expressed.
  //
  // Zero is not a legal pin target, per `JoinResponse.sender_id`. This is the
  // one place MC receives an attacker-supplied `sender_id`, so `Some(0)` is
  // rejected like any other out-of-range pin.
  optional uint32 pinned_sender_id = 3;
}

// A subscriber's declaration of what it can receive (ADR-0036 §6).
//
// The client states what it can decode and render; MC composes the experience
// and decides who appears where. This is also a security property:
// resource-amplification-by-request becomes structurally impossible rather
// than rate-limited.
message ReceiveCapability {
  // The declared slots.
  //
  // Unbounded on this wire; the proto does not enforce a cap. Slot count is
  // capped PER KIND by server-side configuration (ADR-0036 §6, amendment
  // 2026-10-13): MC TRUNCATES each kind to its cap and reports every excess
  // slot `SLOT_STATE_UNAVAILABLE`, never rejecting the declaration for its
  // count; the caps are advertised on `JoinResponse.max_audio_receive_slots`
  // / `max_video_receive_slots`.
  repeated ReceiveSlot slots = 1;
}

// ============================================================================
// Send directives (ADR-0036 §5)
// ============================================================================

// One destination for a produced stream.
message SendTarget {
  // Server-to-client. Same spelling as `MediaServerInfo.media_handler_url`.
  string media_handler_url = 1;

  // How to carry this stream to this target.
  //
  // The send directive carries transport mode and NOT priority group. Priority
  // group is an MC-to-MH egress property on the internal registration contract
  // (ADR-0036 §7): MC assigns each egress stream a priority group explicitly,
  // and those groups BOUND how far a self-declared salience signal can promote
  // a participant. A client able to name its own priority group could promote
  // itself past that bound, which turns "hold the meeting's audio floor" into
  // a one-line client patch.
  TransportMode transport_mode = 2;
}

// One media stream MC directs a client to produce (ADR-0036 §5).
//
// Different encodings are DIFFERENT STREAMS, not one stream with divergent
// per-target encodings. That is what keeps the encrypt-once invariant true by
// construction: different encodings mean different plaintext, so there is no
// single ciphertext to fan out, and modelling it otherwise would require
// either per-destination encryption (nonce reuse — catastrophic) or two
// counters per frame. A stream sent to several targets is encoded and
// encrypted ONCE and transmitted N times.
message SendStream {
  // The publisher's stream index -- MC's SEND ID for this stream. THE single
  // source of truth for stream numbers: video is 1 (`MEDIA_KIND_VIDEO_CAMERA`,
  // `CODEC_VP8`, `TRANSPORT_MODE_STREAM_PER_GROUP`), audio stays 0. Each
  // independent stream (simulcast layers later) gets its own number.
  //
  // A `uint32` on the wire carrying 8-BIT semantics: the 64-bit SFrame key id
  // allots 8 bits to the stream. ANCHOR (DRY): the layout is documented at
  // `crates/media-protocol/src/frame.rs::KEY_ID_BYTES`.
  //
  // IT IS ALSO THE UPLINK RELAY ID (story 3 wire freeze; ADR-0036 §2, relay
  // ids are hop-local): the publisher stamps this value into the frame's
  // 16-bit relay-region `stream_id` on every frame it sends to a handler,
  // through one function for both kinds, and MH attributes the frame by
  // (connection-bound sender, this id) against MC's
  // `dark_tower.internal.v1.SourceStream` list. Two fields, one value: the
  // 8-bit key-id field and the 16-bit relay field. The relay copy is
  // publisher-set, UNAUTHENTICATED at MH, and never cross-checked against the
  // key id; a signed header copy was considered and dropped, because the
  // publisher sets both label and key id, so signing protected nothing. On the
  // DOWNLINK MH rewrites the relay field to the subscriber's
  // `ReceiveSlot.slot_id`, which is 16-bit and subscriber-scoped.
  //
  // MC MUST enforce the range with `u8::try_from` and fail closed; the proto
  // cannot. Enforcement owner: story task 14.
  //
  // OBSERVABILITY (ADR-0036 §11): stream identity. Never a metric label, never
  // a span attribute, never a per-frame log dimension.
  uint32 stream_number = 1;

  MediaKind media_kind = 2;
  EncodingParameters encoding = 3;

  // Where to send it. ONE TARGET PER HANDLER owning at least one of this
  // stream's outgoing edges, so a multi-target set is the NORMAL case whenever a
  // sender's subscribers are spread across handlers.
  //
  // SEND TO EVERY TARGET. Dropping targets after the first is SILENT — the
  // sender transmits, its own uplink looks healthy, and only the subscribers
  // behind the skipped handlers hear nothing. There is no error and no frame to
  // count, so this failure presents as "some peers can't hear me" with nothing
  // red anywhere.
  //
  // ENCRYPT ONCE, TRANSMIT N TIMES — and that is a CRYPTO SAFETY rule, not an
  // efficiency preference. It is stated normatively in THIS FILE at the
  // `SendStream` message header directly above (per-destination encryption =>
  // nonce reuse => catastrophic), and deliberately NOT restated here: a second
  // wording of a nonce-reuse rule is a second thing that can drift, and a reader
  // who finds the weaker copy stops looking. The header is the single normative
  // home; this is a pointer into it.
  //
  // The mechanical consequence for an implementer, which is where this gets got
  // wrong: the AEAD sequence is allocated ONCE PER FRAME, per (sender, stream),
  // BEFORE fanout, and the IDENTICAL sealed bytes go to every target. ADR-0036
  // §2 fixes that counting scope at per (sender, stream) — NOT per target and
  // NOT per send path. A per-target counter restarts under the same transmit
  // key, which is a nonce repeat, and §2 states the consequence: it "leaks the
  // authentication subkey and permits forgery". So fanning out by giving each
  // target its own sequence source is not a performance regression, it forfeits
  // integrity for that key.
  //
  // AN EMPTY TARGET SET MEANS SEND NOTHING — MC turns off publishers nobody
  // watches. Resuming from empty is a keyframe event, and the sender rotates its
  // transmit key at that point (ADR-0036 §4).
  //
  // WITHDRAWAL IS AN EMPTY SET, NEVER REMOVAL (story 3 R-8, R-16, R-17). MC
  // directs a kind only while at least one subscriber holds the stream in a
  // slot of that kind AND the kind is not server-muted. A withdrawn stream,
  // and a published-but-never-watched one, stays LISTED with an EMPTY target
  // set; a kind the participant does not publish is NEVER listed. A video
  // withdrawal stops capture (the camera light goes off). Every start or
  // resume begins with a keyframe.
  repeated SendTarget targets = 4;
}

// What MC directs this client to produce, and where (ADR-0036 §5).
//
// CLIENT MUTE STAYS DIRECTED: the directive NEVER depends on client mute; the
// client suppresses locally (nothing of that kind leaves the device) and MC
// leaves the instruction in place, which keeps "MC has not asked you to send"
// distinguishable from "you have muted yourself". SERVER MUTE WITHDRAWS: a
// server-muted kind's stream is listed with an empty target set (capture
// stops), with MH's ingress drop as the backstop; a server unmute restores the
// targets whatever the client mute.
//
// (Tightened 2026-10-23, MC-B: the 2026-10-13 "MAY stay directed" is now
// "stays directed"; MC's directive builder has no input carrying client mute.)
//
// (Corrected 2026-10-13. Was: "MC keeps a send directive active while a
// client reports itself client-muted ... which is what makes unmute
// instantaneous". The client-mute half still holds as a MAY; it never applied
// to server mute, and story 3 R-8 also withdraws an UNWATCHED kind, so an
// active directive is no longer implied by "not client-muted".)
message SendDirective {
  repeated SendStream streams = 1;

  // The meeting-wide frame header version every stream in this directive must
  // use (ADR-0036 §2). A `uint32` carrying u8 semantics. Header v3 is the ONLY
  // version once P2 flips `PROTOCOL_VERSION` (the value is 2 until then).
  //
  // Meeting-wide and MC-directed because the version sits in the SIGNED
  // publisher region: a relay cannot translate between header versions without
  // breaking verification, so MC selects one version for the whole meeting
  // from the participants' declared capabilities and no translation ever
  // arises. The signed field is also proof the publisher used the version MC
  // directed, which is what makes a downgrade detectable.
  //
  // MC MUST set this BY DERIVATION from
  // `crates/media-protocol/src/frame.rs::PROTOCOL_VERSION`, never as a literal.
  // There is no floor and no allowlist: one version exists, and a join not
  // declaring it is refused (see
  // `ParticipantCapabilities.supported_header_versions`). (2026-10-13: the
  // former "MUST NOT emit a version below the configured floor" language is
  // deleted with the floor.)
  // ANCHOR (DRY): cross-language source of truth is the frame vectors file
  // (`proto/test-vectors/frame-v3.vectors.json`, `header_version: 3`); see `docs/TODO.md` §Media Path Obligations for the precedence rule
  // between the two anchors.
  uint32 header_version = 2;
}

// ============================================================================
// Stream assignment (ADR-0036 §2, §3, §6, §7)
// ============================================================================

// What MC has placed in one of the subscriber's declared slots.
//
// ATTRIBUTION CHAIN: a receiver resolves an arriving frame's key id to
// `sender_id`, `sender_id` to that participant's roster entry, and the roster
// entry's `identity_public_key` to an Ed25519 verification of the frame.
// Attribution comes from THE SIGNATURE VERIFYING, never from this assignment
// or from the roster mapping itself — a compromised MC can mis-map either, and
// this chain is rooted in trust-on-first-use because no attestation check
// exists yet (the attestation story in the ADR-0036 addendum adds it).
message StreamAssignment {
  // Pre-ADR-0036 (the layout-form message that occupied this name): `uint32
  // stream_id = 1`, `uint64 user_id = 2`, `MediaType media_type = 3`, `uint32
  // slot_index = 4`, `string media_handler_url = 5`.
  //
  // Every one of the six ADR-0036 fields takes a fresh tag; not one of the
  // five vacated tags is re-pointed. Two of them are the exact hazard the
  // reserve-the-tag rule exists for — an old peer would decode them
  // SUCCESSFULLY, with the wrong semantics, rather than failing:
  //
  //   tag 2 (`uint64 user_id` -> `optional uint32 sender_id`): both varint, so
  //   a durable user id would be read as a per-meeting sender id. Byte-for-byte
  //   the same change `JoinResponse` reserves tag 2 for, on the same field-name
  //   pair; the two must be reserved the same way or the file contradicts
  //   itself.
  //
  //   tag 3 (`MediaType` -> `MediaKind`): the enum's zero value changes meaning
  //   (old `AUDIO = 0`, new `MEDIA_KIND_UNSPECIFIED = 0`), so an old peer's
  //   audio assignment would decode as "unspecified" instead of failing. Same
  //   reasoning as `MediaStream`/`PublishStream` tags 2 and 3.
  //
  // Tags 1, 4 and 5 would have been wire-incompatible repurposes that fail
  // loud (uint32 -> uint32 with a changed value space; uint32 -> string;
  // string -> enum). They are reserved anyway: a rule applied to three of five
  // repurposes in one message is worse than no rule, because a reader cannot
  // tell the unreserved tags from the ones nobody looked at.
  reserved 1, 2, 3, 4, 5;

  // `media_handler_url` is deliberately ABSENT from the name reservation: the
  // ADR-0036 shape reuses that name on a fresh tag, and reserving a name you
  // then use is a protoc error. Second and last instance of this exception in
  // the file — see `ServerMessage`'s `reserved 5;` for the first.
  reserved "stream_id", "user_id", "media_type", "slot_index";

  // Which of the subscriber's declared slots this fills. Echoes the
  // `ReceiveSlot.slot_id` the subscriber chose (including on
  // `SLOT_STATE_UNAVAILABLE`); see that field for the full
  // scoping, range, validation AND observability rules — this is a published
  // message, so it is the surface a well-meant "assignments per slot" label
  // would come from.
  uint32 slot_id = 6;

  // The source participant. See `JoinResponse.sender_id` for the full range,
  // allocation, fail-closed AND observability rules.
  //
  // PRESENCE BY STATE (story 3 R-5, wire freeze):
  //   - ABSENT on a VIDEO `SLOT_STATE_ACTIVE` slot: MC never names the live
  //     video source. The client attributes live video from the frame's
  //     signature-verified key-id sender, which avoids racing the new
  //     source's keyframe (and active-speaker switching later).
  //   - PRESENT on an AUDIO `SLOT_STATE_ACTIVE` slot and on every `AVATAR_*`
  //     state (the avatar is FOR a named participant).
  //   - ABSENT on `SLOT_STATE_FEWER_SOURCES_THAN_SLOTS` and
  //     `SLOT_STATE_UNAVAILABLE` (no source).
  // Absent MUST NOT be coerced to 0.
  optional uint32 sender_id = 7;

  MediaKind media_kind = 8;

  // Which handler to receive this slot's media from: the handler OWNING THIS
  // EDGE. Empty when no source is assigned. Server-to-client. Same spelling as
  // `MediaServerInfo.media_handler_url`.
  //
  // PER SLOT, NOT PER SUBSCRIBER. A subscriber may receive different slots on
  // DIFFERENT handlers, so a client MUST read each slot on the transport THIS
  // field names and MUST NOT assume one receive transport for all of its slots.
  // Collapsing these to a single url — reading every slot off the first
  // assignment's handler, or off `media_servers[0]` — silently drops the media
  // of every peer whose edge is on another handler.
  //
  // This is a RECEIVE address. It is not a transmit address: see the derivation
  // warning at `JoinResponse.media_servers`.
  string media_handler_url = 9;

  // Why this slot looks the way it does. Explicit because absence of frames is
  // not a signal (ADR-0036 §6).
  SlotState slot_state = 10;

  // The MC command that requested a pending source switch. Present if and only
  // if `slot_state` is `SLOT_STATE_SWITCH_PENDING`.
  //
  // Opaque to the client: echo-only, for correlating a pending switch with the
  // command that requested it. Needed because a state description is ambiguous
  // — if MC switches a slot to B, reverts to A, then switches to B again, a
  // report reading "A to B" cannot distinguish the first command from the
  // third (ADR-0036 §7).
  //
  // SSoT: the MC-to-MH internal contract MUST use `uint64` for the same
  // identifier. A conversion in the middle of the path this identifier exists
  // to disambiguate is exactly where the disambiguation would be lost.
  //
  // OBSERVABILITY (ADR-0036 §11): unbounded cardinality. Never a metric label,
  // never a span attribute, never a per-frame log dimension.
  optional uint64 switch_command_id = 11;
}

// The subscriber's current slot assignments.
//
// Not subject to the reserve-the-tag rule: `assignments = 1` keeps its name,
// its tag, its cardinality and its type NAME across the reshape — only the
// element message's contents changed, and that hazard is reserved for inside
// `StreamAssignment` above. Reserving tag 1 here would vacate a field that
// nothing repurposed.
//
// FULL SNAPSHOT, REPLACE SEMANTICS, for BOTH fields: each `StreamAssignments`
// wholly replaces the previous one. Neither field is a delta. Because nothing
// else tells the client, MC MUST re-emit `StreamAssignments` to a subscriber
// whenever EITHER field changes for that subscriber -- including when the change
// is only to `unreachable_sender_ids`.
//
// THE TRIGGERS ARE NOT ONLY ROSTER CHANGES. A CONNECTIVITY change -- a
// participant connecting to or disconnecting from a handler, which MC learns
// from `dark_tower.internal.v1.NotifyParticipantConnected` /
// `NotifyParticipantDisconnected` -- changes reachability WITHOUT changing the
// roster, and it obliges the same re-emit. Reachability is a property of the
// two parties' CONNECTED HANDLER SETS (ADR-0036 §9), and those move
// independently of joins and leaves. An implementation that re-emits only on
// roster join or leave satisfies the letter of the sentence above and still
// strands a subscriber on a stale view: a peer that becomes reachable is never
// heard, and a peer that becomes unreachable is awaited forever. Re-emit on
// EVERY change to either field, whatever caused it.
message StreamAssignments {
  repeated StreamAssignment assignments = 1;

  // The roster participants THIS subscriber cannot reach: the subscriber's
  // connected handler set and the participant's are DISJOINT, and there is no
  // cross-handler forwarding (ADR-0036 §9 visibility rule; story 2 R-33). Each
  // is a sender id; the client resolves it to a roster entry through
  // `Participant.sender_id`.
  //
  // PER SUBSCRIBER, because reachability is relative to THE HANDLERS THE
  // SUBSCRIBER IS CONNECTED TO -- which may be several, and need not be the same
  // set as any other subscriber's. A subscriber hears a sender if and only if
  // the two share at least one connected handler. MC computes the visibility
  // graph and stays authoritative. Do NOT put each participant's handler SET on
  // the roster and let clients compute this -- that exposes topology and
  // contradicts §7/§9.
  //
  // MEMBERSHIP, precisely:
  //   - EXCLUDES the subscriber's own sender id.
  //   - EXCLUDES senders that DO share a connected handler with the subscriber
  //     but were left unassigned only because the subscriber's slots are full
  //     (the N+2th sender). That is "no slot", not "can't reach", and telling a
  //     user a reachable participant is unreachable would be false.
  //   - EXCLUDES a participant NOT YET CONNECTED to any handler. Not-yet-
  //     connected is NOT unreachable: it has no edges yet, and its connected set
  //     is empty rather than disjoint. A participant still establishing its
  //     connections would otherwise be reported unreachable and then reachable
  //     moments later, which is a false statement about a healthy join, and one
  //     that a client rendering it distinctly would show to a user.
  //   - Lists only roster participants that HAVE a `sender_id` (it is
  //     `optional` on `Participant`); a participant without one cannot be named
  //     here.
  //   - An unreachable participant consumes NO slot. It is never represented as
  //     an empty slot, and `SLOT_STATE_SOURCE_UNREACHABLE` is reserved for the
  //     pinned case, which cannot arise under static fill.
  //
  // A message MAY carry zero `assignments` and a non-empty set here (every
  // other participant is elsewhere); that is well-formed, not malformed.
  //
  // THE CLIENT MARKS THESE ROSTER ENTRIES DISTINCTLY -- never a spinner, never
  // an empty slot, never inferred from silence (§6 "absence of frames is not a
  // signal"; §9 "needs distinct treatment in the interface").
  //
  // WHAT THIS DELIBERATELY DOES NOT DISCLOSE, so nobody widens it believing it
  // is already a topology channel. It is one bit per roster entry, relative to
  // this subscriber. It carries no handler identity or URL for these
  // participants, no handler count for the meeting, and no other subscriber's
  // partition. A client MUST NOT infer co-location AMONG the unreachable set:
  // being absent from my reachable set says nothing about whether two
  // unreachable peers share a handler with each other. Grouping them is the
  // step that turns a reachability bit into a topology map. THE HANDLERS THE
  // SUBSCRIBER IS CONNECTED TO are already known to it (`JoinResponse.
  // media_servers` offers the set; each `StreamAssignment.media_handler_url`
  // names the one carrying that slot); nothing here adds to that.
  //
  // OBSERVABILITY (ADR-0036 §11): sender ids -- never a metric label, never a
  // span attribute, never a per-frame log dimension.
  repeated uint32 unreachable_sender_ids = 2;
}

// ============================================================================
// Key distribution (ADR-0036 §4)
// ============================================================================

// A new meeting KEK, pushed to every member on rotation (ADR-0036 §4 step 6).
//
// Pushed by MC on leave-debounced rotation (story 2): MC rotates on
// participant departure, debounced to at most once per W; the joiner path uses
// `JoinResponse` instead, which touches no existing member. Defined additively
// in story 1 so that story 2's rotation is a behaviour change plus the one
// additive field below. Receivers retain the previous KEK for a bounded window
// so frames in flight, and frames from senders that have not yet re-wrapped,
// still open; that window is derived from `kek_rotation_debounce_seconds` below,
// and its rule lives at `JoinResponse.kek_rotation_debounce_seconds`.
//
// On receipt, every sender also rotates its own transmit keys (ADR-0036 §4
// Rotation, "Meeting KEK rotated"): re-wrapping alone cannot revoke a transmit
// key a leaver already holds in plaintext.
message MeetingKekUpdate {
  // The new meeting key-encryption key. AES-256: exactly 32 bytes. See
  // `JoinResponse.meeting_kek` for the full custody, logging and fail-closed
  // rules — they apply identically here.
  //
  // SECURITY: live key material. Never logged, never a span attribute, never a
  // metric label, never in an error or panic payload, never across the MC-to-MH
  // contract. Derived `Debug` is suppressed for this message in
  // `crates/proto-gen/build.rs`.
  bytes meeting_kek = 1;

  // The generation of `meeting_kek`. Same u16 semantics and same observability
  // rules as `JoinResponse.kek_generation` — the two MUST NOT diverge, or
  // rotation breaks in a way that only shows up as undecryptable frames.
  uint32 kek_generation = 2;

  // W, the meeting's KEK rotation debounce window in seconds. The full rule --
  // retention derivation, floor, ceiling, counting and logging -- is stated
  // once at `JoinResponse.kek_rotation_debounce_seconds` and applies
  // identically here; it is deliberately not restated. Carried on the push as
  // well as the join so a long-lived member never runs on a W it learned at
  // join time after MC's configuration changed.
  uint32 kek_rotation_debounce_seconds = 3;
}

// ============================================================================
// Quality, errors, connection state
// ============================================================================

// Stream quality update (bidirectional)
message StreamQualityUpdate {
  string stream_id = 1;
  uint32 available_bitrate = 2;
  float packet_loss = 3;
  uint32 rtt_ms = 4;
}

// Error codes.
//
// Value 0 is `ERROR_CODE_UNSPECIFIED` per buf STANDARD, displacing the
// pre-ADR-0036 `UNKNOWN`. Same number and same meaning, so unlike
// `LeaveReason` no renumbering is needed and no value is reserved.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_UNAUTHORIZED = 2;
  ERROR_CODE_FORBIDDEN = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_INTERNAL_ERROR = 6;
  ERROR_CODE_CAPACITY_EXCEEDED = 7;
  ERROR_CODE_STREAM_ERROR = 8;
}

// Error message
message ErrorMessage {
  ErrorCode code = 1;
  string message = 2;
  map<string, string> details = 3;
}

// Per-MH connection-state classification reported by clients in
// MediaConnectionUpdate. Catalog-style enum-value prefix per ADR-0011
// + internal.proto convention (DisconnectReason, RejectionReason).
enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_CONNECTED = 1;
  CONNECTION_STATE_FAILED = 2;
  CONNECTION_STATE_DISCONNECTED = 3;
}

// Per-MH connection status reported by the client.
message MhConnectionStatus {
  // URL of the media handler this status pertains to.
  // SECURITY: client-controlled. Consumers MUST truncate before logging
  // (current MC handler bound: 256 bytes via floor_char_boundary).
  // SDK SHOULD cap at <= 256 bytes when populating.
  string mh_url = 1;

  ConnectionState state = 2;

  // Optional human-readable failure reason. Empty when state != FAILED.
  // SECURITY: client-controlled, untrusted. Same 256-byte truncation
  // discipline as `mh_url`; never log unbounded.
  optional string failure_reason = 3;

  // Optional structured failure code (SDK-defined enum-as-string,
  // e.g. "QUIC_TIMEOUT", "TLS_HANDSHAKE_FAIL"). Empty when state != FAILED.
  // SECURITY: client-controlled; same truncation discipline.
  optional string failure_code = 4;

  google.protobuf.Timestamp observed_at = 5;
}

// Client report of per-MH media connection state (replaces predecessor
// MediaConnectionFailed; richer per-handler shape supports the SDK's
// connectAll() resolver in browser-client-join story Task #14).
//
// DIAGNOSTIC ONLY. THIS IS NOT THE CONNECTIVITY SOURCE, and MC MUST NOT compute
// reachability, placement, or any client-facing url from it.
//
// connected(participant) -- the input to ADR-0036 §9's visibility rule and to
// every edge MC places -- is what MC has been TOLD BY HANDLERS, over
// `dark_tower.internal.v1.NotifyParticipantConnected` /
// `NotifyParticipantDisconnected`, whose participant identity is derived from a
// validated meeting token and whose handler identity is the handler's own. That
// is SERVER-OBSERVED truth. Everything in this message is CLIENT-ASSERTED: a
// client can claim to be connected to a handler it never dialed, or claim a
// failure on a handler it is happily using.
//
// WHY THE DISTINCTION IS LOAD-BEARING, not stylistic. If reachability were
// computed from this message, a client could place its own edges — naming a
// handler to be routed through, or claiming disjointness to make itself
// unreachable to a peer — and the url MC hands out would trace back to
// client-supplied input. Routing input MUST NOT be client-assertable.
//
// NOTHING IN THIS REPOSITORY READS IT FOR ROUTING TODAY, and the preferred
// answer remains DO NOT READ IT AT ALL. Its legitimate uses are diagnostic:
// operator visibility, and detecting DIVERGENCE between what a client believes
// and what handlers report.
//
// The narrow allowance below is NOT A CARVE-OUT FROM THE PROHIBITION ABOVE — it
// INHERITS it in full. If a consumer uses this message at all, it may serve only
// as a MEMBERSHIP HINT, matched by EXACT comparison against the meeting's
// registered handler set, and EVEN THEN it is NEVER the source of any url MC
// hands to any client and NEVER an input to reachability, placement, or edge
// assignment. A "hint" that reached any of those would be the client-assertable
// routing input this whole block exists to forbid.
message MediaConnectionUpdate {
  repeated MhConnectionStatus statuses = 1;
}

// ============================================================================
// Envelopes
// ============================================================================

// Client to server message wrapper
message ClientMessage {
  // Pre-ADR-0036 layout-subscription variants. Capability replaces layout
  // (ADR-0036 §6): geometry was never the server's business.
  reserved 3, 4, 5;

  reserved "subscribe_to_layout", "update_layout", "unsubscribe_layout";

  // Variant tags stay below 20; tags 20+ are envelope-level (see below).
  oneof message {
    JoinRequest join_request = 1;
    PublishStream publish_stream = 2;
    StreamQualityUpdate stream_quality_update = 6;
    // ADR-0023 mute messages, ADR-0036 §5 terminology
    MuteRequest mute_request = 7;
    ServerMuteRequest server_mute_request = 8;
    UnmuteRequest unmute_request = 9;
    UnmuteResponse unmute_response = 10;
    // browser-client-join R-60: replaces MediaConnectionFailed; tag 11
    // reused (one-time wire break — no on-wire clients exist outside
    // this codebase per Clarification Question 9).
    MediaConnectionUpdate media_connection_update = 11;
    // ADR-0036 §6: replaces SubscribeToLayout/UpdateLayout/UnsubscribeLayout.
    ReceiveCapability receive_capability = 12;
  }

  // W3C Trace Context traceparent header value (RFC: ~55 chars,
  // e.g. "00-<trace-id>-<span-id>-<flags>"). Empty if client did not
  // propagate a trace. Parser is `TraceContextPropagator`; downstream
  // extraction tasks (R-57 MC, R-58-MH, SDK) own validation and rejection
  // of malformed values — do not rely on the proto layer for validation.
  string trace_parent = 20;

  // W3C Trace Context tracestate header value (vendor-specific kv pairs;
  // spec allows up to ~512 bytes / 32 entries). Same parser + validation
  // boundary as `trace_parent`.
  string trace_state = 21;
}

// MH client→server connect envelope; first framed message on a new bidi stream.
message MhConnectRequest {
  string join_token = 1; // Meeting JWT; same semantics as JoinRequest.join_token.
}

// ============================================================================
// Keyframe and recovery requests on the client<->MH bidi stream (story 3)
// ============================================================================
//
// There is NO KEYFRAME INTERVAL (ADR-0036 §1/§7, amendment 2026-10-13):
// keyframes are produced on demand. Both messages below ride the client-opened
// MH bidi control stream AFTER `MhConnectRequest`, with the same 4-byte
// big-endian length prefix and the same per-message size bound as
// `MhClientMessage`: `RecoveryRequest` on its receive half (client to MH),
// `KeyframeRequest` on its send half (MH to client). Fixed scalars only: no
// strings, no URL, no sender identity in the MH-to-client direction.
//
// GoP COUNTER: the 32-bit `gop_counter` of the v3 frame header (ADR-0036 §2),
// per (sender, stream), incremented on every independently-decodable frame and
// carried by every frame of the group. COUNTER-BASED COALESCING is what makes
// stale, repeated, multi-receiver and multi-handler requests yield ONE keyframe
// that reaches every target.
//
// OBSERVABILITY (ADR-0036 §11, story 3 R-30): every `gop_counter`,
// `stream_number`, `slot_id` and `sender_id` field below is stream identity --
// the rules at `dark_tower.internal.v1.SubscriberSlot` apply. Never a log
// field, metric label, span attribute or test-bus value.

// A receiver's request to its handler to restore decodability on one of its
// slots (story 3 R-13): the same counter-based request as `KeyframeRequest`,
// client to MH instead of MH to client.
//
// EVENT-DRIVEN (story 3 amendment 4). A receiver sends ONE request per loss
// event: the first failure on a slot (failed verify or decrypt, decoder error,
// local drop, abandoned group) at a given (`sender_id`, `gop_counter`).
// Further failures at that same pair send nothing, so a decoder-error loop
// cannot flood; there is no pacing timer and no retry. A stream reset before
// any header is parsed has no failing frame and sends nothing: that slot,
// like one receiving nothing from a new source, is MH's to recover (R-10,
// R-12). The receiver keeps at most one queued, unsent request per slot; a
// newer one replaces it.
//
// NOT a token-refresh or reconnect variant: it carries no credential, and the
// read-once rule at
// `dark_tower.internal.v1.NotifyParticipantConnectedRequest.participant_id` is
// untouched by it.
//
// MH RULES (MH-B). Per message MH does a fixed-size parse and one lookup,
// nothing else; volume is bounded by QUIC flow control. Undecodable, or a
// post-connect body larger than MH's fixed parse buffer (sized for the
// largest conforming envelope) -> `malformed`. MH resolves `slot_id` only
// within THIS subscriber connection's own edges (unknown slot, or no
// forwarding stream-per-group source -> `unmapped_slot`), then:
//   - `sender_id` not the slot's current source sender -> `source_mismatch`;
//   - `gop_counter` LOWER than MH's newest counter for that source stream ->
//     `stale` (a newer group is already in flight); HIGHER, or MH has no
//     counter for that source yet -> `counter_ahead` (refused: MH never saw
//     that group); EQUAL and already
//     requested for that (source stream, counter), by any receiver or by
//     MH's own request -> `duplicate`; otherwise EQUAL -> forwarded. No
//     clamping in either direction.
// MH NEVER forwards this message verbatim: it re-sends upstream as its own
// `KeyframeRequest`, with the source's `stream_number` and MH's newest
// counter (fields are REMAPPED). MH keeps ONE dedupe record per source
// stream, shared with its own requests, so each (source stream, counter)
// yields at most one upstream request; forwarded requests are therefore
// bounded by groups produced, which the publisher's minimum interval bounds.
// Dedupe is by counter, not by time: there is no aggregation window.
message RecoveryRequest {
  // The receiver's DOWNLINK relay id: its own `ReceiveSlot.slot_id`, as MH
  // writes it into the relay region on this hop. Never a publisher stream
  // number.
  uint32 slot_id = 1;

  // The sender of the FAILING frame: the key-id sender from that frame's own
  // header, never the last verified frame's (after a switch, that names the
  // previous source). It MAY be unverified (e.g. the failure was a verify
  // failure); that is bounded because MH forwards only on an exact counter
  // match for the slot's current source, and `source_mismatch` catches the
  // rest. A STALENESS GUARD ONLY (`source_mismatch`): it narrows matching and
  // is NEVER authority -- never used to choose a source or publisher, and
  // never forwarded upstream. Zero never matches a source
  // (`JoinResponse.sender_id`).
  uint32 sender_id = 2;

  // The `gop_counter` from the failing frame's own header (the same frame as
  // `sender_id`). 0 is legal (a sender's first group).
  uint32 gop_counter = 3;
}

// Wrapper envelope for client→MH messages (parallel to ClientMessage for MC).
message MhClientMessage {
  // Variant tags stay below 20; tags 20+ are envelope-level.
  //
  // `connect_request` is the FIRST framed message on the bidi stream and only
  // the first; any other variant first is an invalid connect. After it, the
  // stream carries `recovery_request` (story 3 R-13).
  oneof message {
    MhConnectRequest connect_request = 1;
    RecoveryRequest recovery_request = 2;
  }

  // W3C Trace Context (see ClientMessage::trace_parent for format,
  // parser, and validation boundary). Same envelope-level placement
  // pattern — available across all current and future MhClientMessage
  // variants without per-variant changes.
  string trace_parent = 20;
  string trace_state = 21;
}

// MH's request that a publisher produce a keyframe on ONE of its streams
// (story 3 R-10, R-11).
//
// PUBLISHER RULES (the client; this message is UNTRUSTED input to it). The
// publisher produces a keyframe for a request only if ALL hold:
//   - `gop_counter` is AT LEAST its current counter for that stream (stale or
//     back-to-back requests coalesce into one keyframe reaching every target);
//   - the named stream is one it is CURRENTLY SENDING TO THAT HANDLER;
//   - at most once per max(directed
//     `EncodingParameters.min_keyframe_interval_ms`, compiled 100 ms
//     floor), deferring at most one in-interval request per stream rather
//     than refusing it.
// ONLY THE NAMED STREAM keys (room for simulcast, where a request for one
// encoding must not key every encoding). A request NEVER starts capture and
// never makes a muted or undirected stream send. Refused and malformed
// requests are counted by reason. A compromised MH can therefore at most drive
// a publisher's keyframes at that bound.
//
// SELF-KEYING (story 3 amendment 4, R-12). Separately from requests, the
// publisher keys whenever a target has no group in progress: a directed
// start, a target added to an active stream, and abandonment of that target
// by the publisher's own per-target backlog cap. There is one encoder, so
// that keyframe reaches every target of the stream; it is under the same
// bound and the same single deferral, never dropped. WHOEVER DECIDES AN
// ABANDONMENT REPAIRS IT: the publisher does NOT re-key for a stream MH
// refused or stopped (STOP_SENDING: ingress refusal, stream-open limit); MH
// repairs that by request when it wants the source again. Otherwise a refused
// stream would loop at the minimum interval.
//
// MH RULES (MH-B). MH requests only for a source stream it has received at
// least one frame from: it needs the counter, and an unseen source needs no
// request, since the publisher keys every target with no group in progress.
// The request carries MH's NEWEST counter for that stream: the HIGHEST
// `gop_counter` read from any of its frame headers (the counter never wraps,
// ADR-0036 §2) -- forwarded, muted, unrouted or paused frames alike, and a
// stream MH stopped after reading its header -- not the last one read (a late
// frame of group N can arrive after group N+1's header). MH sends AT MOST ONE
// request per (source stream, counter) and NEVER retries: the request rides a
// reliable stream, so repeating a counter achieves nothing, and a later loss
// is a new event with a newer counter. MH's own requests and remapped
// `RecoveryRequest`s share one dedupe record per source stream. MH keeps at
// most one queued, unsent request per stream (a newer one replaces it); a
// failed write is counted, not re-sent.
message KeyframeRequest {
  // The publisher's UPLINK relay id for the stream to key: MC's send id,
  // `SendStream.stream_number` (the SSoT). NOT a slot id.
  uint32 stream_number = 1;

  // The newest GoP counter MH has seen on that stream.
  uint32 gop_counter = 2;
}

// Wrapper envelope for MH→client messages, written on the send half of the
// client-opened MH bidi stream (parallel to `ServerMessage` for MC). Same
// framing and size bound as `MhClientMessage`.
message MhServerMessage {
  // Variant tags stay below 20; tags 20+ are envelope-level.
  oneof message {
    KeyframeRequest keyframe_request = 1;
  }

  // W3C Trace Context, same placement as `MhClientMessage`. MH sets NONE:
  // keyframe requests carry no trace context and nothing is logged per
  // request.
  string trace_parent = 20;
  string trace_state = 21;
}

// Server to client message wrapper
message ServerMessage {
  // Was: the layout-form `StreamAssignments`. The NAME is reused by the
  // ADR-0036 shape on a fresh tag, so only the NUMBER is reserved here —
  // deliberately no name reservation, since reserving a name and then using it
  // is a protoc error. One of exactly two places in this file where the name
  // half of the reserve-the-vacated-tag rule does not apply; the other is
  // `StreamAssignment`'s `media_handler_url`.
  reserved 5;

  // Variant tags stay below 20; tags 20+ are envelope-level.
  oneof message {
    JoinResponse join_response = 1;
    ParticipantJoined participant_joined = 2;
    ParticipantLeft participant_left = 3;
    StreamPublished stream_published = 4;
    StreamQualityUpdate stream_quality_update = 6;
    ErrorMessage error = 7;
    // ADR-0023: Additional server messages
    ParticipantMuteUpdate participant_mute_update = 8;
    UnmuteRequest unmute_request = 9; // Participant's request, relayed
    UnmuteResponse unmute_response = 10; // Response, relayed to participant
    RedirectToMc redirect_to_mc = 11; // MC migration redirect
    // ADR-0036 §6 / §5 / §4
    StreamAssignments stream_assignments = 12;
    SendDirective send_directive = 13;
    MeetingKekUpdate meeting_kek_update = 14;
  }

  // W3C Trace Context (see ClientMessage::trace_parent for format,
  // parser, and validation boundary). MC populates these on outbound
  // ServerMessage via the global propagator (R-57) so client-side
  // observability sees a continuous trace across the bidi stream.
  string trace_parent = 20;
  string trace_state = 21;
}
